<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planet 28</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #1b2735 0%, #090a0f 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #eee;
  }
  .card {
    text-align: center;
    padding: 40px 30px;
    max-width: 420px;
  }
  h1 {
    font-size: 2rem;
    letter-spacing: 2px;
    margin-bottom: 8px;
    color: #fff;
  }
  p.sub {
    color: #9aa5b1;
    margin-bottom: 32px;
    font-size: 0.95rem;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  a.link-btn {
    display: block;
    padding: 16px 20px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    font-size: 1.05rem;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    border: 1px solid rgba(255,255,255,0.15);
  }
  a.link-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }
  .builder {
    background: linear-gradient(135deg, #4b3fa8, #7d5fff);
    color: #fff;
  }
  .realm {
    background: linear-gradient(135deg, #1f7a5c, #2ecc9a);
    color: #06231b;
  }
  footer {
    margin-top: 32px;
    font-size: 0.75rem;
    color: #566073;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Planet 28</h1>
    <p class="sub">Choose your destination</p>
    <div class="links">
      <a class="link-btn builder" href="https://claude.ai/code/artifact/f20338a6-00fa-44fb-9019-ed01c9774bbd" target="_blank" rel="noopener">Claude Builder</a>
      <a class="link-btn realm" href="https://noxiusv-dotcom.github.io/warband/" target="_blank" rel="noopener">The Realm</a>
    </div>
    <footer>Planet 28</footer>
  </div>
</body>
</html>
