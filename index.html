  const typeDesc={Ground:"rugged wheeled and tracked ground vehicle",Walker:"legged walker war-machine",Hover:"hovering anti-grav vehicle",Flyer:"flying aircraft-style vehicle"}[ty[0]]||"vehicle";
  const sizeWord=sz[0]==="Small"?"small, nimble":sz[0]==="Large"?"huge, hulking":"mid-sized";
  let bgEss="";
  if(v.bg&&v.bg.trim()){bgEss=(v.bg.trim().match(/^[^.!?]*/)||[""])[0].trim();if(bgEss.length>150)bgEss=bgEss.slice(0,150).trim();if(bgEss)bgEss=bgEss.charAt(0).toLowerCase()+bgEss.slice(1);}
  out.push(`${who?who+", ":""}a ${sizeWord} ${typeDesc}${v.role?` (${v.role.toLowerCase()})`:""}`+(bgEss?` — ${bgEss}`:""));
  const secNames=(v.sections||[]).map(e=>CAT.vsection[e.id]?.name).filter(Boolean);
  const sv=[];
  if(secNames.includes("Armour plating"))sv.push("heavy bolted armour plating");

  if(sv.length)out.push(cap(naturalJoin(sv)));
  const wns=[...new Set((v.weapons||[]).map(e=>CAT.vweapon[e.id]?.name).filter(Boolean))];
  if(wns.length)out.push("armed with "+naturalJoin(wns.map(n=>article(n)+n.toLowerCase())));

function buildVehicleDossier(){
  const v=vehEdit();if(!v)return;
  const cost=vehicleCost(v);
  const d=$("#dossier");
  d.innerHTML=`
    <div class="dossier-head">
      <button class="iconbtn" id="dvBack" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div><div class="eyebrow">Vehicle dossier</div></div>
      <div class="dcost">${cost}<small>points</small></div>
    </div>
    <div class="dbody" id="dvbody"></div>
    <div class="dossier-foot">
      <button class="btn danger ghost" id="dvDelete">Scrap</button>
      <button class="btn primary" id="dvDone">Done</button>
    </div>`;
  const b=$("#dvbody");

  // identity
  const idc=document.createElement("div");idc.className="dgroup";
  idc.innerHTML=`
    <div class="field" style="margin-bottom:12px"><label>Name</label>
      <div class="name-row">
        <input class="input" id="fvName" value="${esc(v.name)}" placeholder="e.g. The Rust Wagon" maxlength="42">

      </div></div>
    <div class="field" style="margin-bottom:12px"><label>Role / description</label><input class="input" id="fvRole" value="${esc(v.role)}" placeholder="e.g. Armoured gun-truck" maxlength="40"></div>
    <div class="field"><label>Background</label><textarea class="input" id="fvBg" placeholder="What is it, and who drives it?">${esc(v.bg)}</textarea></div>`;
  b.appendChild(idc);
  idc.querySelector("#fvName").oninput=e=>{v.name=e.target.value;persist();};
  idc.querySelector("#fvGen").onclick=()=>openNameGen(v,true);
  idc.querySelector("#fvRole").oninput=e=>{v.role=e.target.value;persist();};
  idc.querySelector("#fvBg").oninput=e=>{v.bg=e.target.value;save();};

  // type
  const tg=document.createElement("div");tg.className="dgroup";
  tg.innerHTML=`<div class="ghead"><span class="eyebrow">Type — propulsion &amp; speed</span><span class="rule"></span><span class="gcost mono">${VEHICLE_TYPES[v.type][1]?"+"+VEHICLE_TYPES[v.type][1]:"free"}</span></div>
    <div class="chips-row" id="vTypeChips">${VEHICLE_TYPES.map((t,i)=>`<button class="stylechip ${i===v.type?"on":""}" data-t="${i}" data-tip="${esc(t[3])}">${t[0]} · ${t[2]}${t[1]?" · +"+t[1]:""}</button>`).join("")}</div>`;
  b.appendChild(tg);
  tg.querySelectorAll("#vTypeChips .stylechip").forEach(bt=>bt.onclick=()=>{v.type=+bt.dataset.t;buildVehicleDossier();persist();});

  // size
  const zg=document.createElement("div");zg.className="dgroup";
  zg.innerHTML=`<div class="ghead"><span class="eyebrow">Size</span><span class="rule"></span></div>
    <div class="chips-row" id="vSizeChips">${VEHICLE_SIZES.map((z,i)=>`<button class="stylechip ${i===v.size?"on":""}" data-z="${i}" data-tip="${esc(z[1])}">${z[0]}</button>`).join("")}</div>
    <div class="none-note" style="font-style:normal;margin-top:8px">Size affects how the vehicle plays (fighting, movement, cover, facings) but not its points. In the book it's set by how many sections fit your vehicle grid — pick the closest here.</div>`;
  b.appendChild(zg);
  zg.querySelectorAll("#vSizeChips .stylechip").forEach(bt=>bt.onclick=()=>{v.size=+bt.dataset.z;buildVehicleDossier();persist();});

  // skills
  const sg=document.createElement("div");sg.className="dgroup";
  sg.innerHTML=`<div class="ghead"><span class="eyebrow">Skills</span><span class="rule"></span><span class="gcost mono">+${vSkillPts(v)}</span></div>`;
  [["A","Agility","Sets when the vehicle acts each turn and how it navigates terrain."],["S","Shooting","How well the vehicle performs shooting actions."]].forEach(([k,name,tip])=>{
    const pts=(v.skills[k]-VRULES.aStart)*VRULES.skillStep;
    const row=document.createElement("div");row.className="steprow";
    row.innerHTML=`
      <div class="lbl" data-tip="${esc(name+" ("+k+") — "+tip+" Roll 1D10 under this value to succeed. Starts at "+VRULES.aStart+".")}"><b>${name} <span style="color:var(--ink-mute)">(${k})</span></b><span>${VRULES.skillStep} pts / level · range ${VRULES.aStart}–${VRULES.skillMax}</span></div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="stepper">
          <button data-d="-1" ${v.skills[k]<=VRULES.aStart?"disabled":""} aria-label="Lower ${name}">−</button>
          <span class="val">${v.skills[k]}</span>
          <button data-d="1" ${v.skills[k]>=VRULES.skillMax?"disabled":""} aria-label="Raise ${name}">+</button>
        </div>
        <span class="pts mono ${pts>0?"pos":""}">${pts?"+"+pts:"—"}</span>
      </div>`;
    row.querySelectorAll("button").forEach(bt=>bt.onclick=()=>{const nv=v.skills[k]+ +bt.dataset.d;if(nv<VRULES.aStart||nv>VRULES.skillMax)return;v.skills[k]=nv;buildVehicleDossier();persist();});
    sg.appendChild(row);
  });
  b.appendChild(sg);

  // vitals (read-only info)
  const vg=document.createElement("div");vg.className="dgroup";
  vg.innerHTML=`<div class="ghead"><span class="eyebrow">Hull</span><span class="rule"></span></div>
    <div class="steprow"><div class="lbl"><b>Total hit-points</b><span>2 core sections (10 HP each) + your sections</span></div><span class="mono" style="font-weight:700;font-size:16px;color:var(--teal)">${vehicleHP(v)}</span></div>
    <div class="steprow"><div class="lbl"><b>Speed</b><span>set by vehicle type</span></div><span class="mono" style="font-weight:700;font-size:16px;color:var(--ink-dim)">${VEHICLE_TYPES[v.type][2]}</span></div>`;
  b.appendChild(vg);

  // groups
  b.appendChild(gearGroup(v,"Sections","vsection",v.sections,buildVehicleDossier));
  b.appendChild(gearGroup(v,"Traits","vtrait",v.traits,buildVehicleDossier));
  b.appendChild(gearGroup(v,"Abilities","vability",v.abilities,buildVehicleDossier));
  b.appendChild(gearGroup(v,"Weapons","vweapon",v.weapons,buildVehicleDossier));

  const backToCard=()=>{const id=curVehId;closeDossier();openVehicleCard(id);};
  $("#dvBack").onclick=backToCard;
  $("#dvDone").onclick=backToCard;
  $("#dvDelete").onclick=()=>{
    askConfirm("Scrap "+(v.name||"this vehicle")+"? This can't be undone.",()=>{
      const w=activeWB();w.vehicles=vehsOf(w).filter(x=>x.id!==v.id);closeDossier();render();toast("Vehicle scrapped");
    },{danger:true,yesLabel:"Scrap"});
  };
}

let scnScreen="list", scnCurrentId=null, scnMode="coop", scnPlayers=2, scnDifficulty="normal", scnLengthBase=0;
const DIFFICULTY={
 easy:  {label:"Easy",  enemyBonus:100, roundMod:2,  tone:"forgiving — the enemy is lighter and there is a little more time"},
 normal:{label:"Normal",enemyBonus:200, roundMod:0,  tone:"balanced — the standard co-op odds from the rules"},
 hard:  {label:"Hard",  enemyBonus:350, roundMod:-1, tone:"punishing — veteran, heavily-equipped enemies and tighter timing"},
 deadly:{label:"Deadly",enemyBonus:550, roundMod:-2, tone:"brutal — elite, overwhelming opposition and little time"},
};
const DIFF_ORDER=["easy","normal","hard","deadly"];
function diffOf(s){return DIFFICULTY[s&&s.difficulty]||DIFFICULTY.normal;}
function rollD10p6(){return 6+(1+Math.floor(Math.random()*10));}   // 1D10+6 → 7-16
function scnFinalLength(){return Math.max(4,Math.min(20,(scnLengthBase||rollD10p6())+DIFFICULTY[scnDifficulty].roundMod));}
function scnsOf(w){return w.scenarios||[]}

async function hostScenario(s,name){

  try{ _liveUnsub.push(db.doc("sessions/"+code).collection("players").onSnapshot(snap=>{livePlayers=snap.docs.map(d=>d.data()||{});if(liveRole==="host"){mergePlayersIntoHostedBattle();renderScenarioView();}},()=>{})); }catch(e){}
  closeModal();renderScenarioView();toast("Hosting · code "+code);

async function joinGame(code,name){
  const db=await getDb();if(!db){toast("Live play unavailable here.");return;}
  const res=$("#lgResult");if(res)res.innerHTML=`<div class="ng-note spin">Joining ${esc(code)}…</div>`;

  let snap;try{snap=await ref.get();}catch(e){if(res)res.innerHTML=`<div class="ng-note">Couldn't reach the game — check the code.</div>`;return;}

  const pid=(name.replace(/[^A-Za-z0-9_-]/g,"")||"guest").slice(0,20)+"_"+Math.random().toString(36).slice(2,6);
  guestPid=pid; guestPlayerRef=ref.collection("players").doc(pid);

}

function openImportScenario(){
  const body=$("#modalBody");
  body.innerHTML=`
    <h3>Import a scenario</h3>
    <p class="lead">Paste a scenario code shared from another copy of the app (for example one you generated with AI in the Claude version). It'll be added to this warband so you can host it live.</p>

    <div class="modal-actions"><button class="btn primary sm" id="imScnGo">Import</button><button class="btn ghost sm" id="imScnX" style="margin-left:auto">Cancel</button></div>`;
  $("#imScnX").onclick=closeModal;
  $("#imScnGo").onclick=()=>{
    const raw=$("#imScn").value.trim();const err=$("#imScnErr");
    let s;try{s=JSON.parse(raw);}catch(e){err.innerHTML=`<div class="ng-note">That doesn't look like a valid scenario code.</div>`;return;}
    if(!s||typeof s!=="object"||(!s.title&&!s.premise&&!s.objectives)){err.innerHTML=`<div class="ng-note">That code isn't a scenario.</div>`;return;}
    s=normalizeImportedScn(s);
    const w=activeWB();(w.scenarios=w.scenarios||[]).unshift(s);save();
    closeModal();scnCurrentId=s.id;scnScreen="detail";renderScenarioView();toast("Scenario imported");
  };
  showModal();
}
function normalizeImportedScn(raw){
  const s=raw&&typeof raw==="object"?JSON.parse(JSON.stringify(raw)):{};
  s.id=uid(); s.createdAt=s.createdAt||Date.now();
  s.mode=s.mode==="coop"?"coop":"pvp";
  s.players=+s.players||3; s.points=+s.points||300;
  ["objectives","specialRules","terrain","markers"].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});

This scenario: ${players} players; ${mode==="coop"?`CO-OPERATIVE — the players team up against an AI-controlled enemy force that is 200 points larger than a single player warband`:"PvP — the players' warbands fight each other"}; ${points} points per player warband.
${seed?`Base the scenario on this idea: "${seed}".`:"Invent an original, evocative premise."}
Write it to be ATMOSPHERIC and immersive: rich sensory detail (sights, sounds, smells, the feel of the place), so the players feel they are really THERE. The "briefing" field is a vivid, cinematic 4-6 sentence second-person narration that sets the mood before the game; the "premise" stays a short one-hook summary.
This game lasts EXACTLY ${length} turns (already rolled) — place every timed event on a round from 1 to ${length}; never use a round beyond ${length}. Difficulty is ${diff.label} (${diff.tone}); reflect that in the danger, timing and opposition.
Include 2-5 TIMED EVENTS, each with a "round" (1 to ${length}) and a "kind": "deadline" for a time-pressure objective the PLAYERS must achieve BY that turn (shown to them in advance, e.g. "by turn 4 disarm the reactor" — use these sparingly, only when the narrative needs a clock), or "surprise" for a hidden reveal that only appears when that turn arrives (reinforcements, a hazard, a betrayal, an environmental shift). Prefer surprises. Write each event atmospherically.
When a surprise event has a concrete mechanical effect the app can auto-apply to characters, add an "effect" object: {"apply":true,"type":"damage"|"heal"|"skill"|"condition","amount":"1D6" (a dice string, for damage/heal),"skill":"A"|"F"|"S"|"AW"|"P" (for a skill change),"delta":-1 (for skill),"condition":"short label like Blinded or On fire" (for condition/skill),"duration":"turn" (wears off next turn) or "game" (lasts the game),"scope":"chosen" (the host picks who is in range) or "all" (every combatant),"negatedBy":["trait/ability/armour/item names that cancel it"]}. Choose negatedBy from things that logically cancel the effect (e.g. Power armour negates Poisonous and Cumulative; Psy-hood negates Psychic/Arcane; Fearless negates fear/break effects; Iron skin, Death-proof, Painless, Unearthly, Bulwark can apply). For a purely narrative event set "effect":{"apply":false}.
This is a PRINT-AND-PLAY game: players 3D-print their miniatures and build/print terrain. So also produce a preparation checklist of what must be built or printed BEFORE the game — terrain pieces, objective/token markers, any extra non-player characters or creatures the scenario needs, and any custom collectible items it introduces (things a character can pick up during play).

Reply with ONLY a JSON object (no prose, no code fence) shaped EXACTLY like:
{"title":"short evocative title","premise":"1-2 sentence hook","briefing":"vivid 4-6 sentence atmospheric second-person narration","scenery":"1-2 sentences describing the terrain to build","objectives":["a victory condition","..."],"specialRules":["an optional special rule","..."],"twist":"one mid-game complication (or empty string)","events":[{"round":4,"kind":"surprise","title":"short event name","text":"what happens this round, written atmospherically","effect":{"apply":true,"type":"damage","amount":"1D6","scope":"chosen","duration":"turn","negatedBy":["Power armour"]}}],"deployment":"how the warbands deploy, referencing table sides/centre","gameLength":"1D10+6 turns","terrain":["terrain piece to build","..."],"markers":["objective/token to print","..."],"npcs":[{"name":"extra character/creature","note":"what it is / when it appears","secret":false,"hint":""}],"items":[{"name":"collectible item","note":"what it does / what it changes about whoever picks it up","secret":false,"hint":""}],"map":{"note":"one-line caption of the battlefield","zones":[{"label":"short deployment label","side":"a","x":5,"y":5,"w":30,"h":18}],"features":[{"type":"terrain","label":"short","x":50,"y":50}]}}

  try{

function coerceScenario(raw,opts){
  raw=raw&&typeof raw==="object"?raw:{};
  const arr=x=>Array.isArray(x)?x.filter(Boolean).map(String):[];
  const named=x=>Array.isArray(x)?x.map(v=>typeof v==="string"?{name:v,note:"",secret:false,hint:"",revealed:false}:{name:String(v&&v.name||"").slice(0,60),note:String(v&&v.note||"").slice(0,180),secret:!!(v&&v.secret),hint:String(v&&v.hint||"").slice(0,90),revealed:false}).filter(v=>v.name||v.hint):[];
  const m=raw.map&&typeof raw.map==="object"?raw.map:{};
  const num=(v,d)=>{const n=+v;return isFinite(n)?Math.max(0,Math.min(100,n)):d;};
  const zones=(Array.isArray(m.zones)?m.zones:[]).map(z=>({label:String(z&&z.label||"").slice(0,26),side:(z&&z.side)==="b"?"b":(z&&z.side)==="neutral"?"neutral":"a",x:num(z&&z.x,5),y:num(z&&z.y,5),w:num(z&&z.w,25),h:num(z&&z.h,18)}));
  const feats=(Array.isArray(m.features)?m.features:[]).map(f=>{const t=(f&&f.type||"terrain");return{type:["terrain","cover","objective","hazard"].includes(t)?t:"terrain",label:String(f&&f.label||"").slice(0,24),x:num(f&&f.x,50),y:num(f&&f.y,50)};});
  return {
    id:uid(), createdAt:Date.now(),
    mode:opts.mode, players:opts.players, points:opts.points, seed:opts.seed||"",
    title:String(raw.title||"Untitled scenario").slice(0,80),
    premise:String(raw.premise||""),
    briefing:String(raw.briefing||""),
    scenery:String(raw.scenery||""),
    objectives:arr(raw.objectives),
    specialRules:arr(raw.specialRules),
    twist:String(raw.twist||""),
    events:(Array.isArray(raw.events)?raw.events:[]).map(e=>({round:Math.max(1,Math.min(opts.length||16,Math.round(+(e&&e.round))||1)),kind:(e&&e.kind)==="deadline"?"deadline":"surprise",title:String(e&&e.title||"").slice(0,70),text:String(e&&e.text||"").slice(0,320),effect:parseEventEffect(e&&e.effect)})).filter(e=>e.title||e.text).sort((a,b)=>a.round-b.round),
    deployment:String(raw.deployment||""),
    gameLength:String(raw.gameLength||"1D10+6 turns"),
    terrain:arr(raw.terrain), markers:arr(raw.markers), npcs:named(raw.npcs),
    items:named(raw.items).map((x,i)=>({name:x.name,note:x.note,secret:x.secret,hint:x.hint,revealed:false,id:"it"+i,heldBy:null})),
    difficulty:opts.difficulty||"normal",
    round:1, rounds:opts.length||null,
    map:{note:String(m.note||""),zones,features:feats},
  };
}

function catalogForAI(){
  const s=cat=>Object.values(CAT[cat]).map(o=>o.name+":"+(o.cost>=0?"+":"")+o.cost).join(", ");
  const c=cat=>Object.values(CAT[cat]).map(o=>o.name+":"+o.cost).join(", ");
  return `TRAITS (name:pts, can be negative): ${s("trait")}.
ABILITIES (name:pts): ${s("ability")}.
WEAPONS (name:credits): ${c("weapon")}.
ARMOUR (name:credits): ${c("armour")}.
ITEMS (name:credits): ${c("item")}.`;
}
function findCat(cat,name){name=String(name||"").trim().toLowerCase();if(!name)return null;return Object.values(CAT[cat]).find(o=>o.name.toLowerCase()===name)||null;}
function buildEnemyChar(u){
  if(!u||typeof u!=="object")return null;
  const c=newChar();
  c.name=String(u.name||"Enemy").slice(0,42);
  c.role=String(u.role||"").slice(0,40);
  c.bg=String(u.background||"").slice(0,400);
  const sk=u.skills||{};["A","F","S","AW","P"].forEach(k=>{let v=Math.round(+sk[k]);if(!isFinite(v))v=1;c.skills[k]=Math.max(1,Math.min(10,v));});
  let hp=Math.round(+u.hp);if(!isFinite(hp))hp=20;hp=Math.max(2,hp);if(hp%2)hp+=1;c.hp=hp;
  let n=Math.round(+u.count)||1;if(n===2)n=3;c.count=Math.max(1,Math.min(10,n));
  c.traits=(Array.isArray(u.traits)?u.traits:[]).map(x=>findCat("trait",x)).filter(Boolean).map(o=>o.id);
  c.abilities=(Array.isArray(u.abilities)?u.abilities:[]).map(x=>findCat("ability",x)).filter(Boolean).map(o=>o.id);
  const gear=(cat,list)=>(Array.isArray(list)?list:[]).map(w=>{const o=findCat(cat,w&&w.name);return o?{id:o.id,qty:Math.max(1,Math.round(+((w&&w.qty)||1))||1)}:null;}).filter(Boolean);
  c.weapons=gear("weapon",u.weapons);c.armour=gear("armour",u.armour);c.items=gear("item",u.items);
  c.fielded=true;
  return c;
}
function scnLoreForAI(scn){
  const named=x=>(Array.isArray(x)?x:[]).map(v=>v&&(v.name||v.hint)).filter(Boolean);
  const evt=x=>(Array.isArray(x)?x:[]).map(e=>e&&(e.title||e.text)?`Turn ${e.round} (${e.kind}): ${e.title||""}${e.text?" — "+e.text:""}`:null).filter(Boolean);
  const lines=[];
  if(scn.scenery)lines.push(`Setting/scenery: ${scn.scenery}`);
  if(scn.deployment)lines.push(`Deployment: ${scn.deployment}`);
  if((scn.specialRules||[]).length)lines.push(`Special rules: ${scn.specialRules.join("; ")}`);
  if(scn.twist)lines.push(`Twist: ${scn.twist}`);
  const npcs=named(scn.npcs);if(npcs.length)lines.push(`NPCs/creatures mentioned in the scenario: ${npcs.join("; ")}`);
  const events=evt(scn.events);if(events.length)lines.push(`Timed events (a creature or foe that "arrives"/"breaches"/"spawns" here should become an actual unit below):\n${events.join("\n")}`);
  return lines.join("\n");
}

  if(statusEl)statusEl.innerHTML=`<div class="ng-note spin">Mustering the enemy force (~${target} pts, ${diff.label})… this can take up to a minute.</div>`;
  const lore=scnLoreForAI(scn);
  const prompt=`You are building an ENEMY warband for a co-operative game of the grimdark sci-fi skirmish game Planet 28. The AI-controlled enemy is meant to be tougher, so build to a total of about ${target} points (get as close as you can; a little under is fine, do not go far over).
Difficulty is ${diff.label} (${diff.tone}) — make the opposition ${scn.difficulty==="deadly"?"elite and terrifying":scn.difficulty==="hard"?"hardened veterans":scn.difficulty==="easy"?"rough and lightly-armed":"a solid, mixed force"}.

THIS ENEMY MUST BE THE SCENARIO'S ACTUAL ANTAGONISTS, not a generic reskin. Scenario — "${scn.title}": ${scn.premise}
Objectives: ${(scn.objectives||[]).join("; ")}.
${lore}

Ground every unit in the material above: if a specific creature, faction, monster or named threat is mentioned anywhere in the scenario text (including an event where something breaches/arrives/spawns), it MUST appear as one of the units below, built to match what's described — same kind of thing, same rough size/role. Don't invent unrelated enemies that have nothing to do with this scenario; only add extra units where the scenario leaves room (e.g. "some guards", "a patrol") for you to flesh out sensibly. Do not add anything that contradicts or reveals a "secret" hint — build around it faithfully without spelling out the secret in a unit's public name/role.

Character build rules: each character costs a base 10 pts; the five skills A,F,S,AW,P each start at 1 and cost +10 per level up to a max of 10; HP starts at 20 and each ±2 HP costs ±10 pts (keep HP even); traits and abilities cost their listed pts; weapons, armour and items cost their listed credits at 1 credit = 1 point. A SQUAD repeats ONE profile: set "count" to 3-10 and the unit costs (profile cost × count).
Use ONLY names spelled EXACTLY as in these catalogs:
${catalogForAI()}
Reply with ONLY a JSON array (no prose, no code fence) of 3-8 units, each shaped exactly like:
{"name":"Warboss Krael","role":"Leader","background":"Two vivid sentences: what this thing/person is, how it fits the scenario, and what makes it dangerous — atmospheric, not generic.","count":1,"skills":{"A":4,"F":6,"S":4,"AW":4,"P":2},"hp":26,"traits":["Fearsome","Brave"],"abilities":["Inspire"],"weapons":[{"name":"Power fist","qty":1}],"armour":[{"name":"Ballistic plate","qty":1}],"items":[{"name":"Med kit","qty":1}]}
Every unit needs a vivid "background" tying it to this specific scenario. Give it character: a leader, some troopers (or a squad), and maybe a specialist — but only where the scenario supports it. Spend close to ${target} points in total.`;
  try{
    const list=await s.json(prompt,{modelTier:"default",cache:false});

    renderScenarioView();toast("Enemy warband mustered");
  }catch(e){
    if(statusEl)statusEl.innerHTML=`<div class="ng-note">${sampleErr(e&&e.code)}</div>`;
  }

function scenarioMapSVG(map,mini){
  map=map||{};
  const zones=Array.isArray(map.zones)?map.zones:[];
  const feats=Array.isArray(map.features)?map.features:[];
  const cl=v=>Math.max(0,Math.min(100,+v||0));
  const zc=s=>s==="b"?["#e5686d","rgba(229,104,109,.15)"]:s==="neutral"?["#9aa3b2","rgba(154,163,178,.12)"]:["#5a9be0","rgba(90,155,224,.15)"];
  let g="";
  for(let i=10;i<100;i+=10)g+=`<line class="grid" x1="${i}" y1="0" x2="${i}" y2="100"/><line class="grid" x1="0" y1="${i}" x2="100" y2="${i}"/>`;
  let z="";
  zones.forEach(zo=>{const[st,fi]=zc(zo.side);const x=cl(zo.x),y=cl(zo.y),w=Math.min(100-x,Math.max(4,+zo.w||20)),h=Math.min(100-y,Math.max(4,+zo.h||18));
    z+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${fi}" stroke="${st}" stroke-width="0.5" stroke-dasharray="2 1.5"/>`;
    if(!mini&&zo.label)z+=`<text class="zlabel" x="${x+w/2}" y="${y+h/2}" fill="${st}" font-size="3" text-anchor="middle" dominant-baseline="middle">${esc(String(zo.label)).slice(0,22)}</text>`;});
  let f="";
  feats.forEach(ft=>{const x=cl(ft.x),y=cl(ft.y),t=ft.type||"terrain";
    if(t==="objective")f+=`<circle class="obj" cx="${x}" cy="${y}" r="2.7"/>`;
    else if(t==="hazard")f+=`<path class="haz" d="M ${x} ${y-3.2} L ${x+3} ${y+2.5} L ${x-3} ${y+2.5} Z"/>`;
    else f+=`<rect class="terr" x="${x-3.5}" y="${y-3.5}" width="7" height="7" rx="1.5"/>`;
    if(!mini&&ft.label)f+=`<text class="flabel" x="${x}" y="${y+6}" font-size="2.6" text-anchor="middle">${esc(String(ft.label)).slice(0,20)}</text>`;});
  return `<svg class="scn-map" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${g}${z}${f}</svg>`;
}

  return {apply:true,type,

function rollDice(str){
  str=String(str||"").trim();
  const m=str.match(/^(\d+)\s*[dD]\s*(\d+)\s*([+\-]\s*\d+)?$/);
  if(!m){const n=parseInt(str,10);return isFinite(n)?Math.max(0,n):0;}
  const cnt=Math.min(20,+m[1]||1),sides=+m[2]||6,mod=m[3]?parseInt(m[3].replace(/\s/g,""),10):0;
  let t=0;for(let i=0;i<cnt;i++)t+=1+Math.floor(Math.random()*sides);
  return Math.max(0,t+mod);
}
function negatedBy(m,eff){
  const neg=(eff.negatedBy||[]).map(x=>String(x).toLowerCase().trim()).filter(Boolean);
  for(const nn of neg){ if((m.neg||[]).some(mn=>mn===nn||mn.includes(nn)||nn.includes(mn))) return eff.negatedBy.find(x=>String(x).toLowerCase().trim()===nn)||nn; }
  return null;
}
function applyEventEffect(s,eff,ids){
  const out=[];
  ids.forEach(id=>{
    const m=(s.battle.combatants||[]).find(x=>x.id===id);if(!m)return;
    const neg=negatedBy(m,eff);
    if(neg){out.push({name:m.name,txt:"negated by "+neg,neg:true});return;}
    if(eff.type==="damage"){const d=rollDice(eff.amount);m.curHP=Math.max(0,m.curHP-d);out.push({name:m.name,txt:"−"+d+" HP"+(m.curHP<=0?" · DOWN":"")});}
    else if(eff.type==="heal"){const h=rollDice(eff.amount);m.curHP=Math.min(m.maxHP,m.curHP+h);out.push({name:m.name,txt:"+"+h+" HP"});}
    else{const label=eff.condition||(eff.skill?((eff.delta>0?"+":"")+eff.delta+" "+eff.skill):"Affected");const expireTurn=eff.duration==="turn"?curRound(s)+1:null;m.conditions=m.conditions||[];m.conditions.push({label,expireTurn});out.push({name:m.name,txt:label+(expireTurn?" (→T"+expireTurn+")":"")});}
  });
  save();return out;
}

async function applyPickup(c,p){

  const aNames=c.abilities.map(id=>CAT.ability[id]&&CAT.ability[id].name).filter(Boolean).join(", ")||"none";

Use ONLY these ability names: ${abilityList}.

{"summary":"one vivid sentence describing what happens to them","newName":"","skills":{"A":0,"F":0,"S":0,"AW":0,"P":0},"hp":0,"addTraits":[],"removeTraits":[],"addAbilities":[],"note":"a sentence of flavour to add to their background"}

  try{
    const eff=await s.json(prompt,{modelTier:"default",cache:false});
    openEffectPreview(c,p,eff);
  }catch(e){toast(sampleErr(e&&e.code));}
}
function effectLines(eff){
  const L=[];
  if(eff.newName)L.push(`→ <b>${esc(String(eff.newName))}</b>`);
  const sd=eff.skills||{};["A","F","S","AW","P"].forEach(k=>{const d=Math.round(+sd[k]||0);if(d)L.push(`${k} ${d>0?"+":"−"}${Math.abs(d)}`);});
  const hd=Math.round(+eff.hp||0);if(hd)L.push(`HP ${hd>0?"+":"−"}${Math.abs(hd)}`);
  (eff.addTraits||[]).forEach(n=>{if(findCat("trait",n))L.push(`+ ${esc(n)}`);});
  (eff.removeTraits||[]).forEach(n=>{if(findCat("trait",n))L.push(`− ${esc(n)}`);});
  (eff.addAbilities||[]).forEach(n=>{if(findCat("ability",n))L.push(`+ ${esc(n)}`);});
  return L;
}
function openEffectPreview(c,p,eff){
  eff=eff&&typeof eff==="object"?eff:{};
  const body=$("#modalBody");
  const lines=effectLines(eff);
  body.innerHTML=`
    <h3>Apply pick-up · ${esc(p.name)}</h3>
    <p class="lead" style="font-style:italic;color:var(--arcane)">${esc(eff.summary||"Something changes…")}</p>
    ${lines.length?`<div class="eff-changes">${lines.map(l=>`<span class="eff-chip">${l}</span>`).join("")}</div>`:`<p class="lead">Flavour only — no mechanical change.</p>`}
    ${eff.note?`<p class="lead" style="margin-top:2px">“${esc(eff.note)}”</p>`:""}
    <div class="modal-actions">
      <button class="btn primary sm" id="effApply">Apply to ${esc(c.name)||"character"}</button>
      <button class="btn sm" id="effRetry">✦ Try again</button>
      <button class="btn ghost sm" id="effCancel" style="margin-left:auto">Cancel</button>
    </div>`;
  $("#effApply").onclick=()=>{applyEffect(c,p,eff);closeModal();if(curCharId===c.id)buildDossier();persist();if(cardCharId===c.id)buildCard();toast("Character changed");};
  $("#effRetry").onclick=()=>{closeModal();applyPickup(c,p);};
  $("#effCancel").onclick=closeModal;
  showModal();
}
function applyEffect(c,p,eff){
  p.before={name:c.name,skills:Object.assign({},c.skills),hp:c.hp,traits:[...c.traits],abilities:[...c.abilities],bg:c.bg};
  if(eff.newName)c.name=String(eff.newName).slice(0,42);
  const sd=eff.skills||{};["A","F","S","AW","P"].forEach(k=>{let v=c.skills[k]+Math.round(+sd[k]||0);c.skills[k]=Math.max(1,Math.min(10,v));});
  let hp=c.hp+Math.round(+eff.hp||0);if(hp<2)hp=2;if(hp%2)hp+=1;c.hp=hp;
  (eff.removeTraits||[]).forEach(n=>{const o=findCat("trait",n);if(o)c.traits=c.traits.filter(id=>id!==o.id);});
  (eff.addTraits||[]).forEach(n=>{const o=findCat("trait",n);if(o&&!c.traits.includes(o.id))c.traits.push(o.id);});
  (eff.addAbilities||[]).forEach(n=>{const o=findCat("ability",n);if(o&&!c.abilities.includes(o.id))c.abilities.push(o.id);});
  if(eff.note)c.bg=(c.bg?c.bg+"\n\n":"")+String(eff.note);
  p.applied=true;p.effect={summary:String(eff.summary||"")};
  save();
}
function revertPickup(c,p){
  const b=p.before;if(!b)return;
  c.name=b.name;c.skills=Object.assign({},b.skills);c.hp=b.hp;c.traits=[...b.traits];c.abilities=[...b.abilities];c.bg=b.bg;
  p.applied=false;delete p.effect;delete p.before;save();
}
function removePickup(c,p){
  const go=()=>{c.pickups=(c.pickups||[]).filter(x=>x!==p);
    const w=activeWB();const scn=(w.scenarios||[]).find(s=>s.id===p.scnId);if(scn){const it=(scn.items||[]).find(i=>i.id===p.itemId);if(it&&it.heldBy===c.id)it.heldBy=null;}
    save();buildDossier();persist();if(cardCharId===c.id)buildCard();};
  if(p.applied)askConfirm("Discard the pick-up “"+p.name+"”? Its change to "+(c.name||"the character")+" stays — revert first if you want to undo it.",go,{danger:true,yesLabel:"Discard"});
  else go();
}

function renderScenarioDetail(scnOverride){
  const w=activeWB(), el=$("#scenarioView");
  const s=scnOverride||scnsOf(w).find(x=>x.id===scnCurrentId);
  if(!s){scnScreen="list";return renderScenarioList();}
  // migrate older scenarios
  if(!Array.isArray(s.events))s.events=[];
  if(!s.round)s.round=1;
  (s.items||[]).forEach((it,i)=>{if(it&&!it.id)it.id="it"+i;if(it&&it.heldBy===undefined)it.heldBy=null;});
  const li=a=>a.map(x=>`<li>${esc(x)}</li>`).join("");
  const prepSec=(title,items,noted,catKey)=>{
    if(!items.length)return "";
    const rows=items.map((x,i)=>{
      if(!noted)return `<li>${esc(x)}</li>`;
      if(x.secret&&!x.revealed)return `<li class="secret-li"><span class="redacted">${esc(x.hint||"A hidden surprise — prepare a spare miniature/token")}</span>${scnReadOnly?"":` <button class="reveal-btn" data-reveal="${catKey}|${i}">reveal</button>`}</li>`;
      return `<li>${x.secret?'🔓 ':""}<b>${esc(x.name)}</b>${x.note?` — ${esc(x.note)}`:""}</li>`;
    }).join("");
    return `<div class="prep-sec"><div class="prep-h">${title}</div><ul class="scn-list">${rows}</ul></div>`;
  };
  const anyPrep=(s.terrain||[]).length+(s.markers||[]).length+(s.npcs||[]).length+(s.items||[]).length;
  const prepBox=anyPrep?`<div class="scn-prep">
      <div class="bh">▣ What you'll need — build &amp; print</div>
      ${prepSec("Terrain / scenery",s.terrain||[])}
      ${prepSec("Markers &amp; tokens",s.markers||[])}
      ${prepSec("Extra characters / creatures",s.npcs||[],true,"npcs")}
      ${prepSec("Custom items",s.items||[],true,"items")}
      <div class="none-note" style="font-style:normal;margin-top:8px">Hidden or conditional elements may be revealed during play — improvise those as they come up.</div>
    </div>`:"";
  el.innerHTML=`
    <div class="scn-detail">
      <button class="scn-back" id="scnBack">${scnReadOnly?"⎋ Leave game · "+esc(liveCode):"‹ All scenarios"}</button>
      ${scnReadOnly?`<div class="live-badge guest">◉ Live · watching the host's game (read-only)</div>
        <div class="guest-wb">🛡 <b>${esc(activeWB().name)}</b> — ${activeWB().characters.filter(isFielded).length} fielded sent to the host's roster. <button class="linkbtn" id="gResend">Re-send my warband</button><div class="none-note" style="font-style:normal;margin-top:4px">Change your fielded characters on the Warband tab, then re-send.</div></div>`:(liveRole==="host"&&s.id===hostScenarioId?`<div class="live-badge host">📡 Hosting · code <b>${esc(hostCode)}</b> · ${livePlayers.length} joined <button class="linkbtn" id="hostStop">Stop</button></div>`:"")}
      <div class="scn-dmode" style="color:${s.mode==="coop"?"var(--teal)":"var(--amber)"}">${s.mode==="coop"?"Co-operative":"PvP"} · ${s.players} players · ${s.points} pts · ${esc(diffOf(s).label)}</div>
      <h2>${esc(s.title)}</h2>
      <p class="scn-premise">${esc(s.premise)}</p>
      ${s.briefing?`<div class="scn-briefing">${esc(s.briefing)}</div>`:""}
      <div class="scn-facts">
        <div class="scn-fact"><b>Board</b> 90 × 90cm</div>
        <div class="scn-fact"><b>Length</b> ${s.rounds?s.rounds+" turns":esc(s.gameLength)}</div>
        <div class="scn-fact"><b>Scenery</b> ≥ 60% cover</div>
        ${s.mode==="coop"?`<div class="scn-fact"><b>Enemy</b> ${s.points+diffOf(s).enemyBonus} pts</div>`:""}
      </div>
      <div class="scn-cols">
        <div>
          ${prepBox}
          ${s.objectives.length?`<div class="scn-block"><div class="bh">Objectives &amp; victory</div><ul class="scn-list">${li(s.objectives)}</ul></div>`:""}
          ${s.deployment?`<div class="scn-block"><div class="bh">Deployment</div><p>${esc(s.deployment)}</p></div>`:""}
          ${s.scenery?`<div class="scn-block"><div class="bh">Scenery</div><p>${esc(s.scenery)}</p></div>`:""}
          ${s.specialRules.length?`<div class="scn-block"><div class="bh">Special rules</div><ul class="scn-list">${li(s.specialRules)}</ul></div>`:""}
          ${s.twist?`<div class="scn-block"><div class="bh">Twist</div><p>${esc(s.twist)}</p></div>`:""}
          ${s.mode==="coop"?enemyBlock(s):""}
        </div>
        <div>
          <div class="scn-map-wrap">
            <div class="mh">Battlefield · 90 × 90cm <span style="color:var(--ink-mute);font-weight:400;text-transform:none;letter-spacing:0">· tap to enlarge</span></div>
            ${scenarioMapSVG(s.map,false)}
            ${s.map&&s.map.note?`<div class="scn-mapnote">${esc(s.map.note)}</div>`:""}
            <div class="scn-maplegend">
              <span><i style="background:#5a9be0"></i>Deploy A</span>
              <span><i style="background:#e5686d"></i>Deploy B / enemy</span>
              <span><i style="background:#6b7280"></i>Terrain</span>
              <span><i style="background:var(--amber)"></i>Objective</span>
              <span><i style="background:var(--danger)"></i>Hazard</span>
            </div>
          </div>
          ${trackerHTML(s)}
          ${battleHTML(s)}
          ${collectHTML(s)}
        </div>
      </div>
      <div style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap">
        ${scnReadOnly?`<button class="btn ghost sm" id="scnCopy">Copy as text</button><button class="btn primary sm" id="scnLeave" style="margin-left:auto">⎋ Leave game</button>`:`
        <button class="btn" id="scnRegen">✦ Regenerate</button>
        <button class="btn ghost sm" id="scnCopy">Copy as text</button>
        <button class="btn ghost sm" id="scnShare" title="Copy a code to bring this scenario into the World App to host it live">🌍 Move to World App</button>
        ${fbAvailable()?(liveRole==="host"&&s.id===hostScenarioId?`<button class="btn gc-fielded sm" id="hostStop2">Stop hosting</button>`:`<button class="btn sm" id="scnHost">📡 Host live</button>`):""}
        <button class="btn danger ghost" id="scnDelete" style="margin-left:auto">Delete</button>`}
      </div>
    </div>`;
  const eGen=$("#enemyGen");if(eGen)eGen.onclick=()=>generateEnemyWarband(s,$("#enemyStatus"));
  const eReg=$("#enemyRegen");if(eReg)eReg.onclick=()=>generateEnemyWarband(s,$("#enemyStatus"));
  el.querySelectorAll("[data-eid]").forEach(b=>b.onclick=()=>openEnemyCard((s.enemy.characters||[]).find(c=>c.id===b.dataset.eid)));
  // round tracker
  const rp=$("#rndPrev");if(rp)rp.onclick=()=>setRound(s,curRound(s)-1);
  const rn=$("#rndNext");if(rn)rn.onclick=()=>nextTurn(s);
  const rz=$("#rndReset");if(rz)rz.onclick=()=>{s.round=1;save();renderScenarioView();};
  // battle roster
  const bs=$("#btlStart");if(bs)bs.onclick=()=>{buildBattle(s);renderScenarioView();};
  const br=$("#btlReset");if(br)br.onclick=()=>{buildBattle(s);renderScenarioView();toast("Battle roster rebuilt");};
  el.querySelectorAll("[data-hp]").forEach(b=>b.onclick=()=>{const[id,d]=b.dataset.hp.split("|");const m=(s.battle.combatants||[]).find(x=>x.id===id);if(m){m.curHP=Math.max(0,Math.min(m.maxHP,m.curHP+ +d));save();renderScenarioView();}});
  el.querySelectorAll("[data-cond]").forEach(b=>b.onclick=()=>{const[id,ci]=b.dataset.cond.split("|");const m=(s.battle.combatants||[]).find(x=>x.id===id);if(m){m.conditions.splice(+ci,1);save();renderScenarioView();}});
  // pickups
  el.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{pickupOpenId=b.dataset.pick;renderScenarioView();});
  el.querySelectorAll("[data-pickcancel]").forEach(b=>b.onclick=()=>{pickupOpenId=null;renderScenarioView();});
  el.querySelectorAll("[data-assign]").forEach(b=>b.onclick=()=>{const[itId,cId]=b.dataset.assign.split("|");assignPickup(s,itId,cId);});
  el.querySelectorAll("[data-drop]").forEach(b=>b.onclick=()=>dropPickup(s,b.dataset.drop));
  // reveal secrets
  el.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>{const[cat,i]=b.dataset.reveal.split("|");const it=(s[cat]||[])[+i];if(it){it.revealed=true;save();renderScenarioView();}});
  const mp=el.querySelector(".scn-map-wrap .scn-map");if(mp)mp.onclick=()=>openMapLightbox(s.map,s.map&&s.map.note);
  const cp=$("#scnCopy");if(cp)cp.onclick=()=>{navigator.clipboard.writeText(scenarioText(s)).then(()=>toast("Copied")).catch(()=>toast("Copy failed"));};
  if(scnReadOnly){
    const lb=$("#scnBack");if(lb)lb.onclick=leaveGame;
    const lb2=$("#scnLeave");if(lb2)lb2.onclick=leaveGame;
    const gr=$("#gResend");if(gr)gr.onclick=resendWarband;
    return;
  }
  $("#scnBack").onclick=()=>{scnScreen="list";renderScenarioView();};
  const rg=$("#scnRegen");if(rg)rg.onclick=()=>{scnMode=s.mode;scnPlayers=s.players;openScenarioWizard();const sd=$("#scSeed");if(sd)sd.value=s.seed||"";const sp=$("#scPoints");if(sp)sp.value=s.points;};
  const dl=$("#scnDelete");if(dl)dl.onclick=()=>{
    const hosting=liveRole==="host"&&s.id===hostScenarioId;
    askConfirm("Delete “"+(s.title||"this scenario")+"”?"+(hosting?" This will also end the live game for anyone who joined.":""),async()=>{
      if(hosting)await stopHosting();
      w.scenarios=scnsOf(w).filter(x=>x.id!==s.id);save();scnScreen="list";renderScenarioView();toast("Scenario deleted");
    },{danger:true,yesLabel:"Delete"});
  };
  const sh=$("#scnShare");if(sh)sh.onclick=()=>exportScenarioCode(s);
  const hh=$("#scnHost");if(hh)hh.onclick=()=>openHostDialog(s);
  const hs=$("#hostStop");if(hs)hs.onclick=stopHosting;
  const hs2=$("#hostStop2");if(hs2)hs2.onclick=stopHosting;
  scheduleHostSync(s);
}
function scenarioText(s){
  let o=`${s.title}\n${s.mode==="coop"?"Co-op":"PvP"} · ${s.players} players · ${s.points} pts · ${s.gameLength}\n\n${s.premise}\n\n`;
  if(s.briefing)o+=s.briefing+"\n\n";
  if(s.objectives.length)o+="OBJECTIVES:\n"+s.objectives.map(x=>"- "+x).join("\n")+"\n\n";
  if(s.deployment)o+="DEPLOYMENT: "+s.deployment+"\n\n";
  if(s.scenery)o+="SCENERY: "+s.scenery+"\n\n";
  if(s.specialRules.length)o+="SPECIAL RULES:\n"+s.specialRules.map(x=>"- "+x).join("\n")+"\n\n";
  if(s.twist)o+="TWIST: "+s.twist+"\n\n";
  if((s.events||[]).length)o+="TIMED EVENTS:\n"+s.events.map(e=>e.kind==="deadline"?"- By turn "+e.round+" (deadline): "+e.title+(e.text?" — "+e.text:""):"- Turn "+e.round+" (surprise): "+e.title+(e.text?" — "+e.text:"")).join("\n")+"\n\n";
  const prep=[];
  if((s.terrain||[]).length)prep.push("Terrain: "+s.terrain.join(", "));
  if((s.markers||[]).length)prep.push("Markers: "+s.markers.join(", "));
  if((s.npcs||[]).length)prep.push("Extra characters: "+s.npcs.map(x=>x.secret&&!x.revealed?(x.hint||"a hidden surprise"):x.name+(x.note?" ("+x.note+")":"")).join(", "));
  if((s.items||[]).length)prep.push("Custom items: "+s.items.map(x=>x.secret&&!x.revealed?x.name+" (effect hidden until picked up)":x.name+(x.note?" ("+x.note+")":"")).join(", "));
  if(prep.length)o+="TO BUILD / PRINT:\n"+prep.map(x=>"- "+x).join("\n")+"\n\n";
  if(s.mode==="coop")o+="ENEMY FORCE: "+(s.points+diffOf(s).enemyBonus)+" pts (AI-controlled, "+diffOf(s).label+")\n";
  return o;
}

});

/* ---- tooltips (hover + tap) for [data-tip] elements ---- */
(function(){
  const tip=document.createElement("div");tip.className="tooltip-pop";document.body.appendChild(tip);
  let pinned=null;
  function place(el){
    tip.style.display="block";
    const r=el.getBoundingClientRect(), t=tip.getBoundingClientRect();
    let left=r.left+r.width/2-t.width/2;
    left=Math.max(8,Math.min(left,window.innerWidth-t.width-8));
    let top=r.top-t.height-8;
    if(top<8)top=r.bottom+8;
    tip.style.left=left+"px";tip.style.top=top+"px";
  }
  function show(el){if(!el||!document.contains(el)){hide();return;}const txt=el.getAttribute("data-tip");if(!txt)return;tip.textContent=txt;place(el);}
  function hide(){tip.style.display="none";pinned=null;}
  const near=e=>e.target&&e.target.closest?e.target.closest("[data-tip]"):null;
  document.addEventListener("mouseover",e=>{if(pinned)return;const el=near(e);if(el)show(el);});
  document.addEventListener("mouseout",e=>{if(pinned)return;const el=near(e);if(el)hide();});
  document.addEventListener("focusin",e=>{if(pinned)return;const el=near(e);if(el)show(el);});
  document.addEventListener("focusout",()=>{if(!pinned)hide();});
  document.addEventListener("click",e=>{
    const el=near(e);
    if(el){pinned=(pinned===el)?null:el;pinned?show(el):hide();}
    else if(pinned)hide();
  });
  window.addEventListener("scroll",()=>{if(!pinned)hide();},true);
  window.addEventListener("resize",hide);
})();

/* boot */
load();render();
