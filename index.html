<body>
<title>Realm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Barlow:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --ground:#14161b; --panel:#1c1f27; --panel-2:#232733; --sunk:#101217;
  --line:#2c313d; --line-soft:#242832;
  --map-solid:#8d95a6; --map-solid2:#c3c9d4; --map-wall:#b6bdc9; --map-badge:#4a5163; --map-shadow:rgba(0,0,0,.45);
  --ink:#e9e7e2; --ink-dim:#a7adba; --ink-mute:#727a8a;
  --amber:#ffb84d; --amber-deep:#e0932a; --amber-glow:rgba(255,184,77,.14);
  --teal:#3fb9a6; --teal-deep:#2f9d8c;
  --arcane:#b98fe6;
  --danger:#ec5b60; --danger-bg:rgba(236,91,96,.13);
  --warn:#e9b949;
  --disp:"Chakra Petch",system-ui,sans-serif;
  --body:"Barlow",system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,monospace;
  --r:10px; --r-sm:7px;
  --shadow:0 18px 46px -18px rgba(0,0,0,.7);
  /* roster cards ("4g"): teal-tinted panel, gold wash from the top-left, lit rim, deep drop */
  --card-bg:radial-gradient(130% 100% at 0% 0%,rgba(255,184,77,.30) 0%,rgba(255,184,77,.10) 45%,rgba(255,184,77,0) 75%),color-mix(in srgb,var(--teal) 8%,#262a39);
  --card-border:color-mix(in srgb,var(--teal) 34%,#454c5c);
  --card-shadow:inset 0 1.5px 0 rgba(255,214,140,.55),inset 1.5px 0 0 rgba(255,214,140,.22),0 22px 34px -16px rgba(0,0,0,.95),0 8px 14px -8px rgba(0,0,0,.7),0 1px 0 rgba(0,0,0,.6);
  --card-chip:rgba(20,22,27,.5); --card-chip-line:rgba(255,255,255,.12);
}
:root:not([data-theme="light"]){color-scheme:dark;}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#eceae2; --panel:#fbfaf6; --panel-2:#f1efe7; --sunk:#e4e1d7;
    --line:#d6d2c6; --line-soft:#e0ddd2;
    --map-solid:#3b4150; --map-solid2:#7b8393; --map-wall:#2c313d; --map-badge:#2c313d; --map-shadow:rgba(0,0,0,.22);
    --ink:#1c1e24; --ink-dim:#565b66; --ink-mute:#8a8f9b;
    --amber:#bd7c12; --amber-deep:#a86a08; --amber-glow:rgba(189,124,18,.12);
    --teal:#12857260; --teal:#177f6f; --teal-deep:#0f6d5f;
    --arcane:#6b3fa0;
    --danger:#c73f43; --danger-bg:rgba(199,63,67,.1);
    --warn:#a9781a;
    --shadow:0 16px 40px -20px rgba(40,36,24,.4);
    --card-bg:radial-gradient(130% 100% at 0% 0%,rgba(189,124,18,.16) 0%,rgba(189,124,18,.05) 45%,rgba(189,124,18,0) 75%),color-mix(in srgb,var(--teal) 5%,#ffffff); --card-border:color-mix(in srgb,var(--teal) 30%,#d6d2c6); --card-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),0 14px 26px -16px rgba(40,36,24,.55),0 4px 10px -6px rgba(40,36,24,.25); --card-chip:rgba(255,255,255,.6); --card-chip-line:rgba(28,30,36,.12);
    color-scheme:light;
  }
}
[data-theme="light"]{
  --ground:#eceae2; --panel:#fbfaf6; --panel-2:#f1efe7; --sunk:#e4e1d7;
  --line:#d6d2c6; --line-soft:#e0ddd2;
  --map-solid:#3b4150; --map-solid2:#7b8393; --map-wall:#2c313d; --map-badge:#2c313d; --map-shadow:rgba(0,0,0,.22);
  --ink:#1c1e24; --ink-dim:#565b66; --ink-mute:#8a8f9b;
  --amber:#bd7c12; --amber-deep:#a86a08; --amber-glow:rgba(189,124,18,.12);
  --teal:#177f6f; --teal-deep:#0f6d5f;
  --arcane:#6b3fa0;
  --danger:#c73f43; --danger-bg:rgba(199,63,67,.1);
  --warn:#a9781a;
  --shadow:0 16px 40px -20px rgba(40,36,24,.4);
  color-scheme:light;

  --card-bg:radial-gradient(130% 100% at 0% 0%,rgba(189,124,18,.16) 0%,rgba(189,124,18,.05) 45%,rgba(189,124,18,0) 75%),color-mix(in srgb,var(--teal) 5%,#ffffff); --card-border:color-mix(in srgb,var(--teal) 30%,#d6d2c6); --card-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),0 14px 26px -16px rgba(40,36,24,.55),0 4px 10px -6px rgba(40,36,24,.25); --card-chip:rgba(255,255,255,.6); --card-chip-line:rgba(28,30,36,.12);
}
*{box-sizing:border-box}
/* Our own [hidden] reset. The artifact wrapper ships one, the Realm wrapper does not, so
   without this a class like .btn{display:inline-flex} silently defeats the hidden attribute
   and "hidden" buttons stay on screen in one build but not the other. */
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;}
h1,h2,h3,h4{font-family:var(--disp);margin:0;font-weight:600;letter-spacing:.01em;text-wrap:balance}
button{font-family:var(--disp);cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:var(--body);color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--disp);text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:600;color:var(--ink-mute)}

/* ---------- command header ---------- */
/* The header carries the brand, the tabs, the "where you are" frame and the whole warband
   manifest. Pinned, that is three quarters of a phone screen and only the roster could move.
   Let the page scroll as one instead — the tabs are a short flick away. */
.top{position:relative;z-index:40;background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--panel) 86%, transparent));backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-inner{max-width:1120px;margin:0 auto;padding:12px clamp(12px,3vw,26px)}
.brandrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{width:38px;height:38px;flex:none;border:1.5px solid var(--amber);border-radius:9px;display:grid;place-items:center;background:var(--amber-glow);position:relative}
.mark svg{width:22px;height:22px}
.brand h1{font-size:19px;line-height:1;letter-spacing:.02em}
.brand .sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);font-family:var(--disp);font-weight:600;margin-top:3px}
.brand-spacer{flex:1}
.iconbtn{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;color:var(--ink-dim);background:var(--panel-2);transition:.15s}
.iconbtn:hover{color:var(--amber);border-color:var(--amber)}
.iconbtn svg{width:18px;height:18px}

.manifest{margin-top:14px;display:grid;grid-template-columns:1fr auto;gap:14px 20px;align-items:end}
.wb-name-wrap{min-width:0}
.wb-name{font-family:var(--disp);font-weight:700;font-size:clamp(20px,4.4vw,30px);background:none;border:none;border-bottom:1.5px dashed transparent;color:var(--ink);width:100%;padding:2px 0;letter-spacing:.01em}
.wb-name:hover{border-bottom-color:var(--line)}
.wb-name:focus{outline:none;border-bottom-color:var(--amber)}
.wb-name-row{display:flex;align-items:center;gap:9px}
.wb-name-row .wb-name{flex:1;min-width:0}
.genbtn.wb-gen{width:42px;height:40px;flex:none;align-self:center}
.gauge{min-width:min(340px,64vw)}
.gauge-nums{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.gauge-spent{font-family:var(--mono);font-size:23px;font-weight:700;line-height:1;color:var(--ink)}
.gauge-spent.over{color:var(--danger)}
.gauge-spent .of{color:var(--ink-mute);font-size:14px;font-weight:400}
.budget-edit{font-family:var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:6px;color:var(--ink);width:74px;padding:2px 6px;font-size:14px;text-align:right;font-weight:700}
.budget-edit:focus{outline:none;border-color:var(--amber)}
.budget-edit[readonly]{opacity:.6;cursor:default}
.seal-note{border:1px solid color-mix(in srgb,var(--amber) 50%,var(--line));background:var(--amber-glow);border-radius:var(--r-sm);padding:9px 12px;font-size:13px;line-height:1.45;margin-bottom:12px}
.seal-note.recruit{border-color:color-mix(in srgb,var(--teal) 50%,var(--line));background:color-mix(in srgb,var(--teal) 9%,transparent)}
.remain{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:600}
.remain b{font-family:var(--mono);letter-spacing:0}
.remain.ok{color:var(--teal)} .remain.over{color:var(--danger)}
.bar{height:8px;border-radius:5px;background:var(--sunk);border:1px solid var(--line-soft);overflow:hidden;position:relative}
.bar > i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--teal-deep),var(--teal));transition:width .35s cubic-bezier(.4,0,.2,1)}
.bar > i.warn{background:linear-gradient(90deg,var(--amber-deep),var(--amber))}
.bar > i.over{background:linear-gradient(90deg,#b23b3f,var(--danger))}
.meta-line{margin-top:8px;display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-mute);font-family:var(--mono)}
.meta-line .warnflag{color:var(--warn)}

/* ---------- main / roster ---------- */
main{max-width:1120px;margin:0 auto;padding:22px clamp(12px,3vw,26px) 90px}
.section-head{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
.section-head .eyebrow{white-space:nowrap}
.section-head .rule{height:1px;background:var(--line);flex:1}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--card-bg);border:1px solid var(--card-border);box-shadow:var(--card-shadow);border-radius:var(--r);padding:15px 16px 14px;text-align:left;display:flex;flex-direction:column;gap:11px;transition:.16s;position:relative;overflow:hidden}
.card .chip{background:var(--card-chip);border-color:var(--card-chip-line)}
.card:hover{border-color:var(--amber);transform:translateY(-2px);box-shadow:var(--card-shadow),var(--shadow)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber);opacity:.0;transition:.16s}
.card:hover::before{opacity:.9}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card-name{font-family:var(--disp);font-weight:600;font-size:17px;line-height:1.15}
.card-role{font-size:12px;color:var(--ink-mute);margin-top:2px;min-height:1em}
.card-cost{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--amber);white-space:nowrap;text-align:right}
.card-cost small{display:block;font-size:9px;letter-spacing:.13em;color:var(--ink-mute);text-transform:uppercase;font-family:var(--disp);font-weight:600}
.statgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:9px 0}
.stat{text-align:center}
.stat b{display:block;font-family:var(--mono);font-weight:700;font-size:16px;line-height:1}
.stat span{display:block;font-family:var(--disp);font-size:9px;letter-spacing:.08em;color:var(--ink-mute);margin-top:3px;text-transform:uppercase}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--ink-dim)}
.roster-div{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-family:var(--disp);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute);margin:6px 0 -4px}
.roster-div::before,.roster-div::after{content:"";flex:1;height:1px;background:var(--line)}
.card.benched{opacity:.55;filter:saturate(.5)}
.card.benched:hover{opacity:.85}
.card.benched::before{background:var(--ink-mute)}
.fieldtog{font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:20px;border:1px solid var(--line);color:var(--ink-mute);background:var(--panel-2);white-space:nowrap;transition:.14s;flex:none}
.fieldtog:hover{border-color:var(--amber);color:var(--amber)}
.fieldtog.on{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 48%,var(--line))}
.fieldtog.on:hover{border-color:var(--teal);color:var(--teal)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--ink-dim);background:var(--panel-2)}
.chip.hp{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 45%,var(--line))}
.chip.squad{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 55%,var(--line));background:color-mix(in srgb,var(--teal) 10%,var(--panel-2))}
.card.add{align-items:center;justify-content:center;text-align:center;border-style:dashed;border-color:var(--line);color:var(--ink-mute);min-height:150px;gap:8px;background:transparent;box-shadow:none}
.card.add:hover{color:var(--amber);border-color:var(--amber);transform:translateY(-2px)}
.card.add .plus{width:34px;height:34px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:22px;font-family:var(--body);line-height:0}
.card.add span{font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:600}
.empty{grid-column:1/-1;text-align:center;padding:56px 20px;color:var(--ink-mute)}
.empty h3{font-size:20px;color:var(--ink-dim);margin-bottom:8px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--r-sm);font-weight:600;font-size:13px;letter-spacing:.03em;text-transform:uppercase;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);transition:.15s}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.primary{background:var(--amber);color:#191308;border-color:var(--amber)}
.btn.primary:hover{background:var(--amber-deep);border-color:var(--amber-deep);color:#191308}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn.gc-fielded{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 45%,var(--line))}
.btn.gc-fielded:hover{border-color:var(--teal);color:var(--teal)}
.btn svg{width:15px;height:15px}
.btn.sm{padding:6px 11px;font-size:12px}

/* ---------- overlay / dossier ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,7,10,.62);backdrop-filter:blur(3px);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.scrim.show{opacity:1;pointer-events:auto}
.dossier{position:fixed;z-index:70;top:0;right:0;height:100%;width:min(560px,100%);background:var(--ground);border-left:1px solid var(--line);box-shadow:-24px 0 60px -30px rgba(0,0,0,.8);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .26s cubic-bezier(.32,.72,0,1)}
.dossier.show{transform:none}
.dossier-head{padding:16px clamp(14px,3vw,22px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--panel)}
.dossier-head .eyebrow{color:var(--amber)}
.dossier-head .dcost{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:18px;color:var(--amber);text-align:right;white-space:nowrap}
.dossier-head .dcost small{display:block;font-family:var(--disp);font-size:9px;letter-spacing:.13em;color:var(--ink-mute);text-transform:uppercase}
.dossier-head .dcost small b{font-weight:700;letter-spacing:.08em}
.dossier-head .dcost small b.ok{color:var(--teal)} .dossier-head .dcost small b.over{color:var(--danger)}
.dbody{flex:1;overflow-y:auto;padding:clamp(14px,3vw,22px);display:flex;flex-direction:column;gap:22px}
.dgroup > .ghead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dgroup > .ghead .eyebrow{color:var(--ink-dim)}
.dgroup > .ghead .rule{height:1px;background:var(--line-soft);flex:1}
.dgroup > .ghead .gcost{font-family:var(--mono);font-size:12px;color:var(--ink-mute)}
.field label{display:block;font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:600;color:var(--ink-mute);margin-bottom:6px}
.input{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--ink);padding:10px 12px;font-size:15px}
.input:focus{outline:none;border-color:var(--amber)}
textarea.input{resize:vertical;min-height:56px;line-height:1.45}

/* steppers */
.steprow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.steprow:last-child{border-bottom:none}
.steprow .lbl{display:flex;flex-direction:column;gap:1px}
.steprow .lbl b{font-family:var(--disp);font-size:14px;font-weight:600}
.steprow .lbl span{font-size:11px;color:var(--ink-mute)}
.stepper{display:flex;align-items:center;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:3px}
.stepper button{width:30px;height:30px;border-radius:6px;font-size:19px;line-height:0;color:var(--ink-dim);font-family:var(--body)}
.stepper button:hover:not(:disabled){background:var(--panel-2);color:var(--amber)}
.stepper button:disabled{opacity:.28;cursor:not-allowed}
.stepper .val{width:38px;text-align:center;font-family:var(--mono);font-weight:700;font-size:17px}
.steprow .pts{font-family:var(--mono);font-size:12px;color:var(--ink-mute);width:52px;text-align:right}
.steprow .pts.pos{color:var(--teal)} .steprow .pts.neg{color:var(--danger)}

/* selected list rows */
.sel-list{display:flex;flex-direction:column;gap:7px}
.sel-row{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px}
.sel-row .srmain{flex:1;min-width:0}
.sel-row .srname{font-family:var(--disp);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sel-row .srdesc{font-size:12px;color:var(--ink-dim);margin-top:3px;line-height:1.4}
.sel-row .srcost{font-family:var(--mono);font-size:13px;font-weight:700;white-space:nowrap}
.srcost.pos{color:var(--teal)} .srcost.neg{color:var(--danger)} .srcost.cr{color:var(--amber)}
.tag{font-family:var(--disp);font-size:9px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-mute)}
.tag.psy{color:#b58be0;border-color:#4a3a5e}
.tag.energy{color:#5fb8e0;border-color:#2f4d5e}
.tag.ap{color:var(--amber);border-color:var(--amber-deep)}
.qty{display:flex;align-items:center;gap:1px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:2px}
.qty button{width:24px;height:24px;border-radius:4px;font-size:15px;line-height:0;color:var(--ink-dim);font-family:var(--body)}
.qty button:hover{color:var(--amber)}
.qty .qv{width:24px;text-align:center;font-family:var(--mono);font-weight:700;font-size:13px}
.rm{color:var(--ink-mute);width:26px;height:26px;border-radius:5px;display:grid;place-items:center;flex:none;font-size:16px}
.rm:hover{color:var(--danger);background:var(--danger-bg)}
.add-line{display:flex;flex-wrap:wrap;gap:8px}
.addbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border:1px dashed var(--line);border-radius:var(--r-sm);color:var(--ink-dim);font-family:var(--disp);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;background:transparent;transition:.15s}
.addbtn:hover{border-color:var(--amber);color:var(--amber);border-style:solid}

/* sheet / data modal */
.modal{position:fixed;z-index:80;inset:0;display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:.2s}

.linkbtn{color:var(--ink-mute);font-family:var(--disp);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:4px 6px}
.linkbtn:hover{color:var(--amber)}

/* a realm device hides everything that acts on a warband it does not have */
.host-only{display:none}
body.host-device .wb-only{display:none!important}

/* ---------- in-battle glow ----------
   While your warband is deployed the whole screen is edged in red, so a glance at the phone
   lying on the table tells you the quest is live without reading anything. It sits above the
   app but never takes a click, and it beats faster when one of your own is down. */
.questglow{position:fixed;inset:0;z-index:200;pointer-events:none;border-radius:2px;
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--danger) 70%,transparent),
             inset 0 0 26px -4px color-mix(in srgb,var(--danger) 55%,transparent);
  animation:questPulse 3.4s ease-in-out infinite}
.questglow.wounded{
  box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--warn) 85%,transparent),
             inset 0 0 36px -3px color-mix(in srgb,var(--warn) 65%,transparent);
  animation-duration:1.8s}
.questglow.urgent{
  box-shadow:inset 0 0 0 3px var(--danger),
             inset 0 0 44px -2px color-mix(in srgb,var(--danger) 75%,transparent);
  animation-duration:1.15s}
@keyframes questPulse{0%,100%{opacity:.42}50%{opacity:.92}}
@media (prefers-reduced-motion: reduce){.questglow{animation:none;opacity:.7}}

// Adapter exposing the same .doc/.collection interface the app uses, backed by Firebase RTDB.
function fbDb(root){
  const base=firebase.database();
  const clean=o=>JSON.parse(JSON.stringify(o==null?null:o));   // strips undefined (RTDB rejects it)
  function docRef(path){
    const ref=base.ref(root+"/"+path);
    return {
      set(o){ return ref.set(clean(o)); },
      update(o){ return ref.update(clean(o)); },
      delete(){ return ref.remove(); },
      async get(){ const s=await ref.once("value"); const v=s.val(); return { exists:v!=null, data:()=>v||{} }; },
      onSnapshot(next,err){ const h=ref.on("value",s=>{const v=s.val();next({exists:v!=null,data:()=>v||{}});},err||function(){}); return ()=>ref.off("value",h); },
      collection(sub){ return collRef(path+"/"+sub); }
    };
  }
  function collRef(path){
    const ref=base.ref(root+"/"+path);
    return {
      doc(id){ return docRef(path+"/"+id); },
      async get(){ const s=await ref.once("value"); const v=s.val()||{}; return {docs:Object.keys(v).map(k=>({id:k,data:()=>v[k]||{}}))}; },
      onSnapshot(next,err){ const h=ref.on("value",s=>{const v=s.val()||{};const docs=Object.keys(v).map(k=>({id:k,data:()=>v[k]||{}}));next({docs});},err||function(){}); return ()=>ref.off("value",h); }
    };
  }
  return { doc:docRef, collection:collRef };
}

  ["characters","vehicles","scenarios"].forEach(k=>{if(!Array.isArray(w[k]))w[k]=[];});
  w.id=w.id||uid(); w.name=String(w.name||"Restored Warband"); if(typeof w.budget!=="number")w.budget=500;
  [].concat(w.characters,w.vehicles).forEach(c=>{
    if(!c||typeof c!=="object")return;
    ["traits","abilities","weapons","armour","items","pickups","sections"].forEach(k=>{if(!Array.isArray(c[k]))c[k]=[];});
    if(!c.skills||typeof c.skills!=="object")c.skills={A:1,F:1,S:1,AW:1,P:1};
    if(typeof c.hp!=="number")c.hp=20;
  });
  allScns().forEach(s=>fillScnArrayDefaults(s));
  return w;
}
async function backupCamp(){

  if(!roomKey&&!await ensureRoom())return;

    await db.doc("camps/"+id).set({name:campName(),savedAt:Date.now(),warbands:store.warbands.map(wbForCloud)});
    toast("Camp backed up to your realm");
  }catch(e){ toast("Backup failed — try again"); }
}
async function restoreCamp(){
  if(!fbAvailable()){toast("Cloud stash only works in the Realm app");return;}
  const id=campId(); if(!id){toast("Name your camp first");return;}
  if(!roomKey&&!await ensureRoom())return;
  const db=await getDb(); if(!db){toast("Couldn't reach your realm");return;}
  let snap; try{snap=await db.doc("camps/"+id).get();}catch(e){toast("Couldn't reach your realm");return;}
  const v=snap.exists?snap.data():null;
  if(!v||!Array.isArray(v.warbands)||!v.warbands.length){toast("No backup found for “"+campName()+"”");return;}
  askConfirm("Restore "+v.warbands.length+" warband"+(v.warbands.length>1?"s":"")+" saved "+new Date(v.savedAt||0).toLocaleString()+"? Warbands with the same id are replaced. Portraits aren't included in backups.",()=>{
    v.warbands.forEach(bw=>{
      const h=healWb(bw);

function uid(){return Math.random().toString(36).slice(2,9)}
/* Speed is fixed at 10cm by the rules, but Big/Gigantic (−3cm) and healed-or-not leg
   injuries change it — show the real number wherever a speed is printed. Fast/Slow are a
   per-turn D6 so they stay a suffix, never folded into the number. */
function charSpeed(c){
  let v=RULES.speed;
  const has=n=>(c&&c.traits||[]).some(id=>CAT.trait[id]&&CAT.trait[id].name===n);
  if(has("Big")||has("Gigantic"))v-=3;
  (c&&c.injuries||[]).forEach(i=>{if(i&&i.speed)v+=i.speed;});
  return Math.max(1,v);
}
function speedSuffix(c){
  const has=n=>(c&&c.traits||[]).some(id=>CAT.trait[id]&&CAT.trait[id].name===n);
  return has("Fast")?" +1D6":has("Slow")?" −1D6":"";
}

function newVehicle(){return{id:uid(),name:"",role:"",bg:"",fielded:true,type:0,size:1,skills:{A:VRULES.aStart,S:VRULES.sStart},sections:[],traits:[],abilities:[],weapons:[]}}

/* ---- cost maths ---- */
function skillPts(c){return SKILLS.reduce((s,[k])=>s+(c.skills[k]-1)*RULES.skillStep,0)}
function hpPts(c){return ((c.hp-RULES.hpStart)/RULES.hpStep)*RULES.hpPts}
function listPts(ids,cat){return ids.reduce((s,id)=>s+(CAT[cat][id]?CAT[cat][id].cost:0),0)}
function gearPts(entries,cat){return entries.reduce((s,e)=>s+(CAT[cat][e.id]?CAT[cat][e.id].cost*e.qty:0),0)}
function charCost(c){
  return RULES.baseCost + skillPts(c) + hpPts(c)
       + listPts(c.traits,"trait") + listPts(c.abilities,"ability")
       + gearPts(c.weapons,"weapon") + gearPts(c.armour,"armour") + gearPts(c.items,"item");
}
function isFielded(c){return c.fielded!==false}
function memberCount(c){return Math.max(1,c.count||1)}
function unitCost(c){return charCost(c)*memberCount(c)}   // squad = profile cost × members
/* vehicle cost maths */
function vSkillPts(v){return (v.skills.A-VRULES.aStart)*VRULES.skillStep+(v.skills.S-VRULES.sStart)*VRULES.skillStep}
/* the hull as the rulebook sees it: two core sections and whatever was bought, each with its
   own hit-points and a facing. Facings live on the bought entry (all copies share it). */
function vehSections(v){
  const out=[{key:"engine",name:"Engine",max:10,facing:"C",kind:"engine"},{key:"crew",name:"Crew",max:10,facing:"C",kind:"crew"}];
  (v.sections||[]).forEach((e,i)=>{const o=CAT.vsection[e.id];if(!o)return;
    for(let k=0;k<(e.qty||1);k++)out.push({key:"s"+i+"_"+k,name:o.name+((e.qty||1)>1?" "+(k+1):""),max:o.hp,facing:e.facing||"F",kind:/transport/i.test(o.name)?"transport":/crew/i.test(o.name)?"crew":/hard point/i.test(o.name)?"mount":"other"});});
  return out;
}
/* a battle row's sections: built from the hull, carrying over lingering damage */
function vehSecsFor(v){
  const base=vehSections(v);
  const prev=Array.isArray(v.secs)?v.secs:null;
  return base.map(s=>{const p=prev&&prev.find(x=>x.key===s.key);return {key:s.key,name:s.name,max:s.max,facing:s.facing,kind:s.kind,cur:p&&typeof p.cur==="number"?Math.max(0,Math.min(s.max,p.cur)):s.max};});
}
function secsTotal(secs){return (secs||[]).reduce((a,s)=>a+Math.max(0,s.cur|0),0);}
/* what a destroyed section takes with it */
const SEC_LOSS={engine:"cannot move",crew:"one weapon fewer per shooting action",transport:"anyone aboard is thrown out and takes 1D10",mount:"its weapon is gone",other:"its rule no longer applies"};
/* break test state: 75% of sections gone → test 1D10 UNDER the sections remaining, until only 3 remain */
function vehBreak(secs){
  const n=secs.length, dead=secs.filter(s=>(s.cur|0)<=0).length, left=n-dead;
  if(left<=0)return {state:"wreck"};
  if(dead>=n*0.75&&left>3)return {state:"test",target:left};
  if(dead>=n*0.75)return {state:"steady"};
  return {state:"ok"};
}
function vehicleHP(v){return VRULES.coreHP+(v.sections||[]).reduce((s,e)=>s+(CAT.vsection[e.id]?CAT.vsection[e.id].hp*e.qty:0),0)}
function vehicleCost(v){
  return VRULES.baseCost + vSkillPts(v) + (VEHICLE_TYPES[v.type]?VEHICLE_TYPES[v.type][1]:0)
       + gearPts(v.sections||[],"vsection") + listPts(v.traits||[],"vtrait")
       + listPts(v.abilities||[],"vability") + gearPts(v.weapons||[],"vweapon");
}
function vehsOf(w){return w.vehicles||[]}
function wbSpent(w){return w.characters.filter(isFielded).reduce((s,c)=>s+unitCost(c),0)+vehsOf(w).filter(isFielded).reduce((s,v)=>s+vehicleCost(v),0)}
function wbPool(w){return w.characters.reduce((s,c)=>s+unitCost(c),0)+vehsOf(w).reduce((s,v)=>s+vehicleCost(v),0)}

/* ============================ PERSISTENCE ============================ */
/* A silent save failure used to lose work invisibly: the screen looked right, then the
   data was gone on reload. Storage fills up mainly from character portraits. */
let _saveFailed=false;
function storageKB(){try{return Math.round(JSON.stringify(store).length/1024);}catch(e){return 0;}}
function save(){
  try{
    localStorage.setItem(LS_KEY,JSON.stringify(store));
    if(_saveFailed){_saveFailed=false;const b=document.getElementById("saveWarn");if(b)b.remove();}
    return true;
  }catch(e){
    if(!_saveFailed){_saveFailed=true;try{toast("⚠ NOT SAVED — storage is full");}catch(_){}}
    showSaveWarning();
    return false;
  }
}
function showSaveWarning(){

  const d=document.createElement("div");d.id="saveWarn";d.className="save-warn";
  d.innerHTML=`<b>⚠ Changes are NOT being saved</b> — this device's storage for the app is full (${storageKB()} KB in use), so anything you add now disappears when you reload. Free some space, then everything saves normally again. <button class="btn sm" id="saveWarnFix">Free up space</button>`;

/* Scenarios used to live inside each warband, which hid them whenever you switched warband.
   Move them up to the camp once, keeping every one, tagged unfiled so they attach to the first
   table this device joins. */
function migrateScenarios(){
  if(!Array.isArray(store.scenarios))store.scenarios=[];
  let moved=0;
  (store.warbands||[]).forEach(w=>{
    (w.scenarios||[]).forEach(s=>{
      if(!s||!s.id||store.scenarios.some(x=>x&&x.id===s.id))return;
      if(!s.room)s.room="";
      store.scenarios.push(s); moved++;
    });
    w.scenarios=[];
  });
  if(moved)save();
  return moved;
}

  try{const raw=localStorage.getItem(LS_KEY);if(raw){const p=JSON.parse(raw);if(p&&p.warbands&&p.warbands.length){store=p;migrateScenarios();store.warbands.forEach(w=>{if(!w.vehicles)w.vehicles=[];if(!w.scenarios)w.scenarios=[];});return}}}catch(e){}

/* ---- LIVE QUEST STATE, SEEN FROM CAMP ----
   While a quest is running your characters' real hit-points live in the battle roster, not on
   the character record. Camp used to show only c.curHP (wounds from the LAST quest), so you had
   to flip to the Scenarios tab to see what was happening now. These read the live roster so the
   camp cards can show current health beside the stats you need for deploying. */
function activeQuestScn(){
  if(liveRole==="guest"&&liveScenario&&liveScenario.battle&&liveScenario.battle.started)return liveScenario;
  if(hostScenarioId){
    const s=findScn(hostScenarioId);
    if(s&&s.battle&&s.battle.started)return s;
  }
  return null;
}
function onQuest(){return !!activeQuestScn();}
// the live combatant for one of my characters/vehicles, matched the way the roster stores it
function questUnitFor(id,isVeh){
  const s=activeQuestScn(); if(!s)return null;
  const cid=campId();
  return (s.battle.combatants||[]).find(m=>m&&m.side==="player"&&(isVeh?m.vehId===id:m.charId===id)
    &&(!m.campId||!cid||m.campId===cid))||null;
}
/* ⚔ hits and ☠ kills, tapped by the player on their own character as the game goes. Kept on
   the character, tagged with the quest, so coming home pre-fills the campaign-point tally. */
function tallyFor(c,s){
  const id=s&&s.id;
  if(!c.tally||c.tally.scnId!==id)c.tally={scnId:id,hits:0,kills:0,log:[]};
  return c.tally;
}
function bumpTally(c,k){
  const s=activeQuestScn(); if(!s)return;
  const t=tallyFor(c,s);
  if(k==="undo"){const last=t.log.pop();if(last)t[last]=Math.max(0,t[last]-1);}
  else {t[k]++;t.log.push(k);if(t.log.length>60)t.log.shift();}
  save();renderRoster();if(scnScreen==="detail")renderScenarioView();
  if(k!=="undo")toast(k==="hits"?"⚔ hit — +1 cp":"☠ kill — +5 cp");
}
function tallyHTML(c){
  const s=activeQuestScn(); if(!s||!questUnitFor(c.id,false))return "";
  const t=tallyFor(c,s);
  return `<span class="tally"><button class="tbtn" data-tally="${c.id}|hits" title="Tap when a shoot or fight action does damage — 1 campaign point each">⚔ ${t.hits}</button><button class="tbtn" data-tally="${c.id}|kills" title="Tap when this character kills an enemy — 5 campaign points each">☠ ${t.kills}</button>${t.log.length?`<button class="tbtn undo" data-tally="${c.id}|undo" title="Undo the last tap">↶</button>`:""}</span>`;
}
/* One HP chip, live when a quest is running and otherwise the lingering wounds it always showed. */
function hpChipFor(o,max,isVeh){
  const live=questUnitFor(o.id,isVeh);
  if(live){
    const cur=Math.max(0,live.curHP|0), half=cur<=live.maxHP*0.5;
    return `<span class="chip hp live ${cur<=0?"down":half?"hurt":""}">${cur<=0?"DOWN":cur+"/"+live.maxHP+" HP"}</span>${cur>0&&half?`<span class="chip brk" tabindex="0" data-tip="Under half: every skill is −1 and each hit forces a break test — fail and they run for the board edge.">⚠ −1 all skills · break tests</span>`:""}`;
  }
  const cur=(typeof o.curHP==="number"&&o.curHP<max)?o.curHP:null;
  return cur===null?`<span class="chip hp">${max} HP</span>`
    :`<span class="chip hp ${cur<=0?"down":"hurt"}">${cur<=0?"DOWN":cur+"/"+max+" HP"}</span>`;
}

/* Everything currently limiting a character, named rather than counted, because at the table
   you are deciding how to fight WITH the limitation ("only one one-handed weapon", "-1 Psyche
   on break tests") and a chip saying "2 scars" cannot answer that.
   Two sources, both self-clearing: c.injuries holds only injuries still in effect (tickInjuries
   drops them once served, and treating one removes it), and a live combatant's conditions are
   whatever the battle roster is currently tracking — lift one there and it disappears here. */
function cardMarks(o,isVeh){
  const bits=[];
  (o.injuries||[]).forEach(inj=>{
    if(!inj||!inj.name)return;
    const tip=[inj.ruleName&&inj.ruleName!==inj.name?inj.ruleName:"",inj.effectNote||inj.note||""].filter(Boolean).join(" — ");
    bits.push(`<span class="chip scar" ${tip?`tabindex="0" data-tip="${esc(tip)}"`:""}>⚠ ${esc(inj.name)}${inj.permanent?"":inj.games?` <small>${Math.max(0,inj.games-(inj.served||0))} left</small>`:""}</span>`);
  });
  const live=questUnitFor(o.id,!!isVeh);
  (live&&live.conditions||[]).forEach(cd=>{
    if(!cd||!cd.label)return;
    bits.push(`<span class="chip cond-chip">◈ ${esc(cd.label)}${cd.expireTurn?` <small>→T${cd.expireTurn}</small>`:""}</span>`);
  });
  return bits.join("");
}

/* ---- FIXING WHAT THE TABLE GOT WRONG ----
   Damage gets logged twice, a condition lands on the wrong model, an injury is rolled for the
   wrong character. All of it must be correctable in place, or the app stops matching the table
   and people go back to paper. Edits apply to the LIVE combatant while a quest is running and
   to the stored character otherwise, so the same panel works before, during and after a game. */
let adjustFor=null;
function adjustTargets(o,isVeh){
  const live=questUnitFor(o.id,!!isVeh);
  return {live, max: live?live.maxHP:(isVeh?vehicleHP(o):o.hp*memberCount(o))};
}
function openAdjust(o,isVeh){
  adjustFor={o,isVeh};
  const draw=()=>{
    const {live,max}=adjustTargets(o,isVeh);
    const guestLive=!!live&&liveRole==="guest";   // the host owns the live roster
    const cur=live?Math.max(0,live.curHP|0):(typeof o.curHP==="number"?o.curHP:max);
    const conds=(live&&live.conditions)||[];
    const scars=o.injuries||[];
    $("#modalBody").innerHTML=`
      <h3>Adjust ${esc(o.name||"this one")}</h3>
      <p class="lead">${live?(guestLive?"Your host runs the battle roster — ask them to correct this one. You can still tidy up scars here."
                                  :"This one is on a quest — changes go straight to the live roster.")
                           :"Not on a quest, so this sets what they come back with."}</p>
      ${guestLive?"":`<div class="eyebrow" style="margin-bottom:8px">Hit-points</div>
      <div class="adj-hp">
        <button class="rbtn" data-adj="-5">−5</button>
        <button class="rbtn" data-adj="-1">−1</button>
        <input class="input mono" id="adjHP" inputmode="numeric" value="${cur}" style="width:84px;text-align:center">
        <span class="none-note" style="font-style:normal">of ${max}</span>
        <button class="rbtn" data-adj="1">+1</button>
        <button class="rbtn" data-adj="5">+5</button>
        <button class="linkbtn" id="adjFull">full</button>
      </div>`}
      ${live&&!guestLive?`<div class="eyebrow" style="margin:16px 0 8px">Conditions</div>
      <div class="adj-list">${conds.length?conds.map((cd,i)=>`<span class="chip cond-chip">◈ ${esc(cd.label)}${cd.expireTurn?` <small>→T${cd.expireTurn}</small>`:""}
        <button class="chip-x" data-rmcond="${i}" aria-label="Remove">×</button></span>`).join("")
        :`<span class="none-note">None right now.</span>`}</div>
      <div class="adj-add">
        <input class="input" id="adjCond" placeholder="e.g. Blinded, Poisoned, Pinned" maxlength="28">
        <input class="input mono" id="adjTurn" placeholder="until T" inputmode="numeric" style="width:88px">
        <button class="btn sm" id="adjAddCond">Add</button>
      </div>`:""}
      ${scars.length?`<div class="eyebrow" style="margin:16px 0 8px">Scars</div>
      <div class="adj-list">${scars.map((s,i)=>`<span class="chip scar">⚠ ${esc(s.name)}
        <button class="chip-x" data-rmscar="${i}" aria-label="Remove">×</button></span>`).join("")}</div>
      <div class="none-note" style="font-style:normal;margin-top:6px">Removing a scar here is for mistakes — it does not undo the skill or hit-point change it made.</div>`:""}
      <div class="modal-actions"><button class="btn primary sm" id="adjDone" style="margin-left:auto">Done</button></div>`;
    const setHP=v=>{
      const {live,max}=adjustTargets(o,isVeh);
      const n=Math.max(0,Math.min(max,Math.round(v)||0));
      if(live)live.curHP=n; else o.curHP=n;
      save();refreshAll();draw();
    };
    $("#modalBody").querySelectorAll("[data-adj]").forEach(b=>b.onclick=()=>{
      const {live,max}=adjustTargets(o,isVeh);
      const now=live?(live.curHP|0):(typeof o.curHP==="number"?o.curHP:max);
      setHP(now + (+b.dataset.adj));
    });
    const af=$("#adjFull"); if(af)af.onclick=()=>setHP(adjustTargets(o,isVeh).max);
    const hp=$("#adjHP"); if(hp)hp.onchange=()=>setHP(+hp.value);
    const ac=$("#adjAddCond");
    if(ac)ac.onclick=()=>{
      const lbl=($("#adjCond").value||"").trim(); if(!lbl){toast("Name the condition");return;}
      const turn=parseInt($("#adjTurn").value,10);
      const {live}=adjustTargets(o,isVeh); if(!live)return;
      live.conditions=live.conditions||[];
      live.conditions.push(isFinite(turn)&&turn>0?{label:lbl.slice(0,28),expireTurn:turn}:{label:lbl.slice(0,28)});
      save();refreshAll();draw();
    };
    $("#modalBody").querySelectorAll("[data-rmcond]").forEach(b=>b.onclick=()=>{
      const {live}=adjustTargets(o,isVeh); if(!live)return;
      live.conditions.splice(+b.dataset.rmcond,1);
      save();refreshAll();draw();
    });
    $("#modalBody").querySelectorAll("[data-rmscar]").forEach(b=>b.onclick=()=>{
      askConfirm("Remove this scar? Use this only when it was recorded by mistake.",()=>{
        o.injuries.splice(+b.dataset.rmscar,1);save();refreshAll();draw();
      },{danger:true,yesLabel:"Remove"});
    });
    $("#adjDone").onclick=()=>{adjustFor=null;closeModal();refreshAll();};
  };
  const refreshAll=()=>{renderRoster();renderVehicleRoster();renderCampBar();
    if(currentView==="scenarios")renderScenarioView();
    if(cardCharId||cardVehId)rebuildOpenCard();};
  draw();showModal();
}
/* fielded first, benched after a divider — the order in the data is untouched */
function byFielded(list){return list.slice().sort((a,b)=>(isFielded(b)?1:0)-(isFielded(a)?1:0));}
function benchDivider(el,list,noun){
  const n=list.filter(x=>!isFielded(x)).length;
  if(!n||n===list.length)return;
  const d=document.createElement("div");d.className="roster-div";d.innerHTML=`<span>○ Benched · ${n} ${noun}${n===1?"":"s"} staying at camp</span>`;
  el.appendChild(d);
}
function renderRoster(){
  const w=activeWB(),el=$("#roster");el.innerHTML="";
  let dividerDone=false;
  byFielded(w.characters).forEach(c=>{
    if(!isFielded(c)&&!dividerDone){benchDivider(el,w.characters,"character");dividerDone=true;}
    const n=memberCount(c), cost=unitCost(c);
    const nGear=c.weapons.length+c.armour.length+c.items.length;
    const nAbil=c.traits.length+c.abilities.length;
    const fielded=isFielded(c);
    const card=document.createElement("div");
    card.className="card"+(fielded?"":" benched");card.tabIndex=0;card.setAttribute("role","button");
    card.onclick=()=>openCard(c.id);
    card.onkeydown=e=>{if(e.key==="Enter"){openCard(c.id);}};
    card.innerHTML=`
      <div class="card-top">
        ${c.img?`<img class="card-thumb" src="${c.img}" style="object-position:${(c.imgPos||{x:50}).x}% ${(c.imgPos||{y:50}).y}%" alt="">`:""}
        <div style="min-width:0;flex:1">
          <div class="card-name">${esc(c.name)||"<span style='color:var(--ink-mute)'>Unnamed</span>"}</div>
          <div class="card-role">${esc(c.role)||"&nbsp;"}</div>
        </div>
        <div class="card-cost">${cost}<small>points</small></div>
      </div>
      <div class="statgrid">
        ${SKILLS.map(([k])=>`<div class="stat"><b>${c.skills[k]}</b><span>${k}</span></div>`).join("")}
      </div>
      <div class="card-foot">
        <div class="chips">
          ${n>1?`<span class="chip squad">⛊ Squad ×${n}</span>`:""}
          ${hpChipFor(c,c.hp*n,false)}
          ${questUnitFor(c.id,false)?`<span class="chip onquest">⚔ deployed</span>`:""}
          ${tallyHTML(c)}
          <span class="chip">${charSpeed(c)}cm${speedSuffix(c)}</span>
          ${cpTotalOf(c)>0?`<span class="chip rank">${esc(rankOf(cpTotalOf(c)))}</span>`:""}
          ${cpOf(c)>0?`<span class="chip xp">⭐ ${cpOf(c)} cp</span>`:""}
          ${cardMarks(c,false)}
          ${nGear?`<span class="chip">${nGear} gear</span>`:""}
        </div>
        <button class="fieldtog ${fielded?"on":""}" data-tog title="Bring in / out of the battle">${fielded?"◉ Fielded":"○ Benched"}</button>
      </div>`;
    card.querySelector("[data-tog]").onclick=e=>{e.stopPropagation();toggleFielded(c);};
    card.querySelectorAll("[data-tally]").forEach(b=>b.onclick=e=>{e.stopPropagation();bumpTally(c,b.dataset.tally.split("|")[1]);});
    el.appendChild(card);
  });
  const add=document.createElement("button");
  add.className="card add";add.onclick=openRecruitChooser;
  add.innerHTML=`<div class="plus">+</div><span>${wbSealed(w)?((w.freeRecruits||0)>0?"Recruit replacement · free":"Recruit character · "+CP_COSTS.recruit+" cp"):"Recruit character"}</span>`;
  el.appendChild(add);
}

function renderVehicleRoster(){
  const w=activeWB(),el=$("#vehicleRoster");if(!el)return;el.innerHTML="";
  let vDivider=false;
  byFielded(vehsOf(w)).forEach(v=>{

      <div class="card-foot">
        <div class="chips">
          <span class="chip">${ty[0]}</span>

          ${questUnitFor(v.id,true)?`<span class="chip onquest">⚔ deployed</span>`:""}
          ${cardMarks(v,true)}
          ${v.laidUp?`<span class="chip" style="color:var(--warn)">in the workshop</span>`:""}
          ${v.wrecked?`<span class="chip" style="color:var(--danger)">wrecked</span>`:""}
        </div>
        <button class="fieldtog ${fielded?"on":""}" data-tog title="Bring in / out of the battle">${fielded?"◉ Fielded":"○ Benched"}</button>
      </div>`;
    card.querySelector("[data-tog]").onclick=e=>{e.stopPropagation();toggleFielded(v);};
    el.appendChild(card);
  });
  const add=document.createElement("button");
  add.className="card add";add.onclick=addVehicle;
  add.innerHTML=`<div class="plus">+</div><span>Build vehicle</span>`;

}



/* ---- WHAT IS THIS DEVICE? ----
   Realm is one link but two jobs: a player's CAMP (a warband, taken on quests) or THE REALM
   itself (the host's table, running scenarios and the DM's enemies). Asking once on first run
   means neither person has to look past half an app they never use. The choice is remembered
   and can be changed any time from the camp header. In the Claude app there is no hosting at
   all, so the question is never asked. */
function appRole(){ try{return localStorage.getItem("p28_role")||"";}catch(e){return "";} }
function setAppRole(r){ try{localStorage.setItem("p28_role",r);}catch(e){} applyRole(); }
function isHost(){ return fbAvailable() && appRole()==="realm"; }
function onAQuest(){
  return !!(activeQuestScn()||(liveRole==="guest"&&liveScenario)||liveRole==="host");
}
function applyRole(){
  const host=isHost();
  const campTab=document.querySelector('#topnav .topnav-btn[data-view="warband"]');
  if(campTab)campTab.hidden=host;
  const cb=$("#campBar"); if(cb)cb.hidden=host;
  document.body.classList.toggle("host-device",host);
  syncQuestTab();
  if(host&&currentView!=="scenarios")switchView("scenarios");
  else{ render(); if(currentView==="scenarios")renderScenarioView(); }
}
function syncQuestTab(){
  const ct=document.querySelector('#topnav .topnav-btn[data-view="warband"]'); if(ct&&isWorkshop())ct.lastChild.textContent="Warbands";
  const tab=document.querySelector('#topnav .topnav-btn[data-view="scenarios"]');
  const lbl=$("#scnTabLabel");
  if(!tab)return;
  const host=isHost();
  const show=host||!fbAvailable()||onAQuest();     // the Claude app still writes scenarios here
  tab.hidden=!show;
  if(lbl)lbl.textContent=(fbAvailable()&&!host)?"Quest":"Scenarios";
  const campClosed=campClosedForQuest();
  if(ct)ct.hidden=host||campClosed;
  const nav=$("#topnav"); if(nav)nav.hidden=host||!show||campClosed;
  if(!show&&currentView==="scenarios")switchView("warband");
  if(campClosed&&currentView!=="scenarios")switchView("scenarios");
}
/* while the warband is in the field, camp is shut — everyone who went is fielded, everyone
   benched stayed behind, and nothing at camp happens until they are home */
function campClosedForQuest(){
  return fbAvailable()&&!isHost()&&liveRole==="guest"&&!!(liveScenario&&liveScenario.battle&&liveScenario.battle.started);
}
/* Only camps that have been stashed at the table are listed — a camp living solely on
   someone's phone is invisible here, which is worth saying out loud rather than showing
   an empty list that looks broken. */
async function listCamps(){
  const db=await getDb(); if(!db)return null;
  try{ const s=await db.collection("camps").get();
    return s.docs.map(d=>{const v=d.data()||{};return {id:d.id,name:v.name||d.id,savedAt:v.savedAt||0,n:(v.warbands||[]).length};})
      .sort((a,b)=>b.savedAt-a.savedAt);
  }catch(e){ return null; }
}
function openRoleChooser(){
  const body=$("#modalBody");
  const step1=()=>{
    body.innerHTML=`<h3>What is this device?</h3>
      <p class="lead">You can change this later from your camp header.</p>
      <div class="rolegrid">

          <div class="rc-ico">⛺</div><div class="rc-n">A camp</div>

      body.innerHTML=`<h3>⛺ Your camp</h3>

      $("#rcPass").onclick=async()=>{ if(await ensureRoom())step2(); };

    const camps=await listCamps();

        <div class="wbi-sub">${c.n} warband${c.n===1?"":"s"}${c.savedAt?" · stashed "+new Date(c.savedAt).toLocaleDateString():""}</div>
      </button></div>`).join("");
    body.innerHTML=`<h3>⛺ Your camp</h3>
      ${camps===null?`<p class="lead">Couldn't reach your realm — you can still start a camp on this device.</p>`

             :`<p class="lead">No camps stashed in your realm yet. Start one here — you can stash it later so your other devices can pick it up.</p>`}

/* The camp's own header: who you are (camp name) and which table you play at (passphrase).
   Both used to live inside the Warbands dialog, which is why nobody found them. The
   passphrase only means anything where there is a live table, so it only shows in Realm. */

/* On whenever a quest is live and something of yours is in it. Urgent once one of your own
   has been taken down, so the screen changes on its own the moment it matters. */
function syncQuestGlow(){
  const el=$("#questGlow"); if(!el)return;
  const s=activeQuestScn();
  const mine=s?(s.battle.combatants||[]).filter(m=>m&&m.side==="player"&&(m.charId||m.vehId)):[];
  const on=!!s&&mine.length>0;
  el.hidden=!on;
  // steady red = deployed · amber pulse = someone under half (skills −1, break tests) · fast red = someone down
  const down=on&&mine.some(m=>(m.curHP|0)<=0);
  const bleeding=on&&!down&&mine.some(m=>(m.curHP|0)>0&&(m.curHP|0)<=m.maxHP*0.5);
  el.classList.toggle("urgent",down);
  el.classList.toggle("wounded",bleeding);
}

    syncQuestGlow(); syncQuestTab(); renderActRow(); return;

  el.innerHTML=`<div class="statusstrip">

    <span class="sc static ${sealed?"sealed":""}">${sealed?"🔒 sealed":"🔓 building"}</span>
    ${quest?`<button class="sc quest" id="cbToScn">⚔ ${esc(quest.title||"On a quest")} ›</button>`:""}
  </div>${live&&!joined?`<div class="none-note" style="font-style:normal;margin:2px 0 4px">One-time — the realm you share with your players. After this, joining a game is just a 4-letter code.</div>`:""}`;
  $("#cbName").onclick=openCampNamePrompt;

  const cq=$("#cbToScn"); if(cq)cq.onclick=()=>{const q=activeQuestScn();if(q){scnCurrentId=q.id;scnScreen="detail";}switchView("scenarios");};

function addCharacter(){
  const w=activeWB();
  if(!wbSealed(w)){const c=newChar();w.characters.push(c);render();openDossier(c.id);return;}
  const free=(w.freeRecruits||0)>0, fee=free?0:CP_COSTS.recruit, pool=w.cp||0;

  askConfirm(free?"A replacement for the fallen joins without the usual "+CP_COSTS.recruit+"-point fee. Their levels, traits and abilities still cost their points from the warband pool ("+pool+" available); gear costs credits."
    :"Recruit a new character for "+CP_COSTS.recruit+" campaign points from the warband pool ("+pool+" available)? Their levels, traits and abilities cost their points on top; gear costs credits.",
    ()=>{
      if(free)w.freeRecruits--; else w.cp=pool-fee;
      const c=newChar(); c.recruit=true; c.recruitFee=fee; w.characters.push(c); save(); render(); openDossier(c.id);
    },{danger:false,yesLabel:free?"Bring them in":"Pay "+CP_COSTS.recruit+" cp"});
}

/* ============================ DOSSIER (character editor) ============================ */
function syncScroll(){
  const open=document.querySelector(".scrim.show,.dossier.show,.picker.show,.modal.show,.cardwrap.show,.confirm.show,.maplb.show");
  document.body.style.overflow=open?"hidden":"";
  document.body.classList.toggle("overlay-open",!!open);
}
let _confirmCb=null;
function askConfirm(message,onYes,opts){
  opts=opts||{};
  $("#confirmMsg").textContent=message;
  const yes=$("#confirmYes");
  yes.textContent=opts.yesLabel||"Confirm";
  yes.className="btn sm "+(opts.danger===false?"primary":"confirm-danger");
  _confirmCb=onYes;
  $("#confirmWrap").classList.add("show");syncScroll();
}
function closeConfirm(){$("#confirmWrap").classList.remove("show");_confirmCb=null;syncScroll();}
function openDossier(id){
  curCharId=id;curVehId=null;buildDossier();
  $("#scrim").classList.add("show");
  const d=$("#dossier");d.classList.add("show");d.setAttribute("aria-hidden","false");
  syncScroll();
}
/* a recruit whose build the pool cannot pay for stays on the desk — no back door out */
function settleRecruit(){
  const c=curChar(); if(!c||!c.recruit||!wbSealed())return true;
  const w=activeWB(), need=recruitBuildCost(c), pool=w.cp||0;
  if(need>pool){toast("This build costs "+need+" campaign points — the pool has "+pool+". Trim it, or discharge them.");return false;}
  w.cp=pool-need; delete c.recruit; delete c.recruitFee; save();
  if(need>0)toast("Recruited — "+need+" campaign points spent on their build");
  return true;
}
function closeDossier(){
  if(curCharId&&!settleRecruit())return;
  $("#scrim").classList.remove("show");
  const d=$("#dossier");d.classList.remove("show");d.setAttribute("aria-hidden","true");
  curCharId=null;curVehId=null;syncScroll();
}
function curChar(){return activeWB().characters.find(c=>c.id===curCharId)}

function buildDossier(){
  const c=curChar();if(!c)return;
  const wbL=activeWB(), locked=wbSealed(wbL)&&!c.recruit, recruit=wbSealed(wbL)&&!!c.recruit;
  const cost=charCost(c);
  const d=$("#dossier");
  d.innerHTML=`
    <div class="dossier-head">
      <button class="iconbtn" id="dBack" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div><div class="eyebrow">Character dossier</div></div>
      <div class="dcost">${dossierCostHTML(cost,c)}</div>
    </div>
    <div class="dbody" id="dbody"></div>
    <div class="dossier-foot">
      <button class="btn danger ghost" id="dDelete">Discharge</button>
      <button class="btn primary" id="dDone">Done</button>
    </div>`;
  const b=$("#dbody");
  if(locked)b.insertAdjacentHTML("beforeend",`<div class="seal-note">🔒 <b>Sealed for the campaign.</b> Skills, hit-points, traits and abilities advance with campaign points (⭐ Advance below); gear is bought with credits (🛒). Name and background stay yours to edit.</div>`);
  if(recruit)b.insertAdjacentHTML("beforeend",`<div class="seal-note recruit">🪖 <b>New recruit.</b> Build them here — levels, traits and abilities cost their points from the warband pool (<b>${wbL.cp||0}</b> available), taken when you press Done. Gear is bought with credits.</div>`);

  // identity
  const idc=document.createElement("div");idc.className="dgroup";
  idc.innerHTML=`
    <div class="field" style="margin-bottom:12px"><label>Name</label>
      <div class="name-row">
        <input class="input" id="fName" value="${esc(c.name)}" placeholder="e.g. Sgt. Vex Kalloran" maxlength="42">
        <button class="genbtn" id="fGen" title="Suggest a name &amp; background with AI" aria-label="Suggest a name and background with AI">✦</button>
      </div></div>
    <div class="field" style="margin-bottom:12px"><label>Role / archetype</label><input class="input" id="fRole" value="${esc(c.role)}" placeholder="e.g. Warband leader" maxlength="40"></div>
    <div class="field"><label>Background</label><textarea class="input" id="fBg" placeholder="Who are they, and why do they fight?">${esc(c.bg)}</textarea></div>`;
  b.appendChild(idc);
  idc.querySelector("#fName").oninput=e=>{c.name=e.target.value;liveCost();renderHeader();renderRoster();save()};
  idc.querySelector("#fGen").onclick=()=>openNameGen(c,false);
  idc.querySelector("#fRole").oninput=e=>{c.role=e.target.value;save();renderRoster()};
  idc.querySelector("#fBg").oninput=e=>{c.bg=e.target.value;save()};

  // skills
  const sg=document.createElement("div");sg.className="dgroup";
  sg.innerHTML=`<div class="ghead"><span class="eyebrow">Core skills</span><span class="rule"></span><span class="gcost mono">+${skillPts(c)}</span></div>`;
  SKILLS.forEach(([k,name])=>{
    const pts=(c.skills[k]-1)*RULES.skillStep;
    const row=document.createElement("div");row.className="steprow";
    row.innerHTML=`
      <div class="lbl" data-tip="${esc(SKILL_INFO[k]+" "+SKILL_ROLL)}"><b>${name} <span style="color:var(--ink-mute)">(${k})</span></b><span>${RULES.skillStep} pts / level · range ${RULES.skillMin}–${RULES.skillMax}</span></div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="stepper">
          <button data-d="-1" ${locked||c.skills[k]<=RULES.skillMin?"disabled":""} aria-label="Lower ${name}">−</button>
          <span class="val">${c.skills[k]}</span>
          <button data-d="1" ${locked||c.skills[k]>=RULES.skillMax?"disabled":""} aria-label="Raise ${name}">+</button>
        </div>
        <span class="pts mono ${pts>0?"pos":""}">${pts?"+"+pts:"—"}</span>
      </div>`;
    row.querySelectorAll("button").forEach(bt=>bt.onclick=()=>{

/* cost badge: what this one costs, and what is still available to spend on it —
   build points while the warband is being built, the pool for a recruit, campaign points once sealed */
function dossierCostHTML(cost,obj){
  const w=activeWB();
  if(obj&&obj.recruit&&wbSealed(w)){
    const left=(w.cp||0)-recruitBuildCost(obj);
    return `${cost}<small>points · <b class="${left<0?"over":"ok"}">${left<0?"pool short by "+(-left):left+" cp left in pool"}</b></small>`;
  }

    return `${cost}<small>points · <b class="ok">⭐ ${cp} cp to spend</b></small>`;
  }

/* meta/description line for a catalog entry (shared by group rows + picker) */
function entryDesc(cat,o){
  if(cat==="weapon"||cat==="vweapon"){
    const b=[];
    if(o.type)b.push(o.type); if(o.size)b.push(o.size);
    if(o.dmg)b.push("dmg "+o.dmg);
    if(o.range&&o.range!=="—")b.push(o.range);
    if(o.rules&&o.rules!=="—")b.push(o.rules);
    return b.join(" · ");
  }
  if(cat==="armour")return (o.def&&o.def!=="—"?"Defence "+o.def:"")+(o.desc&&o.desc!=="—"?((o.def&&o.def!=="—")?" · ":"")+o.desc:"");
  if(cat==="vsection")return "HP "+o.hp+(o.desc?" · "+o.desc:"");
  return o.desc||"";
}
const ADD_NOUN={trait:"trait",ability:"ability",weapon:"weapon",armour:"armour",item:"item",vsection:"section",vtrait:"trait",vability:"ability",vweapon:"weapon"};

/* generic group renderer — obj[field] is a list of ids (traits/abilities) or {id,qty} (gear).
   rebuild() re-renders the parent editor (buildDossier or buildVehicleDossier). */
function gearGroup(obj,label,cat,arr,rebuild,lock){
  const meta=CAT_META[cat], isQty=meta.kind==="qty", unit=meta.unit;
  const g=document.createElement("div");g.className="dgroup";
  const groupCost=isQty?gearPts(arr,cat):listPts(arr,cat);
  g.innerHTML=`<div class="ghead"><span class="eyebrow">${label}</span><span class="rule"></span>
     <span class="gcost mono">${groupCost?(isQty?groupCost+" "+unit:fmtSigned(groupCost)):"—"}</span></div>`;
  const list=document.createElement("div");list.className="sel-list";
  if(!arr.length){const n=document.createElement("div");n.className="none-note";n.textContent="None selected.";list.appendChild(n);}
  arr.forEach(entry=>{
    const id=isQty?entry.id:entry;const o=CAT[cat][id];if(!o)return;
    const row=document.createElement("div");row.className="sel-row";
    let costTxt,costCls;
    if(isQty){costTxt=(o.cost*entry.qty)+" "+unit;costCls="cr";}
    else{costTxt=fmtSigned(o.cost);costCls=o.cost>=0?"pos":"neg";}
    const d=entryDesc(cat,o);
    row.innerHTML=`
      <div class="srmain"><div class="srname">${esc(o.name)}</div>${d?`<div class="srdesc">${esc(d)}</div>`:""}</div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:7px">
        <span class="srcost ${costCls}">${costTxt}</span>
        ${isQty?(lock?`<span class="qv mono">×${entry.qty}</span>`:`<div class="qty"><button data-q="-1" aria-label="less">−</button><span class="qv">${entry.qty}</span><button data-q="1" aria-label="more">+</button></div>`):""}
      </div>
      ${lock==="cp"?"":`<button class="rm" aria-label="Remove">×</button>`}`;
    if(isQty)row.querySelectorAll(".qty button").forEach(bt=>bt.onclick=()=>{entry.qty=Math.max(1,entry.qty+ +bt.dataset.q);rebuild();persist();});
    const rmb=row.querySelector(".rm");if(rmb)rmb.onclick=()=>{arr.splice(arr.indexOf(entry),1);rebuild();persist();};
    list.appendChild(row);
  });
  g.appendChild(list);
  const addLine=document.createElement("div");addLine.className="add-line";addLine.style.marginTop="9px";
  const ab=document.createElement("button");ab.className="addbtn";
  if(lock==="cp"){ab.innerHTML=`<span class="p">⭐</span> Advance with campaign points`;ab.onclick=()=>openSpendCP(obj.id);}
  else if(lock==="shop"){ab.innerHTML=`<span class="p">🛒</span> Buy with credits`;ab.onclick=()=>openBuyGear(obj.id);}
  else {ab.innerHTML=`<span class="p">+</span> Add ${ADD_NOUN[cat]||"item"}`;ab.onclick=()=>openPicker(cat,obj,rebuild);}
  addLine.appendChild(ab);g.appendChild(addLine);
  return g;
}

let pickerCtx=null;
const PICKER_TITLE={trait:"Add a trait",ability:"Add an ability",weapon:"Add a weapon",armour:"Add armour",item:"Add an item",
  vsection:"Add a section",vtrait:"Add a vehicle trait",vability:"Add a vehicle ability",vweapon:"Add a weapon"};
/* while a sealed warband's recruit is being built, the picker checks the pool before adding */
function recruitCanAfford(obj,cat,o){
  if(!obj||!obj.recruit||!wbSealed())return true;
  if(cat!=="trait"&&cat!=="ability")return true;
  const room=(activeWB().cp||0)-recruitBuildCost(obj);
  return o.cost<=room;
}

/* A weapon with "Ammo = rough/basic/special" spends a piece per shot and cannot fire without
   any. Buying the gun and forgetting the bullets is the classic mistake, so the app asks
   straight away — and tells you how many are already in the pack. */
const AMMO_FOR={rough:"Ammo — rough",basic:"Ammo — basic",special:"Ammo — special"};
function ammoTypeOf(o){const m=String(o&&o.rules||"").match(/Ammo\s*=\s*(rough|basic|special)/i);return m?m[1].toLowerCase():"";}
function offerAmmoFor(weapon,obj,rebuild){
  const kind=ammoTypeOf(weapon); if(!kind)return;
  const it=findCat("item",AMMO_FOR[kind]); if(!it||!Array.isArray(obj.items))return;
  const have=(obj.items.find(e=>e.id===it.id)||{}).qty||0;
  const body=$("#modalBody");
  const add=n=>{
    const ex=obj.items.find(e=>e.id===it.id);
    if(ex)ex.qty+=n; else obj.items.push({id:it.id,qty:n});
    closeModal(); if(rebuild)rebuild(); persist();
    toast(n+" × "+it.name+" added");
  };
  body.innerHTML=`<h3>${esc(weapon.name)} needs ammo</h3>
    <p class="lead">It spends one piece of <b>${esc(it.name.toLowerCase())}</b> every time it fires, and cannot shoot with an empty pack. ${have?`This one already carries <b>${have}</b>.`:"This one carries none."}</p>
    <div class="chips-row">
      ${[3,5,10].map(n=>`<button class="stylechip" data-ammo="${n}">+${n} <span class="none-note" style="font-style:normal">${n*it.cost} cr</span></button>`).join("")}
    </div>
    <div class="modal-actions"><button class="btn ghost sm" id="amSkip" style="margin-left:auto">Not now</button></div>`;
  body.querySelectorAll("[data-ammo]").forEach(b=>b.onclick=()=>add(+b.dataset.ammo));
  $("#amSkip").onclick=closeModal;
  showModal();
}
function renderPickerList(q){
  const {cat,obj,field,rebuild}=pickerCtx;const list=$("#pkList");list.innerHTML="";
  q=q.trim().toLowerCase();
  const meta=CAT_META[cat], isQty=meta.kind==="qty", unit=meta.unit;
  const arr=obj[field];
  const pickedIds=new Set(isQty?arr.map(e=>e.id):arr);
  const entries=Object.values(CAT[cat]).filter(o=>{
    if(!q)return true;
    const hay=(o.name+" "+(o.desc||"")+" "+(o.rules||"")+" "+(o.type||"")+" "+(o.dmg||"")+" "+(o.def||"")).toLowerCase();
    return hay.includes(q);
  });
  if(!entries.length){list.innerHTML=`<div class="nomatch">No match for “${esc(q)}”.</div>`;return}
  $("#pkTitle").innerHTML=(PICKER_TITLE[cat]||"Add")+` <span class="cnt">${entries.length}</span>`;
  entries.forEach(o=>{
    const picked=!isQty&&pickedIds.has(o.id);
    const btn=document.createElement("button");btn.className="opt"+(picked?" picked":"");
    let costTxt,costCls;
    if(isQty){costTxt=o.cost+" "+unit;costCls="cr";}else{costTxt=fmtSigned(o.cost);costCls=o.cost>=0?"pos":"neg";}
    const desc=entryDesc(cat,o);
    btn.innerHTML=`
      <div class="omain">
        <div class="oname">${esc(o.name)}${picked?' <span class="tag">added</span>':""}</div>
        ${desc?`<div class="odesc">${esc(desc)}</div>`:""}
      </div>
      <div class="ocost ${costCls}">${costTxt}</div>`;
    btn.onclick=()=>{
      if(isQty){
        const ex=arr.find(e=>e.id===o.id);
        if(ex)ex.qty++;else arr.push({id:o.id,qty:1});
        toast(o.name+" added");
        if(cat==="weapon")offerAmmoFor(o,obj,rebuild);
      }else{
        if(pickedIds.has(o.id)){arr.splice(arr.indexOf(o.id),1);toast(o.name+" removed");}
        else if(!recruitCanAfford(obj,cat,o)){toast("The pool cannot pay for "+o.name+" ("+o.cost+" cp)");return;}
        else{arr.push(o.id);toast(o.name+" added");}
      }
      rebuild();persist();
      renderPickerList($("#pkSearch").value);
    };
    list.appendChild(btn);
  });
}

/* a character code becomes a clean character: only catalogue ids survive, nothing campaign-worn */
function charFromCode(raw){
  if(!raw||typeof raw!=="object"||!raw.skills)return null;
  const c=newChar();
  c.name=String(raw.name||"").slice(0,42); c.role=String(raw.role||"").slice(0,40); c.bg=String(raw.bg||"").slice(0,600);
  c.count=Math.max(1,Math.min(10,Math.round(+raw.count||1))); if(c.count===2)c.count=1;
  SKILLS.forEach(([k])=>{c.skills[k]=Math.max(RULES.skillMin,Math.min(RULES.skillMax,Math.round(+raw.skills[k])||1));});
  c.hp=Math.max(2,Math.min(80,Math.round(+raw.hp||RULES.hpStart)));
  const ids=(arr,cat)=>[...new Set((Array.isArray(arr)?arr:[]).map(v=>typeof v==="string"?v:(v&&v.id)).filter(id=>id&&CAT[cat][id]))];
  const qty=(arr,cat)=>(Array.isArray(arr)?arr:[]).filter(e=>e&&e.id&&CAT[cat][e.id]).map(e=>({id:e.id,qty:Math.max(1,Math.min(9,Math.round(+e.qty)||1))}));
  c.traits=ids(raw.traits,"trait"); c.abilities=ids(raw.abilities,"ability");
  c.weapons=qty(raw.weapons,"weapon"); c.armour=qty(raw.armour,"armour"); c.items=qty(raw.items,"item");
  return c;
}
function importCharacter(raw){
  const w=activeWB(), c=charFromCode(raw);
  if(!c){toast("That isn't a character code");return;}
  if(!wbSealed(w)){w.characters.push(c);save();render();closeModal();toast((c.name||"Character")+" joined the warband");return;}
  // sealed: the recruit is paid for on the way in
  const free=(w.freeRecruits||0)>0, fee=free?0:CP_COSTS.recruit, build=recruitBuildCost(c), pool=w.cp||0;
  const gearCost=gearPts(c.weapons,"weapon")+gearPts(c.armour,"armour")+gearPts(c.items,"item"), credits=creditsOf(w);
  if(fee+build>pool){toast("Needs "+(fee+build)+" campaign points (fee "+fee+" + build "+build+") — the pool has "+pool);return;}
  const gearOk=gearCost<=credits;
  askConfirm((c.name||"This recruit")+" joins for "+(fee+build)+" campaign points"+(free?" (replacement — no fee)":" ("+fee+" fee + "+build+" build)")+" from the pool of "+pool

function summaryText(w){

    out+=`${c.name||"Unnamed"}${c.role?" — "+c.role:""}  [${unitCost(c)} pts]${memberCount(c)>1?"  (squad ×"+memberCount(c)+")":""}${isFielded(c)?"":"  (benched)"}\n`;
    out+="  "+SKILLS.map(([k])=>`${k} ${c.skills[k]}`).join("  ")+`   ${c.hp}HP  ${charSpeed(c)}cm${speedSuffix(c)}\n`;
    const t=c.traits.map(id=>CAT.trait[id]?.name).filter(Boolean).join(", ");if(t)out+="  Traits: "+t+"\n";
    const a=c.abilities.map(id=>CAT.ability[id]?.name).filter(Boolean).join(", ");if(a)out+="  Abilities: "+a+"\n";
    const g=[...c.weapons.map(e=>CAT.weapon[e.id]?.name+(e.qty>1?" x"+e.qty:"")),...c.armour.map(e=>CAT.armour[e.id]?.name),...c.items.map(e=>CAT.item[e.id]?.name+(e.qty>1?" x"+e.qty:""))].filter(Boolean).join(", ");
    if(g)out+="  Gear: "+g+"\n";
    out+="\n";
  });
  return out;
}

/* SOLO AI (rulebook p.51-52). The host runs the DM's units, and until now had to remember
   this ladder unaided. It is a strict priority order — take the FIRST line that applies. */
const SOLO_AI=[
  ["In combat","It fights on until it or its opponent is slain. It may not choose to leave combat."],
  ["Not in combat, a player character in line of sight","It takes a shooting action, or uses an ability if it has a relevant one."],
  ["Can't shoot and has no relevant ability","It moves its full speed straight at the nearest visible player character. If two are equally close, pick at random."],
  ["No player character visible","It moves its full speed towards the board edge furthest from where it stands."]
];
const SOLO_AI_ALWAYS=[
  "Always charges when a charge is possible.",
  "Always counters in combat when it can.",
  "Never pushes an opponent back after winning a fight.",
  "Never leaves combat, and never holds an action.",
  "Hits an obstacle while moving? Roll 1D4 — on 1-2 it carries straight on, using Agility to tackle the obstacle; on 3 it turns and moves back the way it came; on 4 you decide how it spends the rest of its move."
];

/* Rolled powers, read as the enemy's own tactics. The ladder already says "shoot OR use an
   ability", but which ability, at whom, and whether it counts as reaching across the table
   is exactly what the host has to decide mid-turn — so spell it out per power. */
const ARCANA_AI=[

/* ---- character portrait (paste / drop / browse) ---- */
function wirePortrait(o){
  const port=$("#gcPortrait");if(!port)return;
  const browse=()=>$("#imgInput").click();
  if(o.img&&portraitEditing){
    const img=$("#gcImg");
    let dragging=false,sx=0,sy=0,ox=50,oy=50;
    img.addEventListener("pointerdown",e=>{dragging=true;sx=e.clientX;sy=e.clientY;ox=tmpPos.x;oy=tmpPos.y;try{img.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
    img.addEventListener("pointermove",e=>{
      if(!dragging)return;
      const r=port.getBoundingClientRect();
      const kx=100/Math.max(1,r.width), ky=100/Math.max(1,r.height);
      tmpPos.x=Math.max(0,Math.min(100,ox-(e.clientX-sx)*kx));
      tmpPos.y=Math.max(0,Math.min(100,oy-(e.clientY-sy)*ky));
      img.style.objectPosition=tmpPos.x+"% "+tmpPos.y+"%";
    });
    const end=()=>{dragging=false;};
    img.addEventListener("pointerup",end);img.addEventListener("pointercancel",end);
    $("#gcPosSave").onclick=()=>{o.imgPos={x:Math.round(tmpPos.x),y:Math.round(tmpPos.y)};portraitEditing=false;save();rebuildOpenCard();renderRoster();renderVehicleRoster();toast("Position saved");};
    $("#gcPosCancel").onclick=()=>{portraitEditing=false;rebuildOpenCard();};
    return;
  }
  if(o.img){
    $("#gcImgAdjust").onclick=e=>{e.stopPropagation();tmpPos=Object.assign({x:50,y:50},o.imgPos);portraitEditing=true;rebuildOpenCard();};
    $("#gcImgChange").onclick=e=>{e.stopPropagation();browse();};
    $("#gcImgRemove").onclick=e=>{e.stopPropagation();o.img=null;save();rebuildOpenCard();renderRoster();renderVehicleRoster();toast("Portrait removed");};
  }else{
    const drop=$("#gcDrop");
    drop.onclick=browse;
    drop.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();browse();}};
  }
  port.addEventListener("dragover",e=>{e.preventDefault();const d=port.querySelector(".gc-drop");if(d)d.classList.add("drag");});
  port.addEventListener("dragleave",()=>{const d=port.querySelector(".gc-drop");if(d)d.classList.remove("drag");});
  port.addEventListener("drop",e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)handleImageFile(o,f);});
}
function processImage(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onerror=()=>reject(new Error("read"));
    r.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("decode"));
      img.onload=()=>{
        const maxW=640,maxH=820;
        let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        const scale=Math.min(1,maxW/w,maxH/h);
        w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
        const cv=document.createElement("canvas");cv.width=w;cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        resolve(cv.toDataURL("image/jpeg",0.82));
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}
async function handleImageFile(o,file){
  if(!file||!file.type||!/^image\//.test(file.type)){toast("That doesn't look like an image");return;}
  toast("Adding portrait…");
  try{
    const url=await processImage(file);
    const prev=o.img, prevPos=o.imgPos;o.img=url;o.imgPos={x:50,y:50};
    if(!save()){o.img=prev;o.imgPos=prevPos;save();toast("Storage full — try a smaller image or remove some");return;}
    rebuildOpenCard();renderRoster();renderVehicleRoster();toast("Portrait added");
  }catch(e){toast("Couldn't read that image");}
}

/* ============================ AI ART-PROMPT BUILDER ============================ */
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s}
function naturalJoin(a){if(a.length===0)return "";if(a.length===1)return a[0];if(a.length===2)return a[0]+" and "+a[1];return a.slice(0,-1).join(", ")+", and "+a[a.length-1];}
function article(w){return /^[aeiou]/i.test(w)?"an ":"a ";}

function buildArtPrompt(c){
  const s=c.skills, out=[];
  // subject
  const who=(c.name||"").trim();
  const role=(c.role||"").trim();
  const lead=role?article(role)+role.toLowerCase():"a lone operative";
  let bgEss="";
  if(c.bg&&c.bg.trim()){bgEss=(c.bg.trim().match(/^[^.!?]*/)||[""])[0].trim();if(bgEss.length>150)bgEss=bgEss.slice(0,150).trim();if(bgEss)bgEss=bgEss.charAt(0).toLowerCase()+bgEss.slice(1);}
  out.push(`${who?who+", ":""}${lead}`+(bgEss?` — ${bgEss}`:""));
  // physique from stats
  const ap=[];
  if(s.F>=8)ap.push("hulking, heavily muscled and covered in battle scars");
  else if(s.F>=6)ap.push("powerfully built for close combat");
  if(s.S>=8)ap.push("a deadeye marksman");
  else if(s.S>=6)ap.push("a steady-handed shooter");
  if(s.A>=8)ap.push("lithe and acrobatic");
  else if(s.A<=2)ap.push("slow and heavy-footed");
  if(s.AW>=8)ap.push("hyper-alert with sharp, watchful eyes");
  if(s.P>=8)ap.push("crackling with psychic energy, eyes glowing with arcane power");
  else if(s.P>=6)ap.push("carrying an unsettling psychic aura");
  if(s.F<=2&&s.A<=2&&s.S<=2)ap.push("frail and physically unimposing");
  if(ap.length)out.push(cap(naturalJoin(ap.slice(0,3))));
  // traits
  const tv=c.traits.map(id=>TRAIT_VIS[CAT.trait[id]?.name]).filter(Boolean);
  if(tv.length)out.push(cap(naturalJoin(tv.slice(0,4))));
  // armour
  const av=[...new Set(c.armour.map(e=>ARMOUR_VIS[CAT.armour[e.id]?.name]).filter(Boolean))];
  if(av.length)out.push("wearing "+naturalJoin(av));
  // weapons
  const wns=[...new Set(c.weapons.map(e=>CAT.weapon[e.id]?.name).filter(Boolean).filter(n=>n!=="Fist"))];
  if(wns.length)out.push("armed with "+naturalJoin(wns.map(n=>article(n)+n.toLowerCase())));
  else out.push("fighting with bare fists");
  // items
  const iv=[...new Set(c.items.map(e=>ITEM_VIS[CAT.item[e.id]?.name]).filter(Boolean))];
  if(iv.length)out.push("carrying "+naturalJoin(iv));
  // style + framing
  const style=ART_STYLES[promptStyle]||ART_STYLES.concept;
  const asp=ASPECTS[promptAspect]||ASPECTS["2:3"];
  let p=out.map(cap).join(". ")+". "+cap(style[1])+". ";
  p+="Character shown in a dark, grimy science-fiction setting (the Planet 28 tabletop skirmish universe), neutral background, no text or watermark. ";
  p+=cap(asp[1])+" ("+asp[2]+").";
  return p;
}
const NEG_PROMPT="blurry, low detail, low quality, cropped, extra fingers, deformed hands, watermark, signature, text, logo, modern clothing, cartoonish";

function buildVehicleArtPrompt(v){
  const out=[];
  const who=(v.name||"").trim();
  const ty=VEHICLE_TYPES[v.type]||VEHICLE_TYPES[0];
  const sz=VEHICLE_SIZES[v.size]||VEHICLE_SIZES[1];
  const typeDesc={Ground:"rugged wheeled and tracked ground vehicle",Walker:"legged walker war-machine",Hover:"hovering anti-grav vehicle",Flyer:"flying aircraft-style vehicle"}[ty[0]]||"vehicle";
  const sizeWord=sz[0]==="Small"?"small, nimble":sz[0]==="Large"?"huge, hulking":"mid-sized";
  let bgEss="";
  if(v.bg&&v.bg.trim()){bgEss=(v.bg.trim().match(/^[^.!?]*/)||[""])[0].trim();if(bgEss.length>150)bgEss=bgEss.slice(0,150).trim();if(bgEss)bgEss=bgEss.charAt(0).toLowerCase()+bgEss.slice(1);}
  out.push(`${who?who+", ":""}a ${sizeWord} ${typeDesc}${v.role?` (${v.role.toLowerCase()})`:""}`+(bgEss?` — ${bgEss}`:""));
  const secNames=(v.sections||[]).map(e=>CAT.vsection[e.id]?.name).filter(Boolean);
  const sv=[];
  if(secNames.includes("Armour plating"))sv.push("heavy bolted armour plating");
  if(secNames.includes("Transport section"))sv.push("a troop-carrying compartment");
  if(secNames.includes("Dozer blade"))sv.push("a front dozer blade");
  if(secNames.includes("Turret hard point"))sv.push("a rotating gun turret");
  if(secNames.includes("Smoke launchers"))sv.push("smoke launchers");
  if(secNames.includes("Radio")||secNames.includes("Scrambler array"))sv.push("antennae and comms arrays");
  if(sv.length)out.push(cap(naturalJoin(sv)));
  const wns=[...new Set((v.weapons||[]).map(e=>CAT.vweapon[e.id]?.name).filter(Boolean))];
  if(wns.length)out.push("armed with "+naturalJoin(wns.map(n=>article(n)+n.toLowerCase())));
  const trn=(v.traits||[]).map(id=>CAT.vtrait[id]?.name).filter(Boolean);
  const tv=[];
  if(trn.includes("Camo"))tv.push("camouflage paint");
  if(trn.includes("Ramshackle"))tv.push("a rusty, ramshackle, cobbled-together look");
  if(trn.includes("Open-topped"))tv.push("an open top");
  if(tv.length)out.push(cap(naturalJoin(tv)));
  const style=ART_STYLES[promptStyle]||ART_STYLES.concept;
  const asp=ASPECTS[promptAspectVeh]||ASPECTS["3:2"];
  let p=out.map(cap).join(". ")+". "+cap(style[1])+". ";
  p+="Three-quarter side view of the vehicle in a dark, grimy science-fiction setting (the Planet 28 tabletop skirmish universe), neutral background, no text or watermark. ";
  p+=cap(asp[1])+" ("+asp[2]+").";
  return p;
}

function openPrompt(o,isVeh){

    <div class="neg-line"><b>Suggested negative prompt</b> <span class="tiplink" id="negCopy">copy</span><br><code id="negTxt">${esc(NEG_PROMPT)}</code></div>
    <div class="modal-actions">
      <button class="btn sm" id="pmEnhance">✦ Enhance with AI</button>
      <button class="btn primary sm" id="pmCopy">Copy prompt</button>

    </div>`;
  const box=$("#promptBox");

    promptStyle=b.dataset.style;

  });
  body.querySelectorAll("#aspChips .stylechip").forEach(b=>b.onclick=()=>{
    if(isVeh)promptAspectVeh=b.dataset.asp;else promptAspect=b.dataset.asp;
    body.querySelectorAll("#aspChips .stylechip").forEach(x=>x.classList.toggle("on",x.dataset.asp===curAsp()));
    $("#arTxt").textContent="--ar "+curAsp();
    refresh();
  });
  $("#arCopy").onclick=()=>{navigator.clipboard.writeText("--ar "+curAsp()).then(()=>toast("Copied --ar "+curAsp())).catch(()=>toast("Copy failed"))};
  $("#pmCopy").onclick=()=>{box.select();navigator.clipboard.writeText(box.value).then(()=>toast("Prompt copied")).catch(()=>{document.execCommand("copy");toast("Prompt copied")});};
  $("#negCopy").onclick=()=>{navigator.clipboard.writeText(NEG_PROMPT).then(()=>toast("Negative prompt copied")).catch(()=>toast("Copy failed"))};
  $("#pmEnhance").onclick=async()=>{
    const en=$("#pmEnhance");
    const s=await getSample();
