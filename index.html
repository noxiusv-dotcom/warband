/* ---- lasting injuries ----
   The AI writes a table of scenario-specific injuries WHEN THE SCENARIO IS GENERATED, so no AI
   is needed at the table. Rolled when a character who went down reaches camp. */
/* Where the rulebook already has a trait for the injury, USE IT — Armless, Slow, Coward and
   the rest are real rules with real (negative) point costs, so a maimed veteran also gets
   cheaper to field. Only fall back to a skill shift or a written note when nothing fits. */
/* The rulebook's own 1D8 character injury table. The AI's scenario injuries are used only for
   FLAVOUR (a name and a line of prose that fits what actually happened) — the mechanics always
   come from here, so a campaign stays legal. */
const INJURY_TABLE=[
  {roll:1,name:"Complete recovery",note:"A swift recovery from their wounds — they fight as normal next game.",permanent:false,heals:true,effectNote:"",skills:{},hp:0,addTraits:[],miss:0,games:0},
  {roll:2,name:"Out of action",note:"Alive but bloodied. They take no part in the next game, then fight as normal.",permanent:false,heals:true,effectNote:"Misses the next game.",skills:{},hp:0,addTraits:[],miss:1,games:0},
  {roll:3,name:"Shaken",note:"Their brush with death has left them traumatised.",permanent:true,heals:true,effectNote:"-1 (P) when making break tests, in all future games.",skills:{},hp:0,addTraits:[],miss:0,games:0,breakP:-1},
  {roll:4,name:"Life long wounds",note:"They will never fully recover from this.",permanent:true,heals:true,effectNote:"Hit-points permanently reduced by 25%.",skills:{},hp:0,addTraits:[],miss:0,games:0,hpPct:-25},
  {roll:5,name:"Shattered hand",note:"They narrowly avoided losing the limb.",permanent:false,heals:true,effectNote:"May only use a single one-handed weapon.",skills:{},hp:0,addTraits:[],miss:0,games:"1D4"},
  {roll:6,name:"Crushed leg",note:"They limp onto the battlefield, the bones barely set.",permanent:true,heals:true,effectNote:"-1D4 Agility while it mends, and a permanent -3cm speed.",skills:{},hp:0,addTraits:[],miss:0,games:"1D4",agility:"1D4",speed:-3},
  {roll:7,name:"Brain damage",note:"A vicious scar runs the length of their skull — a miracle they're alive.",permanent:true,heals:true,effectNote:"Permanent -2 to (AW) and (P).",skills:{AW:-2,P:-2},hp:0,addTraits:[],miss:0,games:0},
  {roll:8,name:"Death",note:"They're dead, just dead. Divide their possessions amongst the warband and find a replacement.",permanent:true,heals:false,dead:true,effectNote:"",skills:{},hp:0,addTraits:[],miss:0,games:0}
];
const d=(n)=>1+Math.floor(Math.random()*n);
function rollDuration(v){return typeof v==="string"&&/^1D(\d+)$/i.test(v)?d(parseInt(v.slice(2),10)):(+v||0);}
function injuryTraitsForAI(){
  return Object.values(CAT.trait).filter(t=>t.cost<0).map(t=>t.name+" ("+t.cost+")").join(", ");
}
function coerceInjury(x){
  if(!x||typeof x!=="object")return null;
  const n=String(x.name||"").slice(0,50); if(!n)return null;
  return {name:n,note:String(x.note||"").slice(0,180),cause:String(x.cause||"").toLowerCase().slice(0,40)};
}
// scenario-written flavour, matched to what put them down
function flavourFor(scn,cause){
  const list=(scn&&Array.isArray(scn.injuries)?scn.injuries:[]).map(coerceInjury).filter(Boolean);
  if(!list.length)return null;
  const c=normLabel(cause);
  const hit=c?list.filter(x=>x.cause&&(normLabel(x.cause).includes(c)||c.includes(normLabel(x.cause)))):[];
  const pool=hit.length?hit:list;
  return pool[Math.floor(Math.random()*pool.length)];
}
function injuryCauses(scn){
  const out=[];
  const add=v=>{const s=String(v||"").trim();if(s&&!out.some(x=>normLabel(x)===normLabel(s))&&out.length<8)out.push(s.slice(0,28));};
  enemyAll(scn).forEach(c=>add(c.name));
  ((scn&&scn.map&&scn.map.features)||[]).filter(f=>f&&f.role==="hazard").forEach(f=>add(f.label));
  ((scn&&scn.events)||[]).forEach(e=>add(e.title));
  return out;
}
function injuryTableFor(scn){return (scn&&Array.isArray(scn.injuries))?scn.injuries:[];}
function applyInjury(c,entry,flavour,scnTitle){
  if(entry.dead){c._died=true;return;}
  const games=rollDuration(entry.games), ag=entry.agility?d(4):0;
  const rec={roll:entry.roll,name:(flavour&&flavour.name)||entry.name,ruleName:entry.name,
    note:(flavour&&flavour.note)||entry.note,effectNote:entry.effectNote,
    permanent:!!entry.permanent,from:scnTitle||"",at:Date.now(),
    games:games,miss:entry.miss||0,agility:ag,speed:entry.speed||0,breakP:entry.breakP||0,served:0};
  c.injuries=c.injuries||[];
  c.injuries.push(rec);
  Object.keys(entry.skills||{}).forEach(k=>{if(typeof c.skills[k]==="number")c.skills[k]=Math.max(1,Math.min(10,c.skills[k]+entry.skills[k]));});
  if(entry.hpPct){const max=c.hp;c.hp=Math.max(2,Math.round(max*(1+entry.hpPct/100)/2)*2);}
  (entry.addTraits||[]).forEach(n=>{const o=findCat("trait",n);if(o&&!c.traits.includes(o.id))c.traits.push(o.id);});
  const max=c.hp*memberCount(c); if(typeof c.curHP==="number"&&c.curHP>max)c.curHP=max;
}
function openInjuryRoll(c){
  const p=c.pendingInjury||{}, causes=Array.isArray(p.causes)?p.causes:[];
  const body=$("#modalBody");
  const draw=cause=>{
    const entry=INJURY_TABLE[d(8)-1];
    const flav=flavourFor({injuries:p.table||[]},cause);
    const title=(flav&&flav.name)||entry.name;
    const eff=[];
    Object.keys(entry.skills||{}).forEach(k=>eff.push((entry.skills[k]>0?"+":"")+entry.skills[k]+" "+k));
    if(entry.hpPct)eff.push(entry.hpPct+"% hit-points");
    if(entry.speed)eff.push(entry.speed+"cm speed (permanent)");
    if(entry.agility)eff.push("-1D4 Agility while it mends");
    if(entry.miss)eff.push("misses the next game");
    if(entry.games)eff.push("lasts "+entry.games+" games");
    body.innerHTML=`
      <h3>${esc(title)}</h3>
      <p class="lead">${esc((flav&&flav.note)||entry.note)}</p>
      <div class="camp-box" style="border-color:color-mix(in srgb,var(--danger) 45%,var(--line));background:var(--danger-bg)">
        <div class="prep-h" style="color:var(--danger)">1D8 → ${entry.roll} · ${esc(entry.name)}${entry.dead?"":entry.permanent?" · permanent":" · temporary"}</div>
        ${eff.length?`<div style="margin-bottom:6px"><b>${esc(eff.join(" · "))}</b></div>`:""}
        ${entry.effectNote?`<div class="pick-when">⏱ ${esc(entry.effectNote)}</div>`:""}
      </div>
      <div class="modal-actions">
        <button class="btn primary sm" id="injTake">${entry.dead?"They're gone":"They carry it"}</button>
        <button class="btn ghost sm" id="injReroll">↻ Roll again</button>
        <button class="btn ghost sm" id="injSkip" style="margin-left:auto">Skip</button>
      </div>`;
    $("#injReroll").onclick=()=>draw(cause);
    $("#injSkip").onclick=()=>{delete c.pendingInjury;save();closeModal();render();toast("They walked it off");};
    $("#injTake").onclick=()=>{
      const t=(c.pendingInjury||{}).title||"";
      applyInjury(c,entry,flav,t);
      delete c.pendingInjury;
      if(c._died){delete c._died;save();closeModal();openDeathRites(c.id,title);return;}
      save();closeModal();render();
      toast("“"+title+"” — "+(entry.permanent?"it stays with them":"it will mend"));
      setTimeout(()=>openEarnedNames([{charId:c.id,name:c.name,reason:(c.name||"They")+" — "+title+(entry.effectNote?" ("+entry.effectNote+")":"")}],"scar"),300);
    };
    showModal();
  };
  body.innerHTML=`
    <h3>What put ${esc(c.name||"them")} down?</h3>
    <p class="lead">Pick what took them out — the 1D8 injury roll decides what it cost them, and this scenario's own dangers give it a name.</p>
    <div class="chips-row">${causes.map(x=>`<button class="stylechip" data-cause="${esc(x)}">${esc(x)}</button>`).join("")}
      <button class="stylechip" data-cause="">Something else</button></div>
    <div class="modal-actions"><button class="btn ghost sm" id="injLater" style="margin-left:auto">Decide later</button></div>`;
  body.querySelectorAll("[data-cause]").forEach(b=>b.onclick=()=>draw(b.dataset.cause));
  $("#injLater").onclick=closeModal;
  if(p.cause){draw(p.cause);return;}
  showModal();
}
/* Death: possessions are divided amongst the survivors, and a replacement doesn't pay the
   usual 10-point joining cost. */
function openDeathRites(charId,injName){
  const w=activeWB(), c=w.characters.find(x=>x.id===charId); if(!c)return;
  const gear=[].concat((c.weapons||[]).map(e=>["weapon","weapons",e]),(c.armour||[]).map(e=>["armour","armour",e]),(c.items||[]).map(e=>["item","items",e]));
  const worth=gearPts(c.weapons||[],"weapon")+gearPts(c.armour||[],"armour")+gearPts(c.items||[],"item");
  const others=w.characters.filter(x=>x.id!==c.id);
  const body=$("#modalBody");
  body.innerHTML=`
    <h3>${esc(c.name||"They")} is dead</h3>
    <p class="lead">${esc(injName||"Killed in action")}. Divide their possessions amongst the warband — and remember, a replacement joins without paying the usual 10-point cost.</p>
    ${gear.length?`<div class="camp-box" style="margin-bottom:10px"><div class="prep-h">They were carrying</div>
      <div>${gear.map(([cat,f,e])=>esc((CAT[cat][e.id]||{}).name||"?")+(e.qty>1?" ×"+e.qty:"")).join(" · ")}</div>
      <div class="none-note" style="font-style:normal;margin-top:5px">Worth ${worth} credits if sold.</div></div>`:`<div class="ng-note">They carried nothing.</div>`}
    ${gear.length&&others.length?`<div class="eyebrow" style="margin:10px 0 6px">Hand everything to…</div>
      <div class="chips-row">${others.map(o=>`<button class="stylechip" data-heir="${o.id}">${esc(o.name||"Unnamed")}</button>`).join("")}</div>`:""}
    <div class="modal-actions">
      ${gear.length?`<button class="btn sm" id="drSell">Sell it all — +${worth} credits</button>`:""}
      <button class="btn danger ghost sm" id="drBury" style="margin-left:auto">Bury them</button>
    </div>`;
  const finish=()=>{
    w.characters=w.characters.filter(x=>x.id!==c.id);
    w.freeRecruits=(w.freeRecruits||0)+1;      // rulebook: a replacement skips the 10-point fee
    if(curCharId===c.id)curCharId=null;
    save();closeModal();render();toast(esc(c.name||"They")+" has fallen");
  };
  body.querySelectorAll("[data-heir]").forEach(b=>b.onclick=()=>{
    const h=w.characters.find(x=>x.id===b.dataset.heir); if(!h)return;
    [["weapons"],["armour"],["items"]].forEach(([f])=>{
      h[f]=Array.isArray(h[f])?h[f]:[];
      (c[f]||[]).forEach(e=>{const ex=h[f].find(x=>x.id===e.id);if(ex)ex.qty=(ex.qty||1)+(e.qty||1);else h[f].push({id:e.id,qty:e.qty||1});});
    });
    toast("Their gear passes to "+(h.name||"the warband"));
    finish();
  });
  const sell=$("#drSell"); if(sell)sell.onclick=()=>{w.credits=creditsOf(w)+worth;toast("+"+worth+" credits");finish();};
  $("#drBury").onclick=finish;
  showModal();
}
/* Treatment between games: serve at least one game with the wound, then roll a D6 —
   on 4+ the surgeons manage it and you pay 10 campaign points. */
function canTreat(c,inj){return inj&&!inj.dead&&(inj.served||0)>=1;}
function openTreatInjury(charId,idx){
  const w=activeWB(), c=w.characters.find(x=>x.id===charId); if(!c)return;
  const inj=(c.injuries||[])[idx]; if(!inj)return;
  const purse=cpOf(c)+(w.cp||0);
  const body=$("#modalBody");
  body.innerHTML=`
    <h3>Treat ${esc(inj.name)}</h3>
    <p class="lead">${esc(c.name||"They")} has carried this through ${inj.served||0} game${(inj.served||0)===1?"":"s"}. The surgeons charge ${CP_COSTS.heal} campaign points <b>for the attempt</b>, win or lose. Roll a D6 — on <b>4 or more</b> they put it right; on less, the points are spent anyway and they go into the next fight still carrying it.</p>
    <div class="camp-box"><div class="prep-h">${esc(inj.ruleName||inj.name)}</div>
      ${inj.effectNote?`<div class="pick-when">⏱ ${esc(inj.effectNote)}</div>`:""}
      <div class="none-note" style="font-style:normal;margin-top:6px">Available: ${purse} campaign points</div></div>
    <div class="modal-actions">
      <button class="btn primary sm" id="trRoll"${purse>=CP_COSTS.heal?"":" disabled"}>🎲 Roll for treatment</button>
      <button class="btn ghost sm" id="trClose" style="margin-left:auto">Not now</button>
    </div>`;
  $("#trClose").onclick=closeModal;
  $("#trRoll").onclick=()=>{
    const r=d(6), ok=r>=4;
    // the attempt is paid for either way — surgeons charge whether or not they succeed
    let owe=CP_COSTS.heal, own=Math.min(cpOf(c),owe); owe-=own;
    c.cp=cpOf(c)-own; if(owe>0)w.cp=Math.max(0,(w.cp||0)-owe);
    if(ok){
      // undo what the wound did
      if(inj.speed)c.speedMod=(c.speedMod||0)-inj.speed;
      if(inj.breakP)c.breakMod=(c.breakMod||0)-inj.breakP;
      const entry=INJURY_TABLE.find(e=>e.roll===inj.roll);
      if(entry){Object.keys(entry.skills||{}).forEach(k=>{if(typeof c.skills[k]==="number")c.skills[k]=Math.max(1,Math.min(10,c.skills[k]-entry.skills[k]));});
        if(entry.hpPct)c.hp=Math.max(2,Math.round(c.hp/(1+entry.hpPct/100)/2)*2);}
      c.injuries.splice(idx,1);
      save();closeModal();render();
      toast("Rolled "+r+" — treated. "+CP_COSTS.heal+" points spent.");
      setTimeout(()=>openEarnedNames([{charId:c.id,name:c.name,reason:(c.name||"They")+" is whole again — "+inj.name+" is behind them"}],"recovered"),300);
    }else{
      inj.treatTried=(inj.treatTried||0)+1;save();closeModal();render();
      toast("Rolled "+r+" — the treatment failed. "+CP_COSTS.heal+" points spent anyway.");
    }
  };
  showModal();
}
// one game served, durations tick down, expired wounds mend on their own
function tickInjuries(c){
  let changed=false;
  (c.injuries||[]).forEach(inj=>{inj.served=(inj.served||0)+1;changed=true;});
  const before=(c.injuries||[]).length;
  c.injuries=(c.injuries||[]).filter(inj=>{
    if(!inj.games)return true;
    return (inj.served||0)<inj.games;   // 1D4-game wounds mend once served
  });
  if((c.injuries||[]).length!==before)changed=true;
  return changed;
}
/* ---- earned names ----
   A character who goes down, or who grows through hard-won experience, can take a new name.
   Works with no AI (the Realm has none at the table); the Claude app adds tailored suggestions. */
const EPITHET_SCAR=["the Scarred","the Broken","One-Eye","the Limping","the Bled","Half-Face","the Marked","Deathless","the Ruined","Ashen","the Twice-Dead","Gravebound"];
const EPITHET_GLORY=["the Feared","the Undying","the Iron","Blooded","the Merciless","the Bold","Grim","the Unbowed","the Butcher","the Relentless","the Vow-Keeper","Wolf-of-the-Line"];
function baseName(n){const s=String(n||"").trim();if(!s)return "Unnamed";const cut=s.split(/\s+(?:the|of|von|de)\s+/i)[0];return cut.split(/\s+/).slice(0,2).join(" ")||s;}
const EPITHET_MENDED=["the Mended","the Returned","Twice-Made","the Unbroken","the Restored","Whole Again"];
function suggestEarnedNames(name,kind){
  const base=baseName(name), out=[];
  // a healed character can simply drop the epithet they were carrying
  if(kind==="recovered"&&base!==String(name||"").trim())out.push(base);
  const pool=(kind==="glory"?EPITHET_GLORY:kind==="recovered"?EPITHET_MENDED:EPITHET_SCAR).slice();
  while(out.length<4&&pool.length)out.push(base+" "+pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  return out;
}
/* entries: [{charId, name, reason}] — kind "scar" (went down) or "glory" (grew stronger) */
function openEarnedNames(entries,kind,then){
  entries=(entries||[]).filter(e=>e&&e.charId);
  if(!entries.length){if(then)then();return;}
  const body=$("#modalBody");
  const rows=entries.map((e,i)=>`
    <div class="earn-row" data-earn="${e.charId}">
      <div class="prep-h">${esc(e.reason||"")}</div>
      <div class="field" style="margin-bottom:7px"><label>Name</label>
        <input class="input earn-name" id="earn${i}" value="${esc(e.name||"")}" maxlength="42"></div>
      <div class="chips-row">${suggestEarnedNames(e.name,kind).map(n=>`<button class="stylechip" data-suggest="${i}|${esc(n)}">${esc(n)}</button>`).join("")}
        <button class="linkbtn" data-reroll="${i}">↻ more</button>
        ${kind==="glory"?"":""}</div>
    </div>`).join("");
  body.innerHTML=`
    <h3>${kind==="glory"?"A name worth earning":kind==="recovered"?"Mended":"They carry it with them"}</h3>
    <p class="lead">${kind==="glory"?"Deeds change what people call you. Take a new name, or keep the old one.":kind==="recovered"?"The wound is behind them — they may not answer to the old name any more.":"Surviving what put you down leaves a mark — and often a new name. Change it, or leave it be."}</p>
    ${rows}
    <div id="earnAI"></div>
    <div class="modal-actions">
      <button class="btn primary sm" id="earnSave">Save names</button>
      ${typeof getSample==="function"?`<button class="btn ghost sm" id="earnAImore">✦ Suggest with AI</button>`:""}
      <button class="btn ghost sm" id="earnSkip" style="margin-left:auto">Keep as they are</button>
    </div>`;
  const setName=(i,v)=>{const el=$("#earn"+i);if(el)el.value=v;};
  body.querySelectorAll("[data-suggest]").forEach(b=>b.onclick=()=>{const[i,n]=b.dataset.suggest.split("|");setName(i,n);});
  body.querySelectorAll("[data-reroll]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.reroll, row=b.closest(".earn-row"), chips=row.querySelector(".chips-row");
    const fresh=suggestEarnedNames(entries[i].name,kind);
    [...chips.querySelectorAll("[data-suggest]")].forEach((c,k)=>{if(fresh[k]){c.textContent=fresh[k];c.dataset.suggest=i+"|"+fresh[k];}});
  });
  const done=save_=>{
    if(save_)entries.forEach((e,i)=>{
      const el=$("#earn"+i);if(!el)return;
      const v=el.value.trim();if(!v)return;
      const c=activeWB().characters.find(x=>x.id===e.charId);
      if(c&&c.name!==v){c.name=v;}
    });
    if(save_)save();
    closeModal();render();if(then)then();
  };
  $("#earnSave").onclick=()=>done(true);
  $("#earnSkip").onclick=()=>done(false);
  const ai=$("#earnAImore");
  if(ai)ai.onclick=async()=>{
    const st=$("#earnAI");st.innerHTML=`<div class="ng-note spin">Asking Claude…</div>`;
    const s=await getSample();
    if(!s){st.innerHTML=`<div class="ng-note">AI naming only works in the Claude app.</div>`;return;}
    try{
      const list=await s.json(`Grimdark sci-fi skirmish game. For each character below, suggest ONE new name they might earn — keep their existing given name and add an earned epithet that fits what happened. Reply with ONLY a JSON array of strings, same order, no prose.\n`+
        entries.map((e,i)=>`${i+1}) "${e.name}" — ${e.reason}`).join("\n"),{modelTier:"quick",cache:false});
      (Array.isArray(list)?list:[]).forEach((n,i)=>{if(typeof n==="string"&&n.trim())setName(i,n.trim().slice(0,42));});
      st.innerHTML="";
    }catch(e){st.innerHTML=`<div class="ng-note">${sampleErr(e&&e.code)}</div>`;}
  };
  showModal();
}
function questClaims(){try{return JSON.parse(localStorage.getItem("p28_claimed")||"[]");}catch(e){return [];}}
function markClaimed(id){try{const a=questClaims();if(!a.includes(id)){a.push(id);localStorage.setItem("p28_claimed",JSON.stringify(a.slice(-50)));}}catch(e){}}
/* quests this device went on but never brought home — the host packed up, or the app was
   closed before Return to camp. They wait at camp until claimed. */
function strandedQuests(){
  const out=[];
  try{Object.keys(localStorage).filter(k=>k.indexOf("p28_quest_")===0).forEach(k=>{
    const snap=JSON.parse(localStorage.getItem(k)||"null"); if(!snap||!snap.scnId)return;
    if(questClaims().includes(snap.scnId))return;
    if(liveRole==="guest"&&liveScenario&&liveScenario.id===snap.scnId)return;   // still live — not stranded
    if((snap.combatants||[]).some(m=>m.charId&&activeWB().characters.some(c=>c.id===m.charId)))out.push(snap);
  });}catch(e){}
  return out.sort((a,b)=>(b.at||0)-(a.at||0));
}
function pendingQuest(scn){
  // prefer the live roster; fall back to the last copy this device kept
  let snap=null;
  if(scn&&scn.battle){
    const mine=myCombatantsIn(scn);
    if(mine.length)snap={scnId:scn.id,title:scn.title||"",combatants:mine,injuries:injuryTableFor(scn),causes:injuryCauses(scn),outcome:scn.outcome||null,round:curRound(scn),mode:scn.mode||"",enemyRouted:enemyRoutedIn(scn)};
  }
  if(!snap&&scn){try{const raw=localStorage.getItem("p28_quest_"+scn.id);if(raw)snap=JSON.parse(raw);}catch(e){}}
  if(!snap||questClaims().includes(snap.scnId))return null;
  return snap;
}
/* VEHICLE DAMAGE (rulebook p.81-82) — the counterpart of the character injury table, rolled
   at camp for any vehicle wrecked on the quest. What the app can apply it applies; the rest
   it states plainly and leaves to the host. */
const VEH_DAMAGE=[
  {roll:1,name:"Grinding gears",effect:"Suffers −1D4 agility and moves at half speed.",
   apply:v=>{v.damage="Grinding gears — −1D4 agility, moves at half speed.";}},
  {roll:2,name:"Short on crew",effect:"Loses all but 1 of its crew sections.",
   apply:v=>{const cw=findCat("vsection","Crew");if(cw){const e=(v.sections||[]).find(x=>x.id===cw.id);if(e)e.qty=1;}
     v.damage="Short on crew — down to a single crew section.";}},
  {roll:3,name:"Badly repaired",effect:"Gains the Ramshackle trait. This does not lower the vehicle's points cost.",
   apply:v=>{const rt=findCat("vtrait","Ramshackle");if(rt&&(v.traits||[]).indexOf(rt.id)<0)v.traits.push(rt.id);
     v.damage="Badly repaired — now Ramshackle (derelict on a single failed break test).";}},
  {roll:4,name:"Slow repairs",effect:"Misses the next game, after which it is returned to full hit-points.",
   apply:v=>{v.laidUp=true;v.curHP=vehicleHP(v);v.damage="In the workshop — sits out the next quest, then returns at full hit-points.";}},
  {roll:5,name:"Fully repaired",effect:"Fixed up without any problems — starts the next game at full hit-points.",
   apply:v=>{v.curHP=vehicleHP(v);v.damage="";}},
  {roll:6,name:"Destroyed",effect:"Too badly damaged to keep going. Add up its total starting points cost; you may use 50% of that to build a new vehicle. Any campaign points it had are lost.",
   apply:v=>{v.wrecked=true;v.salvage=Math.floor(vehicleCost(v)/2);v.damage="Destroyed — "+v.salvage+" pts of salvage towards a new vehicle.";}}
];
function openVehicleDamage(v,then){
  const body=$("#modalBody");
  const draw=res=>{
    body.innerHTML=`<h3>▰ ${esc(v.name||"Vehicle")} was wrecked</h3>
      <p class="lead">Roll 1D6 on the vehicle damage table to see what state it comes home in.</p>
      <div>${res?`<div class="ng-result"><b>${res.roll} — ${esc(res.name)}</b><div class="ed" style="margin-top:6px">${esc(res.effect)}</div></div>`:""}</div>
      <div class="modal-actions">
        ${res?`<button class="btn primary sm" id="vdDone">Back to camp</button>`
             :`<button class="btn primary sm" id="vdRoll">🎲 Roll 1D6</button>`}
      </div>`;
    if(res)$("#vdDone").onclick=()=>{closeModal();render();if(then)then();};
    else $("#vdRoll").onclick=()=>{
      const r=VEH_DAMAGE[Math.floor(Math.random()*6)];
      r.apply(v);v.damageRoll=r.roll;save();draw(r);toast("▰ "+r.name);
    };
  };
  draw(null);showModal();
}
function claimQuest(snap,then){
  const w=activeWB();
  let wounded=0,downed=0,found=0,maimed=0;
  const fell=[];
  const byChar={};
  (snap.combatants||[]).forEach(m=>{ if(!m.charId)return;
    const e=byChar[m.charId]||(byChar[m.charId]={cur:0,down:true,finds:[]});
    e.cur+=Math.max(0,m.curHP|0); if((m.curHP|0)>0)e.down=false; (m.finds||[]).forEach(f=>e.finds.push(f)); if(m.maimedBy)e.maimedBy=m.maimedBy;
  });
  Object.keys(byChar).forEach(id=>{const m=byChar[id];
    const first=(snap.combatants||[]).find(x=>x.charId===id);
    if(first){first.curHP=m.cur; first.finds=m.finds; if(m.maimedBy)first.maimedBy=m.maimedBy;}
  });
  (snap.combatants||[]).filter((m,i,arr)=>!m.charId||arr.findIndex(x=>x.charId===m.charId)===i).forEach(m=>{
    const c=w.characters.find(x=>x.id===m.charId); if(!c)return;
    if(m.curHP<=0){
      fell.push({charId:c.id,name:c.name});
      // they'll roll for a lasting injury at camp — the table travels with them
      c.pendingInjury={scnId:snap.scnId,title:snap.title||"",table:snap.injuries||[],causes:snap.causes||[]};
    } else if(m.maimedBy){
      // still standing, but the scenario itself marked them — same table, cause already known
      maimed++; fell.push({charId:c.id,name:c.name});
      c.pendingInjury={scnId:snap.scnId,title:snap.title||"",table:snap.injuries||[],causes:snap.causes||[],cause:m.maimedBy};
    }
    const max=c.hp*memberCount(c);
    if(typeof m.curHP==="number"&&m.curHP<max){ c.curHP=Math.max(0,m.curHP); if(m.curHP<=0)downed++; else wounded++; }
    else { c.curHP=max; }
    if(m.curHP<=0){ c.downedIn=c.downedIn||[]; if(!c.downedIn.includes(snap.scnId))c.downedIn.push(snap.scnId); }
    (m.finds||[]).forEach(f=>{
      c.pickups=c.pickups||[];
      if(!c.pickups.some(p=>p.itemId===f.itemId&&p.scnId===f.scnId)){c.pickups.push(f);found++;}
    });
  });
  const wrecks=[];
  (snap.combatants||[]).forEach(m=>{
    if(!m.vehId)return;
    const v=vehsOf(w).find(x=>x.id===m.vehId); if(!v)return;
    const max=vehicleHP(v);
    if(typeof m.curHP==="number"&&m.curHP<max)v.curHP=Math.max(0,m.curHP); else v.curHP=max;
    if(Array.isArray(m.secs)&&m.curHP<max)v.secs=m.secs.map(s=>({key:s.key,cur:s.cur})); else delete v.secs;
    if(m.curHP<=0)wrecks.push(v);
  });
  // a vehicle that sat this quest out has served its lay-up and is ready again
  vehsOf(w).forEach(v=>{if(v.laidUp&&!(snap.combatants||[]).some(m=>m.vehId===v.id))v.laidUp=false;});
  (snap.combatants||[]).forEach(m=>{const c=w.characters.find(x=>x.id===m.charId);if(c)tickInjuries(c);});
  markClaimed(snap.scnId);
  if(!w.sealed)w.sealed=Date.now();   // the campaign has begun — the build is final
  w.ledger=Array.isArray(w.ledger)?w.ledger:[];
  w.ledger.unshift({scnId:snap.scnId,title:snap.title||"a quest",at:Date.now(),
    result:(snap.outcome&&snap.outcome.result)||"unknown",round:(snap.outcome&&snap.outcome.round)||snap.round||0,
    fought:(snap.combatants||[]).filter((m,i,a)=>m.charId&&a.findIndex(x=>x.charId===m.charId)===i).map(m=>m.name.replace(/ \d+\/\d+$/,"")),
    wounded,downed,found,fell:fell.map(f=>f.name)});
  const ok=save();
  render();
  const bits=[];
  if(wounded)bits.push(wounded+" wounded");
  if(downed)bits.push(downed+" taken down");
  if(maimed)bits.push(maimed+" maimed");
  if(wrecks.length)bits.push(wrecks.length+" vehicle"+(wrecks.length>1?"s":"")+" wrecked");
  if(found)bits.push(found+" find"+(found>1?"s":""));
  toast(ok?("Back at camp"+(bits.length?" — "+bits.join(", "):"")):"⚠ Returned but NOT saved — storage is full");
  if(then)then();
  // XP for the quest first, then anyone who fell rolls for what it cost them
  const took=(snap.combatants||[]).map(m=>m.charId).filter(id=>w.characters.some(c=>c.id===id));
  const rollWrecks=()=>{ if(wrecks.length)openVehicleDamage(wrecks[0]); };
  const rollInjuries=()=>{ if(!fell.length){rollWrecks();return;}
    const c=w.characters.find(x=>x.id===fell[0].charId);
    if(c&&c.pendingInjury)openInjuryRoll(c); else rollWrecks();
  };
  const settleAgendas=()=>openAgendaCheck(took.map(id=>w.characters.find(c=>c.id===id)).filter(Boolean),rollInjuries);
  setTimeout(()=>openCPAwards(snap,took,settleAgendas),350);
}
function returnToCamp(){
  const snap=pendingQuest(liveScenario);
  const finish=()=>{clearLive();liveRole="solo";liveScenario=null;liveCode="";guestPlayerRef=null;guestPid="";syncQuestTab();switchView("warband");renderScenarioView();};
  if(!snap){finish();toast("Back at camp");return;}
  const names=(snap.combatants||[]).map(m=>m.name).slice(0,4).join(", ");
  askConfirm("Bring your warband home from “"+(snap.title||"the quest")+"”? Wounds and anything they picked up ("+names+") come back with them.",
    ()=>claimQuest(snap,finish),{danger:false,yesLabel:"Return to camp"});
}
function leaveGame(){returnToCamp();}

/* who took part in a scenario — read off the battle roster the host ran */
function participantsOf(s){
  const rows=((s.battle&&s.battle.combatants)||[]).filter(m=>m&&m.side==="player");
  const by={};
  rows.forEach(m=>{const k=m.owner||"—";(by[k]=by[k]||{name:k,models:0,down:0,names:[]});by[k].models++;if((m.curHP|0)<=0)by[k].down++;const nm=m.name.replace(/ \d+\/\d+$/,"");if(!by[k].names.includes(nm))by[k].names.push(nm);});
  return Object.values(by);
}
function scnStage(s){return s.outcome?"played":(s.battle&&s.battle.started)?"inplay":"next";}
let scnQuery="";
function scnRowHTML(s,ctx){
  const o=s.outcome&&OUTCOMES[s.outcome.result];
  const qt=s.questType&&questTypeBrief(s.questType);
  const stage=scnStage(s);
  const hosting=liveRole==="host"&&s.id===hostScenarioId;
  const chips=[
    hosting?`<span class="chip teal">📡 hosting · ${esc(hostCode)}</span>`:"",
    stage==="played"?`<span class="chip ${s.outcome.result==="victory"?"teal":s.outcome.result==="defeat"?"red":"amber"}">${o?o.icon+" "+esc(o.short):"played"} · turn ${s.outcome.round||"?"}${s.outcome.at?" · "+new Date(s.outcome.at).toLocaleDateString(undefined,{day:"numeric",month:"short"}):""}</span>`:"",
    stage==="inplay"?`<span class="chip amber">in play · turn ${curRound(s)}</span>`:"",
    isMystery(s)?`<span class="chip arc">❓ mystery</span>`:(qt?`<span class="chip">${esc(qt[1].split(" — ")[0])}</span>`:""),
    ctx==="workshop"?(s.movedAt?`<span class="chip teal">✓ moved</span>`:`<span class="chip amber">draft</span>`):"",
    ctx==="workshop"&&s.mode==="coop"&&!enemyAll(s).length?`<span class="chip mute">no enemy yet</span>`:"",
    ctx==="elsewhere"?`<span class="chip">realm: ${esc(s.realmName||"unknown")}</span>`:"",
    stage==="played"&&participantsOf(s).length?`<span class="chip">${esc(participantsOf(s).map(x=>x.name).join(", "))}</span>`:""
  ].filter(Boolean).join("");
  const action=ctx==="workshop"?`<button class="btn sm ghost" data-move="${s.id}">🌍 Move</button>`
    :ctx==="host"&&stage==="next"?`<button class="btn sm ${hosting?"":"primary"}" data-host="${s.id}">${hosting?"Open":"Host"}</button>`
    :ctx==="host"&&stage==="played"?`<button class="btn sm ghost" data-again="${s.id}" title="Clear the result and roster so it can be run again">Again</button>`
    :"";
  return `<div class="srow ${stage} ${ctx==="elsewhere"?"elsewhere":""}" data-open="${s.id}">
    <div class="srow-mini">${scenarioMapSVG(s.map,true)}</div>
    <div class="srow-b">
      <div class="srow-m ${s.mode==="coop"?"coop":"pvp"}">${s.mode==="coop"?"Co-op":"PvP"} · ${s.players} · ${s.points} pts</div>
      <div class="srow-t">${esc(s.title||"Untitled scenario")}</div>
      ${s.premise?`<div class="srow-s">${esc(s.premise)}</div>`:""}
      <div class="srow-chips">${chips}</div>
    </div>${action?`<div class="srow-act">${action}</div>`:""}
  </div>`;
}
/* the realm's story so far: every played scenario as a dot, in the order they were played */
function campaignStripHTML(list){
  // only what was fought counts: a dot per played scenario, in the order they happened —
  // plus the one on the table right now, if there is one. Nothing for what is merely available.
  const played=list.filter(s=>s.outcome).sort((a,b)=>(a.outcome.at||0)-(b.outcome.at||0));
  const live=list.filter(s=>scnStage(s)==="inplay");
  if(!played.length&&!live.length)return "";
  const won=played.filter(s=>s.outcome.result==="victory").length, lost=played.filter(s=>s.outcome.result==="defeat").length;
  const who=new Set();played.forEach(s=>participantsOf(s).forEach(x=>who.add(x.name)));
  return `<div class="camp-strip">
    <div class="cs-h"><span>🗝 <b>${esc(savedPass()||"this realm")}</b> · the campaign so far</span><span>${played.length} played${played.length?` · ${won} won · ${lost} lost`:""}${who.size?` · ${who.size} player${who.size===1?"":"s"}`:""}</span></div>

/* Your table doubles as durable scenario storage: anything ever hosted in this passphrase

async function openTableScenarios(){
  const body=$("#modalBody");
  body.innerHTML=`<h3>Scenarios in your realm</h3><div class="ng-note spin">Looking…</div>`;showModal();
  const db=await getDb();
  if(!db){body.innerHTML=`<h3>Scenarios in your realm</h3><p class="lead">Name your realm first.</p><div class="modal-actions"><button class="btn ghost sm" id="tsX" style="margin-left:auto">Close</button></div>`;$("#tsX").onclick=closeModal;return;}
  let docs=[];
  try{ docs=(await db.collection("sessions").get()).docs; }catch(e){}
  const mine=allScns().map(x=>normLabel(x.title));
  const rows=docs.map(d=>{const v=d.data()||{},s=v.scenario||{};return {code:d.id,title:s.title||"Untitled",host:v.hostName||"",when:v.updatedAt||0,have:mine.includes(normLabel(s.title))};})
    .sort((a,b)=>b.when-a.when);
  body.innerHTML=`
    <h3>Scenarios in your realm</h3>
    <p class="lead">Every scenario in this realm is kept here, so you can pull one back onto any device — even after clearing a browser.</p>
    ${rows.length?`<div class="wb-switch">${rows.map(r=>`<div class="wb-item">
      <div class="wbi-main" style="cursor:default"><div class="wbi-name">${esc(r.title)}</div>
        <div class="wbi-sub">code ${esc(r.code)}${r.host?" · hosted by "+esc(r.host):""}${r.when?" · "+new Date(r.when).toLocaleString():""}</div></div>
      ${r.have?`<span class="none-note" style="font-style:normal">already here</span>`:`<button class="linkbtn" data-pull="${esc(r.code)}">Load</button>`}</div>`).join("")}</div>`
      :`<div class="ng-note">Nothing has been hosted in this realm yet.</div>`}
    <div class="modal-actions"><button class="btn ghost sm" id="tsX" style="margin-left:auto">Close</button></div>`;
  $("#tsX").onclick=closeModal;
  body.querySelectorAll("[data-pull]").forEach(b=>b.onclick=async()=>{
    b.textContent="Loading…";
    try{
      const snap=await db.doc("sessions/"+b.dataset.pull).get();
      const raw=(snap.data()||{}).scenario;
      if(!raw){toast("That game is no longer there");return;}
      const s=normalizeImportedScn(raw);
      addScn(s);

      closeModal();scnCurrentId=s.id;scnScreen="detail";renderScenarioView();toast("Loaded “"+(s.title||"scenario")+"”");
    }catch(e){toast("Couldn't load that one");}
  });
}

    if(!s||typeof s!=="object"||(!s.title&&!s.premise&&!s.objectives)){err.innerHTML=`<div class="ng-note">That code isn't a scenario.</div>`;return;}
    s=normalizeImportedScn(s);

function normalizeImportedScn(raw){
  const s=raw&&typeof raw==="object"?JSON.parse(JSON.stringify(raw)):{};
  s.id=uid(); s.createdAt=s.createdAt||Date.now();
  s.mystery=coerceMystery(s.mystery);
  s.mode=s.mode==="coop"?"coop":"pvp";
  s.players=+s.players||3; s.points=+s.points||300;
  ["objectives","specialRules","terrain","markers","searched"].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});
  ["npcs","items","events"].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});
  // Rebuild from a whitelist, but keep EVERYTHING the item carries about where it lives and
  // when it matters. Dropping mapLabel silently emptied the cache the DM had hidden it in, so
  // an imported scenario asked the host to place items that were already placed; dropping
  // `when` produced the "doesn't say when it matters" warning on every import.
  s.items=s.items.map((x,i)=>({name:String(x&&x.name||""),note:String(x&&x.note||""),
    when:String(x&&x.when||""),mapLabel:String(x&&x.mapLabel||""),role:String(x&&x.role||""),
    secret:!!(x&&x.secret),hint:String(x&&x.hint||""),revealed:!!(x&&x.revealed),
    found:!!(x&&x.found),effect:coerceItemEffect(x&&x.effect),id:(x&&x.id)||("it"+i),heldBy:(x&&x.heldBy)||null,trap:coerceTrap(x),sprung:!!(x&&x.sprung)}));
  s.title=String(s.title||"Imported scenario").slice(0,80);
  s.premise=String(s.premise||"");
  if(!s.map||typeof s.map!=="object")s.map={note:"",zones:[],features:[]};
  s.map.zones=Array.isArray(s.map.zones)?s.map.zones:[]; s.map.features=Array.isArray(s.map.features)?s.map.features:[];
  s.difficulty=s.difficulty||"normal";
  s.round=+s.round||1; if(s.rounds!=null)s.rounds=+s.rounds||null;
  if(s.enemy&&typeof s.enemy==="object"){ if(!Array.isArray(s.enemy.characters))s.enemy.characters=[]; if(!Array.isArray(s.enemy.vehicles))s.enemy.vehicles=[]; }
  if(s.battle&&(!s.battle.combatants||!Array.isArray(s.battle.combatants)))s.battle=null;
  return healScnChars(s);
}
function exportScenarioCode(s){
  const body=$("#modalBody");
  const code=JSON.stringify(scnForDb(s));
  body.innerHTML=`
    <h3>Move this scenario to the World App</h3>
    <p class="lead">Copy this code, open the World App, and paste it into Scenarios → ⇩ Import scenario to host it live in your realm.</p>
    <textarea class="jsonbox" id="exScn" readonly>${esc(code)}</textarea>
    <div class="modal-actions"><button class="btn primary sm" id="exScnCopy">Copy code</button><button class="btn ghost sm" id="exScnX" style="margin-left:auto">Close</button></div>`;
  $("#exScnX").onclick=closeModal;
  $("#exScnCopy").onclick=()=>{const t=$("#exScn");t.select();navigator.clipboard.writeText(code).then(()=>toast("Copied — paste it into your realm")).catch(()=>toast("Copy failed"));s.movedAt=Date.now();save();if(scnScreen==="list")renderScenarioView();};
  showModal();setTimeout(()=>{const t=$("#exScn");if(t)t.select();},60);
}



/* ---- QUEST TYPES ----
   Naming the SHAPE of the game up front gives the DM something to build toward, instead of
   inventing a premise and a win condition from nothing every time. Each brief says what the
   objectives, the map and the ending should look like, so the scenario comes out playable
   rather than merely atmospheric. "" lets the DM choose. */
const QUEST_TYPES=[
 ["Combat & attrition",[
  ["grinder","Defeat all enemies","The whole point is the fight. Victory is destroying the opposing force or breaking it. Keep objectives minimal, make the terrain do the work, and give both sides reasons to close rather than camp.","A straight fight to the last model standing. Terrain and nerve decide it."],
  ["assassin","Assassination","One named, high-value target must die — a warlord, a psyker, a foreman. Name it, make it dangerous and give it bodyguards. Killing it wins; losing your own leader should cost the players something.","One named target must die. Get to them through their bodyguards — and don't lose your own leader doing it."],
  ["lastStand","Hold the line","Asymmetric: the players are outnumbered and must SURVIVE a set number of turns, not win a fight. Enemies arrive in waves at named turns, from named edges. Victory is measured in turns endured.","Outnumbered and dug in. Survive the waves for a set number of turns; every turn endured is the win."]]],
 ["Area control",[
  ["hill","King of the hill","One high-value zone at the centre. Whoever holds it when the game ends wins. Put hard cover around it and hazards on the approaches so holding it hurts.","One patch of ground at the centre. Hold it when the last turn ends."],
  ["domination","Capture and hold","3-5 objective markers spread across the board, scored at the end of every turn. Spread them so no single position covers two, and make at least one sit in bad ground.","Several markers across the board, scored every turn. Spread out, or lose the count."],
  ["breakthrough","Breakthrough","The players must fight ACROSS the board and exit the far edge; each model that escapes scores. The enemy deploys between them and the exit and does not need to kill, only delay.","Fight across the table and off the far edge. Every model that gets out scores."]]],
 ["Retrieval & escort",[
  ["fetch","Fetch the prize","One specific object must be picked up and physically carried off the board. Say where it starts, who can carry it, and what carrying it costs — slower, cannot shoot, draws attention.","Find the prize, pick it up, and carry it home — slower, and everyone knows you have it."],
  ["scavenge","Scavenge the unknown","Several mystery markers; only searching reveals which holds the real prize. Use cache features and hide the true objective among decoys, so the search itself is the game.","Mystery markers; only searching reveals which holds the real prize. The search is the game."],
  ["escort","Escort","Something slow and vulnerable must reach a destination — a civilian, a wounded courier, a crawling vehicle. Give it a path, a speed, and no ability to defend itself. The enemy wins by stopping it.","Something slow and helpless must reach safety. Keep it alive and moving."]]],
 ["Stealth & sabotage",[
  ["heist","Infiltration / heist","Getting in unseen matters more than fighting. Sentries with patrol notes, consoles to reach, and an alarm state that makes everything worse once raised.","Get in unseen. Patrols, consoles, and an alarm that makes everything worse once it sounds."],
  ["sabotage","Sabotage","Named terrain pieces must be destroyed or rigged — a fuel stack, a generator, a ritual site. Say how long each takes and what the defender does about it.","Destroy or rig named pieces of the table before the defenders stop you."]]],
 ["Mystery — sealed, no objectives shown",[
  ["expedition","Total mystery — into the unknown","AN UNUSUAL SITUATION TO INVESTIGATE, not a battle and not a random scenario. Start from ONE specific unexplained thing the warband has seen, heard or found — a blinking light at the bottom of a shaft, a two-legged creature that keeps its distance and watches, a hatch nobody remembers building, a sound from the sea floor, a room that is colder than it should be — and the whole scenario is the players going to find out what it is. The table is the place it lives in (a cave system, an ocean trench, a derelict hull, a pocket of wrong space). Structure it as a sequence of discoveries: 4-6 search points ('cache' features) and secret NPCs/items whose reveals each answer part of the question, timed events that change the place as they go deeper, and a TRUTH you know from the start but only reveal in the final envelope. Victory is leaving the table alive with the answer (an item or a reached marker), not killing anything. Keep any enemy to a single guardian or a few creatures revealed late — the danger is the environment and the unknown.","An unusual situation to go and investigate, not a fight: what's down there? What is that blinking thing? What is that two-legged creature that keeps its distance? The DM knows the answer; you dig it out clue by clue and try to get back."],
  ["anomaly","The anomaly — SCP-style containment","CONTAINMENT MYSTERY in the style of an SCP file or a Star Trek away mission. One thing on the table should not exist — an object, a zone, an entity — and it has RULES the players do not know: what wakes it, what it does to those nearby, what stops it. Write those rules into the special rules and events so the players can DISCOVER them by testing (a search that triggers it, an event when someone crosses a line, an item that dampens it). Let them win by understanding: contain it (reach markers in the right order, use the right item), or escape with proof. The enemy force, if any, is the anomaly's effect — a few turned creatures or one warped guardian, never a warband.","Something is here that should not exist. Work out its rules by testing them — then contain it, or run."],
  ["signal","Answer the signal — first contact","FIRST CONTACT. A transmission, a beacon, a voice from somewhere it cannot come from, and the players go to see. Build in a real choice: what they find may be a survivor, a lure, a machine that wants something, or a mind that does not understand them. Give it a way to be talked to (Psyche tests, an item, reaching a console) and a way to go wrong. The enemy force is small and may not be hostile until the players make it so; the map should have a clear 'source' marker and the route to it should reveal clues.","A transmission from somewhere it can't come from. Answer it. It may not be hostile — or that may be the trick."]]],
 ["Environmental & narrative",[
  ["gauntlet","The gauntlet","The battlefield itself is killing everyone. A collapse, a flood, a fire that spreads a set distance per turn, and exits to reach. Timed events should tighten the noose every few turns.","The battlefield itself is killing everyone — floods, collapse, fire. Reach the exits."],

const MYSTERY_TYPES=["expedition","anomaly","signal"];
/* mystery quests are not fights: the enemy force is a guardian or a few creatures, half the usual weight */
function enemyTargetCalc(points,players,difficulty,questType){
  const d=DIFFICULTY[difficulty||"normal"]||DIFFICULTY.normal;
  const base=(+points||0)*Math.max(1,+players||1)+d.enemyBonus;
  return MYSTERY_TYPES.includes(questType)?Math.round(base*0.5):base;
}
function questTypeBrief(key){
  for(const [,list] of QUEST_TYPES){const hit=list.find(q=>q[0]===key);if(hit)return hit;}
  return null;
}

    const pk=root.querySelector(".qt-dd");if(pk)pk.classList.toggle("mystery",!!(q&&MYSTERY_TYPES.includes(q[0])));};
  const qb=root.querySelector("#scQBrowse");if(qb)qb.onclick=()=>openQuestTypeBrowser(k=>{scnQuestType=k;qs.value=k;updQ();});

      ? `<b>Co-op</b>: ${scnPlayers} warbands of ${$("#scPoints")?(+$("#scPoints").value||0):0} pts face one enemy force of <b>${(+($("#scPoints")?$("#scPoints").value:0)||0)*scnPlayers+d.enemyBonus} pts</b> (${d.label}). `
      : `<b>PvP</b>: warbands fight each other. `)+d.tone+".";

  upd();
  $("#scPlMinus").onclick=()=>{scnPlayers=Math.max(2,scnPlayers-1);$("#scPlVal").textContent=scnPlayers;};
  $("#scPlPlus").onclick=()=>{scnPlayers=Math.min(6,scnPlayers+1);$("#scPlVal").textContent=scnPlayers;};

    scnDifficulty=b.dataset.d;root.querySelectorAll("#scDiffChips .stylechip").forEach(x=>x.classList.toggle("on",x.dataset.d===scnDifficulty));upd();

const SCN_EXAMPLES=[

async function generateScenario(){

${qt?`THE KIND OF QUEST IS DECIDED: build a "${qt[1]}" scenario. ${qt[2]} Everything — the premise, the objectives, the map, the timed events and the enemy force — must serve that shape. Do not quietly turn it into a straight fight.`:"The kind of quest is yours to choose — pick a shape that gives the table something to do besides trade shots, and commit to it."}
Obey the game's real rules:
- The playing area is 90×90 cm; at least 60% should be covered by scenery (multiple levels and plenty of cover).
- Game length is 1D10+6 turns.
- Deployment: number the 4 table sides 1-4; each warband deploys within 10cm of a side, or within 10cm of the centre.
- A scenario must include: a premise/motivation, a scenery description, victory conditions/objectives, deployment details, and any special rules.
Example Planet 28 scenario premises (for tone only, do not copy): ${SCN_EXAMPLES.map((e,i)=>(i+1)+") "+e).join(" ")}
This scenario: ${players} players; ${mode==="coop"?`CO-OPERATIVE — ${players} player warbands of ${points} points each team up against ONE enemy force run by the host, worth ${enemyTargetCalc(points,players,difficulty,scnQuestType)} points in total${qt&&MYSTERY_TYPES.includes(qt[0])?" — deliberately light, because this is a mystery, not a battle":""}`:"PvP — the players' warbands fight each other"}; ${points} points per player warband.
${seed?`Base the scenario on this idea: "${seed}".`:"Invent an original, evocative premise."}
Write it to be ATMOSPHERIC and immersive: rich sensory detail (sights, sounds, smells, the feel of the place), so the players feel they are really THERE. The "briefing" field is a vivid, cinematic 4-6 sentence second-person narration that sets the mood before the game; the "premise" stays a short one-hook summary.
This game lasts EXACTLY ${length} turns (already rolled) — place every timed event on a round from 1 to ${length}; never use a round beyond ${length}. Difficulty is ${diff.label} (${diff.tone}); reflect that in the danger, timing and opposition.
Include 2-5 TIMED EVENTS, each with a "round" (1 to ${length}) and a "kind": "deadline" for a time-pressure objective the PLAYERS must achieve BY that turn (shown to them in advance, e.g. "by turn 4 disarm the reactor" — use these sparingly, only when the narrative needs a clock), or "surprise" for a hidden reveal that only appears when that turn arrives (reinforcements, a hazard, a betrayal, an environmental shift). Prefer surprises. Write each event atmospherically.
When a surprise event has a concrete mechanical effect the app can auto-apply to characters, add an "effect" object: {"apply":true,"type":"damage"|"heal"|"skill"|"condition"|"injury","amount":"1D6" (a dice string, for damage/heal),"skill":"A"|"F"|"S"|"AW"|"P" (for a skill change),"delta":-1 (for skill),"condition":"short label like Blinded or On fire" (for condition/skill),"duration":"turn" (wears off next turn) or "game" (lasts the game),"scope":"chosen" (the host picks who is in range) or "all" (every combatant),"where":"the exact area in cm, anchored to a named map feature or marker — e.g. within 10cm of Marble Pit (#3); everyone in base contact with the Reliquary; the whole east table half" (REQUIRED whenever scope is "chosen"),"negatedBy":["trait/ability/armour/item names that cancel it"]}. AREA IS A RULE, NOT A MOOD: at the table the host has to measure who is affected, so never write "nearby", "close by" or "anyone around" — give a distance in cm (5, 10, 15, 20 — the game's own ranges) or "base contact", measured from a feature or marker the map actually has, in BOTH the "where" field and the event's "text". Choose negatedBy from things that logically cancel the effect (e.g. Power armour negates Poisonous and Cumulative; Psy-hood negates Psychic/Arcane; Fearless negates fear/break effects; Iron skin, Death-proof, Painless, Unearthly, Bulwark can apply). "injury" is the rarest and cruellest: the chosen characters roll on the 1D8 injury table back at camp even if they survive the game (a collapsing gantry, a toxic bloom, a curse that takes hold) — use it in AT MOST one event per scenario, only for a danger the briefing or scenery warned about, with "scope":"chosen" and a fair "negatedBy". For a purely narrative event set "effect":{"apply":false}.
This is a PRINT-AND-PLAY game: players 3D-print their miniatures and build/print terrain. So also produce a preparation checklist of what must be built or printed BEFORE the game — terrain pieces, objective/token markers, any extra non-player characters or creatures the scenario needs, and any custom collectible items it introduces (things a character can pick up during play).
GROUND TYPE ON EVERY MAP FEATURE. Separately from what a piece DOES, the rulebook sorts all terrain into four movement categories, and the players are told to agree them BEFORE the game — so decide them here, as the DM, and set "ground" on every feature:
- "even" — moved over without impediment, no skill roll. Flat ground, steps, ladders, puddles.
- "rough" — an Agility roll to move through; fail and the character moves at half speed. Rubble-strewn ruins, low walls, slow water, shifting sand.
- "hazardous" — an Agility roll for EVERY action spent in it; pass and you move at half speed, fail and you cannot move at all and take 1D10 damage minus armour. Lava, raging water, grinding machinery, hostile fauna.
- "impassable" — cannot be crossed at all; characters must go around. Energy fields, sheer walls of rock.
Do NOT make everything even — a table of flat ground plays flat. Rough ground is the workhorse: it is what makes a ruin feel like a ruin and gives Agility, Sure-footed, Climber and the vehicle types (Walker, Hover, Flyer) something to matter against. Reserve hazardous for genuinely lethal ground and place little of it, and use impassable sparingly for hard edges. Ground and role are independent: a collapsed spire can be tall cover AND rough, a reactor pool can be an objective AND hazardous.
BUILD THE TABLE OUT OF THE STANDARD PROPS. The host owns a fixed set of shapes, so every terrain entry must name one by its code in a "prop" field, and its "size" must be that prop's size copied exactly. Name the piece for the fiction, not the shape — "P5 — The Rust Spire", "P2 — collapsed handrail". Each prop line says how many the host OWNS — never call for more of one than that, and never use a prop that is not listed, because it does not exist yet. A table is usually 8-14 pieces in total. If the list is short, build the scenario around what is there: fewer, better-placed pieces and ground areas beat imaginary scenery. The library:
${propsForAI()}
GET THE COVER LANGUAGE RIGHT. Planet 28 has ONE cover rule: if any part of a character's body is covered by terrain they are in cover, and gain an extra 1D6 armour roll against shooting. There is no "heavy" or "light" cover, and cover never blocks a shot by itself. What height changes is LINE OF SIGHT — you may shoot anyone with any part of their body visible — so a piece taller than a standing model hides them completely (no shot at all), while a low piece leaves them targetable but in cover. Say it that way in the scenario: "blocks line of sight" or "gives cover", never "heavy cover".
If the table truly needs a shape the library does not have, do NOT bend an existing prop — instead add it to "newProps" (see the JSON shape) so the host can build it before next time, and use the closest existing prop for this game.
CONNECT THE CHECKLIST TO THE MAP — this is important. Every map feature needs a "role" saying what it DOES in play, chosen from: "cover-low" (shoot over it), "cover-tall" (blocks sight, can hide behind), "blocking" (impassable/solid), "deco" (pure scenery, no game effect), "cache" (can be SEARCHED — this is where a collectible item is found), "interactive" (can be operated/hacked/opened/triggered), "objective", "hazard", "spawn" (where something arrives). And every checklist entry (terrain, markers, npcs, items) must set "mapLabel" to the EXACT label text of the map feature or zone it corresponds to, copied character-for-character (use a comma-separated list if one entry covers several identical pieces, e.g. "Wreck Spire, Wreck Spire"). The app turns those into the numbers shown on the map, so the host knows exactly which printed piece goes where and which one is searchable. If a collectible item is found by searching a terrain piece, give that feature role "cache" and point the item's "mapLabel" at it. Leave "mapLabel" as "" ONLY for things genuinely not on the map (e.g. a spare token kept off-table).
SEARCHING IS RESOLVED BY THE APP: a feature with role "cache" gets a Search button in play. Any item whose mapLabel points at that cache stays hidden until someone searches it, and the app picks which one turns up (at random if several share one cache). So it is GOOD to hide 1-3 items in caches, and fine for two different items to share a cache — that creates a real gamble. An item that just lies in the open (like the main objective) should point at a non-cache feature instead, so it needs no searching.
ITEMS ARE THE MOST IMPORTANT PLACE TO GET THIS RIGHT, AND THE EASIEST TO FORGET: every entry in "items" MUST carry BOTH a "mapLabel" (where on the table it is found — normally the cache it is hidden in) AND a "when". Do not leave an item's mapLabel empty; if it is not hidden in a cache, point it at whatever feature it lies on or beside. An item with no mapLabel is useless to the host because they cannot place it.
EVERY item MUST have a "when" field: one short, concrete sentence saying WHEN OR WHERE it matters, naming the specific special rule, hazard, event or place it interacts with — e.g. "Wear it before entering the flooded lower level; cancels the Deep-pressure -1 Athletics penalty" rather than a vague "useful later". If an item counters something, that something must exist in specialRules, events or a hazard feature — never invent a rule the scenario doesn't have. Do the same for npcs where it helps ("when" = when/where it shows up).
LASTING INJURIES — when a character is taken down the players roll on the rulebook's own 1D8 injury table, so do NOT invent mechanics. Instead write an "injuries" list of 5-7 SCENARIO-FLAVOURED wound descriptions this place could inflict — each just a "name" (e.g. "Venom-withered arm", "Pressure-burst eardrum"), a one-line "note" of prose, and a "cause" tag matching a threat in this scenario (an enemy name, a hazard, an event) so the right flavour is drawn for what actually happened. The app pairs your description with whatever the dice decide.
A find may instead be a TRAP: set "trap":{"damage":"1D6","condition":"Stunned" or "","note":"what goes off"} and the app springs it on whoever searches that cache — damage rolled and applied at the table, never picked up. A trap has no "effect". Use one at most, and make the "note" hint at it for a sharp-eyed reader. EVERY OTHER ITEM DECIDES ITS OWN EFFECT NOW. The host has no AI at the table, so write each item's mechanical "effect" here, in the exact shape shown: skill deltas between -4 and +4, HP delta between -10 and +10, traits and abilities by their exact catalogue names, an optional new name for a true transformation, and a one-sentence "summary". A plain piece of gear, or a pure objective like a data-core or a golden brick, gets {"apply":false,"summary":"..."} — it is carried, not absorbed. Never leave "effect" out.
${qt&&MYSTERY_TYPES.includes(qt[0])?`THIS IS A MYSTERY, SO IT IS DELIVERED SEALED. The players — and the host reading this at the table — must not be handed the shape of it in advance. Therefore: "objectives" holds EXACTLY ONE line, deliberately vague ("Find out what is down here, and come back."); "specialRules" holds at most 2 atmospheric rules about the PLACE (light, water, cold), never about the mystery itself; "twist" is an empty string; EVERY enemy unit and creature is "secret": true and does not deploy at the start; every item is "secret": true with a hint. Then add a "mystery" object: {"question":"the one thing the players are here to find out, in a sentence","truth":"the full answer — what this really is, why, what it wants; only ever shown at the finale","envelopes":[{"trigger":"a concrete, testable moment — 'turn 3', 'someone searches #4', 'a model enters the Sump (#7)', 'a caster fails a roll', 'the first time anyone is wounded'","title":"short sealed title the host sees BEFORE opening (2-4 words, no spoilers)","text":"what the host reads aloud when it opens — vivid, second person, 2-4 sentences","effect":"what changes at the table now, as a rule the host applies — a new marker, a creature stepping out (name it, it is in the enemy list), a zone that becomes hazardous, a clue that narrows the question; or an empty string if it is pure atmosphere"}],"finale":"how the truth comes out and how the game ends — what the players must do in the last turns, and what 'getting out with the answer' looks like on the table"}. Write 6-9 envelopes; order them from early to late; make at least 3 depend on what the players DO (search, enter, touch, cast), not just on the turn count; make the clues add up so a thinking table can guess the truth one envelope early. Timed "events" may still exist for the app's turn tracker, but keep them as atmosphere — the mystery lives in the envelopes.
`:""}SECRETS & SURPRISES — make the world feel alive: you MAY include plot twists and surprise reveals. Mark any NPC, item, or timed event that should be a SECRET (hidden from the host until it happens) with "secret": true. For a secret NPC or item, DO NOT spoil it in the checklist — instead give a non-spoiler "hint" telling the host only what to PREPARE (e.g. "a large monstrous miniature", "a mysterious relic token"). A hint says WHAT TO BUILD and nothing else — never put the turn, the trigger or any timing in it ("kept hidden until turn 8" is wrong), because in a co-op game the host is playing too and would be spoiling their own surprise while keeping the real name/note/round in the normal fields (the app hides them until the host reveals or the moment arrives). A collectible item whose effect should only be discovered on pickup should be marked "secret": true with a vague "hint". Not everything needs to be secret — obvious, up-front elements stay visible.

  try{

  v.deployNote=(function(){var t=String(u.deployNote||"");if(t.length<=240)return t;var cut=t.slice(0,240),i=cut.lastIndexOf(" ");return (i>180?cut.slice(0,i):cut)+"…";})();

/* The rulebook's vehicle construction limits — same repair-don't-trust rule as characters. */
function legaliseVehicle(v){
  const sec=n=>findCat("vsection",n), q=o=>{const e=o&&v.sections.find(x=>x.id===o.id);return e?e.qty:0;};
  const dozer=sec("Dozer blade");
  if(dozer&&v.size===0)v.sections=v.sections.filter(e=>e.id!==dozer.id);       // medium/large only
  // A vehicle mounts one weapon per hard point (turret hard points included)
  const hp=sec("Hard point"), th=sec("Turret hard point");
  let mounts=q(hp)+q(th);
  if(mounts<1&&v.weapons.length){                                              // it needs somewhere to bolt them on
    const add=Math.min(3,v.weapons.reduce((a,e)=>a+e.qty,0));
    if(hp){v.sections.push({id:hp.id,qty:add});mounts=add;}
  }
  let left=mounts,kept=[];
  v.weapons.forEach(e=>{const take=Math.min(e.qty,left);if(take>0){kept.push(e.as?{id:e.id,qty:take,as:e.as}:{id:e.id,qty:take});left-=take;}});
  v.weapons=kept;
  // Armour plating may be at most 50% of a small/medium vehicle, 25% of a large one
  const plate=sec("Armour plating");
  if(plate){
    const pe=v.sections.find(e=>e.id===plate.id);
    if(pe){
      const ratio=v.size===2?0.25:0.5;
      const other=2+v.sections.filter(e=>e.id!==plate.id).reduce((a,e)=>a+e.qty,0);   // +2 core sections
      const cap=Math.floor(ratio*other/(1-ratio));
      if(pe.qty>cap)pe.qty=cap;
      if(pe.qty<1)v.sections=v.sections.filter(e=>e.id!==plate.id);
    }
  }
  return v;
}
function scnLoreForAI(scn){

  const lines=[];
  if(scn.scenery)lines.push(`Setting/scenery: ${scn.scenery}`);
  if(scn.deployment)lines.push(`Deployment: ${scn.deployment}`);
  if((scn.specialRules||[]).length)lines.push(`Special rules: ${scn.specialRules.join("; ")}`);
  if(scn.twist)lines.push(`Twist: ${scn.twist}`);
  const npcs=(Array.isArray(scn.npcs)?scn.npcs:[]).map(v=>{const n=v&&(v.name||v.hint);return n?n+(v.when?" - "+v.when:"")+(v.note?" ("+v.note+")":""):null;}).filter(Boolean);

/* How much a late arrival is telegraphed is a storytelling choice the AI makes per unit:
   "open" — known from the outset, so the players can plan around it
   "foreshadowed" — they know something is coming, and roughly when, but not what

function enemyReveal(c){
  const r=String((c&&c.reveal)||"").toLowerCase();
  if(r==="hidden"||r==="foreshadowed"||r==="open")return r;
  return (c&&c.secret)?"hidden":"open";        // older scenarios: fall back to the secret flag
}
function enemyHidden(c){return !!(c&&!c.revealed&&enemyReveal(c)==="hidden");}
function enemyTeased(c){return !!(c&&!c.revealed&&enemyReveal(c)==="foreshadowed");}
/* Only badge a turn we can actually stand behind. The old first-match-wins read was wrong
   two ways: an arrival triggered by something happening ("erupts the turn the pod is
   disturbed, and further waves after turn 11") is on no fixed turn at all, and a turn named
   after "after"/"each"/"every" describes a LATER wave rather than the arrival. Better no
   badge than a number that sends the host into the wrong turn. */
function enemyArrivalTurn(c){
  const note=String((c&&c.deployNote)||"");
  if(/\b(when|once|if|as soon as|the moment|upon|the turn the|is disturbed|triggered)\b/i.test(note))return 0;
  const re=/(\w+)?\s*\bturn (\d+)/gi;
  let m;
  while((m=re.exec(note))){
    if(/^(after|beyond|past|each|every|from)$/i.test(m[1]||""))continue;
    return +m[2];
  }
  return 0;
}

/* ---- map ↔ build-list cross-referencing ----
   Every labelled zone/feature gets a number (zones first, then features — the SAME order
   scenarioMapSVG draws its badges in). Build-list entries name the map label they belong to
   via `mapLabel`, so the app can resolve it to those numbers and show them side by side. */
const FEAT_ROLES={
  "cover-low":{label:"cover · shoot over",cls:"r-cover"},
  "cover-tall":{label:"cover · hides a model",cls:"r-cover"},
  "blocking":{label:"impassable",cls:"r-cover"},
  "deco":{label:"scenic only",cls:"r-deco"},
  "cache":{label:"searchable",cls:"r-cache"},
  "interactive":{label:"interactive",cls:"r-inter"},
  "objective":{label:"objective",cls:"r-obj"},
  "hazard":{label:"hazard",cls:"r-haz"},
  "spawn":{label:"spawn point",cls:"r-spawn"}
};
/* The rulebook sorts ALL terrain into four movement categories and says to agree them before
   play. That is separate from what a piece DOES (a wreck can be tall cover AND rough to climb
   through), so ground rides alongside the role rather than replacing it. */
const GROUND={
  even:{label:"even ground",cls:"g-even",rule:"Moved over without impediment — no skill roll."},
  rough:{label:"rough ground",cls:"g-rough",rule:"Make an Agility roll to move through. Fail and the character moves at half speed, rounding down."},
  hazardous:{label:"hazardous ground",cls:"g-haz",rule:"Agility roll for EVERY action spent in it. Pass and you move at half speed; fail and you may not move at all and take 1D10 damage, minus armour rolls."},
  impassable:{label:"impassable",cls:"g-imp",rule:"Cannot be moved over or through at all — characters must go around it."}
};
/* Only two roles imply their ground beyond doubt; everything else is left UNKNOWN rather
   than assumed flat, so the host decides at the table instead of the app inventing a rule. */
const GROUND_FROM_ROLE={blocking:"impassable",hazard:"hazardous"};
function featGround(f){
  const g=String((f&&f.ground)||"").toLowerCase();
  if(GROUND[g])return g;
  return GROUND_FROM_ROLE[String((f&&f.role)||"").toLowerCase()]||"";
}
function groundChip(g){
  const o=GROUND[String(g||"").toLowerCase()];
  return o?`<span class="role-chip ${o.cls}" tabindex="0" data-tip="${esc(o.rule)}">${esc(o.label)}</span>`:"";
}
function roleChip(role){
  const r=FEAT_ROLES[String(role||"").toLowerCase()];
  return r?`<span class="role-chip ${r.cls}">${esc(r.label)}</span>`:"";
}
function mapSeq(map){
  map=map||{};
  const zones=Array.isArray(map.zones)?map.zones:[];
  const feats=Array.isArray(map.features)?map.features:[];
  const out=[];let n=0;
  zones.forEach(z=>{if(z&&z.label){n++;out.push({n,label:String(z.label),role:"",kind:"zone"});}});
  feats.forEach(f=>{if(f&&f.label){n++;out.push({n,label:String(f.label),role:String(f.role||""),ground:featGround(f),kind:"feature"});}});
  return out;
}
function normLabel(v){return String(v||"").trim().toLowerCase().replace(/\s+/g," ").replace(/s$/,"");}
/* Tolerant matching: the AI has to repeat a label it invented elsewhere, so near-misses
   ("Supply Lockers" vs "Supply Locker") are common. Exact-normalised match first; then a
   containment match, but ONLY when it is unambiguous (exactly one candidate). */
function mapNumsFor(map,labels){
  if(!labels)return [];
  const seq=mapSeq(map);
  const want=String(labels).split(/\s*,\s*/).map(normLabel).filter(Boolean);
  if(!want.length||!seq.length)return [];
  const out=[];
  want.forEach(wr=>{
    const exact=seq.filter(e=>normLabel(e.label)===wr);
    if(exact.length){exact.forEach(e=>{if(!out.includes(e.n))out.push(e.n);});return;}
    if(wr.length<4)return;
    const loose=seq.filter(e=>{const el=normLabel(e.label);return el.length>=4&&(el.includes(wr)||wr.includes(el));});
    if(loose.length===1&&!out.includes(loose[0].n))out.push(loose[0].n);
  });
  return out.sort((a,b)=>a-b);
}
function numBadges(nums){
  if(!nums||!nums.length)return "";
  return `<span class="mapref">${nums.map(n=>`<span class="mapref-n">${n}</span>`).join("")}</span>`;
}
// build-list entries may be plain strings (older scenarios) or {name,note,mapLabel,role,...}
function prepEntry(x){
  if(typeof x==="string")return {name:x,note:"",when:"",size:"",prop:"",mapLabel:"",role:"",secret:false,hint:"",revealed:false};
  return {name:String(x&&x.name||""),note:String(x&&x.note||""),when:String(x&&x.when||""),size:String(x&&x.size||""),prop:String(x&&x.prop||""),mapLabel:String(x&&x.mapLabel||""),role:String(x&&x.role||""),secret:!!(x&&x.secret),hint:String(x&&x.hint||""),revealed:!!(x&&x.revealed)};
}
// an entry with no role of its own inherits the role of the map feature it points at
function prepRole(map,e){
  if(e.role&&FEAT_ROLES[e.role])return e.role;
  const nums=mapNumsFor(map,e.mapLabel);
  if(!nums.length)return "";
  const hit=mapSeq(map).find(q=>nums.includes(q.n)&&q.role);
  return hit?hit.role:"";
}
// like prepRole: a build-list entry inherits the ground of the map feature it points at
function prepGround(map,e){
  const nums=mapNumsFor(map,e.mapLabel);
  if(!nums.length)return "";
  const hit=mapSeq(map).find(q=>nums.includes(q.n)&&q.ground);
  return hit?hit.ground:"";
}
/* key of the glyphs actually on this map (same order the roles are drawn), so the picture
   reads on its own without hunting through the numbered list */
const MAP_KEY={
  "cover-tall":["tall cover","background:var(--map-solid);border-radius:2px"],
  "cover-low":["low cover","background:#a68d5c;border:1px solid #6b5a30"],
  "blocking":["wall","background:var(--map-wall);height:6px!important;border-radius:1px"],
  "hazard":["hazard","background:rgba(236,91,96,.6);border:1px solid #c9444a;border-radius:50%"],
  "objective":["objective","border:2.5px solid #e9b949;border-radius:50%;background:none"],
  "cache":["searchable","background:#5a9be0;border-radius:2px"],
  "interactive":["interactive","background:#8e6bd0;transform:rotate(45deg) scale(.8)"],
  "spawn":["spawn point","border:1.5px dashed #e5686d;border-radius:50%;background:rgba(229,104,109,.18)"],
  "deco":["scenic","background:#86ad7e;border-radius:50%"],
  "":["terrain","background:var(--map-solid);border-radius:2px"]
};
function mapKeyHTML(map){
  map=map||{};
  const feats=Array.isArray(map.features)?map.features:[];
  const zones=Array.isArray(map.zones)?map.zones:[];
  const roles=[];
  feats.forEach(f=>{let k=String(f.role||"").toLowerCase();if(!MAP_KEY[k])k=f.type==="objective"?"objective":f.type==="hazard"?"hazard":"";if(!roles.includes(k))roles.push(k);});
  const items=[];
  if(zones.some(z=>z.side!=="b"&&z.side!=="neutral"))items.push(`<span><i style="border:1.5px dashed #5a9be0;background:rgba(90,155,224,.13)"></i>deploy · players</span>`);
  if(zones.some(z=>z.side==="b"))items.push(`<span><i style="border:1.5px dashed #e5686d;background:rgba(229,104,109,.13)"></i>deploy · enemy</span>`);
  Object.keys(MAP_KEY).forEach(k=>{if(roles.includes(k))items.push(`<span><i style="${MAP_KEY[k][1]}"></i>${MAP_KEY[k][0]}</span>`);});
  return items.length?`<div class="scn-maplegend">${items.join("")}</div>`:"";
}
function mapLegendHTML(map){
  const seq=mapSeq(map);
  if(!seq.length)return mapKeyHTML(map);
  const grounds=[...new Set(seq.map(e=>e.ground).filter(g=>g&&g!=="even"))];
  const gkey=grounds.length?`<div class="scn-maplegend">${grounds.map(g=>`<span><i style="background:${g==="hazardous"?"rgba(236,91,96,.3)":g==="rough"?"repeating-linear-gradient(45deg,#e9b949 0 1px,rgba(233,185,73,.12) 1px 4px)":"repeating-linear-gradient(-45deg,#9aa3b2 0 1px,rgba(154,163,178,.15) 1px 3px)"};border:1px ${g==="hazardous"?"solid":"dashed"} ${g==="hazardous"?"#ec5b60":g==="rough"?"#e9b949":"#9aa3b2"}"></i>${esc(GROUND[g].label)}</span>`).join("")}</div>`:"";
  const rows=seq.map(e=>`<div class="maplg-row" data-mapnum="${e.n}"><span class="maplg-num">${e.n}</span><span class="maplg-label">${esc(e.label)}</span>${roleChip(e.role)}${groundChip(e.ground)}</div>`);
  return mapKeyHTML(map)+gkey+`<div class="scn-maplegend-nums">${rows.join("")}</div>`;
}
function wireMapNums(container){

/* ---- live-play: round tracker + item pickups ---- */
let pickupOpenId=null;
function curRound(s){return Math.max(1,s.round||1);}
function setRound(s,r){s.round=Math.max(1,r);save();renderScenarioView();}
function parseEventEffect(x){
  if(!x||typeof x!=="object"||!x.apply)return {apply:false};
  const type=["damage","heal","skill","condition","injury"].includes(x.type)?x.type:"condition";
  return {apply:true,type,
    amount:String(x.amount||"").slice(0,14),
    skill:["A","F","S","AW","P"].includes(x.skill)?x.skill:"",
    delta:Math.round(+x.delta||0),
    condition:String(x.condition||"").slice(0,40),
    duration:x.duration==="turn"?"turn":"game",
    scope:x.scope==="all"?"all":"chosen",
    where:String(x.where||"").slice(0,90),
    negatedBy:(Array.isArray(x.negatedBy)?x.negatedBy:[]).map(v=>String(v).slice(0,40)).filter(Boolean).slice(0,8)};
}
/* ---- live battle roster ---- */
function negListOf(c){
  const nm=[]; (c.traits||[]).forEach(id=>{if(CAT.trait[id])nm.push(CAT.trait[id].name);});
  (c.abilities||[]).forEach(id=>{if(CAT.ability[id])nm.push(CAT.ability[id].name);});
  (c.items||[]).forEach(e=>{if(CAT.item[e.id])nm.push(CAT.item[e.id].name);});
  (c.armour||[]).forEach(e=>{if(CAT.armour[e.id])nm.push(CAT.armour[e.id].name);});
  return nm.map(x=>x.toLowerCase());
}
/* Combatants carry the camp + character they came from, so whatever happens to them at the
   quest can be routed back to the right character on the right player's own device. */
function injuryNotes(c){return (c.injuries||[]).filter(x=>x&&x.name).map(x=>x.name+(x.effectNote?" ("+x.effectNote+")":""));}
function myCombatants(owner,idPrefix){
  const w=activeWB(), out=[], cid=campId();
  // A vehicle laid up for repairs sits this one out; everything else fielded rolls out.
  vehsOf(w).filter(v=>isFielded(v)&&!v.laidUp).forEach(v=>{
    const max=vehicleHP(v);
    const cur=(typeof v.curHP==="number"&&v.curHP>0&&v.curHP<max)?v.curHP*1:max;
    const secs=vehSecsFor(v);
    out.push({id:(idPrefix||"p_")+v.id,side:"player",owner:owner||"",campId:cid,vehId:v.id,isVeh:true,A:v.skills.A,AW:0,
      name:"▰ "+(v.name||"Unnamed vehicle"),maxHP:max,curHP:Math.min(cur,secsTotal(secs)),conditions:[],neg:[],finds:[],secs,aboard:[]});
  });
  w.characters.filter(isFielded).forEach(c=>{
    const n=memberCount(c), max=c.hp*n;
    // a character carries its lingering wounds into the next quest; a squad spreads them
    // across its members, so each model gets its own row to be wounded and killed on
    let left=(typeof c.curHP==="number"&&c.curHP>0&&c.curHP<max)?c.curHP*1:max;
    for(let k=0;k<n;k++){
      const share=Math.max(0,Math.min(c.hp,left)); left-=share;
      out.push({id:(idPrefix||"p_")+c.id+(n>1?"_"+k:""),side:"player",owner:owner||"",campId:cid,charId:c.id,member:k,A:c.skills.A,AW:c.skills.AW,
        name:(c.name||"Unnamed")+(n>1?" "+(k+1)+"/"+n:""),maxHP:c.hp,curHP:share,conditions:[],neg:negListOf(c),
        scars:injuryNotes(c),finds:[]});
    }
  });
  return out;
}
function buildBattle(s){
  const me=campName()||playerName()||"You", combatants=myCombatants(me,"p_");
  (livePlayers||[]).forEach(p=>(p.combatants||[]).forEach(m=>{if(m&&m.id&&!combatants.some(x=>x.id===m.id))combatants.push(JSON.parse(JSON.stringify(m)));}));
  if(s.mode==="coop"){
    enemyChars(s).forEach(c=>{
      const n=memberCount(c), neg=negListOf(c);
      for(let k=0;k<n;k++)combatants.push({id:"e_"+c.id+(n>1?"_"+k:""),side:"enemy",owner:"Enemy",A:c.skills.A,AW:c.skills.AW,
        name:(c.name||"Enemy")+(n>1?" "+(k+1)+"/"+n:""),maxHP:c.hp,curHP:c.hp,conditions:[],neg:neg.slice()});
    });
    // a vehicle's hull is the sum of its sections; it is destroyed section by section
    enemyVehs(s).forEach(v=>{const hp=vehicleHP(v);combatants.push({id:"e_"+v.id,side:"enemy",owner:"Enemy",name:"▰ "+(v.name||"Enemy vehicle"),maxHP:hp,curHP:hp,conditions:[],neg:[],isVeh:true,secs:vehSections(v).map(s=>Object.assign({},s,{cur:s.max})),aboard:[]});});
  }
  s.battle={started:true,combatants};save();
}
function mergePlayersIntoHostedBattle(){
  const s=findScn(hostScenarioId);
  if(!s||!s.battle||!s.battle.started)return;
  let added=false;
  (livePlayers||[]).forEach(p=>(p.combatants||[]).forEach(m=>{if(m&&m.id&&!s.battle.combatants.some(x=>x.id===m.id)){s.battle.combatants.push(JSON.parse(JSON.stringify(m)));added=true;}}));
  if(added){save();scheduleHostSync(s);}
}

/* ---- activation order: Agility bands, both sides interleaved; ties by Awareness, then a roll ---- */
let rosterFilter="all";
function unitA(s,m){

function rollDice(str){
  str=String(str||"").trim();
  const m=str.match(/^(\d+)\s*[dD]\s*(\d+)\s*([+\-]\s*\d+)?$/);
  if(!m){const n=parseInt(str,10);return isFinite(n)?Math.max(0,n):0;}
  const cnt=Math.min(20,+m[1]||1),sides=+m[2]||6,mod=m[3]?parseInt(m[3].replace(/\s/g,""),10):0;
  let t=0;for(let i=0;i<cnt;i++)t+=1+Math.floor(Math.random()*sides);
  return Math.max(0,t+mod);
}
function negatedBy(m,eff){
  const neg=(eff.negatedBy||[]).map(x=>String(x).toLowerCase().trim()).filter(Boolean);
  for(const nn of neg){ if((m.neg||[]).some(mn=>mn===nn||mn.includes(nn)||nn.includes(mn))) return eff.negatedBy.find(x=>String(x).toLowerCase().trim()===nn)||nn; }
  return null;
}
function applyEventEffect(s,eff,ids){
  const out=[];
  ids.forEach(id=>{
    const m=(s.battle.combatants||[]).find(x=>x.id===id);if(!m)return;
    const neg=negatedBy(m,eff);
    if(neg){out.push({name:m.name,txt:"negated by "+neg,neg:true});return;}
    if(eff.type==="damage"){const d=rollDice(eff.amount);m.curHP=Math.max(0,m.curHP-d);out.push({name:m.name,txt:"−"+d+" HP"+(m.curHP<=0?" · DOWN":"")});}
    else if(eff.type==="heal"){const h=rollDice(eff.amount);m.curHP=Math.min(m.maxHP,m.curHP+h);out.push({name:m.name,txt:"+"+h+" HP"});}
    else if(eff.type==="injury"){m.maimedBy=String(eff.cause||"a hazard").slice(0,40);out.push({name:m.name,txt:"maimed — rolls on the injury table back at camp"});}
    else{const label=eff.condition||(eff.skill?((eff.delta>0?"+":"")+eff.delta+" "+eff.skill):"Affected");const expireTurn=eff.duration==="turn"?curRound(s)+1:null;m.conditions=m.conditions||[];m.conditions.push({label,expireTurn});out.push({name:m.name,txt:label+(expireTurn?" (→T"+expireTurn+")":"")});}
  });
  save();return out;
