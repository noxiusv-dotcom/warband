<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<body>
<title>Realm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Barlow:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --ground:#14161b; --panel:#1c1f27; --panel-2:#232733; --sunk:#101217;
  --line:#2c313d; --line-soft:#242832;
  --ink:#e9e7e2; --ink-dim:#a7adba; --ink-mute:#727a8a;
  --amber:#ffb84d; --amber-deep:#e0932a; --amber-glow:rgba(255,184,77,.14);
  --teal:#3fb9a6; --teal-deep:#2f9d8c;
  --arcane:#b98fe6;
  --danger:#ec5b60; --danger-bg:rgba(236,91,96,.13);
  --warn:#e9b949;
  --disp:"Chakra Petch",system-ui,sans-serif;
  --body:"Barlow",system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,monospace;
  --r:10px; --r-sm:7px;
  --shadow:0 18px 46px -18px rgba(0,0,0,.7);
}
:root:not([data-theme="light"]){color-scheme:dark;}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#eceae2; --panel:#fbfaf6; --panel-2:#f1efe7; --sunk:#e4e1d7;
    --line:#d6d2c6; --line-soft:#e0ddd2;
    --ink:#1c1e24; --ink-dim:#565b66; --ink-mute:#8a8f9b;
    --amber:#bd7c12; --amber-deep:#a86a08; --amber-glow:rgba(189,124,18,.12);
    --teal:#12857260; --teal:#177f6f; --teal-deep:#0f6d5f;
    --arcane:#6b3fa0;
    --danger:#c73f43; --danger-bg:rgba(199,63,67,.1);
    --warn:#a9781a;
    --shadow:0 16px 40px -20px rgba(40,36,24,.4);
    color-scheme:light;
  }
}
[data-theme="light"]{
  --ground:#eceae2; --panel:#fbfaf6; --panel-2:#f1efe7; --sunk:#e4e1d7;
  --line:#d6d2c6; --line-soft:#e0ddd2;
  --ink:#1c1e24; --ink-dim:#565b66; --ink-mute:#8a8f9b;
  --amber:#bd7c12; --amber-deep:#a86a08; --amber-glow:rgba(189,124,18,.12);
  --teal:#177f6f; --teal-deep:#0f6d5f;
  --arcane:#6b3fa0;
  --danger:#c73f43; --danger-bg:rgba(199,63,67,.1);
  --warn:#a9781a;
  --shadow:0 16px 40px -20px rgba(40,36,24,.4);
  color-scheme:light;
}
*{box-sizing:border-box}
/* Our own [hidden] reset. The artifact wrapper ships one, the Realm wrapper does not, so
   without this a class like .btn{display:inline-flex} silently defeats the hidden attribute
   and "hidden" buttons stay on screen in one build but not the other. */
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;}
h1,h2,h3,h4{font-family:var(--disp);margin:0;font-weight:600;letter-spacing:.01em;text-wrap:balance}
button{font-family:var(--disp);cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:var(--body);color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--disp);text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:600;color:var(--ink-mute)}

/* ---------- command header ---------- */
.top{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--panel) 86%, transparent));backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-inner{max-width:1120px;margin:0 auto;padding:12px clamp(12px,3vw,26px)}
.brandrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{width:38px;height:38px;flex:none;border:1.5px solid var(--amber);border-radius:9px;display:grid;place-items:center;background:var(--amber-glow);position:relative}
.mark svg{width:22px;height:22px}
.brand h1{font-size:19px;line-height:1;letter-spacing:.02em}
.brand .sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);font-family:var(--disp);font-weight:600;margin-top:3px}
.brand-spacer{flex:1}
.iconbtn{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;color:var(--ink-dim);background:var(--panel-2);transition:.15s}
.iconbtn:hover{color:var(--amber);border-color:var(--amber)}
.iconbtn svg{width:18px;height:18px}

.manifest{margin-top:14px;display:grid;grid-template-columns:1fr auto;gap:14px 20px;align-items:end}
.wb-name-wrap{min-width:0}
.wb-name{font-family:var(--disp);font-weight:700;font-size:clamp(20px,4.4vw,30px);background:none;border:none;border-bottom:1.5px dashed transparent;color:var(--ink);width:100%;padding:2px 0;letter-spacing:.01em}
.wb-name:hover{border-bottom-color:var(--line)}
.wb-name:focus{outline:none;border-bottom-color:var(--amber)}
.wb-name-row{display:flex;align-items:center;gap:9px}
.wb-name-row .wb-name{flex:1;min-width:0}
.genbtn.wb-gen{width:42px;height:40px;flex:none;align-self:center}
.gauge{min-width:min(340px,64vw)}
.gauge-nums{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.gauge-spent{font-family:var(--mono);font-size:23px;font-weight:700;line-height:1;color:var(--ink)}
.gauge-spent.over{color:var(--danger)}
.gauge-spent .of{color:var(--ink-mute);font-size:14px;font-weight:400}
.budget-edit{font-family:var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:6px;color:var(--ink);width:74px;padding:2px 6px;font-size:14px;text-align:right;font-weight:700}
.budget-edit:focus{outline:none;border-color:var(--amber)}
.remain{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:600}
.remain b{font-family:var(--mono);letter-spacing:0}
.remain.ok{color:var(--teal)} .remain.over{color:var(--danger)}
.bar{height:8px;border-radius:5px;background:var(--sunk);border:1px solid var(--line-soft);overflow:hidden;position:relative}
.bar > i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--teal-deep),var(--teal));transition:width .35s cubic-bezier(.4,0,.2,1)}
.bar > i.warn{background:linear-gradient(90deg,var(--amber-deep),var(--amber))}
.bar > i.over{background:linear-gradient(90deg,#b23b3f,var(--danger))}
.meta-line{margin-top:8px;display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-mute);font-family:var(--mono)}
.meta-line .warnflag{color:var(--warn)}

/* ---------- main / roster ---------- */
main{max-width:1120px;margin:0 auto;padding:22px clamp(12px,3vw,26px) 90px}
.section-head{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
.section-head .eyebrow{white-space:nowrap}
.section-head .rule{height:1px;background:var(--line);flex:1}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px 14px;text-align:left;display:flex;flex-direction:column;gap:11px;transition:.16s;position:relative;overflow:hidden}
.card:hover{border-color:var(--amber);transform:translateY(-2px);box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber);opacity:.0;transition:.16s}
.card:hover::before{opacity:.9}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card-name{font-family:var(--disp);font-weight:600;font-size:17px;line-height:1.15}
.card-role{font-size:12px;color:var(--ink-mute);margin-top:2px;min-height:1em}
.card-cost{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--amber);white-space:nowrap;text-align:right}
.card-cost small{display:block;font-size:9px;letter-spacing:.13em;color:var(--ink-mute);text-transform:uppercase;font-family:var(--disp);font-weight:600}
.statgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:9px 0}
.stat{text-align:center}
.stat b{display:block;font-family:var(--mono);font-weight:700;font-size:16px;line-height:1}
.stat span{display:block;font-family:var(--disp);font-size:9px;letter-spacing:.08em;color:var(--ink-mute);margin-top:3px;text-transform:uppercase}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--ink-dim)}
.card.benched{opacity:.55;filter:saturate(.5)}
.card.benched:hover{opacity:.85}
.card.benched::before{background:var(--ink-mute)}
.fieldtog{font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:20px;border:1px solid var(--line);color:var(--ink-mute);background:var(--panel-2);white-space:nowrap;transition:.14s;flex:none}
.fieldtog:hover{border-color:var(--amber);color:var(--amber)}
.fieldtog.on{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 48%,var(--line))}
.fieldtog.on:hover{border-color:var(--teal);color:var(--teal)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--ink-dim);background:var(--panel-2)}
.chip.hp{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 45%,var(--line))}
.chip.squad{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 55%,var(--line));background:color-mix(in srgb,var(--teal) 10%,var(--panel-2))}
.card.add{align-items:center;justify-content:center;text-align:center;border-style:dashed;color:var(--ink-mute);min-height:150px;gap:8px;background:transparent}
.card.add:hover{color:var(--amber);border-color:var(--amber);transform:translateY(-2px)}
.card.add .plus{width:34px;height:34px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:22px;font-family:var(--body);line-height:0}
.card.add span{font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:600}
.empty{grid-column:1/-1;text-align:center;padding:56px 20px;color:var(--ink-mute)}
.empty h3{font-size:20px;color:var(--ink-dim);margin-bottom:8px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--r-sm);font-weight:600;font-size:13px;letter-spacing:.03em;text-transform:uppercase;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);transition:.15s}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.primary{background:var(--amber);color:#191308;border-color:var(--amber)}
.btn.primary:hover{background:var(--amber-deep);border-color:var(--amber-deep);color:#191308}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn.gc-fielded{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 45%,var(--line))}
.btn.gc-fielded:hover{border-color:var(--teal);color:var(--teal)}
.btn svg{width:15px;height:15px}
.btn.sm{padding:6px 11px;font-size:12px}

/* ---------- overlay / dossier ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,7,10,.62);backdrop-filter:blur(3px);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.scrim.show{opacity:1;pointer-events:auto}
.dossier{position:fixed;z-index:70;top:0;right:0;height:100%;width:min(560px,100%);background:var(--ground);border-left:1px solid var(--line);box-shadow:-24px 0 60px -30px rgba(0,0,0,.8);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .26s cubic-bezier(.32,.72,0,1)}
.dossier.show{transform:none}
.dossier-head{padding:16px clamp(14px,3vw,22px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--panel)}
.dossier-head .eyebrow{color:var(--amber)}
.dossier-head .dcost{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:18px;color:var(--amber);text-align:right;white-space:nowrap}
.dossier-head .dcost small{display:block;font-family:var(--disp);font-size:9px;letter-spacing:.13em;color:var(--ink-mute);text-transform:uppercase}
.dbody{flex:1;overflow-y:auto;padding:clamp(14px,3vw,22px);display:flex;flex-direction:column;gap:22px}
.dgroup > .ghead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dgroup > .ghead .eyebrow{color:var(--ink-dim)}
.dgroup > .ghead .rule{height:1px;background:var(--line-soft);flex:1}
.dgroup > .ghead .gcost{font-family:var(--mono);font-size:12px;color:var(--ink-mute)}
.field label{display:block;font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:600;color:var(--ink-mute);margin-bottom:6px}
.input{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--ink);padding:10px 12px;font-size:15px}
.input:focus{outline:none;border-color:var(--amber)}
textarea.input{resize:vertical;min-height:56px;line-height:1.45}

/* steppers */
.steprow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.steprow:last-child{border-bottom:none}
.steprow .lbl{display:flex;flex-direction:column;gap:1px}
.steprow .lbl b{font-family:var(--disp);font-size:14px;font-weight:600}
.steprow .lbl span{font-size:11px;color:var(--ink-mute)}
.stepper{display:flex;align-items:center;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:3px}
.stepper button{width:30px;height:30px;border-radius:6px;font-size:19px;line-height:0;color:var(--ink-dim);font-family:var(--body)}
.stepper button:hover:not(:disabled){background:var(--panel-2);color:var(--amber)}
.stepper button:disabled{opacity:.28;cursor:not-allowed}
.stepper .val{width:38px;text-align:center;font-family:var(--mono);font-weight:700;font-size:17px}
.steprow .pts{font-family:var(--mono);font-size:12px;color:var(--ink-mute);width:52px;text-align:right}
.steprow .pts.pos{color:var(--teal)} .steprow .pts.neg{color:var(--danger)}

/* selected list rows */
.sel-list{display:flex;flex-direction:column;gap:7px}
.sel-row{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px}
.sel-row .srmain{flex:1;min-width:0}
.sel-row .srname{font-family:var(--disp);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sel-row .srdesc{font-size:12px;color:var(--ink-dim);margin-top:3px;line-height:1.4}
.sel-row .srcost{font-family:var(--mono);font-size:13px;font-weight:700;white-space:nowrap}
.srcost.pos{color:var(--teal)} .srcost.neg{color:var(--danger)} .srcost.cr{color:var(--amber)}
.tag{font-family:var(--disp);font-size:9px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-mute)}
.tag.psy{color:#b58be0;border-color:#4a3a5e}
.tag.energy{color:#5fb8e0;border-color:#2f4d5e}
.tag.ap{color:var(--amber);border-color:var(--amber-deep)}
.qty{display:flex;align-items:center;gap:1px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:2px}
.qty button{width:24px;height:24px;border-radius:4px;font-size:15px;line-height:0;color:var(--ink-dim);font-family:var(--body)}
.qty button:hover{color:var(--amber)}
.qty .qv{width:24px;text-align:center;font-family:var(--mono);font-weight:700;font-size:13px}
.rm{color:var(--ink-mute);width:26px;height:26px;border-radius:5px;display:grid;place-items:center;flex:none;font-size:16px}
.rm:hover{color:var(--danger);background:var(--danger-bg)}
.add-line{display:flex;flex-wrap:wrap;gap:8px}
.addbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border:1px dashed var(--line);border-radius:var(--r-sm);color:var(--ink-dim);font-family:var(--disp);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;background:transparent;transition:.15s}
.addbtn:hover{border-color:var(--amber);color:var(--amber);border-style:solid}
.addbtn .p{font-size:16px;font-family:var(--body);line-height:0}
.none-note{font-size:12px;color:var(--ink-mute);font-style:italic;padding:2px 0}
.dossier-foot{padding:12px clamp(14px,3vw,22px);border-top:1px solid var(--line);display:flex;gap:10px;background:var(--panel)}
.dossier-foot .btn{flex:1;justify-content:center}

/* ---------- picker modal ---------- */
.picker{position:fixed;z-index:80;inset:0;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.2s}
.picker.show{opacity:1;pointer-events:auto}
.picker-panel{background:var(--ground);border:1px solid var(--line);border-radius:16px 16px 0 0;width:min(600px,100%);max-height:86vh;display:flex;flex-direction:column;transform:translateY(14px);transition:transform .24s cubic-bezier(.32,.72,0,1);box-shadow:var(--shadow)}
.picker.show .picker-panel{transform:none}
@media(min-width:640px){.picker{align-items:center}.picker-panel{border-radius:16px}}
.picker-head{padding:15px 18px 12px;border-bottom:1px solid var(--line)}
.picker-head .prow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.picker-head h3{font-size:18px}
.picker-head h3 .cnt{color:var(--ink-mute);font-family:var(--mono);font-size:13px;font-weight:400}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-mute)}
.search input{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px 10px 36px;color:var(--ink);font-size:15px}
.search input:focus{outline:none;border-color:var(--amber)}
.picker-list{overflow-y:auto;padding:10px 12px 16px;display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;transition:.13s;width:100%}
.opt:hover{border-color:var(--amber);background:var(--panel-2)}
.opt.picked{opacity:.5}
.opt .omain{flex:1;min-width:0}
.opt .oname{font-family:var(--disp);font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.opt .odesc{font-size:12.5px;color:var(--ink-dim);margin-top:4px;line-height:1.42}
.opt .ometa{margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--ink-mute)}
.opt .ocost{font-family:var(--mono);font-weight:700;font-size:14px;white-space:nowrap;align-self:center}
.ocost.pos{color:var(--teal)} .ocost.neg{color:var(--danger)} .ocost.cr{color:var(--amber)}
.picker-list .nomatch{text-align:center;color:var(--ink-mute);padding:30px;font-style:italic}

/* sheet / data modal */
.modal{position:fixed;z-index:80;inset:0;display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:.2s}
.modal.show{opacity:1;pointer-events:auto}
.modal-panel{background:var(--ground);border:1px solid var(--line);border-radius:14px;width:min(520px,100%);max-height:86vh;overflow-y:auto;box-shadow:var(--shadow);transform:scale(.97);transition:.2s}
.modal.show .modal-panel{transform:none}
.modal-panel .mp{padding:20px}
.modal-panel h3{font-size:19px;margin-bottom:6px}
.modal-panel p.lead{color:var(--ink-dim);font-size:13.5px;margin:0 0 14px}
.jsonbox{width:100%;height:180px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;color:var(--ink-dim);font-family:var(--mono);font-size:11px;padding:10px;resize:vertical}
.modal-actions{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
.wb-switch{display:flex;flex-direction:column;gap:7px;margin-bottom:8px}
.wb-item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.wb-item.active{border-color:var(--amber)}
.wb-item .wbi-main{flex:1;min-width:0;text-align:left}
.wb-item .wbi-name{font-family:var(--disp);font-weight:600;font-size:15px}
.wb-item .wbi-sub{font-family:var(--mono);font-size:11px;color:var(--ink-mute)}
.linkbtn{color:var(--ink-mute);font-family:var(--disp);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:4px 6px}
.linkbtn:hover{color:var(--amber)}
.linkbtn.del:hover{color:var(--danger)}



/* ---------- role chooser ---------- */
.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 6px}
@media(max-width:520px){.rolegrid{grid-template-columns:1fr}}
.rolecard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;display:flex;flex-direction:column;gap:6px;transition:.15s}
.rolecard:hover{border-color:var(--amber);transform:translateY(-2px);box-shadow:var(--shadow)}
.rolecard .rc-ico{font-size:24px;line-height:1}
.rolecard .rc-n{font-family:var(--disp);font-weight:600;font-size:16px}
.rolecard .rc-d{font-size:12.5px;color:var(--ink-dim);line-height:1.45}
.cb-role{margin-left:auto}
/* ---------- camp bar (top of the camp view) ---------- */
.campbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:11px 14px;margin-bottom:16px}
.cb-id{display:flex;flex-direction:column;gap:2px;min-width:0}
.cb-name{font-family:var(--disp);font-weight:600;font-size:16px;color:var(--ink);text-align:left;
  border-bottom:1px dashed var(--line);padding-bottom:1px}
.cb-name:hover{color:var(--amber);border-bottom-color:var(--amber)}
.cb-table{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.cb-ok{font-family:var(--disp);font-weight:600;font-size:12.5px;color:var(--teal)}
/* ---------- round cheat sheet (phone-first, opens beside the tracker) ---------- */
.cheatfab{position:fixed;right:14px;bottom:16px;z-index:74;width:52px;height:52px;border-radius:50%;
  border:1px solid var(--amber);background:var(--panel);color:var(--amber);font-size:22px;line-height:0;
  box-shadow:var(--shadow);display:grid;place-items:center}
.cheatfab:hover{background:var(--amber);color:#191308}
.cheat{position:fixed;z-index:76;top:0;right:0;height:100%;width:min(420px,100%);background:var(--ground);
  border-left:1px solid var(--line);box-shadow:-24px 0 60px -30px rgba(0,0,0,.8);
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .24s cubic-bezier(.32,.72,0,1)}
.cheat.show{transform:none}
.cheat-head{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:10px}
.cheat-head h3{font-size:16px;flex:1}
.cheat-body{flex:1;overflow-y:auto;padding:10px 14px 30px;-webkit-overflow-scrolling:touch}
.cheat-roll{font-size:12.5px;color:var(--ink-dim);background:var(--sunk);border:1px solid var(--line);
  border-radius:8px;padding:9px 11px;margin-bottom:12px;line-height:1.5}
.cheat-roll b{color:var(--amber)}
.cheat-sec{border-bottom:1px solid var(--line-soft)}
.cheat-q{width:100%;text-align:left;display:flex;align-items:center;gap:9px;padding:12px 2px;
  font-family:var(--disp);font-weight:600;font-size:14px;color:var(--ink)}
.cheat-q .cq-ico{color:var(--amber);font-size:13px;width:16px;flex:none}
.cheat-q .cq-arrow{margin-left:auto;color:var(--ink-mute);font-size:12px;transition:transform .18s}
.cheat-sec.open .cheat-q .cq-arrow{transform:rotate(90deg)}
.cheat-a{padding:0 2px 14px;display:none}
.cheat-sec.open .cheat-a{display:block}
.cheat-item{margin-bottom:13px}
.cheat-item:last-child{margin-bottom:0}
.cheat-item .ci-n{font-family:var(--disp);font-weight:600;font-size:13.5px;color:var(--ink);margin-bottom:3px}
.cheat-item .ci-d{font-size:12.5px;color:var(--ink-dim);line-height:1.5}
.cheat-item ol,.cheat-item ul{margin:5px 0 0;padding-left:18px}
.cheat-item li{font-size:12.5px;color:var(--ink-dim);line-height:1.5;margin-bottom:3px}
.cheat-item .ci-mod{font-family:var(--mono);font-size:12px;color:var(--warn)}
@media(max-width:600px){.cheatfab{right:12px;bottom:12px}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel);border:1px solid var(--amber);color:var(--ink);padding:11px 18px;border-radius:9px;font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.03em;z-index:95;opacity:0;transition:.25s;box-shadow:var(--shadow);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- tabletop character card ---------- */
.cardwrap{position:fixed;inset:0;z-index:70;background:rgba(6,7,10,.66);backdrop-filter:blur(4px);display:grid;place-items:start center;overflow-y:auto;padding:clamp(12px,4vw,44px) 14px;opacity:0;pointer-events:none;transition:.2s}
.cardwrap.show{opacity:1;pointer-events:auto}
.gamecard{width:min(780px,100%);background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;position:relative;transform:translateY(10px) scale(.99);transition:.24s}
.gc-layout{display:grid;grid-template-columns:250px 1fr}
.gc-body{min-width:0}
.gc-portrait{position:relative;background:var(--sunk);border-right:1px solid var(--line);overflow:hidden;min-height:300px}
.gc-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.gc-img.editing{cursor:grab;touch-action:none;user-select:none;-webkit-user-drag:none}
.gc-img.editing:active{cursor:grabbing}
.gc-pos-hint{position:absolute;top:8px;left:8px;right:8px;text-align:center;font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.6);padding:6px;border-radius:6px;pointer-events:none;z-index:4}
.gc-portrait-ctrls.always{opacity:1}
.gc-portrait-ctrls{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent);opacity:0;transition:.15s;z-index:3}
.gc-portrait:hover .gc-portrait-ctrls,.gc-portrait:focus-within .gc-portrait-ctrls{opacity:1}
.gc-portrait-ctrls button{flex:1;font-family:var(--disp);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:6px;border-radius:5px;background:rgba(16,18,23,.85);border:1px solid var(--line);color:var(--ink)}
.gc-portrait-ctrls button:hover{border-color:var(--amber);color:var(--amber)}
.gc-drop{position:absolute;inset:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border:1.5px dashed var(--line);border-radius:10px;color:var(--ink-mute);text-align:center;padding:10px;transition:.15s}
.gc-drop:hover,.gc-drop.drag{border-color:var(--amber);color:var(--amber);background:var(--amber-glow)}
.gc-drop svg{width:26px;height:26px}
.gc-drop span{font-family:var(--disp);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.gc-drop small{font-size:10.5px;line-height:1.35}
@media(max-width:600px){
  .gc-layout{grid-template-columns:1fr}
  .gc-portrait{border-right:none;border-bottom:1px solid var(--line);min-height:0;height:240px}
}
.card-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--line);flex:none}
.cardwrap.show .gamecard{transform:none}
.gamecard::before{content:"";position:absolute;inset:5px;pointer-events:none;border-radius:12px;border:1px solid color-mix(in srgb,var(--amber) 22%, transparent);z-index:2}
.gc-top{display:flex;gap:14px;align-items:flex-start;padding:18px 18px 15px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--amber-glow),transparent)}
.gc-cost{flex:none;width:58px;height:58px;border:1.5px solid var(--amber);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:21px;color:var(--amber);line-height:1;background:var(--sunk)}
.gc-cost small{font-family:var(--disp);font-size:8px;letter-spacing:.14em;color:var(--ink-mute);margin-top:3px}
.gc-id{min-width:0;flex:1}
.gc-id .eyebrow{color:var(--amber)}
.gc-name{font-size:clamp(21px,5vw,27px);line-height:1.06;margin:5px 0 3px;letter-spacing:.01em}
.gc-role{font-size:13px;color:var(--ink-dim);font-family:var(--disp);font-weight:500}
.gc-bg{margin:0;padding:12px 18px;font-size:13px;color:var(--ink-dim);font-style:italic;line-height:1.5;border-bottom:1px solid var(--line-soft)}
.gc-stats{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
.gc-stat{padding:13px 4px 11px;text-align:center;border-right:1px solid var(--line-soft)}
.gc-stat:last-child{border-right:none}
.gc-stat b{display:block;font-family:var(--mono);font-weight:700;font-size:23px;line-height:1;color:var(--ink)}
.gc-stat span{display:block;font-family:var(--disp);font-size:9px;letter-spacing:.06em;color:var(--amber);margin-top:5px;text-transform:uppercase;font-weight:600}
.gc-stat small{display:block;font-size:8px;color:var(--ink-mute);margin-top:2px}
.gc-stat[data-tip]{cursor:help}
.gc-stat[data-tip]:hover,.gc-stat[data-tip]:focus{background:var(--amber-glow);outline:none}
.gc-vitals{display:flex;justify-content:center;gap:26px;padding:11px;font-family:var(--mono);font-size:13px;color:var(--ink-dim);border-bottom:1px solid var(--line);background:var(--sunk)}
.gc-vitals span[data-tip]{cursor:help;padding:2px 6px;border-radius:5px}
.gc-vitals span[data-tip]:hover,.gc-vitals span[data-tip]:focus{background:var(--amber-glow);outline:none}
.steprow .lbl[data-tip]{cursor:help}
.steprow .lbl[data-tip] b{border-bottom:1px dotted var(--ink-mute)}
.gc-vitals b{color:var(--teal);font-weight:700}
.gc-sections{padding:4px 18px 12px}
.gc-sec{padding:13px 0;border-bottom:1px solid var(--line-soft)}
.gc-sec:last-child{border-bottom:none}
.gc-sec .sh{font-family:var(--disp);text-transform:uppercase;letter-spacing:.13em;font-size:10px;font-weight:600;color:var(--amber);margin-bottom:10px;display:flex;align-items:center;gap:9px}
.gc-sec .sh::after{content:"";height:1px;background:var(--line-soft);flex:1}
.gc-entry{margin-bottom:10px}.gc-entry:last-child{margin-bottom:0}
.gc-entry .en{font-family:var(--disp);font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.gc-entry .en .ev{font-family:var(--mono);font-size:11.5px;color:var(--ink-mute);font-weight:400;white-space:nowrap}
.gc-entry .ed{font-size:12.5px;color:var(--ink-dim);line-height:1.42;margin-top:2px}
.gc-empty{font-size:12.5px;color:var(--ink-mute);font-style:italic}
/* arcana spellbook */
.gc-sec .sh.arc{color:var(--arcane)}
.gc-spellnote{font-size:12.5px;color:var(--ink-dim);line-height:1.5;margin-bottom:11px}
.spellgrid{display:flex;flex-wrap:wrap;gap:6px}
.spell{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.02em;padding:5px 11px;border-radius:16px;border:1px solid color-mix(in srgb,var(--arcane) 45%,var(--line));color:var(--arcane);background:color-mix(in srgb,var(--arcane) 12%,transparent);cursor:help;transition:.13s}
.spell:hover,.spell:focus{border-color:var(--arcane);outline:none;background:color-mix(in srgb,var(--arcane) 22%,transparent)}
.spell.rolled{font-weight:700;background:color-mix(in srgb,var(--arcane) 30%,transparent);border-color:var(--arcane);box-shadow:0 0 12px -2px var(--arcane)}
.spellgrid.hasroll .spell:not(.rolled){opacity:.38}
.spellgrid.hasroll .spell:not(.rolled):hover,.spellgrid.hasroll .spell:not(.rolled):focus{opacity:1}
.rollrow{display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.rollbtn{display:inline-flex;align-items:center;gap:7px;font-family:var(--disp);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--arcane);color:var(--arcane);background:color-mix(in srgb,var(--arcane) 10%,transparent);transition:.14s}
.rollbtn:hover{background:color-mix(in srgb,var(--arcane) 22%,transparent)}
/* tooltip */
.tooltip-pop{position:fixed;z-index:120;max-width:290px;background:var(--panel-2);color:var(--ink);border:1px solid var(--amber);border-radius:8px;padding:9px 11px;font-size:12.5px;line-height:1.46;box-shadow:var(--shadow);display:none;pointer-events:none;font-family:var(--body)}
.gc-actions{display:flex;gap:9px;padding:14px 18px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.gc-actions .btn{flex:1;justify-content:center;min-width:110px}

/* ---------- art prompt ---------- */
.chips-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.stylechip{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.03em;padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-dim);transition:.14s}
.stylechip:hover{border-color:var(--amber);color:var(--amber)}
.stylechip.on{background:var(--amber);color:#191308;border-color:var(--amber)}
.promptbox{width:100%;height:172px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--body);font-size:13.5px;line-height:1.5;padding:12px;resize:vertical}
.promptbox:focus{outline:none;border-color:var(--amber)}
.neg-line{margin-top:12px;font-size:12px;color:var(--ink-mute);line-height:1.5}
.neg-line b{color:var(--ink-dim);font-family:var(--disp);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:10px}
.neg-line code{font-family:var(--mono);font-size:11px;color:var(--ink-dim)}
.tiplink{color:var(--amber);font-family:var(--disp);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
/* ---------- AI name generator ---------- */
.name-row{display:flex;gap:8px}
.name-row .input{flex:1;min-width:0}
.genbtn{flex:none;width:46px;border:1px solid var(--amber);border-radius:var(--r-sm);background:var(--amber-glow);color:var(--amber);font-size:18px;line-height:0;display:grid;place-items:center;transition:.14s}
.genbtn:hover:not(:disabled){background:var(--amber);color:#191308}
.genbtn:disabled{opacity:.5;cursor:wait}
.ng-result{display:flex;flex-direction:column;gap:6px;margin:2px 0}
.ng-opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;transition:.13s}
.ng-opt:hover{border-color:var(--amber);background:var(--panel-2)}
.ng-nm{font-family:var(--disp);font-weight:600;font-size:15px;color:var(--ink)}
.ng-note-tag{font-size:11px;color:var(--ink-mute);font-style:italic;text-align:right;flex:none}
.ng-note{font-size:12.5px;color:var(--ink-mute);padding:9px 2px;font-style:italic;line-height:1.5}
.ng-note.spin{color:var(--amber)}
.ng-result{gap:9px}
.ng-cand{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;display:flex;flex-direction:column;gap:8px}
.ng-cand .ch{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ng-cand .cn{font-family:var(--disp);font-weight:600;font-size:16px;color:var(--ink);line-height:1.2}
.ng-cand .ct{font-size:11px;color:var(--ink-mute);font-style:italic;text-align:right;flex:none}
.ng-cand .cs{font-size:13px;color:var(--ink-dim);line-height:1.5}
.ng-cand .ca{display:flex;gap:8px;flex-wrap:wrap}
.ng-cand .ca .btn{padding:6px 12px}
/* ---------- confirm dialog ---------- */
.confirm{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:rgba(6,7,10,.62);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.18s}
.confirm.show{opacity:1;pointer-events:auto}
.confirm-panel{background:var(--ground);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(400px,100%);padding:22px;transform:scale(.97);transition:.18s}
.confirm.show .confirm-panel{transform:none}
.confirm-panel p{margin:0 0 18px;font-size:15px;color:var(--ink);line-height:1.5}
.confirm-actions{display:flex;gap:10px;justify-content:flex-end}
.confirm-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.confirm-danger:hover{filter:brightness(1.08);border-color:var(--danger);color:#fff}
/* ---------- top nav (Warband / Scenarios) ---------- */
.topnav{display:flex;gap:4px;margin-top:14px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:4px;width:fit-content}
.topnav-btn{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;padding:8px 18px;border-radius:7px;color:var(--ink-dim);display:inline-flex;align-items:center;gap:7px;transition:.14s}
.topnav-btn svg{width:15px;height:15px}
.topnav-btn:hover{color:var(--ink)}
.topnav-btn.active{background:var(--amber);color:#191308}
/* ---------- scenarios ---------- */
.live-panel{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 15px;margin-bottom:16px}
.live-panel .lp-main b{font-family:var(--disp)}
.live-panel-gate{border-color:color-mix(in srgb,var(--amber) 45%,var(--line));background:var(--amber-glow)}
.lp-tablebadge{font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.03em;color:var(--teal);margin-top:4px;display:flex;align-items:center;gap:8px}
.lp-tablebadge .linkbtn{font-weight:500;font-size:12px}
.live-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.03em;padding:6px 12px;border-radius:20px;margin:2px 0 12px}
.live-badge.host{color:var(--teal);border:1px solid color-mix(in srgb,var(--teal) 45%,var(--line));background:color-mix(in srgb,var(--teal) 10%,transparent)}
.live-badge.guest{color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 45%,var(--line));background:var(--amber-glow)}
.live-badge b{font-family:var(--mono);letter-spacing:.15em}
.guest-wb{font-size:13px;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:0 0 12px}
.guest-wb b{color:var(--amber)}
.btl-owner{font-family:var(--disp);font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:1px 7px;margin-left:8px}
.scn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.scn-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:.16s;position:relative}
.scn-card:hover{border-color:var(--amber);transform:translateY(-2px);box-shadow:var(--shadow)}
.scn-card .scn-mini{height:120px;background:var(--sunk);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.scn-card .scn-cbody{padding:13px 15px 15px;display:flex;flex-direction:column;gap:6px}
.scn-card .scn-mode{font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.scn-card .scn-mode.coop{color:var(--teal)} .scn-card .scn-mode.pvp{color:var(--amber)}
.scn-card .scn-title{font-family:var(--disp);font-weight:600;font-size:17px;line-height:1.15}
.scn-card .scn-sub{font-size:12.5px;color:var(--ink-dim);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scn-card .scn-meta{font-family:var(--mono);font-size:11px;color:var(--ink-mute);margin-top:2px}
.scn-card.add{align-items:center;justify-content:center;text-align:center;border-style:dashed;color:var(--ink-mute);min-height:210px;gap:9px;background:transparent}
.scn-card.add:hover{color:var(--amber);border-color:var(--amber)}
.scn-card.add .plus{width:36px;height:36px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:23px;font-family:var(--body);line-height:0}
.scn-card.add span{font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:600}
/* scenario detail */
.scn-detail{max-width:900px;margin:0 auto}
.scn-back{display:inline-flex;align-items:center;gap:7px;font-family:var(--disp);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);margin-bottom:14px}
.scn-back:hover{color:var(--amber)}
.scn-detail h2{font-size:clamp(22px,4vw,30px);line-height:1.1;margin:2px 0 4px}
.scn-detail .scn-dmode{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
.scn-premise{font-size:15px;color:var(--ink-dim);line-height:1.55;margin:0 0 18px;max-width:65ch}
.scn-cols{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:start}
@media(max-width:720px){.scn-cols{grid-template-columns:1fr}}
.scn-block{margin-bottom:18px}
.scn-block .bh{font-family:var(--disp);text-transform:uppercase;letter-spacing:.13em;font-size:11px;font-weight:600;color:var(--amber);margin-bottom:8px;display:flex;align-items:center;gap:9px}
.scn-block .bh::after{content:"";height:1px;background:var(--line-soft);flex:1}
.scn-block p{margin:0 0 8px;font-size:14px;line-height:1.55;color:var(--ink)}
.scn-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
.scn-list li{position:relative;padding-left:20px;font-size:14px;line-height:1.5;color:var(--ink)}
.scn-list li::before{content:"›";position:absolute;left:4px;color:var(--amber);font-weight:700}
.enemy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.enemy-card{text-align:left;background:var(--panel);border:1px solid color-mix(in srgb,var(--danger) 30%,var(--line));border-radius:var(--r-sm);padding:10px 11px;display:flex;flex-direction:column;gap:5px;transition:.14s}
.enemy-card:hover{border-color:var(--danger);transform:translateY(-2px);box-shadow:var(--shadow)}
.enemy-card .ec-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.enemy-card .ec-name{font-family:var(--disp);font-weight:600;font-size:14px;line-height:1.15}
.enemy-card .ec-cost{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--danger);white-space:nowrap}
.enemy-card .ec-role{font-size:11.5px;color:var(--ink-mute);min-height:1em}
.enemy-card .ec-squad{color:var(--teal);font-family:var(--mono);font-weight:700}
.enemy-card .ec-stats{display:flex;flex-wrap:wrap;gap:7px;font-family:var(--mono);font-size:11px;color:var(--ink-dim);border-top:1px solid var(--line-soft);padding-top:6px}
.enemy-card .ec-stats b{color:var(--ink);font-size:13px}
.enemy-card .ec-stats .hp b{color:var(--teal)}
.scn-prep{background:var(--amber-glow);border:1px solid color-mix(in srgb,var(--amber) 40%,var(--line));border-radius:var(--r);padding:14px 16px;margin-bottom:20px}
.scn-prep .bh{color:var(--amber)}
.scn-prep .bh::after{background:color-mix(in srgb,var(--amber) 35%,transparent)}
.prep-sec{margin-top:11px}
.prep-h{font-family:var(--disp);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-dim);margin-bottom:5px}
.secret-li::before{content:"🔒"!important;color:var(--ink-mute)!important}
.redacted{color:var(--ink-mute);font-style:italic}
.reveal-btn{font-family:var(--disp);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 45%,var(--line));border-radius:12px;padding:2px 8px;margin-left:6px;background:var(--amber-glow)}
.reveal-btn:hover{background:var(--amber);color:#191308}
.evt.secret{border-style:dashed}
.evt.secret .evt-t{color:var(--ink-mute)}
.scn-facts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.scn-fact{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-family:var(--mono);font-size:12px}
.scn-fact b{color:var(--amber)}
/* battlefield map */
.scn-map-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.scn-briefing{border-left:3px solid var(--amber);padding:6px 0 6px 16px;margin:2px 0 18px;font-size:15px;line-height:1.7;color:var(--ink);font-style:italic;max-width:64ch;background:linear-gradient(90deg,var(--amber-glow),transparent)}
.scn-tracker,.scn-collect{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px}
.scn-tracker .mh,.scn-collect .mh{font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:600;color:var(--ink-mute);margin-bottom:10px}
.round-row{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:6px 8px}
.round-cur{font-family:var(--disp);font-size:14px;color:var(--ink-dim);letter-spacing:.02em}
.round-cur b{font-family:var(--mono);font-size:22px;color:var(--amber);margin:0 3px}
.round-cur span{color:var(--ink-mute);font-family:var(--mono)}
.rbtn{width:40px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:20px;line-height:0;font-family:var(--body);flex:none}
.rbtn:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
.rbtn:disabled{opacity:.35;cursor:not-allowed}
.round-actions{display:flex;justify-content:space-between;margin-top:9px}
.evt-list{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.evt{display:flex;gap:9px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 10px;transition:.15s}
.evt.now{border-color:var(--amber);background:var(--amber-glow)}
.evt.past{opacity:.5}
.evt-r{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--ink-mute);flex:none;padding-top:1px}
.evt.now .evt-r{color:var(--amber)}
.evt-body{min-width:0}
.evt-t{font-family:var(--disp);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.evt-fire{font-family:var(--mono);font-size:10px;color:var(--amber);letter-spacing:.05em}
.evt-x{font-size:12.5px;color:var(--ink-dim);line-height:1.45;margin-top:3px}
.scn-lenrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:12px}
.scn-lenrow b{color:var(--amber);font-size:14px}
.tk-sec{margin-top:14px}
.tk-h{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:10px;font-weight:600;color:var(--ink-mute);margin-bottom:8px}
.deadline{display:flex;gap:9px;background:var(--sunk);border:1px solid color-mix(in srgb,var(--amber) 30%,var(--line));border-radius:8px;padding:9px 10px;margin-bottom:7px}
.deadline.now{border-color:var(--amber);background:var(--amber-glow)}
.deadline.past{opacity:.5}
.dl-r{font-family:var(--mono);font-weight:700;font-size:11px;color:var(--amber);flex:none;white-space:nowrap;padding-top:1px}
.dl-b{min-width:0}.dl-b b{font-family:var(--disp);font-size:13.5px}
.dl-x{font-size:12.5px;color:var(--ink-dim);line-height:1.45;margin-top:2px}
.turn-evt{border-left:3px solid var(--amber);padding:8px 0 8px 14px;margin-bottom:12px}
.turn-evt.deadline{border-left-color:var(--warn)}
.te-h{font-family:var(--disp);font-weight:600;font-size:15px;color:var(--ink)}
.te-x{font-size:14px;color:var(--ink-dim);line-height:1.55;margin-top:4px}
.scn-battle{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px}
.scn-battle .mh{font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:600;color:var(--ink-mute);margin-bottom:10px}
.btl-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.btl-row:last-of-type{border-bottom:none}
.btl-row.down{opacity:.45}
.btl-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.btl-side{display:none}
.btl-name{font-family:var(--disp);font-weight:600;font-size:13.5px}
.btl-row.enemy .btl-name{color:var(--danger)}
.btl-row.player .btl-name{color:var(--teal)}
.btl-conds{display:flex;flex-wrap:wrap;gap:5px}
.cond{font-family:var(--mono);font-size:10.5px;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));border-radius:12px;padding:1px 4px 1px 7px;display:inline-flex;align-items:center;gap:3px}
.cond small{color:var(--ink-mute)}
.cond button{color:var(--ink-mute);font-size:12px;line-height:0;padding:2px}
.cond button:hover{color:var(--danger)}
.btl-hp{display:flex;align-items:center;gap:2px;flex:none}
.hpb{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-dim);font-size:16px;line-height:0;font-family:var(--body)}
.hpb:hover{border-color:var(--amber);color:var(--amber)}
.hpv{min-width:56px;text-align:center;font-family:var(--mono);font-weight:700;font-size:13px}
.hpv.low{color:var(--warn)} .hpv.down{color:var(--danger)}
.eff-line{margin:8px 0 4px}
.eff-badge{font-family:var(--disp);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 45%,var(--line));border-radius:14px;padding:3px 10px;background:var(--danger-bg)}
.tgt-grid{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tgt-chip{font-family:var(--disp);font-weight:600;font-size:12px;padding:5px 10px;border-radius:16px;border:1px solid var(--line);color:var(--ink-dim);background:var(--panel-2)}
.tgt-chip.down{opacity:.45}
.tgt-chip.on{background:var(--amber);color:#191308;border-color:var(--amber)}
.eff-results{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.eff-r{font-family:var(--mono);font-size:12px;color:var(--danger)}
.eff-r.neg{color:var(--teal)}
.pick-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.pick-row:last-child{border-bottom:none}
.pick-row.open{align-items:flex-start;flex-direction:column;gap:8px}
.pick-main{font-size:13.5px;color:var(--ink)}
.pick-main b{font-family:var(--disp)}
.pick-note{color:var(--ink-mute);font-size:12.5px}
.pick-held{font-family:var(--mono);font-size:12px;color:var(--teal);display:flex;align-items:center;gap:8px}
.pick-choose{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pick-lbl{font-size:11.5px;color:var(--ink-mute);margin-right:2px}
.pick-chip{font-family:var(--disp);font-weight:600;font-size:12px;padding:5px 10px;border-radius:16px;border:1px solid var(--amber);color:var(--amber);background:var(--amber-glow)}
.pick-chip:hover{background:var(--amber);color:#191308}
.pickup-eff{font-size:12.5px;color:var(--arcane);font-style:italic;line-height:1.5;background:color-mix(in srgb,var(--arcane) 9%,transparent);border-radius:6px;padding:8px 10px}
.eff-changes{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 14px}
.eff-chip{font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:16px;border:1px solid color-mix(in srgb,var(--arcane) 45%,var(--line));color:var(--arcane);background:color-mix(in srgb,var(--arcane) 10%,transparent)}
.scn-map-wrap .mh{font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:600;color:var(--ink-mute);margin-bottom:10px}
.scn-map{width:100%;aspect-ratio:1/1;background:var(--sunk);border:1px solid var(--line);border-radius:8px;display:block}
.scn-mini .scn-map{aspect-ratio:auto;height:100%;border:none;border-radius:0;background:var(--sunk)}
.scn-map .grid{stroke:var(--line-soft);stroke-width:.3}
.scn-map text{font-family:var(--body)}
.scn-map .zlabel{font-family:var(--disp);font-weight:600}
.scn-map .flabel{fill:var(--ink-dim)}
.scn-map .obj{fill:var(--amber);stroke:rgba(0,0,0,.45);stroke-width:.4}
.scn-map .haz{fill:var(--danger);opacity:.9}
.scn-map .terr{fill:#6b7280;opacity:.7}
.scn-map-wrap .scn-map{cursor:zoom-in}
.scn-mapnote{font-size:11.5px;color:var(--ink-mute);margin-top:9px;line-height:1.45}
.maplb{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(6,7,10,.82);backdrop-filter:blur(5px);padding:16px;opacity:0;pointer-events:none;transition:.2s}
.maplb.show{opacity:1;pointer-events:auto}
.maplb .mlb-inner{position:relative;width:min(94vw,90vh,820px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.maplb .scn-map{width:100%;aspect-ratio:1/1;background:var(--sunk)}
.maplb .mlb-close{position:absolute;top:-14px;right:-14px;background:var(--panel);z-index:2}
.maplb .mlb-cap{font-size:12px;color:var(--ink-mute);margin-top:10px;text-align:center;line-height:1.4}
.scn-maplegend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11px;color:var(--ink-dim)}
.scn-maplegend span{display:inline-flex;align-items:center;gap:5px}
.scn-maplegend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.scn-map .mapnum{cursor:pointer}
.scn-map .mapnum:hover circle,.scn-map .mapnum:active circle{stroke-width:1}
.scn-maplegend-nums{display:flex;flex-direction:column;gap:5px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft)}
.maplg-row{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--ink-dim);border-radius:6px;padding:2px 4px;transition:background .3s}
.maplg-row.flash{background:var(--amber-glow)}
.maplg-num{flex:none;width:18px;height:18px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);font-family:var(--mono);font-size:10.5px;font-weight:700;display:grid;place-items:center}
.maplg-label{color:var(--ink)}
.mapref{display:inline-flex;gap:3px;vertical-align:baseline;margin-right:6px}
.mapref-n{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--amber-glow);border:1px solid color-mix(in srgb,var(--amber) 55%,var(--line));color:var(--amber);font-family:var(--mono);font-size:10px;font-weight:700}
.role-chip{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:9px;font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);color:var(--ink-dim);background:var(--panel-2);white-space:nowrap}
.role-chip.r-cover{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 45%,var(--line))}
.role-chip.g-even{color:var(--ink-mute);border-style:dashed}
.role-chip.g-rough{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,var(--line));border-style:dashed}
.role-chip.g-haz{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 55%,var(--line));border-style:dashed}
.role-chip.g-imp{color:var(--ink-dim);border-color:var(--line);border-style:dashed;text-decoration:line-through}
.role-chip.r-cache{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 55%,var(--line));background:var(--amber-glow)}
.role-chip.r-inter{color:var(--arcane);border-color:color-mix(in srgb,var(--arcane) 45%,var(--line))}
.role-chip.r-obj{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,var(--line))}
.role-chip.r-haz{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.role-chip.r-spawn{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.role-chip.r-deco{color:var(--ink-mute)}
.role-chip.r-track{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 40%,var(--line));text-transform:none;letter-spacing:0;font-weight:500}
.prep-when,.pick-when{font-size:11.5px;color:var(--ink-dim);margin-top:3px;line-height:1.4;font-style:italic}
.cache-block{border:1px solid color-mix(in srgb,var(--amber) 35%,var(--line));background:var(--amber-glow);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:12px}
.cache-row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:5px 0;flex-wrap:wrap}
.cache-row+.cache-row{border-top:1px solid var(--line-soft)}
.cache-main{min-width:0}
.pick-row.dim{opacity:.62}
.cache-stash{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.dep-h{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;font-weight:600;color:var(--ink-dim);margin:12px 0 7px}
.dep-note{font-size:12px;color:var(--ink-dim);margin-top:5px;line-height:1.45}
.dep-note b{color:var(--ink)}
.gap-box{margin-top:10px;padding:9px 12px;border:1px dashed color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn) 8%,transparent);border-radius:var(--r-sm)}
.gap-box .prep-h{color:var(--warn)}
.gap-box .scn-list li{font-size:12.5px}
.save-warn{position:fixed;left:12px;right:12px;bottom:12px;z-index:200;background:var(--danger-bg);border:1px solid var(--danger);color:var(--ink);border-radius:var(--r);padding:11px 14px;font-size:13px;line-height:1.5;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.save-warn b{color:var(--danger)}
.save-warn .btn{margin-left:auto}
.camp-box{border:1px solid color-mix(in srgb,var(--teal) 40%,var(--line));background:color-mix(in srgb,var(--teal) 7%,transparent);border-radius:var(--r-sm);padding:11px 13px}
.chip.hp.hurt{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.chip.hp.down{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 55%,var(--line));font-weight:700}
.chip.scar{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.enemy-card.sealed{border-style:dashed;border-color:color-mix(in srgb,var(--danger) 45%,var(--line));background:var(--danger-bg);cursor:pointer;opacity:.9}
.enemy-card.sealed .ec-name{color:var(--danger)}
.enemy-card.sealed .ec-role{font-style:italic;color:var(--ink-dim)}
.enemy-card.teased{border-style:dashed;border-color:color-mix(in srgb,var(--warn) 50%,var(--line));background:color-mix(in srgb,var(--warn) 9%,transparent);cursor:pointer}
.enemy-card.teased .ec-name{color:var(--warn)}
.enemy-card.teased .ec-cost{color:var(--warn)}
.enemy-card.teased .ec-role{font-style:italic;color:var(--ink-dim)}
.omen-box{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.omen{font-style:italic;color:var(--ink-dim);font-size:13px;line-height:1.55;margin-bottom:5px}
.earn-row{border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;margin-bottom:11px;background:var(--panel-2)}
.earn-row .prep-h{color:var(--amber);margin-bottom:7px}
.chip.rank{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 45%,var(--line));font-family:var(--disp);font-weight:600}
.chip.xp{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,var(--line))}
.rank-badge{font-family:var(--disp);font-size:15px;color:var(--teal);letter-spacing:.02em}
.xp-award{display:block;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;margin-bottom:7px;cursor:pointer;background:var(--panel-2)}
.xp-award:hover{border-color:var(--amber)}
.xp-val{color:var(--amber);font-weight:700;float:right}
.xp-total{font-family:var(--disp);font-weight:600;color:var(--amber);text-align:right;margin:6px 2px 2px}
.xp-bar{display:flex;align-items:center;gap:9px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;font-size:13px}
.xp-bar b{font-size:17px;color:var(--amber)}
.xp-bar b.spent{color:var(--ink-mute)}
.cp-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}
.cp-grid label{font-size:12px;color:var(--ink-dim);display:flex;flex-direction:column;gap:4px}
.cp-grid .input{padding:6px 9px}
.stylechip.unaffordable{opacity:.4;cursor:not-allowed}
.stylechip .short{margin-left:6px;font-family:var(--mono);font-size:9.5px;color:var(--danger);opacity:.85}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid var(--ground)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-mute)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:680px){
  .manifest{grid-template-columns:1fr}
  .gauge{min-width:0}
}
@media(max-width:520px){
  .dossier-head .dcost{font-size:16px}
}

async function hashKey(s){ const norm=String(s||"").trim().toLowerCase().replace(/\s+/g," "); const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("p28-room|"+norm)); return [...new Uint8Array(buf)].slice(0,10).map(b=>b.toString(16).padStart(2,"0")).join(""); }

// Adapter exposing the same .doc/.collection interface the app uses, backed by Firebase RTDB.
function fbDb(root){
  const base=firebase.database();
  const clean=o=>JSON.parse(JSON.stringify(o==null?null:o));   // strips undefined (RTDB rejects it)
  function docRef(path){
    const ref=base.ref(root+"/"+path);
    return {
      set(o){ return ref.set(clean(o)); },
      update(o){ return ref.update(clean(o)); },
      delete(){ return ref.remove(); },
      async get(){ const s=await ref.once("value"); const v=s.val(); return { exists:v!=null, data:()=>v||{} }; },
      onSnapshot(next,err){ const h=ref.on("value",s=>{const v=s.val();next({exists:v!=null,data:()=>v||{}});},err||function(){}); return ()=>ref.off("value",h); },
      collection(sub){ return collRef(path+"/"+sub); }
    };
  }
  function collRef(path){
    const ref=base.ref(root+"/"+path);
    return {
      doc(id){ return docRef(path+"/"+id); },
      async get(){ const s=await ref.once("value"); const v=s.val()||{}; return {docs:Object.keys(v).map(k=>({id:k,data:()=>v[k]||{}}))}; },
      onSnapshot(next,err){ const h=ref.on("value",s=>{const v=s.val()||{};const docs=Object.keys(v).map(k=>({id:k,data:()=>v[k]||{}}));next({docs});},err||function(){}); return ()=>ref.off("value",h); }
    };
  }
  return { doc:docRef, collection:collRef };
}

/* ---- cost maths ---- */
function skillPts(c){return SKILLS.reduce((s,[k])=>s+(c.skills[k]-1)*RULES.skillStep,0)}
function hpPts(c){return ((c.hp-RULES.hpStart)/RULES.hpStep)*RULES.hpPts}
function listPts(ids,cat){return ids.reduce((s,id)=>s+(CAT[cat][id]?CAT[cat][id].cost:0),0)}
function gearPts(entries,cat){return entries.reduce((s,e)=>s+(CAT[cat][e.id]?CAT[cat][e.id].cost*e.qty:0),0)}
function charCost(c){
  return RULES.baseCost + skillPts(c) + hpPts(c)
       + listPts(c.traits,"trait") + listPts(c.abilities,"ability")
       + gearPts(c.weapons,"weapon") + gearPts(c.armour,"armour") + gearPts(c.items,"item");
}
function isFielded(c){return c.fielded!==false}
function memberCount(c){return Math.max(1,c.count||1)}
function unitCost(c){return charCost(c)*memberCount(c)}   // squad = profile cost × members
/* vehicle cost maths */
function vSkillPts(v){return (v.skills.A-VRULES.aStart)*VRULES.skillStep+(v.skills.S-VRULES.sStart)*VRULES.skillStep}
function vehicleHP(v){return VRULES.coreHP+(v.sections||[]).reduce((s,e)=>s+(CAT.vsection[e.id]?CAT.vsection[e.id].hp*e.qty:0),0)}
function vehicleCost(v){
  return VRULES.baseCost + vSkillPts(v) + (VEHICLE_TYPES[v.type]?VEHICLE_TYPES[v.type][1]:0)
       + gearPts(v.sections||[],"vsection") + listPts(v.traits||[],"vtrait")
       + listPts(v.abilities||[],"vability") + gearPts(v.weapons||[],"vweapon");
}
