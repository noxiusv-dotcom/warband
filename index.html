  {roll:3,name:"Shaken",note:"Their brush with death has left them traumatised.",permanent:true,heals:true,effectNote:"-1 (P) when making break tests, in all future games.",skills:{},hp:0,addTraits:[],miss:0,games:0,breakP:-1},
  {roll:4,name:"Life long wounds",note:"They will never fully recover from this.",permanent:true,heals:true,effectNote:"Hit-points permanently reduced by 25%.",skills:{},hp:0,addTraits:[],miss:0,games:0,hpPct:-25},
  {roll:5,name:"Shattered hand",note:"They narrowly avoided losing the limb.",permanent:false,heals:true,effectNote:"May only use a single one-handed weapon.",skills:{},hp:0,addTraits:[],miss:0,games:"1D4"},
  {roll:6,name:"Crushed leg",note:"They limp onto the battlefield, the bones barely set.",permanent:true,heals:true,effectNote:"-1D4 Agility while it mends, and a permanent -3cm speed.",skills:{},hp:0,addTraits:[],miss:0,games:"1D4",agility:"1D4",speed:-3},
  {roll:7,name:"Brain damage",note:"A vicious scar runs the length of their skull — a miracle they're alive.",permanent:true,heals:true,effectNote:"Permanent -2 to (AW) and (P).",skills:{AW:-2,P:-2},hp:0,addTraits:[],miss:0,games:0},
  {roll:8,name:"Death",note:"They're dead, just dead. Divide their possessions amongst the warband and find a replacement.",permanent:true,heals:false,dead:true,effectNote:"",skills:{},hp:0,addTraits:[],miss:0,games:0}
];
const d=(n)=>1+Math.floor(Math.random()*n);
function rollDuration(v){return typeof v==="string"&&/^1D(\d+)$/i.test(v)?d(parseInt(v.slice(2),10)):(+v||0);}
function injuryTraitsForAI(){
  return Object.values(CAT.trait).filter(t=>t.cost<0).map(t=>t.name+" ("+t.cost+")").join(", ");
}
function coerceInjury(x){
  if(!x||typeof x!=="object")return null;
  const n=String(x.name||"").slice(0,50); if(!n)return null;
  return {name:n,note:String(x.note||"").slice(0,180),cause:String(x.cause||"").toLowerCase().slice(0,40)};
}
// scenario-written flavour, matched to what put them down
function flavourFor(scn,cause){
  const list=(scn&&Array.isArray(scn.injuries)?scn.injuries:[]).map(coerceInjury).filter(Boolean);
  if(!list.length)return null;
  const c=normLabel(cause);
  const hit=c?list.filter(x=>x.cause&&(normLabel(x.cause).includes(c)||c.includes(normLabel(x.cause)))):[];
  const pool=hit.length?hit:list;
  return pool[Math.floor(Math.random()*pool.length)];
}
function injuryCauses(scn){
  const out=[];
  const add=v=>{const s=String(v||"").trim();if(s&&!out.some(x=>normLabel(x)===normLabel(s))&&out.length<8)out.push(s.slice(0,28));};
  enemyAll(scn).forEach(c=>add(c.name));
  ((scn&&scn.map&&scn.map.features)||[]).filter(f=>f&&f.role==="hazard").forEach(f=>add(f.label));
  ((scn&&scn.events)||[]).forEach(e=>add(e.title));
  return out;
}
function injuryTableFor(scn){return (scn&&Array.isArray(scn.injuries))?scn.injuries:[];}
function applyInjury(c,entry,flavour,scnTitle){
  if(entry.dead){c._died=true;return;}
  const games=rollDuration(entry.games), ag=entry.agility?d(4):0;
  const rec={roll:entry.roll,name:(flavour&&flavour.name)||entry.name,ruleName:entry.name,
    note:(flavour&&flavour.note)||entry.note,effectNote:entry.effectNote,
    permanent:!!entry.permanent,from:scnTitle||"",at:Date.now(),
    games:games,miss:entry.miss||0,agility:ag,speed:entry.speed||0,breakP:entry.breakP||0,served:0};
  c.injuries=c.injuries||[];
  c.injuries.push(rec);
  Object.keys(entry.skills||{}).forEach(k=>{if(typeof c.skills[k]==="number")c.skills[k]=Math.max(1,Math.min(10,c.skills[k]+entry.skills[k]));});
  if(entry.hpPct){const max=c.hp;c.hp=Math.max(2,Math.round(max*(1+entry.hpPct/100)/2)*2);}
  (entry.addTraits||[]).forEach(n=>{const o=findCat("trait",n);if(o&&!c.traits.includes(o.id))c.traits.push(o.id);});
  const max=c.hp*memberCount(c); if(typeof c.curHP==="number"&&c.curHP>max)c.curHP=max;
}
function openInjuryRoll(c){

      save();closeModal();render();
      toast("“"+title+"” — "+(entry.permanent?"it stays with them":"it will mend"));
      setTimeout(()=>openEarnedNames([{charId:c.id,name:c.name,reason:(c.name||"They")+" — "+title+(entry.effectNote?" ("+entry.effectNote+")":"")}],"scar"),300);
    };
    showModal();
  };
  body.innerHTML=`
    <h3>What put ${esc(c.name||"them")} down?</h3>
    <p class="lead">Pick what took them out — the 1D8 injury roll decides what it cost them, and this scenario's own dangers give it a name.</p>
    <div class="chips-row">${causes.map(x=>`<button class="stylechip" data-cause="${esc(x)}">${esc(x)}</button>`).join("")}
      <button class="stylechip" data-cause="">Something else</button></div>
    <div class="modal-actions"><button class="btn ghost sm" id="injLater" style="margin-left:auto">Decide later</button></div>`;
  body.querySelectorAll("[data-cause]").forEach(b=>b.onclick=()=>draw(b.dataset.cause));

/* Death: possessions are divided amongst the survivors, and a replacement doesn't pay the

function openDeathRites(charId,injName){

      <div class="none-note" style="font-style:normal;margin-top:5px">Worth ${worth} credits if sold.</div></div>`:`<div class="ng-note">They carried nothing.</div>`}

    <div class="modal-actions">
      ${gear.length?`<button class="btn sm" id="drSell">Sell it all — +${worth} credits</button>`:""}
      <button class="btn danger ghost sm" id="drBury" style="margin-left:auto">Bury them</button>
    </div>`;
  const finish=()=>{
    w.characters=w.characters.filter(x=>x.id!==c.id);

    save();closeModal();render();toast(esc(c.name||"They")+" has fallen");
  };
  body.querySelectorAll("[data-heir]").forEach(b=>b.onclick=()=>{

  $("#drBury").onclick=finish;
  showModal();

/* Treatment between games: serve at least one game with the wound, then roll a D6 —
   on 4+ the surgeons manage it and you pay 10 campaign points. */
function canTreat(c,inj){return inj&&!inj.dead&&(inj.served||0)>=1;}
function openTreatInjury(charId,idx){
  const w=activeWB(), c=w.characters.find(x=>x.id===charId); if(!c)return;
  const inj=(c.injuries||[])[idx]; if(!inj)return;
  const purse=cpOf(c)+(w.cp||0);
  const body=$("#modalBody");
  body.innerHTML=`
    <h3>Treat ${esc(inj.name)}</h3>
    <p class="lead">${esc(c.name||"They")} has carried this through ${inj.served||0} game${(inj.served||0)===1?"":"s"}. The surgeons charge ${CP_COSTS.heal} campaign points <b>for the attempt</b>, win or lose. Roll a D6 — on <b>4 or more</b> they put it right; on less, the points are spent anyway and they go into the next fight still carrying it.</p>
    <div class="camp-box"><div class="prep-h">${esc(inj.ruleName||inj.name)}</div>
      ${inj.effectNote?`<div class="pick-when">⏱ ${esc(inj.effectNote)}</div>`:""}
      <div class="none-note" style="font-style:normal;margin-top:6px">Available: ${purse} campaign points</div></div>
    <div class="modal-actions">
      <button class="btn primary sm" id="trRoll"${purse>=CP_COSTS.heal?"":" disabled"}>🎲 Roll for treatment</button>
      <button class="btn ghost sm" id="trClose" style="margin-left:auto">Not now</button>
    </div>`;
  $("#trClose").onclick=closeModal;
  $("#trRoll").onclick=()=>{
    const r=d(6), ok=r>=4;
    // the attempt is paid for either way — surgeons charge whether or not they succeed
    let owe=CP_COSTS.heal, own=Math.min(cpOf(c),owe); owe-=own;
    c.cp=cpOf(c)-own; if(owe>0)w.cp=Math.max(0,(w.cp||0)-owe);
    if(ok){
      // undo what the wound did
      if(inj.speed)c.speedMod=(c.speedMod||0)-inj.speed;
      if(inj.breakP)c.breakMod=(c.breakMod||0)-inj.breakP;
      const entry=INJURY_TABLE.find(e=>e.roll===inj.roll);
      if(entry){Object.keys(entry.skills||{}).forEach(k=>{if(typeof c.skills[k]==="number")c.skills[k]=Math.max(1,Math.min(10,c.skills[k]-entry.skills[k]));});
        if(entry.hpPct)c.hp=Math.max(2,Math.round(c.hp/(1+entry.hpPct/100)/2)*2);}
      c.injuries.splice(idx,1);
      save();closeModal();render();
      toast("Rolled "+r+" — treated. "+CP_COSTS.heal+" points spent.");
      setTimeout(()=>openEarnedNames([{charId:c.id,name:c.name,reason:(c.name||"They")+" is whole again — "+inj.name+" is behind them"}],"recovered"),300);
    }else{
      inj.treatTried=(inj.treatTried||0)+1;save();closeModal();render();
      toast("Rolled "+r+" — the treatment failed. "+CP_COSTS.heal+" points spent anyway.");
    }
  };
  showModal();
}
// one game served, durations tick down, expired wounds mend on their own
function tickInjuries(c){
  let changed=false;
  (c.injuries||[]).forEach(inj=>{inj.served=(inj.served||0)+1;changed=true;});
  const before=(c.injuries||[]).length;
  c.injuries=(c.injuries||[]).filter(inj=>{
    if(!inj.games)return true;
    return (inj.served||0)<inj.games;   // 1D4-game wounds mend once served
  });
  if((c.injuries||[]).length!==before)changed=true;
  return changed;
}
/* ---- earned names ----
   A character who goes down, or who grows through hard-won experience, can take a new name.
   Works with no AI (the Realm has none at the table); the Claude app adds tailored suggestions. */
const EPITHET_SCAR=["the Scarred","the Broken","One-Eye","the Limping","the Bled","Half-Face","the Marked","Deathless","the Ruined","Ashen","the Twice-Dead","Gravebound"];
const EPITHET_GLORY=["the Feared","the Undying","the Iron","Blooded","the Merciless","the Bold","Grim","the Unbowed","the Butcher","the Relentless","the Vow-Keeper","Wolf-of-the-Line"];
function baseName(n){const s=String(n||"").trim();if(!s)return "Unnamed";const cut=s.split(/\s+(?:the|of|von|de)\s+/i)[0];return cut.split(/\s+/).slice(0,2).join(" ")||s;}
const EPITHET_MENDED=["the Mended","the Returned","Twice-Made","the Unbroken","the Restored","Whole Again"];
function suggestEarnedNames(name,kind){
  const base=baseName(name), out=[];
  // a healed character can simply drop the epithet they were carrying
  if(kind==="recovered"&&base!==String(name||"").trim())out.push(base);
  const pool=(kind==="glory"?EPITHET_GLORY:kind==="recovered"?EPITHET_MENDED:EPITHET_SCAR).slice();
  while(out.length<4&&pool.length)out.push(base+" "+pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  return out;
}
/* entries: [{charId, name, reason}] — kind "scar" (went down) or "glory" (grew stronger) */
function openEarnedNames(entries,kind,then){
  entries=(entries||[]).filter(e=>e&&e.charId);
  if(!entries.length){if(then)then();return;}
  const body=$("#modalBody");
  const rows=entries.map((e,i)=>`

        <input class="input earn-name" id="earn${i}" value="${esc(e.name||"")}" maxlength="42"></div>

        <button class="linkbtn" data-reroll="${i}">↻ more</button>
        ${kind==="glory"?"":""}</div>
    </div>`).join("");
  body.innerHTML=`
    <h3>${kind==="glory"?"A name worth earning":kind==="recovered"?"Mended":"They carry it with them"}</h3>
    <p class="lead">${kind==="glory"?"Deeds change what people call you. Take a new name, or keep the old one.":kind==="recovered"?"The wound is behind them — they may not answer to the old name any more.":"Surviving what put you down leaves a mark — and often a new name. Change it, or leave it be."}</p>
    ${rows}
    <div id="earnAI"></div>
    <div class="modal-actions">
      <button class="btn primary sm" id="earnSave">Save names</button>
      ${typeof getSample==="function"?`<button class="btn ghost sm" id="earnAImore">✦ Suggest with AI</button>`:""}
      <button class="btn ghost sm" id="earnSkip" style="margin-left:auto">Keep as they are</button>
    </div>`;
  const setName=(i,v)=>{const el=$("#earn"+i);if(el)el.value=v;};
  body.querySelectorAll("[data-suggest]").forEach(b=>b.onclick=()=>{const[i,n]=b.dataset.suggest.split("|");setName(i,n);});
  body.querySelectorAll("[data-reroll]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.reroll, row=b.closest(".earn-row"), chips=row.querySelector(".chips-row");
    const fresh=suggestEarnedNames(entries[i].name,kind);
    [...chips.querySelectorAll("[data-suggest]")].forEach((c,k)=>{if(fresh[k]){c.textContent=fresh[k];c.dataset.suggest=i+"|"+fresh[k];}});
  });
  const done=save_=>{
    if(save_)entries.forEach((e,i)=>{
      const el=$("#earn"+i);if(!el)return;
      const v=el.value.trim();if(!v)return;
      const c=activeWB().characters.find(x=>x.id===e.charId);
      if(c&&c.name!==v){c.name=v;}
    });
    if(save_)save();
    closeModal();render();if(then)then();
  };
  $("#earnSave").onclick=()=>done(true);
  $("#earnSkip").onclick=()=>done(false);
  const ai=$("#earnAImore");
  if(ai)ai.onclick=async()=>{
    const st=$("#earnAI");st.innerHTML=`<div class="ng-note spin">Asking Claude…</div>`;
    const s=await getSample();
    if(!s){st.innerHTML=`<div class="ng-note">AI naming only works in the Claude app.</div>`;return;}
    try{
      const list=await s.json(`Grimdark sci-fi skirmish game. For each character below, suggest ONE new name they might earn — keep their existing given name and add an earned epithet that fits what happened. Reply with ONLY a JSON array of strings, same order, no prose.\n`+
        entries.map((e,i)=>`${i+1}) "${e.name}" — ${e.reason}`).join("\n"),{modelTier:"quick",cache:false});
      (Array.isArray(list)?list:[]).forEach((n,i)=>{if(typeof n==="string"&&n.trim())setName(i,n.trim().slice(0,42));});
      st.innerHTML="";
    }catch(e){st.innerHTML=`<div class="ng-note">${sampleErr(e&&e.code)}</div>`;}
  };
  showModal();
}

function markClaimed(id){try{const a=questClaims();if(!a.includes(id)){a.push(id);localStorage.setItem("p28_claimed",JSON.stringify(a.slice(-50)));}}catch(e){}}
function pendingQuest(scn){
  // prefer the live roster; fall back to the last copy this device kept
  let snap=null;
  if(scn&&scn.battle){
    const mine=myCombatantsIn(scn);
    if(mine.length)snap={scnId:scn.id,title:scn.title||"",combatants:mine,injuries:injuryTableFor(scn),causes:injuryCauses(scn)};
  }
  if(!snap&&scn){try{const raw=localStorage.getItem("p28_quest_"+scn.id);if(raw)snap=JSON.parse(raw);}catch(e){}}
  if(!snap||questClaims().includes(snap.scnId))return null;
  return snap;
}
/* VEHICLE DAMAGE (rulebook p.81-82) — the counterpart of the character injury table, rolled
   at camp for any vehicle wrecked on the quest. What the app can apply it applies; the rest
   it states plainly and leaves to the host. */
const VEH_DAMAGE=[
  {roll:1,name:"Grinding gears",effect:"Suffers −1D4 agility and moves at half speed.",
   apply:v=>{v.damage="Grinding gears — −1D4 agility, moves at half speed.";}},
  {roll:2,name:"Short on crew",effect:"Loses all but 1 of its crew sections.",
   apply:v=>{const cw=findCat("vsection","Crew");if(cw){const e=(v.sections||[]).find(x=>x.id===cw.id);if(e)e.qty=1;}
     v.damage="Short on crew — down to a single crew section.";}},
  {roll:3,name:"Badly repaired",effect:"Gains the Ramshackle trait. This does not lower the vehicle's points cost.",
   apply:v=>{const rt=findCat("vtrait","Ramshackle");if(rt&&(v.traits||[]).indexOf(rt.id)<0)v.traits.push(rt.id);
     v.damage="Badly repaired — now Ramshackle (derelict on a single failed break test).";}},
  {roll:4,name:"Slow repairs",effect:"Misses the next game, after which it is returned to full hit-points.",
   apply:v=>{v.laidUp=true;v.curHP=vehicleHP(v);v.damage="In the workshop — sits out the next quest, then returns at full hit-points.";}},
  {roll:5,name:"Fully repaired",effect:"Fixed up without any problems — starts the next game at full hit-points.",
   apply:v=>{v.curHP=vehicleHP(v);v.damage="";}},
  {roll:6,name:"Destroyed",effect:"Too badly damaged to keep going. Add up its total starting points cost; you may use 50% of that to build a new vehicle. Any campaign points it had are lost.",
   apply:v=>{v.wrecked=true;v.salvage=Math.floor(vehicleCost(v)/2);v.damage="Destroyed — "+v.salvage+" pts of salvage towards a new vehicle.";}}
];
function openVehicleDamage(v,then){
  const body=$("#modalBody");
  const draw=res=>{
    body.innerHTML=`<h3>▰ ${esc(v.name||"Vehicle")} was wrecked</h3>

      <div class="modal-actions">
        ${res?`<button class="btn primary sm" id="vdDone">Back to camp</button>`
             :`<button class="btn primary sm" id="vdRoll">🎲 Roll 1D6</button>`}
      </div>`;
    if(res)$("#vdDone").onclick=()=>{closeModal();render();if(then)then();};
    else $("#vdRoll").onclick=()=>{
      const r=VEH_DAMAGE[Math.floor(Math.random()*6)];
      r.apply(v);v.damageRoll=r.roll;save();draw(r);toast("▰ "+r.name);
    };
  };

}
function claimQuest(snap,then){
  const w=activeWB();
  let wounded=0,downed=0,found=0;
  const fell=[];
  (snap.combatants||[]).forEach(m=>{
    const c=w.characters.find(x=>x.id===m.charId); if(!c)return;
    if(m.curHP<=0){
      fell.push({charId:c.id,name:c.name});
      // they'll roll for a lasting injury at camp — the table travels with them
      c.pendingInjury={scnId:snap.scnId,title:snap.title||"",table:snap.injuries||[],causes:snap.causes||[]};
    }
    const max=c.hp*memberCount(c);
    if(typeof m.curHP==="number"&&m.curHP<max){ c.curHP=Math.max(0,m.curHP); if(m.curHP<=0)downed++; else wounded++; }
    else { c.curHP=max; }
    if(m.curHP<=0){ c.downedIn=c.downedIn||[]; if(!c.downedIn.includes(snap.scnId))c.downedIn.push(snap.scnId); }
    (m.finds||[]).forEach(f=>{
      c.pickups=c.pickups||[];
      if(!c.pickups.some(p=>p.itemId===f.itemId&&p.scnId===f.scnId)){c.pickups.push(f);found++;}
    });
  });
  const wrecks=[];
  (snap.combatants||[]).forEach(m=>{
    if(!m.vehId)return;
    const v=vehsOf(w).find(x=>x.id===m.vehId); if(!v)return;
    const max=vehicleHP(v);
    if(typeof m.curHP==="number"&&m.curHP<max)v.curHP=Math.max(0,m.curHP); else v.curHP=max;
    if(m.curHP<=0)wrecks.push(v);
  });
  // a vehicle that sat this quest out has served its lay-up and is ready again
  vehsOf(w).forEach(v=>{if(v.laidUp&&!(snap.combatants||[]).some(m=>m.vehId===v.id))v.laidUp=false;});
  (snap.combatants||[]).forEach(m=>{const c=w.characters.find(x=>x.id===m.charId);if(c)tickInjuries(c);});
  markClaimed(snap.scnId);
  const ok=save();
  render();
  const bits=[];
  if(wounded)bits.push(wounded+" wounded");
  if(downed)bits.push(downed+" taken down");
  if(wrecks.length)bits.push(wrecks.length+" vehicle"+(wrecks.length>1?"s":"")+" wrecked");
  if(found)bits.push(found+" find"+(found>1?"s":""));
  toast(ok?("Back at camp"+(bits.length?" — "+bits.join(", "):"")):"⚠ Returned but NOT saved — storage is full");
  if(then)then();
  // XP for the quest first, then anyone who fell rolls for what it cost them
  const took=(snap.combatants||[]).map(m=>m.charId).filter(id=>w.characters.some(c=>c.id===id));
  const rollWrecks=()=>{ if(wrecks.length)openVehicleDamage(wrecks[0]); };
  const rollInjuries=()=>{ if(!fell.length){rollWrecks();return;}
    const c=w.characters.find(x=>x.id===fell[0].charId);
    if(c&&c.pendingInjury)openInjuryRoll(c); else rollWrecks();
  };
  const settleAgendas=()=>openAgendaCheck(took.map(id=>w.characters.find(c=>c.id===id)).filter(Boolean),rollInjuries);
  setTimeout(()=>openCPAwards(snap,took,settleAgendas),350);
}

  if(!snap){finish();toast("Back at camp");return;}
  const names=(snap.combatants||[]).map(m=>m.name).slice(0,4).join(", ");
  askConfirm("Bring your warband home from “"+(snap.title||"the quest")+"”? Wounds and anything they picked up ("+names+") come back with them.",

}

function normalizeImportedScn(raw){
  const s=raw&&typeof raw==="object"?JSON.parse(JSON.stringify(raw)):{};
  s.id=uid(); s.createdAt=s.createdAt||Date.now();
  s.mode=s.mode==="coop"?"coop":"pvp";
  s.players=+s.players||3; s.points=+s.points||300;
  ["objectives","specialRules","terrain","markers","searched"].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});
  ["npcs","items","events"].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});
  s.items=s.items.map((x,i)=>({name:String(x&&x.name||""),note:String(x&&x.note||""),secret:!!(x&&x.secret),hint:String(x&&x.hint||""),revealed:!!(x&&x.revealed),id:(x&&x.id)||("it"+i),heldBy:(x&&x.heldBy)||null}));
  s.title=String(s.title||"Imported scenario").slice(0,80);
  s.premise=String(s.premise||"");
  if(!s.map||typeof s.map!=="object")s.map={note:"",zones:[],features:[]};
  s.map.zones=Array.isArray(s.map.zones)?s.map.zones:[]; s.map.features=Array.isArray(s.map.features)?s.map.features:[];
  s.difficulty=s.difficulty||"normal";
  s.round=+s.round||1; if(s.rounds!=null)s.rounds=+s.rounds||null;
  if(s.enemy&&typeof s.enemy==="object"){ if(!Array.isArray(s.enemy.characters))s.enemy.characters=[]; if(!Array.isArray(s.enemy.vehicles))s.enemy.vehicles=[]; }
  if(s.battle&&(!s.battle.combatants||!Array.isArray(s.battle.combatants)))s.battle=null;
  return healScnChars(s);
}

const SCN_EXAMPLES=[
 "A silent research station in a steaming jungle, barricaded from the inside — valuable secrets within, and the missing scientists somewhere too.",
 "A teeming market planet where the governor's runaway heir hides with a trillion-credit bounty on their head.",
 "Pirates holed up in a derelict hull after a heist gone wrong, holding out against pursuing law enforcement until rescue arrives.",
 "Two factions vying for power in a newly independent system after a bitter war.",
 "A cult in the old mines — a warband storms in to snatch their leader from a sacrifice and escape.",
 "A lone research base is the only shelter on a frozen night-world, and there aren't enough supplies for everyone who wants in.",
];
async function generateScenario(){
  const go=$("#scGo"), res=$("#scResult");
  res.innerHTML=`<div class="ng-note spin">Connecting to Claude…</div>`;go.disabled=true;
  const s=await getSample();
  if(!s){res.innerHTML=`<div class="ng-note">${sampleErr("not_granted")}</div>`;go.disabled=false;return;}
  const seed=$("#scSeed").value.trim();
  let points=parseInt(($("#scPoints").value||"").replace(/\D/g,""),10);if(!points||points<0)points=activeWB().budget||500;
  const players=scnPlayers, mode=scnMode, difficulty=scnDifficulty, length=scnFinalLength(), diff=DIFFICULTY[difficulty];
  go.textContent="Designing…";res.innerHTML=`<div class="ng-note spin">Designing the battlefield… this can take a few seconds.</div>`;
  const prompt=`You are the DUNGEON MASTER for the grimdark science-fiction tabletop skirmish game Planet 28, writing tonight's scenario for a table of players. Obey the game's real rules:
- The playing area is 90×90 cm; at least 60% should be covered by scenery (multiple levels and plenty of cover).
- Game length is 1D10+6 turns.
- Deployment: number the 4 table sides 1-4; each warband deploys within 10cm of a side, or within 10cm of the centre.
- A scenario must include: a premise/motivation, a scenery description, victory conditions/objectives, deployment details, and any special rules.
Example Planet 28 scenario premises (for tone only, do not copy): ${SCN_EXAMPLES.map((e,i)=>(i+1)+") "+e).join(" ")}
This scenario: ${players} players; ${mode==="coop"?`CO-OPERATIVE — the players team up against an AI-controlled enemy force that is 200 points larger than a single player warband`:"PvP — the players' warbands fight each other"}; ${points} points per player warband.
${seed?`Base the scenario on this idea: "${seed}".`:"Invent an original, evocative premise."}
Write it to be ATMOSPHERIC and immersive: rich sensory detail (sights, sounds, smells, the feel of the place), so the players feel they are really THERE. The "briefing" field is a vivid, cinematic 4-6 sentence second-person narration that sets the mood before the game; the "premise" stays a short one-hook summary.
This game lasts EXACTLY ${length} turns (already rolled) — place every timed event on a round from 1 to ${length}; never use a round beyond ${length}. Difficulty is ${diff.label} (${diff.tone}); reflect that in the danger, timing and opposition.
Include 2-5 TIMED EVENTS, each with a "round" (1 to ${length}) and a "kind": "deadline" for a time-pressure objective the PLAYERS must achieve BY that turn (shown to them in advance, e.g. "by turn 4 disarm the reactor" — use these sparingly, only when the narrative needs a clock), or "surprise" for a hidden reveal that only appears when that turn arrives (reinforcements, a hazard, a betrayal, an environmental shift). Prefer surprises. Write each event atmospherically.
When a surprise event has a concrete mechanical effect the app can auto-apply to characters, add an "effect" object: {"apply":true,"type":"damage"|"heal"|"skill"|"condition","amount":"1D6" (a dice string, for damage/heal),"skill":"A"|"F"|"S"|"AW"|"P" (for a skill change),"delta":-1 (for skill),"condition":"short label like Blinded or On fire" (for condition/skill),"duration":"turn" (wears off next turn) or "game" (lasts the game),"scope":"chosen" (the host picks who is in range) or "all" (every combatant),"negatedBy":["trait/ability/armour/item names that cancel it"]}. Choose negatedBy from things that logically cancel the effect (e.g. Power armour negates Poisonous and Cumulative; Psy-hood negates Psychic/Arcane; Fearless negates fear/break effects; Iron skin, Death-proof, Painless, Unearthly, Bulwark can apply). For a purely narrative event set "effect":{"apply":false}.
This is a PRINT-AND-PLAY game: players 3D-print their miniatures and build/print terrain. So also produce a preparation checklist of what must be built or printed BEFORE the game — terrain pieces, objective/token markers, any extra non-player characters or creatures the scenario needs, and any custom collectible items it introduces (things a character can pick up during play).
GROUND TYPE ON EVERY MAP FEATURE. Separately from what a piece DOES, the rulebook sorts all terrain into four movement categories, and the players are told to agree them BEFORE the game — so decide them here, as the DM, and set "ground" on every feature:
- "even" — moved over without impediment, no skill roll. Flat ground, steps, ladders, puddles.
- "rough" — an Agility roll to move through; fail and the character moves at half speed. Rubble-strewn ruins, low walls, slow water, shifting sand.
- "hazardous" — an Agility roll for EVERY action spent in it; pass and you move at half speed, fail and you cannot move at all and take 1D10 damage minus armour. Lava, raging water, grinding machinery, hostile fauna.
- "impassable" — cannot be crossed at all; characters must go around. Energy fields, sheer walls of rock.
Do NOT make everything even — a table of flat ground plays flat. Rough ground is the workhorse: it is what makes a ruin feel like a ruin and gives Agility, Sure-footed, Climber and the vehicle types (Walker, Hover, Flyer) something to matter against. Reserve hazardous for genuinely lethal ground and place little of it, and use impassable sparingly for hard edges. Ground and role are independent: a collapsed spire can be tall cover AND rough, a reactor pool can be an objective AND hazardous.
CONNECT THE CHECKLIST TO THE MAP — this is important. Every map feature needs a "role" saying what it DOES in play, chosen from: "cover-low" (shoot over it), "cover-tall" (blocks sight, can hide behind), "blocking" (impassable/solid), "deco" (pure scenery, no game effect), "cache" (can be SEARCHED — this is where a collectible item is found), "interactive" (can be operated/hacked/opened/triggered), "objective", "hazard", "spawn" (where something arrives). And every checklist entry (terrain, markers, npcs, items) must set "mapLabel" to the EXACT label text of the map feature or zone it corresponds to, copied character-for-character (use a comma-separated list if one entry covers several identical pieces, e.g. "Wreck Spire, Wreck Spire"). The app turns those into the numbers shown on the map, so the host knows exactly which printed piece goes where and which one is searchable. If a collectible item is found by searching a terrain piece, give that feature role "cache" and point the item's "mapLabel" at it. Leave "mapLabel" as "" ONLY for things genuinely not on the map (e.g. a spare token kept off-table).
SEARCHING IS RESOLVED BY THE APP: a feature with role "cache" gets a Search button in play. Any item whose mapLabel points at that cache stays hidden until someone searches it, and the app picks which one turns up (at random if several share one cache). So it is GOOD to hide 1-3 items in caches, and fine for two different items to share a cache — that creates a real gamble. An item that just lies in the open (like the main objective) should point at a non-cache feature instead, so it needs no searching.
ITEMS ARE THE MOST IMPORTANT PLACE TO GET THIS RIGHT, AND THE EASIEST TO FORGET: every entry in "items" MUST carry BOTH a "mapLabel" (where on the table it is found — normally the cache it is hidden in) AND a "when". Do not leave an item's mapLabel empty; if it is not hidden in a cache, point it at whatever feature it lies on or beside. An item with no mapLabel is useless to the host because they cannot place it.
EVERY item MUST have a "when" field: one short, concrete sentence saying WHEN OR WHERE it matters, naming the specific special rule, hazard, event or place it interacts with — e.g. "Wear it before entering the flooded lower level; cancels the Deep-pressure -1 Athletics penalty" rather than a vague "useful later". If an item counters something, that something must exist in specialRules, events or a hazard feature — never invent a rule the scenario doesn't have. Do the same for npcs where it helps ("when" = when/where it shows up).
LASTING INJURIES — when a character is taken down the players roll on the rulebook's own 1D8 injury table, so do NOT invent mechanics. Instead write an "injuries" list of 5-7 SCENARIO-FLAVOURED wound descriptions this place could inflict — each just a "name" (e.g. "Venom-withered arm", "Pressure-burst eardrum"), a one-line "note" of prose, and a "cause" tag matching a threat in this scenario (an enemy name, a hazard, an event) so the right flavour is drawn for what actually happened. The app pairs your description with whatever the dice decide.
SECRETS & SURPRISES — make the world feel alive: you MAY include plot twists and surprise reveals. Mark any NPC, item, or timed event that should be a SECRET (hidden from the host until it happens) with "secret": true. For a secret NPC or item, DO NOT spoil it in the checklist — instead give a non-spoiler "hint" telling the host only what to PREPARE (e.g. "a large monstrous miniature", "a mysterious relic token"). A hint says WHAT TO BUILD and nothing else — never put the turn, the trigger or any timing in it ("kept hidden until turn 8" is wrong), because in a co-op game the host is playing too and would be spoiling their own surprise while keeping the real name/note/round in the normal fields (the app hides them until the host reveals or the moment arrives). A collectible item whose effect should only be discovered on pickup should be marked "secret": true with a vague "hint". Not everything needs to be secret — obvious, up-front elements stay visible.
Reply with ONLY a JSON object (no prose, no code fence) shaped EXACTLY like:
{"title":"short evocative title","premise":"1-2 sentence hook","briefing":"vivid 4-6 sentence atmospheric second-person narration","scenery":"1-2 sentences describing the terrain to build","objectives":["a victory condition","..."],"specialRules":["an optional special rule","..."],"twist":"one mid-game complication (or empty string)","events":[{"round":4,"kind":"surprise","title":"short event name","text":"what happens this round, written atmospherically","effect":{"apply":true,"type":"damage","amount":"1D6","scope":"chosen","duration":"turn","negatedBy":["Power armour"]}}],"deployment":"how the warbands deploy, referencing table sides/centre","gameLength":"1D10+6 turns","terrain":[{"name":"terrain piece to build","note":"how many / what it looks like","mapLabel":"Wreck Spire","role":"cover-tall"}],"markers":[{"name":"objective/token to print","note":"what it marks","mapLabel":"Hadal Core","role":"objective"}],"npcs":[{"name":"extra character/creature","note":"what it is / when it appears","when":"when and where it shows up","mapLabel":"Vent Mouth","secret":false,"hint":""}],"items":[{"name":"collectible item","note":"what it does / what it changes about whoever picks it up","when":"the concrete moment it matters, naming the rule/hazard it answers","mapLabel":"Supply Locker","secret":false,"hint":""}],"injuries":[{"name":"Venom-withered arm","note":"The limb never regains its strength.","cause":"Scorpion Swarm"}],"map":{"note":"one-line caption of the battlefield","zones":[{"label":"short deployment label","side":"a","x":5,"y":5,"w":30,"h":18}],"features":[{"type":"terrain","role":"cover-tall","ground":"rough","label":"Wreck Spire","x":50,"y":50}]}}
Map coordinates are percentages of the 90×90 board: x from 0 (left) to 100 (right), y from 0 (top) to 100 (bottom). Provide 2-4 deployment zones (side is "a", "b" or "neutral") and 6-10 features (type is one of "terrain","cover","objective","hazard"; role is one of the roles listed above and is REQUIRED on every feature; "ground" is one of "even","rough","hazardous","impassable" and is also REQUIRED on every feature). Keep every map label under 22 characters and make each one distinctive enough to reference. Keep the checklist arrays short and concrete (omit any that don't apply), and give every checklist entry a "mapLabel" matching a map label exactly wherever it belongs on the table.`;
  try{
    const raw=await s.json(prompt,{modelTier:"default",cache:false});
    const scn=coerceScenario(raw,{seed,players,points,mode,difficulty,length});
    const w=activeWB();if(!w.scenarios)w.scenarios=[];w.scenarios.unshift(scn);save();
    closeModal();scnCurrentId=scn.id;scnScreen="detail";renderScenarioView();
    toast("Scenario generated");
  }catch(e){
    res.innerHTML=`<div class="ng-note">${sampleErr(e&&e.code)}</div>`;go.textContent="✦ Ask the DM";
  }finally{go.disabled=false;}
}
function coerceScenario(raw,opts){
  raw=raw&&typeof raw==="object"?raw:{};
  const arr=x=>Array.isArray(x)?x.filter(Boolean).map(String):[];
  const named=x=>Array.isArray(x)?x.map(v=>typeof v==="string"?{name:v,note:"",when:"",mapLabel:"",role:"",secret:false,hint:"",revealed:false}:{name:String(v&&v.name||"").slice(0,60),note:String(v&&v.note||"").slice(0,180),when:String(v&&v.when||"").slice(0,180),mapLabel:String(v&&v.mapLabel||"").slice(0,120),role:String(v&&v.role||"").toLowerCase().slice(0,20),secret:!!(v&&v.secret),hint:String(v&&v.hint||"").slice(0,90),revealed:false}).filter(v=>v.name||v.hint):[];
  const m=raw.map&&typeof raw.map==="object"?raw.map:{};
  const num=(v,d)=>{const n=+v;return isFinite(n)?Math.max(0,Math.min(100,n)):d;};
  const zones=(Array.isArray(m.zones)?m.zones:[]).map(z=>({label:String(z&&z.label||"").slice(0,34),side:(z&&z.side)==="b"?"b":(z&&z.side)==="neutral"?"neutral":"a",x:num(z&&z.x,5),y:num(z&&z.y,5),w:num(z&&z.w,25),h:num(z&&z.h,18)}));
  // if the AI omits a role, derive a sensible one from the feature type so the host still
  // sees what a piece is for (never guesses "cache" — that would invent a search point)
  const roleFromType={objective:"objective",hazard:"hazard",cover:"cover-tall",terrain:""};
  const feats=(Array.isArray(m.features)?m.features:[]).map(f=>{const t=(f&&f.type||"terrain");const ty=["terrain","cover","objective","hazard"].includes(t)?t:"terrain";const r=String(f&&f.role||"").toLowerCase();const g=String(f&&f.ground||"").toLowerCase();return{type:ty,role:FEAT_ROLES[r]?r:roleFromType[ty],ground:GROUND[g]?g:"",label:String(f&&f.label||"").slice(0,24),x:num(f&&f.x,50),y:num(f&&f.y,50)};});
  // REPAIR PASS: a searchable thing must exist physically on the map. If the AI declared a
  // cache on a build-list entry (a crate/locker) but never put a matching feature on the map,
  // synthesise one so it always gets a number and a place to stand.
  const terrainL=named(raw.terrain), markersL=named(raw.markers), npcsL=named(raw.npcs), itemsL=named(raw.items);
  (function(){
    const spots=[[38,38],[62,38],[38,62],[62,62],[50,25],[25,50],[75,50],[50,75]];
    const taken=l=>feats.some(f=>normLabel(f.label)===normLabel(l));
    [].concat(terrainL,markersL,npcsL,itemsL).forEach(x=>{
      if(String(x.role||"").toLowerCase()!=="cache")return;
      const lbl=(x.mapLabel||x.name||"").trim(); if(!lbl||taken(lbl))return;
      const free=spots.find(p=>!feats.some(f=>Math.abs(f.x-p[0])<9&&Math.abs(f.y-p[1])<9))||[50,50];
      feats.push({type:"terrain",role:"cache",label:lbl.slice(0,24),x:free[0],y:free[1]});
      if(!x.mapLabel)x.mapLabel=lbl;
    });
  })();
  return {
    id:uid(), createdAt:Date.now(),
    mode:opts.mode, players:opts.players, points:opts.points, seed:opts.seed||"",
    title:String(raw.title||"Untitled scenario").slice(0,80),
    premise:String(raw.premise||""),
    briefing:String(raw.briefing||""),
    scenery:String(raw.scenery||""),
    objectives:arr(raw.objectives),
    specialRules:arr(raw.specialRules),
    twist:String(raw.twist||""),
    events:(Array.isArray(raw.events)?raw.events:[]).map(e=>({round:Math.max(1,Math.min(opts.length||16,Math.round(+(e&&e.round))||1)),kind:(e&&e.kind)==="deadline"?"deadline":"surprise",title:String(e&&e.title||"").slice(0,70),text:String(e&&e.text||"").slice(0,320),effect:parseEventEffect(e&&e.effect)})).filter(e=>e.title||e.text).sort((a,b)=>a.round-b.round),
    deployment:String(raw.deployment||""),
    gameLength:String(raw.gameLength||"1D10+6 turns"),
    terrain:terrainL, markers:markersL, npcs:npcsL,
    items:itemsL.map((x,i)=>({name:x.name,note:x.note,when:x.when,mapLabel:x.mapLabel,role:x.role,secret:x.secret,hint:x.hint,revealed:false,found:false,id:"it"+i,heldBy:null})),
    searched:[],
    injuries:(Array.isArray(raw.injuries)?raw.injuries:[]).map(coerceInjury).filter(Boolean).slice(0,10),
    difficulty:opts.difficulty||"normal",
    round:1, rounds:opts.length||null,
    map:{note:String(m.note||""),zones,features:feats},
  };
}

/* ---- co-op enemy warband generation ---- */
/* The DM gets the FULL rules text for everything it can pick, not just names and costs.
   Without the effects and the weapon profiles it chooses blind — it cannot tell a 60cm
   sniper rifle from a 20cm shotgun, or know an Energy shield stops nothing but energy
   weapons — so its picks stop matching the unit it just described. */
function catalogForAI(){
  const pts=n=>(n>=0?"+":"")+n;
  const traits=Object.values(CAT.trait).map(o=>`- ${o.name} (${pts(o.cost)} pts): ${o.desc}`).join("\n");
  const abils=Object.values(CAT.ability).map(o=>`- ${o.name} (${pts(o.cost)} pts): ${o.desc}`).join("\n");
  const weaps=Object.values(CAT.weapon).map(o=>`- ${o.name} (${o.cost} cr): ${o.type}, ${o.size}, damage ${o.dmg}${o.range&&o.range!=="—"?", range "+o.range:""}${o.rules&&o.rules!=="—"?", keywords: "+o.rules:""}`).join("\n");
  const arm=Object.values(CAT.armour).map(o=>`- ${o.name} (${o.cost} cr): defence ${o.def}${o.desc&&o.desc!=="—"?" — "+o.desc:""}`).join("\n");
  const items=Object.values(CAT.item).map(o=>`- ${o.name} (${o.cost} cr): ${o.desc}`).join("\n");
  const wrules=WEAPON_RULES.map(r=>`- ${r[0]}: ${r[1]}`).join("\n");
  const arc=ARCANA.map(a=>`- ${a[0]}: ${a[1]}`).join("\n");
  return `TRAITS — permanent characteristics costing points; NEGATIVE ones make the unit worse and hand points back to spend elsewhere:
${traits}

ABILITIES — active things the unit can do in play, costing points:
${abils}

WEAPONS — cost credits:
${weaps}

WEAPON KEYWORDS used above:
${wrules}

ARMOUR — costs credits. A character may wear ONE type of armour only, never two:
${arm}

ITEMS — cost credits:
${items}

VEHICLE PARTS — only for units in the "vehicles" list, never for characters:
TYPES (pick one by name): ${VEHICLE_TYPES.map(t=>`- ${t[0]} (${t[1]>0?"+":""}${t[1]} pts, speed ${t[2]}): ${t[3]}`).join("\n")}
SIZES (pick one by name; size sets the vehicle's melee and how easily it hides): ${VEHICLE_SIZES.map(t=>`\n- ${t[0]}: ${t[1]}`).join("")}
SECTIONS — a vehicle always has a core Engine and a core Crew section (10 HP each) for free; these are the extra sections you may bolt on, each adding its own hit-points:
${Object.values(CAT.vsection).map(o=>`- ${o.name} (${o.cost} pts, ${o.hp} HP): ${o.desc}`).join("\n")}
VEHICLE TRAITS:
${Object.values(CAT.vtrait).map(o=>`- ${o.name} (${o.cost>=0?"+":""}${o.cost} pts): ${o.desc}`).join("\n")}
VEHICLE ABILITIES:
${Object.values(CAT.vability).map(o=>`- ${o.name} (${o.cost>=0?"+":""}${o.cost} pts): ${o.desc}`).join("\n")}
VEHICLE WEAPONS — the heavy mounts, plus any Ranged character weapon from the list above may be pintle-mounted at its own cost:
${VEHICLE_WEAPONS.map(w=>`- ${w[0]} (${w[4]} pts): damage ${w[1]}, range ${w[3]}, ${w[5]}${w[2]&&w[2]!=="—"?", keywords: "+w[2]:""}`).join("\n")}

function cleanHint(t){
  const TIME=/\b(turn|round)\s*\d|\b(turn|round)\b|\buntil\b|\barriv|\bappear|\bspawn|\berupt|\bdescend|\blater\b|\bkept hidden\b|\bat the start\b|\bfrom the start\b|\bdeploy/i;

function legaliseVehicle(v){
  const sec=n=>findCat("vsection",n), q=o=>{const e=o&&v.sections.find(x=>x.id===o.id);return e?e.qty:0;};
  const dozer=sec("Dozer blade");

  // A vehicle mounts one weapon per hard point (turret hard points included)
  const hp=sec("Hard point"), th=sec("Turret hard point");
  let mounts=q(hp)+q(th);
  if(mounts<1&&v.weapons.length){                                              // it needs somewhere to bolt them on
    const add=Math.min(3,v.weapons.reduce((a,e)=>a+e.qty,0));
    if(hp){v.sections.push({id:hp.id,qty:add});mounts=add;}
  }
  let left=mounts,kept=[];
  v.weapons.forEach(e=>{const take=Math.min(e.qty,left);if(take>0){kept.push(e.as?{id:e.id,qty:take,as:e.as}:{id:e.id,qty:take});left-=take;}});
  v.weapons=kept;
  // Armour plating may be at most 50% of a small/medium vehicle, 25% of a large one
  const plate=sec("Armour plating");
  if(plate){
    const pe=v.sections.find(e=>e.id===plate.id);
    if(pe){
      const ratio=v.size===2?0.25:0.5;
      const other=2+v.sections.filter(e=>e.id!==plate.id).reduce((a,e)=>a+e.qty,0);   // +2 core sections
      const cap=Math.floor(ratio*other/(1-ratio));
      if(pe.qty>cap)pe.qty=cap;
      if(pe.qty<1)v.sections=v.sections.filter(e=>e.id!==plate.id);
    }
  }
  return v;
}

/* How much a late arrival is telegraphed is a storytelling choice the AI makes per unit:
   "open" — known from the outset, so the players can plan around it
   "foreshadowed" — they know something is coming, and roughly when, but not what
   "hidden" — no warning at all; it lands as a shock */
function enemyReveal(c){
  const r=String((c&&c.reveal)||"").toLowerCase();
  if(r==="hidden"||r==="foreshadowed"||r==="open")return r;
  return (c&&c.secret)?"hidden":"open";        // older scenarios: fall back to the secret flag
}
function enemyHidden(c){return !!(c&&!c.revealed&&enemyReveal(c)==="hidden");}
function enemyTeased(c){return !!(c&&!c.revealed&&enemyReveal(c)==="foreshadowed");}
/* Only badge a turn we can actually stand behind. The old first-match-wins read was wrong
   two ways: an arrival triggered by something happening ("erupts the turn the pod is
   disturbed, and further waves after turn 11") is on no fixed turn at all, and a turn named
   after "after"/"each"/"every" describes a LATER wave rather than the arrival. Better no
   badge than a number that sends the host into the wrong turn. */
function enemyArrivalTurn(c){
  const note=String((c&&c.deployNote)||"");
  if(/\b(when|once|if|as soon as|the moment|upon|the turn the|is disturbed|triggered)\b/i.test(note))return 0;
  const re=/(\w+)?\s*\bturn (\d+)/gi;
  let m;
  while((m=re.exec(note))){
    if(/^(after|beyond|past|each|every|from)$/i.test(m[1]||""))continue;
    return +m[2];
  }
  return 0;
}
function enemyMiniCard(c){
  const n=memberCount(c);
  if(enemyHidden(c))
    return `<div class="enemy-card sealed"${scnReadOnly?"":` data-reveal-enemy="${c.id}"`}>
      <div class="ec-top"><span class="ec-name">🔒 Unseen</span></div>
      <div class="ec-role">${esc(c.omen||"something out there, unaccounted for")}</div>
      <div class="ec-stats"><span class="none-note" style="font-style:normal">${scnReadOnly?"":"build: "+esc(c.hint||"a spare miniature")+" · tap to reveal"}</span></div>
    </div>`;
  if(enemyTeased(c)){
    const t=enemyArrivalTurn(c);
    return `<div class="enemy-card teased"${scnReadOnly?"":` data-reveal-enemy="${c.id}"`}>
      <div class="ec-top"><span class="ec-name">⚠ Something approaches</span>${t?`<span class="ec-cost">T${t}</span>`:""}</div>
      <div class="ec-role">${esc(c.tease||c.hint||"you can hear it out there")}</div>
      <div class="ec-stats"><span class="none-note" style="font-style:normal">${scnReadOnly?"you know it is coming — not what it is":"tap to reveal early"}</span></div>
    </div>`;
  }
  if(isEnemyVeh(c)){
    const ty=VEHICLE_TYPES[c.type]||VEHICLE_TYPES[0], sz=VEHICLE_SIZES[c.size]||VEHICLE_SIZES[1];
    return `<button class="enemy-card" data-evid="${c.id}">
      <div class="ec-top"><span class="ec-name">▰ ${esc(c.name)||"Enemy vehicle"}</span><span class="ec-cost">${vehicleCost(c)}</span></div>
      <div class="ec-role">${esc(c.role)||sz[0]+" "+ty[0].toLowerCase()+" vehicle"}</div>
      <div class="ec-stats"><span><b>${c.skills.A}</b>A</span><span><b>${c.skills.S}</b>S</span><span><b>${ty[2]}</b>SPD</span><span class="hp"><b>${vehicleHP(c)}</b>HP</span></div>
    </button>`;
  }
  return `<button class="enemy-card" data-eid="${c.id}">
    <div class="ec-top"><span class="ec-name">${esc(c.name)||"Enemy"}</span><span class="ec-cost">${unitCost(c)}</span></div>
    <div class="ec-role">${esc(c.role)||"&nbsp;"}${n>1?` <span class="ec-squad">×${n}</span>`:""}</div>
    <div class="ec-stats">${SKILLS.map(([k])=>`<span><b>${c.skills[k]}</b>${k}</span>`).join("")}<span class="hp"><b>${c.hp}</b>HP</span></div>
  </button>`;
}
function enemyBlock(s){
  const diff=diffOf(s), bonus=diff.enemyBonus, target=s.points+bonus;
  if(enemyAll(s).length){
    const vehs=enemyVehs(s);
    const total=enemyChars(s).reduce((a,c)=>a+unitCost(c),0)+vehs.reduce((a,v)=>a+vehicleCost(v),0);
    const nUnits=enemyAll(s).length;
    return `<div class="scn-block"><div class="bh">Enemy force — run by the DM</div>
      <p style="margin-bottom:10px">Target <b>${s.enemy.target||target} pts</b> (your ${s.points} + ${bonus}, ${diff.label}) · built <b style="color:var(--danger)">${total} pts</b> across ${nUnits} unit${nUnits===1?"":"s"}${vehs.length?` (including ${vehs.length} vehicle${vehs.length>1?"s":""})`:""}. Tap a unit for its full card.</p>
      ${(()=>{const cs=enemyAll(s),any=cs.some(c=>c.deployNote||c.atStart===false);
        if(!any)return `<div class="enemy-grid">${cs.map(enemyMiniCard).join("")}</div>`;
        // players never see a fully hidden unit; a foreshadowed one they DO see, as a warning
        const visible=scnReadOnly?cs.filter(c=>!enemyHidden(c)):cs;
        const now=visible.filter(c=>c.atStart!==false), later=visible.filter(c=>c.atStart===false);
        const grp=(t,list)=>list.length?`<div class="dep-h">${t}</div><div class="enemy-grid">${list.map(enemyMiniCard).join("")}</div>${list.filter(c=>c.deployNote&&!enemyHidden(c)&&!enemyTeased(c)).map(c=>`<div class="dep-note"><b>${esc(c.name)}</b> — ${esc(c.deployNote)}</div>`).join("")}${list.filter(enemyTeased).map(c=>`<div class="dep-note"><b>⚠ ${esc(c.tease||"Something is coming")}</b>${enemyArrivalTurn(c)?` — expect it around turn ${enemyArrivalTurn(c)}`:""}</div>`).join("")}`:"";
        // players get the dread, not the roster — omens read as atmosphere, so nothing can be counted
        const omens=cs.filter(c=>enemyHidden(c)&&c.omen);
        const dread=omens.length?`<div class="omen-box">${omens.map(c=>`<div class="omen">🌑 ${esc(c.omen)}</div>`).join("")}</div>`:"";
        const warn=now.length?"":`<div class="gap-box" style="margin-bottom:10px"><div class="prep-h">⚠ The board starts empty</div><div>Every unit is set to arrive later, so nothing opposes the players on turn 1.</div>${scnReadOnly?"":`<button class="btn sm" id="enemyFirstWave" style="margin-top:8px">Put the earliest wave on the table</button>`}</div>`;
        return warn+grp("▣ Deploy on the table now",now)+grp("⏳ Arrives later — keep off the table",later)+dread;})()}
      ${scnReadOnly?"":`<button class="btn sm ghost" id="enemyRegen" style="margin-top:12px">✦ Re-muster the enemy</button><div id="enemyStatus"></div>`}
    </div>`;
  }
  if(scnReadOnly)return `<div class="scn-block"><div class="bh">Enemy force — run by the DM</div><p>The DM's enemy warband, worth <b>${target} pts</b> — the host musters and runs it.</p></div>`;
  return `<div class="scn-block"><div class="bh">Enemy force — run by the DM</div>
    <p style="margin-bottom:8px">The DM fields an enemy warband worth <b>${target} pts</b> (your ${s.points} + ${bonus}, ${diff.label} difficulty), built from this scenario's own antagonists. Muster it as playable cards for the host to run.</p>
    <button class="btn primary sm" id="enemyGen">✦ Muster the DM’s enemy</button>
    <div id="enemyStatus"></div>
  </div>`;
}

function scenarioMapSVG(map,mini){
  map=map||{};
  const zones=Array.isArray(map.zones)?map.zones:[];
  const feats=Array.isArray(map.features)?map.features:[];
  const cl=v=>Math.max(0,Math.min(100,+v||0));
  const zc=s=>s==="b"?["#e5686d","rgba(229,104,109,.15)"]:s==="neutral"?["#9aa3b2","rgba(154,163,178,.12)"]:["#5a9be0","rgba(90,155,224,.15)"];
  let g="";
  for(let i=10;i<100;i+=10)g+=`<line class="grid" x1="${i}" y1="0" x2="${i}" y2="100"/><line class="grid" x1="0" y1="${i}" x2="100" y2="${i}"/>`;
  let num=0;
  const badge=(x,y,fill,n,label)=>`<g class="mapnum" data-mapnum="${n}" data-maplabel="${esc(String(label))}"><circle cx="${x}" cy="${y}" r="3.1" fill="${fill}" stroke="#fff" stroke-width="0.5"/><text x="${x}" y="${y}" font-size="3.3" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central">${n}</text></g>`;
  let z="";
  zones.forEach(zo=>{const[st,fi]=zc(zo.side);const x=cl(zo.x),y=cl(zo.y),w=Math.min(100-x,Math.max(4,+zo.w||20)),h=Math.min(100-y,Math.max(4,+zo.h||18));
    z+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${fi}" stroke="${st}" stroke-width="0.5" stroke-dasharray="2 1.5"/>`;
    if(!mini&&zo.label){num++;z+=badge(x+w/2,y+h/2,st,num,zo.label);}});
  let f="";
  feats.forEach(ft=>{const x=cl(ft.x),y=cl(ft.y),t=ft.type||"terrain";
    if(t==="objective")f+=`<circle class="obj" cx="${x}" cy="${y}" r="2.7"/>`;
    else if(t==="hazard")f+=`<path class="haz" d="M ${x} ${y-3.2} L ${x+3} ${y+2.5} L ${x-3} ${y+2.5} Z"/>`;
    else f+=`<rect class="terr" x="${x-3.5}" y="${y-3.5}" width="7" height="7" rx="1.5"/>`;
    if(!mini&&ft.label){num++;f+=badge(x,y-6,"#2c313d",num,ft.label);}});
  return `<svg class="scn-map" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${g}${z}${f}</svg>`;
}
/* ---- map ↔ build-list cross-referencing ----
   Every labelled zone/feature gets a number (zones first, then features — the SAME order
   scenarioMapSVG draws its badges in). Build-list entries name the map label they belong to
   via `mapLabel`, so the app can resolve it to those numbers and show them side by side. */
const FEAT_ROLES={
  "cover-low":{label:"low cover",cls:"r-cover"},
  "cover-tall":{label:"tall cover",cls:"r-cover"},
  "blocking":{label:"blocks line of sight",cls:"r-cover"},
  "deco":{label:"scenic only",cls:"r-deco"},
  "cache":{label:"searchable",cls:"r-cache"},
  "interactive":{label:"interactive",cls:"r-inter"},
  "objective":{label:"objective",cls:"r-obj"},
  "hazard":{label:"hazard",cls:"r-haz"},
  "spawn":{label:"spawn point",cls:"r-spawn"}
};
/* The rulebook sorts ALL terrain into four movement categories and says to agree them before
   play. That is separate from what a piece DOES (a wreck can be tall cover AND rough to climb
   through), so ground rides alongside the role rather than replacing it. */
const GROUND={
  even:{label:"even ground",cls:"g-even",rule:"Moved over without impediment — no skill roll."},
  rough:{label:"rough ground",cls:"g-rough",rule:"Make an Agility roll to move through. Fail and the character moves at half speed, rounding down."},
  hazardous:{label:"hazardous ground",cls:"g-haz",rule:"Agility roll for EVERY action spent in it. Pass and you move at half speed; fail and you may not move at all and take 1D10 damage, minus armour rolls."},
  impassable:{label:"impassable",cls:"g-imp",rule:"Cannot be moved over or through at all — characters must go around it."}
};
/* Only two roles imply their ground beyond doubt; everything else is left UNKNOWN rather
   than assumed flat, so the host decides at the table instead of the app inventing a rule. */
const GROUND_FROM_ROLE={blocking:"impassable",hazard:"hazardous"};
function featGround(f){
  const g=String((f&&f.ground)||"").toLowerCase();
  if(GROUND[g])return g;
  return GROUND_FROM_ROLE[String((f&&f.role)||"").toLowerCase()]||"";
}
function groundChip(g){
  const o=GROUND[String(g||"").toLowerCase()];
  return o?`<span class="role-chip ${o.cls}" tabindex="0" data-tip="${esc(o.rule)}">${esc(o.label)}</span>`:"";
}
function roleChip(role){
  const r=FEAT_ROLES[String(role||"").toLowerCase()];
  return r?`<span class="role-chip ${r.cls}">${esc(r.label)}</span>`:"";
}
function mapSeq(map){
  map=map||{};
  const zones=Array.isArray(map.zones)?map.zones:[];
  const feats=Array.isArray(map.features)?map.features:[];
  const out=[];let n=0;
  zones.forEach(z=>{if(z&&z.label){n++;out.push({n,label:String(z.label),role:"",kind:"zone"});}});
  feats.forEach(f=>{if(f&&f.label){n++;out.push({n,label:String(f.label),role:String(f.role||""),ground:featGround(f),kind:"feature"});}});
  return out;
}
function normLabel(v){return String(v||"").trim().toLowerCase().replace(/\s+/g," ").replace(/s$/,"");}
/* Tolerant matching: the AI has to repeat a label it invented elsewhere, so near-misses
   ("Supply Lockers" vs "Supply Locker") are common. Exact-normalised match first; then a
   containment match, but ONLY when it is unambiguous (exactly one candidate). */
function mapNumsFor(map,labels){
  if(!labels)return [];
  const seq=mapSeq(map);
  const want=String(labels).split(/\s*,\s*/).map(normLabel).filter(Boolean);
  if(!want.length||!seq.length)return [];
  const out=[];
  want.forEach(wr=>{
    const exact=seq.filter(e=>normLabel(e.label)===wr);
    if(exact.length){exact.forEach(e=>{if(!out.includes(e.n))out.push(e.n);});return;}
    if(wr.length<4)return;
    const loose=seq.filter(e=>{const el=normLabel(e.label);return el.length>=4&&(el.includes(wr)||wr.includes(el));});
    if(loose.length===1&&!out.includes(loose[0].n))out.push(loose[0].n);
  });
  return out.sort((a,b)=>a-b);
}
function numBadges(nums){
  if(!nums||!nums.length)return "";
  return `<span class="mapref">${nums.map(n=>`<span class="mapref-n">${n}</span>`).join("")}</span>`;
}
// build-list entries may be plain strings (older scenarios) or {name,note,mapLabel,role,...}
function prepEntry(x){
  if(typeof x==="string")return {name:x,note:"",when:"",mapLabel:"",role:"",secret:false,hint:"",revealed:false};
  return {name:String(x&&x.name||""),note:String(x&&x.note||""),when:String(x&&x.when||""),mapLabel:String(x&&x.mapLabel||""),role:String(x&&x.role||""),secret:!!(x&&x.secret),hint:String(x&&x.hint||""),revealed:!!(x&&x.revealed)};
}
// an entry with no role of its own inherits the role of the map feature it points at
function prepRole(map,e){
  if(e.role&&FEAT_ROLES[e.role])return e.role;
  const nums=mapNumsFor(map,e.mapLabel);
  if(!nums.length)return "";
  const hit=mapSeq(map).find(q=>nums.includes(q.n)&&q.role);
  return hit?hit.role:"";
}
// like prepRole: a build-list entry inherits the ground of the map feature it points at
function prepGround(map,e){
  const nums=mapNumsFor(map,e.mapLabel);
  if(!nums.length)return "";
  const hit=mapSeq(map).find(q=>nums.includes(q.n)&&q.ground);
  return hit?hit.ground:"";
}
function mapLegendHTML(map){
  const seq=mapSeq(map);
  if(!seq.length)return "";
  const rows=seq.map(e=>`<div class="maplg-row" data-mapnum="${e.n}"><span class="maplg-num">${e.n}</span><span class="maplg-label">${esc(e.label)}</span>${roleChip(e.role)}${groundChip(e.ground)}</div>`);
  return `<div class="scn-maplegend-nums">${rows.join("")}</div>`;
}
function wireMapNums(container){

    });

}

/* ---- live-play: round tracker + item pickups ---- */
let pickupOpenId=null;
function curRound(s){return Math.max(1,s.round||1);}
function setRound(s,r){s.round=Math.max(1,r);save();renderScenarioView();}
function parseEventEffect(x){
  if(!x||typeof x!=="object"||!x.apply)return {apply:false};
  const type=["damage","heal","skill","condition"].includes(x.type)?x.type:"condition";
  return {apply:true,type,
    amount:String(x.amount||"").slice(0,14),
    skill:["A","F","S","AW","P"].includes(x.skill)?x.skill:"",
    delta:Math.round(+x.delta||0),
    condition:String(x.condition||"").slice(0,40),
    duration:x.duration==="turn"?"turn":"game",
    scope:x.scope==="all"?"all":"chosen",
    negatedBy:(Array.isArray(x.negatedBy)?x.negatedBy:[]).map(v=>String(v).slice(0,40)).filter(Boolean).slice(0,8)};
}
/* ---- live battle roster ---- */
function negListOf(c){
  const nm=[]; (c.traits||[]).forEach(id=>{if(CAT.trait[id])nm.push(CAT.trait[id].name);});
  (c.abilities||[]).forEach(id=>{if(CAT.ability[id])nm.push(CAT.ability[id].name);});
  (c.items||[]).forEach(e=>{if(CAT.item[e.id])nm.push(CAT.item[e.id].name);});
  (c.armour||[]).forEach(e=>{if(CAT.armour[e.id])nm.push(CAT.armour[e.id].name);});

}
/* Combatants carry the camp + character they came from, so whatever happens to them at the
   quest can be routed back to the right character on the right player's own device. */
function injuryNotes(c){return (c.injuries||[]).filter(x=>x&&x.name).map(x=>x.name+(x.effectNote?" ("+x.effectNote+")":""));}
function myCombatants(owner,idPrefix){
  const w=activeWB(), out=[], cid=campId();
  // A vehicle laid up for repairs sits this one out; everything else fielded rolls out.
  vehsOf(w).filter(v=>isFielded(v)&&!v.laidUp).forEach(v=>{
    const max=vehicleHP(v);
    const cur=(typeof v.curHP==="number"&&v.curHP>0&&v.curHP<max)?v.curHP*1:max;
    out.push({id:(idPrefix||"p_")+v.id,side:"player",owner:owner||"",campId:cid,vehId:v.id,isVeh:true,
      name:"▰ "+(v.name||"Unnamed vehicle"),maxHP:max,curHP:cur,conditions:[],neg:[],finds:[]});
  });
  w.characters.filter(isFielded).forEach(c=>{
    const n=memberCount(c), max=c.hp*n;
    // a character carries its lingering wounds into the next quest
    const cur=(typeof c.curHP==="number"&&c.curHP>0&&c.curHP<max)?c.curHP*1:max;
    out.push({id:(idPrefix||"p_")+c.id,side:"player",owner:owner||"",campId:cid,charId:c.id,
      name:(c.name||"Unnamed")+(n>1?" ×"+n:""),maxHP:max,curHP:cur,conditions:[],neg:negListOf(c),
      scars:injuryNotes(c),finds:[]});
  });
  return out;
}
function buildBattle(s){
  const me=campName()||playerName()||"You", combatants=myCombatants(me,"p_");
  (livePlayers||[]).forEach(p=>(p.combatants||[]).forEach(m=>{if(m&&m.id&&!combatants.some(x=>x.id===m.id))combatants.push(JSON.parse(JSON.stringify(m)));}));
  if(s.mode==="coop"){
    enemyChars(s).forEach(c=>{const n=memberCount(c);combatants.push({id:"e_"+c.id,side:"enemy",owner:"Enemy",name:(c.name||"Enemy")+(n>1?" ×"+n:""),maxHP:c.hp*n,curHP:c.hp*n,conditions:[],neg:negListOf(c)});});
    // a vehicle's hull is the sum of its sections; it is destroyed section by section
    enemyVehs(s).forEach(v=>{const hp=vehicleHP(v);combatants.push({id:"e_"+v.id,side:"enemy",owner:"Enemy",name:"▰ "+(v.name||"Enemy vehicle"),maxHP:hp,curHP:hp,conditions:[],neg:[]});});
  }

}
function mergePlayersIntoHostedBattle(){

function battleHTML(s){

  }

    return `<div class="btl-row ${m.side} ${down?"down":""}">
      <div class="btl-main"><span class="btl-side"></span><span class="btl-name">${esc(m.name)}</span>${m.owner&&m.side==="player"?`<span class="btl-owner">${esc(m.owner)}</span>`:""}${conds?`<div class="btl-conds">${conds}</div>`:""}</div>
      <div class="btl-hp">${scnReadOnly?"":`<button class="hpb" data-hp="${m.id}|-1" aria-label="damage">−</button>`}<span class="hpv ${down?"down":low?"low":""}">${down?"DOWN":m.curHP+"/"+m.maxHP}</span>${scnReadOnly?"":`<button class="hpb" data-hp="${m.id}|1" aria-label="heal">+</button>`}</div>
    </div>`;
  }).join("");
  return `<div class="scn-battle"><div class="mh">Battle roster${scnReadOnly?" · live":""}</div>${rows}
    ${scnReadOnly?"":`<div class="round-actions" style="margin-top:8px"><span class="none-note" style="font-style:normal">${s.battle.combatants.length} combatants · ± adjusts HP</span>${pendingQuest(s)?`<button class="linkbtn" id="btlHome">🏕 Return to camp</button>`:""}<button class="linkbtn" id="btlReset">Rebuild</button></div>`}</div>`;
}
function rollDice(str){
  str=String(str||"").trim();
  const m=str.match(/^(\d+)\s*[dD]\s*(\d+)\s*([+\-]\s*\d+)?$/);
  if(!m){const n=parseInt(str,10);return isFinite(n)?Math.max(0,n):0;}
  const cnt=Math.min(20,+m[1]||1),sides=+m[2]||6,mod=m[3]?parseInt(m[3].replace(/\s/g,""),10):0;
  let t=0;for(let i=0;i<cnt;i++)t+=1+Math.floor(Math.random()*sides);
  return Math.max(0,t+mod);
}
function negatedBy(m,eff){
  const neg=(eff.negatedBy||[]).map(x=>String(x).toLowerCase().trim()).filter(Boolean);
  for(const nn of neg){ if((m.neg||[]).some(mn=>mn===nn||mn.includes(nn)||nn.includes(mn))) return eff.negatedBy.find(x=>String(x).toLowerCase().trim()===nn)||nn; }
  return null;
}
function applyEventEffect(s,eff,ids){
  const out=[];
  ids.forEach(id=>{
    const m=(s.battle.combatants||[]).find(x=>x.id===id);if(!m)return;
    const neg=negatedBy(m,eff);
    if(neg){out.push({name:m.name,txt:"negated by "+neg,neg:true});return;}
    if(eff.type==="damage"){const d=rollDice(eff.amount);m.curHP=Math.max(0,m.curHP-d);out.push({name:m.name,txt:"−"+d+" HP"+(m.curHP<=0?" · DOWN":"")});}
    else if(eff.type==="heal"){const h=rollDice(eff.amount);m.curHP=Math.min(m.maxHP,m.curHP+h);out.push({name:m.name,txt:"+"+h+" HP"});}
    else{const label=eff.condition||(eff.skill?((eff.delta>0?"+":"")+eff.delta+" "+eff.skill):"Affected");const expireTurn=eff.duration==="turn"?curRound(s)+1:null;m.conditions=m.conditions||[];m.conditions.push({label,expireTurn});out.push({name:m.name,txt:label+(expireTurn?" (→T"+expireTurn+")":"")});}
  });
  save();return out;
}

function nextTurn(s){
  const nv=curRound(s)+1;
  if(s.rounds&&curRound(s)>=s.rounds)return;
  s.round=nv;
  if(s.battle&&s.battle.started)s.battle.combatants.forEach(m=>{m.conditions=(m.conditions||[]).filter(cd=>!cd.expireTurn||cd.expireTurn>nv);});
  const arrived=revealDueEnemies(s);   // anything hidden that is due now steps into the light
  save();renderScenarioView();
  const evs=(s.events||[]).filter(e=>e.round===nv);
  if(evs.length)showTurnPopup(s,nv,evs);
  else if(arrived)toast("It arrives: "+(arrived.name||"something"));
}
function effLabel(eff){
  if(eff.type==="damage")return "Damage "+(eff.amount||"?");
  if(eff.type==="heal")return "Heal "+(eff.amount||"?");
  if(eff.skill)return (eff.delta>0?"+":"")+eff.delta+" "+eff.skill+(eff.duration==="turn"?" (this turn)":"");
  return (eff.condition||"Condition")+(eff.duration==="turn"?" (this turn)":"");
}

/* Caches: map features with role "cache" are searchable. Items whose mapLabel points at a
   cache are hidden inside it until someone searches — the APP decides what turns up
   (the single bound item, or a random one when several share a cache, or nothing). */
/* A cache can be declared two ways, because the AI does both: as a map FEATURE with
   role "cache", or as a build-list entry (a crate/locker token) with role "cache" whose
   mapLabel points at the feature it sits on. Honour both. */
function cacheNums(s){
  const out=[];
  mapSeq(s.map).forEach(e=>{if(e.kind==="feature"&&e.role==="cache"&&!out.includes(e.n))out.push(e.n);});
  [].concat(s.terrain||[],s.markers||[],s.npcs||[],s.items||[]).forEach(raw=>{
    const x=prepEntry(raw);
    if(String(x.role||"").toLowerCase()!=="cache")return;
    mapNumsFor(s.map,x.mapLabel).forEach(n=>{if(!out.includes(n))out.push(n);});
  });
  return out.sort((a,b)=>a-b);
}
function cacheList(s){
  const nums=cacheNums(s), seq=mapSeq(s.map);
  return nums.map(n=>{
    const e=seq.find(q=>q.n===n); if(!e)return null;
    // a build-list "crate" sitting on this feature gives the search point its friendlier name
    const token=[].concat(s.terrain||[],s.markers||[]).map(prepEntry)
      .find(x=>String(x.role||"").toLowerCase()==="cache"&&mapNumsFor(s.map,x.mapLabel).includes(n));
    const inside=(s.items||[]).filter(it=>mapNumsFor(s.map,it.mapLabel).includes(n));
    return {n,label:e.label,name:(token&&token.name)||e.label,inside,left:inside.filter(it=>!it.found&&!it.heldBy)};
  }).filter(Boolean);
}
/* REPAIR PASS for enemy deployment. The dangerous default is assuming a unit starts on the
   table when the scenario clearly says it arrives later, so cross-check each unit against the
   scenario's own timed events and NPC notes before falling back to the enemy deploy zone. */
/* A late-arriving unit that the scenario marks as a secret NPC stays sealed in the roster
   until its turn comes round, so the host isn't spoiled by their own enemy list. */
function sealEnemySecrets(s){
  const cs=enemyAll(s); if(!cs.length)return false;
  const secrets=(s.npcs||[]).filter(n=>n&&n.secret);
  let changed=false;
  cs.forEach(c=>{
    if(c.secret!==undefined)return;
    const nm=normLabel(c.name);
    const np=nm.length>3?secrets.find(n=>{const x=normLabel(n.name);return x===nm||x.includes(nm)||nm.includes(x);}):null;
    if(np&&c.atStart===false){c.secret=true;c.revealed=false;c.hint=cleanHint(np.hint)||"prepare a miniature for it";}
    else c.secret=false;
    changed=true;
  });
  return changed;
}
// once the turn arrives, it's no longer a secret
function revealDueEnemies(s){
  const cs=enemyAll(s); const cur=curRound(s);
  let shown=null;
  cs.forEach(c=>{
    if(!enemyHidden(c))return;
    const t=enemyArrivalTurn(c);
    if(t&&cur>=t){c.revealed=true;shown=c;}
  });
  return shown;
}
function repairEnemyDeploy(s){
  const cs=enemyAll(s); if(!cs.length)return false;
  let changed=false;
  const evs=s.events||[], npcs=(s.npcs||[]).filter(n=>n&&n.when);
  const zoneB=(((s.map||{}).zones)||[]).find(z=>z&&z.side==="b");
  const fallback=zoneB&&zoneB.label?("deploys in "+zoneB.label):"";
  cs.forEach(c=>{
    if(c.deployNote)return;                       // the generator already said something
    const nm=normLabel(c.name); if(!nm)return;
    // only call it a late arrival when the wording actually describes one — an event that
    // merely mentions a unit usually means it was already standing on the table
    const ARRIVES=/(arriv|appear|erupt|emerge|spawn|breach|burst|reinforce|descend|joins|enters play|rolls out|rolls onto|awaken)/i;
    const STARTS=/(present from deployment|at the start|from the start|deploys with|starts on the table|turn 1|round 1)/i;
    const np=nm.length>3?npcs.find(n=>{const x=normLabel(n.name);return x===nm||x.includes(nm)||nm.includes(x);}):null;
    if(np&&np.when){
      if(STARTS.test(np.when)){ c.atStart=true; c.deployNote=np.when; changed=true; return; }
      if(ARRIVES.test(np.when)){ c.atStart=false; c.deployNote=np.when; changed=true; return; }
    }
    const ev=nm.length>3?evs.find(e=>{const t=(e.title||"")+" "+(e.text||"");return normLabel(t).includes(nm)&&ARRIVES.test(t);}):null;
    if(ev){ c.atStart=false; c.deployNote="arrives on turn "+ev.round+" — "+(ev.title||"a timed event"); changed=true; return; }
    if(fallback){ c.atStart=(c.atStart!==false); c.deployNote=fallback; changed=true; }
  });
  return changed;
}
/* Surfaces anything the generator left incomplete, so a gap is visible and fixable
   rather than silently missing at the table. */
function scenarioGaps(s){
  const g=[];
  const loose=(s.items||[]).filter(it=>!mapNumsFor(s.map,it.mapLabel).length);
  if(loose.length)g.push(loose.length+" item"+(loose.length>1?"s have":" has")+" no place on the map — hide them in a search point below, or just place them where you like: "+loose.map(i=>i.secret&&!i.revealed?(i.hint||"an unknown find"):i.name).join(", "));
  const empties=cacheList(s).filter(c=>!c.inside.length);
  if(empties.length)g.push("Search point"+(empties.length>1?"s":"")+" with nothing inside: "+empties.map(c=>"#"+c.n+" "+c.name).join(", "));
  const ec=enemyAll(s);
  if(ec.length&&!ec.some(c=>c.deployNote||c.atStart===false))
    g.push("The enemy force has no deployment notes — regenerate it to be told which units start on the table and which arrive later.");
  if(ec.length&&!ec.some(c=>c.atStart!==false))
    g.push("Nothing opposes you on turn 1 — every enemy unit is set to arrive later. Unless that is deliberate, use the enemy list below to put the first wave on the table.");
  const feats=((s.map||{}).features)||[];
  if(feats.length&&!feats.some(f=>featGround(f)))
    g.push("No terrain says what ground it is — the rulebook asks you to agree even / rough / hazardous / impassable before play. Re-generate the scenario for the DM to set them, or just call them at the table.");
  const noWhen=(s.items||[]).filter(it=>!it.when).length;
  if(noWhen)g.push(noWhen+" item"+(noWhen>1?"s don't":" doesn't")+" say when it matters — check the notes before you play.");
  return g;
}
// items the AI never gave a location — the host can stash them in a cache by hand
function unplacedItems(s){
  return (s.items||[]).filter(it=>!it.found&&!it.heldBy&&!mapNumsFor(s.map,it.mapLabel).length);
}
function stashItem(s,itemId,label){
  const it=(s.items||[]).find(x=>x.id===itemId); if(!it)return;
  it.mapLabel=label; save(); renderScenarioView(); toast("Hidden in "+label);
}
function itemIsHidden(s,it){
  if(it.found||it.heldBy)return false;
  return cacheList(s).some(c=>c.inside.some(x=>x.id===it.id));
}
function searchCache(s,label){
  const c=cacheList(s).find(x=>x.label===label);
  if(!c)return;
  s.searched=Array.isArray(s.searched)?s.searched:[];
  if(!s.searched.includes(label))s.searched.push(label);
  if(!c.left.length){ save();renderScenarioView();toast("Nothing here but scrap"); return; }
  const found=c.left[Math.floor(Math.random()*c.left.length)];
  found.found=true;
  if(found.secret)found.revealed=true;      // finding it reveals what it is
  pickupOpenId=found.id;                    // straight into "who picked it up?"
  save();renderScenarioView();
  toast("Found: "+(found.name||"something"));
}
function collectHTML(s){

        <div class="pick-held">🎒 ${esc(who)}${camp}${scnReadOnly?"":` <button class="linkbtn del" data-drop="${it.id}">drop</button>`}</div></div>`;
    }

    return `<div class="pick-row"><div class="pick-main">${nums}${label}${noteHtml}${whenLine}</div>

/* combatKey is a battle-roster id ("p_<charId>" for the host's own, "g<pid>_<charId>" for a
   guest's). The find is recorded on the COMBATANT so it syncs to that player's device, and
   also applied locally when the model belongs to this device's warband. */
function assignPickup(s,itemId,combatKey){
  const it=(s.items||[]).find(x=>x.id===itemId);if(!it)return;
  const m=((s.battle&&s.battle.combatants)||[]).find(x=>x.id===combatKey);
  const localId=(m&&m.charId)||String(combatKey).replace(/^p_/,"");
  const c=activeWB().characters.find(x=>x.id===localId);
  const mine=!!c&&(!m||!m.campId||m.campId===campId());
  it.heldBy=combatKey;
  if(it.secret)it.revealed=true;   // its effect is revealed once picked up
  const rec={itemId,scnId:s.id,name:it.name,note:it.note,when:it.when||""};
  if(m){ m.finds=Array.isArray(m.finds)?m.finds:[]; if(!m.finds.some(f=>f.itemId===itemId))m.finds.push(rec); }
  if(mine){ c.pickups=c.pickups||[]; if(!c.pickups.some(p=>p.itemId===itemId&&p.scnId===s.id))c.pickups.push(rec); }
  pickupOpenId=null;save();renderScenarioView();

function dropPickup(s,itemId){

async function applyPickup(c,p){
  const s=await getSample();
  if(!s){toast(sampleErr("not_granted"));return;}
  toast("Interpreting the item…");
  const tNames=c.traits.map(id=>CAT.trait[id]&&CAT.trait[id].name).filter(Boolean).join(", ")||"none";
  const aNames=c.abilities.map(id=>CAT.ability[id]&&CAT.ability[id].name).filter(Boolean).join(", ")||"none";
  const traitList=Object.values(CAT.trait).map(o=>o.name).join(", ");
  const abilityList=Object.values(CAT.ability).map(o=>o.name).join(", ");
  const prompt=`In the grimdark sci-fi tabletop game Planet 28, a character has picked up a collectible that changes them. Decide its mechanical effect.
Item: "${p.name}"${p.note?` — ${p.note}`:""}.
Current character "${c.name||"the character"}": skills A ${c.skills.A}, F ${c.skills.F}, S ${c.skills.S}, AW ${c.skills.AW}, P ${c.skills.P}; HP ${c.hp}; traits: ${tNames}; abilities: ${aNames}.
The change may be minor (a small boon or curse) or a dramatic TRANSFORMATION into something new — match the item's flavour. You can adjust skills (as deltas), HP (delta), add or remove traits, add abilities, and rename the character.
Use ONLY these trait names: ${traitList}.
Use ONLY these ability names: ${abilityList}.
Reply with ONLY a JSON object like:
{"summary":"one vivid sentence describing what happens to them","newName":"","skills":{"A":0,"F":0,"S":0,"AW":0,"P":0},"hp":0,"addTraits":[],"removeTraits":[],"addAbilities":[],"note":"a sentence of flavour to add to their background"}
Keep each skill delta between -4 and +4 and HP between -10 and +10. For a full transformation, rename them and change several things; for a minor pick-up change little. Set "newName" to "" to keep the current name.`;
  try{
    const eff=await s.json(prompt,{modelTier:"default",cache:false});
    openEffectPreview(c,p,eff);
  }catch(e){toast(sampleErr(e&&e.code));}
}
function effectLines(eff){
  const L=[];
  if(eff.newName)L.push(`→ <b>${esc(String(eff.newName))}</b>`);
  const sd=eff.skills||{};["A","F","S","AW","P"].forEach(k=>{const d=Math.round(+sd[k]||0);if(d)L.push(`${k} ${d>0?"+":"−"}${Math.abs(d)}`);});
  const hd=Math.round(+eff.hp||0);if(hd)L.push(`HP ${hd>0?"+":"−"}${Math.abs(hd)}`);
  (eff.addTraits||[]).forEach(n=>{if(findCat("trait",n))L.push(`+ ${esc(n)}`);});
  (eff.removeTraits||[]).forEach(n=>{if(findCat("trait",n))L.push(`− ${esc(n)}`);});
  (eff.addAbilities||[]).forEach(n=>{if(findCat("ability",n))L.push(`+ ${esc(n)}`);});
  return L;
}

function applyEffect(c,p,eff){
  p.before={name:c.name,skills:Object.assign({},c.skills),hp:c.hp,traits:[...c.traits],abilities:[...c.abilities],bg:c.bg};
  if(eff.newName)c.name=String(eff.newName).slice(0,42);
  const sd=eff.skills||{};["A","F","S","AW","P"].forEach(k=>{let v=c.skills[k]+Math.round(+sd[k]||0);c.skills[k]=Math.max(1,Math.min(10,v));});
  let hp=c.hp+Math.round(+eff.hp||0);if(hp<2)hp=2;if(hp%2)hp+=1;c.hp=hp;
  (eff.removeTraits||[]).forEach(n=>{const o=findCat("trait",n);if(o)c.traits=c.traits.filter(id=>id!==o.id);});
  (eff.addTraits||[]).forEach(n=>{const o=findCat("trait",n);if(o&&!c.traits.includes(o.id))c.traits.push(o.id);});
  (eff.addAbilities||[]).forEach(n=>{const o=findCat("ability",n);if(o&&!c.abilities.includes(o.id))c.abilities.push(o.id);});
  if(eff.note)c.bg=(c.bg?c.bg+"\n\n":"")+String(eff.note);
  p.applied=true;p.effect={summary:String(eff.summary||"")};
  save();
}
function revertPickup(c,p){
  const b=p.before;if(!b)return;
  c.name=b.name;c.skills=Object.assign({},b.skills);c.hp=b.hp;c.traits=[...b.traits];c.abilities=[...b.abilities];c.bg=b.bg;
  p.applied=false;delete p.effect;delete p.before;save();
}

    save();buildDossier();persist();if(cardCharId===c.id)buildCard();};

  else go();
}

  if((s.specialRules||[]).length)o+="SPECIAL RULES:\n"+s.specialRules.map(x=>"- "+x).join("\n")+"\n\n";
  if(s.twist)o+="TWIST: "+s.twist+"\n\n";
  if((s.events||[]).length)o+="TIMED EVENTS:\n"+s.events.map(e=>e.kind==="deadline"?"- By turn "+e.round+" (deadline): "+e.title+(e.text?" — "+e.text:""):"- Turn "+e.round+" (surprise): "+e.title+(e.text?" — "+e.text:"")).join("\n")+"\n\n";
  const seq=mapSeq(s.map);
  if(seq.length)o+="MAP KEY:\n"+seq.map(e=>{const r=FEAT_ROLES[e.role],g=GROUND[e.ground];return "  "+e.n+". "+e.label+(r?" — "+r.label:"")+(g?" ["+g.label+"]":"");}).join("\n")+"\n\n";
  const pl=list=>(list||[]).map(raw=>{
    const x=prepEntry(raw);
    const n=mapNumsFor(s.map,x.mapLabel), pre=n.length?"["+n.join(",")+"] ":"";
    const r=FEAT_ROLES[prepRole(s.map,x)], rc=r?" ["+r.label+"]":"";
    if(x.secret&&!x.revealed)return pre+(x.hint||"a hidden surprise")+rc;
    return pre+x.name+(x.note?" ("+x.note+")":"")+rc+(x.when?" — when: "+x.when:"");
  }).join("; ");
  const prep=[];
  if((s.terrain||[]).length)prep.push("Terrain: "+pl(s.terrain));
  if((s.markers||[]).length)prep.push("Markers: "+pl(s.markers));
  if((s.npcs||[]).length)prep.push("Extra characters: "+pl(s.npcs));
  if((s.items||[]).length)prep.push("Custom items: "+pl(s.items));
  if(prep.length)o+="TO BUILD / PRINT (numbers match the map key):\n"+prep.map(x=>"- "+x).join("\n")+"\n\n";
  if(s.mode==="coop")o+="ENEMY FORCE: "+(s.points+diffOf(s).enemyBonus)+" pts (run by the DM, "+diffOf(s).label+")\n";
  return o;
}

/* ---- tooltips (hover + tap) for [data-tip] elements ---- */
(function(){
  const tip=document.createElement("div");tip.className="tooltip-pop";document.body.appendChild(tip);
  let pinned=null;
  function place(el){
    tip.style.display="block";
    const r=el.getBoundingClientRect(), t=tip.getBoundingClientRect();
    let left=r.left+r.width/2-t.width/2;
    left=Math.max(8,Math.min(left,window.innerWidth-t.width-8));
    let top=r.top-t.height-8;
    if(top<8)top=r.bottom+8;
    tip.style.left=left+"px";tip.style.top=top+"px";
  }
  function show(el){if(!el||!document.contains(el)){hide();return;}const txt=el.getAttribute("data-tip");if(!txt)return;tip.textContent=txt;place(el);}
  function hide(){tip.style.display="none";pinned=null;}
  const near=e=>e.target&&e.target.closest?e.target.closest("[data-tip]"):null;
  document.addEventListener("mouseover",e=>{if(pinned)return;const el=near(e);if(el)show(el);});
  document.addEventListener("mouseout",e=>{if(pinned)return;const el=near(e);if(el)hide();});
  document.addEventListener("focusin",e=>{if(pinned)return;const el=near(e);if(el)show(el);});
  document.addEventListener("focusout",()=>{if(!pinned)hide();});
  document.addEventListener("click",e=>{
    const el=near(e);
    if(el){pinned=(pinned===el)?null:el;pinned?show(el):hide();}
    else if(pinned)hide();
  });
  window.addEventListener("scroll",()=>{if(!pinned)hide();},true);
  window.addEventListener("resize",hide);
})();
