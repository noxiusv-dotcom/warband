/* Caches: map features with role "cache" are searchable. Items whose mapLabel points at a
   cache are hidden inside it until someone searches — the APP decides what turns up
   (the single bound item, or a random one when several share a cache, or nothing). */
/* A cache can be declared two ways, because the AI does both: as a map FEATURE with
   role "cache", or as a build-list entry (a crate/locker token) with role "cache" whose
   mapLabel points at the feature it sits on. Honour both. */
function cacheNums(s){
  const out=[];
  mapSeq(s.map).forEach(e=>{if(e.kind==="feature"&&e.role==="cache"&&!out.includes(e.n))out.push(e.n);});
  [].concat(s.terrain||[],s.markers||[],s.npcs||[],s.items||[]).forEach(raw=>{
    const x=prepEntry(raw);
    if(String(x.role||"").toLowerCase()!=="cache")return;
    mapNumsFor(s.map,x.mapLabel).forEach(n=>{if(!out.includes(n))out.push(n);});
  });
  return out.sort((a,b)=>a-b);
}
function cacheList(s){
  (s.items||[]).forEach(it=>{if(it&&typeof it==="object"&&it.trap===undefined)it.trap=coerceTrap(it);});
  const nums=cacheNums(s), seq=mapSeq(s.map);
  return nums.map(n=>{
    const e=seq.find(q=>q.n===n); if(!e)return null;
    // a build-list "crate" sitting on this feature gives the search point its friendlier name
    const token=[].concat(s.terrain||[],s.markers||[]).map(prepEntry)
      .find(x=>String(x.role||"").toLowerCase()==="cache"&&mapNumsFor(s.map,x.mapLabel).includes(n));
    const inside=(s.items||[]).filter(it=>mapNumsFor(s.map,it.mapLabel).includes(n));
    return {n,label:e.label,name:(token&&token.name)||e.label,inside,left:inside.filter(it=>!it.found&&!it.heldBy&&!it.sprung)};
  }).filter(Boolean);
}
/* REPAIR PASS for enemy deployment. The dangerous default is assuming a unit starts on the
   table when the scenario clearly says it arrives later, so cross-check each unit against the
   scenario's own timed events and NPC notes before falling back to the enemy deploy zone. */
/* A late-arriving unit that the scenario marks as a secret NPC stays sealed in the roster
   until its turn comes round, so the host isn't spoiled by their own enemy list. */
function sealEnemySecrets(s){
  const cs=enemyAll(s); if(!cs.length)return false;
  const secrets=(s.npcs||[]).filter(n=>n&&n.secret);
  let changed=false;
  cs.forEach(c=>{
    if(c.secret!==undefined)return;
    const nm=normLabel(c.name);
    const np=nm.length>3?secrets.find(n=>{const x=normLabel(n.name);return x===nm||x.includes(nm)||nm.includes(x);}):null;
    if(np&&c.atStart===false){c.secret=true;c.revealed=false;c.hint=cleanHint(np.hint)||"prepare a miniature for it";}
    else c.secret=false;
    changed=true;
  });
  return changed;
}
// once the turn arrives, it's no longer a secret
function revealDueEnemies(s){
  const cs=enemyAll(s); const cur=curRound(s);
  let shown=null;

    const t=enemyArrivalTurn(c);

  });
  return shown;
}
function repairEnemyDeploy(s){
  const cs=enemyAll(s); if(!cs.length)return false;
  let changed=false;
  const evs=s.events||[], npcs=(s.npcs||[]).filter(n=>n&&n.when);
  const zoneB=(((s.map||{}).zones)||[]).find(z=>z&&z.side==="b");
  const fallback=zoneB&&zoneB.label?("deploys in "+zoneB.label):"";
  cs.forEach(c=>{
    if(c.deployNote)return;                       // the generator already said something
    const nm=normLabel(c.name); if(!nm)return;
    // only call it a late arrival when the wording actually describes one — an event that
    // merely mentions a unit usually means it was already standing on the table
    const ARRIVES=/(arriv|appear|erupt|emerge|spawn|breach|burst|reinforce|descend|joins|enters play|rolls out|rolls onto|awaken)/i;
    const STARTS=/(present from deployment|at the start|from the start|deploys with|starts on the table|turn 1|round 1)/i;
    const np=nm.length>3?npcs.find(n=>{const x=normLabel(n.name);return x===nm||x.includes(nm)||nm.includes(x);}):null;
    if(np&&np.when){
      if(STARTS.test(np.when)){ c.atStart=true; c.deployNote=np.when; changed=true; return; }
      if(ARRIVES.test(np.when)){ c.atStart=false; c.deployNote=np.when; changed=true; return; }
    }
    const ev=nm.length>3?evs.find(e=>{const t=(e.title||"")+" "+(e.text||"");return normLabel(t).includes(nm)&&ARRIVES.test(t);}):null;
    if(ev){ c.atStart=false; c.deployNote="arrives on turn "+ev.round+" — "+(ev.title||"a timed event"); changed=true; return; }
    if(fallback){ c.atStart=(c.atStart!==false); c.deployNote=fallback; changed=true; }
  });
  return changed;
}
/* Surfaces anything the generator left incomplete, so a gap is visible and fixable

function scenarioGaps(s){
  const g=[];
  const loose=(s.items||[]).filter(it=>!mapNumsFor(s.map,it.mapLabel).length);
  if(loose.length)g.push(loose.length+" item"+(loose.length>1?"s have":" has")+" no place on the map — hide them in a search point below, or just place them where you like: "+loose.map(i=>i.secret&&!i.revealed?(i.hint||"an unknown find"):i.name).join(", "));
  const empties=cacheList(s).filter(c=>!c.inside.length);
  if(empties.length)g.push("Search point"+(empties.length>1?"s":"")+" with nothing inside: "+empties.map(c=>"#"+c.n+" "+c.name).join(", "));
  const ec=enemyAll(s);
  if(ec.length&&!ec.some(c=>c.deployNote||c.atStart===false))
    g.push("The enemy force has no deployment notes — regenerate it to be told which units start on the table and which arrive later.");
  if(ec.length&&!ec.some(c=>c.atStart!==false))
    g.push("Nothing opposes you on turn 1 — every enemy unit is set to arrive later. Unless that is deliberate, use the enemy list below to put the first wave on the table.");
  const feats=((s.map||{}).features)||[];
  if(feats.length&&!feats.some(f=>featGround(f)))
    g.push("No terrain says what ground it is — the rulebook asks you to agree even / rough / hazardous / impassable before play. Re-generate the scenario for the DM to set them, or just call them at the table.");
  const noWhen=(s.items||[]).filter(it=>!it.when).length;
  if(noWhen)g.push(noWhen+" item"+(noWhen>1?"s don't":" doesn't")+" say when it matters — check the notes before you play.");
  return g;
}

/* The searcher takes the hit. The app rolls the dice; the host can trim the number for an

function collectHTML(s){
  const items=(s.items||[]);
  const caches=cacheList(s);
  if(!items.length&&!caches.length)return "";
  const chars=activeWB().characters;
  const searched=Array.isArray(s.searched)?s.searched:[];
  const loose=scnReadOnly?[]:unplacedItems(s);
  const searchBlock=caches.length?`<div class="cache-block"><div class="tk-h">🔦 Search points</div>${caches.map(c=>{
    const done=searched.includes(c.label), empty=!c.left.length;
    const nameLine=c.name&&c.name!==c.label?`<b>${esc(c.name)}</b><span class="pick-note"> at ${esc(c.label)}</span>`:`<b>${esc(c.label)}</b>`;
    const stash=loose.length?`<div class="cache-stash"><span class="pick-lbl">Hide here:</span>${loose.map(it=>`<button class="pick-chip" data-stash="${it.id}|${esc(c.label)}">${esc(it.secret&&!it.revealed?(it.hint||"unknown find"):it.name)}</button>`).join("")}</div>`:"";
    return `<div class="cache-row"><div class="cache-main">${numBadges([c.n])}${nameLine}${done?`<span class="pick-note"> — ${empty?"emptied":"searched"}</span>`:`<span class="pick-note"> — ${c.left.length} still hidden</span>`}${stash}</div>${scnReadOnly?"":`<button class="btn sm ${done?"ghost searched":""}" data-search="${esc(c.label)}"${empty&&done?" disabled":""}>${done?(empty?"✓ Emptied":"✓ Searched · again?"):"🔦 Search"}</button>`}</div>`;
  }).join("")}<div class="none-note" style="font-style:normal;margin-top:6px">The app rolls what's found — searching may also turn up nothing.${loose.length?" Items with no set location are listed above; tap one to hide it in a search point.":""}</div></div>`:"";
  const rows=items.map(it=>{
    if(!it.id)return "";
    const nums=numBadges(mapNumsFor(s.map,it.mapLabel));
    const whenLine=it.when?`<div class="pick-when">⏱ ${esc(it.when)}</div>`:"";
    if(it.sprung)return `<div class="pick-row dim"><div class="pick-main">${nums}<b>💥 ${esc(it.name)}</b><span class="pick-note"> — sprung</span></div></div>`;
    if(it.trap&&!itemIsHidden(s,it)&&!scnReadOnly)return `<div class="pick-row"><div class="pick-main">${nums}<b>${esc(it.name)}</b><span class="pick-note"> — trap · ${esc(it.trap.damage)} to whoever searches it</span></div></div>`;
    if(it.heldBy){
      const m=((s.battle&&s.battle.combatants)||[]).find(x=>x.id===it.heldBy);
      const ch=chars.find(c=>c.id===((m&&m.charId)||String(it.heldBy).replace(/^p_/,"")));
      const who=(m&&m.name)||(ch&&ch.name)||"held";
      const camp=m&&m.owner?` <small style="opacity:.7">${esc(m.owner)}</small>`:"";
      return `<div class="pick-row"><div class="pick-main">${nums}<b>${esc(it.name)}</b>${it.note?` <span class="pick-note">— ${esc(it.note)}</span>`:""}${whenLine}</div>
        <div class="pick-held">🎒 ${esc(who)}${camp}${scnReadOnly?"":` <button class="linkbtn del" data-drop="${it.id}">drop</button>`}</div></div>`;
    }
    const hidden=itemIsHidden(s,it);
    const label=(it.secret&&!it.revealed)?`<i>${esc(it.hint||"an unknown find")}</i>`:`<b>${esc(it.name)}</b>`;
    if(hidden){
      const where=mapNumsFor(s.map,it.mapLabel);
      return `<div class="pick-row dim"><div class="pick-main">${nums}${label}<span class="pick-note"> — hidden${where.length?", search "+where.map(n=>"#"+n).join(" or "):""} to find it</span></div></div>`;
    }
    if(scnReadOnly){
      const nh=(it.secret&&!it.revealed)?` <span class="pick-note" style="font-style:italic">— effect unknown until picked up</span>`:(it.note?` <span class="pick-note">— ${esc(it.note)}</span>`:"");
      return `<div class="pick-row"><div class="pick-main">${nums}${label}${nh}${whenLine}</div></div>`;
    }
    if(pickupOpenId===it.id){
      // every player model at the quest can claim a find — including guests' warbands
      const roster=((s.battle&&s.battle.combatants)||[]).filter(m=>m&&m.side==="player");
      const opts=roster.length?roster.map(m=>({key:m.id,label:m.name,who:m.owner||""}))
        :chars.map(c=>({key:"p_"+c.id,label:c.name||"Unnamed",who:campName()||""}));
      const chips=opts.length?opts.map(o=>`<button class="pick-chip" data-assign="${it.id}|${esc(o.key)}">${esc(o.label)}${o.who?` <small style="opacity:.7">${esc(o.who)}</small>`:""}</button>`).join("")
        :`<span class="none-note" style="font-style:normal">Start the battle roster (or add characters) first.</span>`;
      return `<div class="pick-row open"><div class="pick-main">${nums}<b>${esc(it.name)}</b></div>
        <div class="pick-choose"><span class="pick-lbl">Picked up by…</span>${chips}<button class="linkbtn" data-pickcancel="1">cancel</button></div></div>`;
    }
    const noteHtml=(it.secret&&!it.revealed)?` <span class="pick-note" style="font-style:italic">— effect unknown until picked up</span>`:(it.note?` <span class="pick-note">— ${esc(it.note)}</span>`:"");
    return `<div class="pick-row"><div class="pick-main">${nums}${label}${noteHtml}${whenLine}</div>
      <button class="btn sm ghost" data-pick="${it.id}">Picked up…</button></div>`;
  }).join("");
  return `<div class="scn-collect"><div class="mh">Collectibles — pick-ups</div>${searchBlock}${rows}</div>`;
}
/* combatKey is a battle-roster id ("p_<charId>" for the host's own, "g<pid>_<charId>" for a
   guest's). The find is recorded on the COMBATANT so it syncs to that player's device, and
   also applied locally when the model belongs to this device's warband. */
/* The moment of discovery. A find is shown in full — name, what it does, when it matters,
   the sheet changes the DM wrote for it — and the player picks who pockets it from a list. */
function pickupOptions(s){
  const roster=((s.battle&&s.battle.combatants)||[]).filter(m=>m&&m.side==="player");
  if(roster.length)return roster.map(m=>({key:m.id,label:m.name+(m.owner?" · "+m.owner:""),down:(m.curHP|0)<=0}));
  return activeWB().characters.map(c=>({key:"p_"+c.id,label:c.name||"Unnamed",down:false}));
}
function openFoundItem(s,it){
  if(!it)return;
  const eff=it.effect&&typeof it.effect==="object"?it.effect:null;
  const lines=eff&&eff.apply!==false?effectLines(eff):[];
  const opts=pickupOptions(s);
  const body=$("#modalBody");
  body.innerHTML=`<div class="eyebrow">🎒 Found</div>
    <h3>${esc(it.name||"Something")}</h3>
    ${it.note?`<p class="lead">${esc(it.note)}</p>`:""}
    ${it.when?`<p class="lead pick-when" style="margin-top:2px">⏱ ${esc(it.when)}</p>`:""}
    ${eff&&eff.summary?`<p class="lead" style="font-style:italic;color:var(--arcane)">${esc(eff.summary)}</p>`:""}
    ${lines.length?`<div class="eff-changes">${lines.map(l=>`<span class="eff-chip">${l}</span>`).join("")}</div>`
      :eff?`<p class="none-note" style="font-style:normal">Carried, not absorbed — it changes nothing on the sheet.</p>`
      :`<p class="none-note" style="font-style:normal">Its effect gets worked out back at camp.</p>`}
    ${opts.length?`<div class="eyebrow" style="margin-top:14px">Picked up by</div>
      <select class="input" id="fiWho">${opts.map(o=>`<option value="${esc(o.key)}"${o.down?" disabled":""}>${esc(o.label)}${o.down?" (down)":""}</option>`).join("")}</select>`
      :`<p class="none-note" style="font-style:normal;margin-top:12px">Start the battle roster (or add characters) first.</p>`}
    <div class="modal-actions">
      ${opts.length?`<button class="btn primary sm" id="fiTake">Take it</button>`:""}
      <button class="btn ghost sm" id="fiLeave" style="margin-left:auto">Leave it for now</button>
    </div>`;
  const tk=$("#fiTake");if(tk)tk.onclick=()=>{closeModal();assignPickup(s,it.id,$("#fiWho").value);};
  $("#fiLeave").onclick=()=>{closeModal();pickupOpenId=null;renderScenarioView();};
  showModal();
}
function assignPickup(s,itemId,combatKey){
  const it=(s.items||[]).find(x=>x.id===itemId);if(!it)return;
  const m=((s.battle&&s.battle.combatants)||[]).find(x=>x.id===combatKey);
  const localId=(m&&m.charId)||String(combatKey).replace(/^p_/,"");
  const c=activeWB().characters.find(x=>x.id===localId);
  const mine=!!c&&(!m||!m.campId||m.campId===campId());
  it.heldBy=combatKey;
  if(it.secret)it.revealed=true;   // its effect is revealed once picked up
  const rec={itemId,scnId:s.id,name:it.name,note:it.note,when:it.when||"",effect:it.effect||null};
  if(m){ m.finds=Array.isArray(m.finds)?m.finds:[]; if(!m.finds.some(f=>f.itemId===itemId))m.finds.push(rec); }
  if(mine){ c.pickups=c.pickups||[]; if(!c.pickups.some(p=>p.itemId===itemId&&p.scnId===s.id))c.pickups.push(rec); }
  pickupOpenId=null;save();renderScenarioView();
  toast(((m&&m.name)||(c&&c.name)||"Character")+" picked up "+it.name);
}
function dropPickup(s,itemId){
  const it=(s.items||[]).find(x=>x.id===itemId);if(!it)return;
  const m=((s.battle&&s.battle.combatants)||[]).find(x=>x.id===it.heldBy);
  if(m&&Array.isArray(m.finds))m.finds=m.finds.filter(f=>f.itemId!==itemId);
  const localId=(m&&m.charId)||String(it.heldBy||"").replace(/^p_/,"");
  const c=activeWB().characters.find(x=>x.id===localId);
  if(c&&c.pickups)c.pickups=c.pickups.filter(p=>!(p.itemId===itemId&&p.scnId===s.id));
  it.heldBy=null;save();renderScenarioView();
}

/* ---- PHASE 3: apply a pick-up's effect to a character (AI-interpreted) ---- */
function renderPickupsGroup(c){
  const g=document.createElement("div");g.className="dgroup";
  const pk=c.pickups||[];
  g.innerHTML=`<div class="ghead"><span class="eyebrow">Campaign pick-ups</span><span class="rule"></span><span class="gcost mono">${pk.length}</span></div>`;
  const list=document.createElement("div");list.className="sel-list";
  pk.forEach(p=>{
    const row=document.createElement("div");row.className="sel-row";row.style.flexDirection="column";row.style.alignItems="stretch";row.style.gap="8px";
    row.innerHTML=`
      <div style="display:flex;justify-content:space-between;gap:10px">
        <div class="srmain"><div class="srname">${esc(p.name)}${p.applied?' <span class="tag" style="color:var(--arcane);border-color:var(--arcane)">changed</span>':""}</div>${p.note?`<div class="srdesc">${esc(p.note)}</div>`:""}${p.when?`<div class="pick-when">⏱ ${esc(p.when)}</div>`:""}</div>
        <button class="rm" data-rm aria-label="Discard">×</button>
      </div>
      ${p.applied&&p.effect?`<div class="pickup-eff">✦ ${esc(p.effect.summary||"Transformed.")}</div>`:""}
      <div class="add-line">
        ${p.applied?`<button class="addbtn" data-revert>↺ Revert change</button>`:`<button class="addbtn" data-apply style="border-color:var(--arcane);color:var(--arcane)"><span class="p">✦</span> Apply effect</button>`}
      </div>`;
    row.querySelector("[data-rm]").onclick=()=>removePickup(c,p);
    const ap=row.querySelector("[data-apply]");if(ap)ap.onclick=()=>applyPickup(c,p);
    const rv=row.querySelector("[data-revert]");if(rv)rv.onclick=()=>{revertPickup(c,p);buildDossier();persist();if(cardCharId===c.id)buildCard();toast("Change reverted");};
    list.appendChild(row);
  });
  g.appendChild(list);
  return g;
}
async function applyPickup(c,p){
  if(p.effect_pre===undefined)p.effect_pre=(p.effect&&p.effect.apply!==undefined&&!p.applied)?p.effect:null;
  const pre=p.effect_pre||((p.effect&&typeof p.effect.apply==="boolean")?p.effect:null);
  if(pre){
    if(pre.apply===false){toast("Flavour only — it changes nothing on the sheet");p.applied=true;p.effect={summary:pre.summary||"Kept."};save();buildDossier&&buildDossier();persist();return;}
    openEffectPreview(c,p,pre); return;                 // decided by the DM when the scenario was written
  }
  const s=await getSample();
  if(!s){toast("This find carries no written effect, and only the Claude app can work one out");return;}
  toast("Interpreting the item…");
  const tNames=c.traits.map(id=>CAT.trait[id]&&CAT.trait[id].name).filter(Boolean).join(", ")||"none";
  const aNames=c.abilities.map(id=>CAT.ability[id]&&CAT.ability[id].name).filter(Boolean).join(", ")||"none";
  const traitList=Object.values(CAT.trait).map(o=>o.name).join(", ");
  const abilityList=Object.values(CAT.ability).map(o=>o.name).join(", ");
  const prompt=`In the grimdark sci-fi tabletop game Planet 28, a character has picked up a collectible that changes them. Decide its mechanical effect.
Item: "${p.name}"${p.note?` — ${p.note}`:""}.
Current character "${c.name||"the character"}": skills A ${c.skills.A}, F ${c.skills.F}, S ${c.skills.S}, AW ${c.skills.AW}, P ${c.skills.P}; HP ${c.hp}; traits: ${tNames}; abilities: ${aNames}.
The change may be minor (a small boon or curse) or a dramatic TRANSFORMATION into something new — match the item's flavour. You can adjust skills (as deltas), HP (delta), add or remove traits, add abilities, and rename the character.
Use ONLY these trait names: ${traitList}.
Use ONLY these ability names: ${abilityList}.
Reply with ONLY a JSON object like:
{"summary":"one vivid sentence describing what happens to them","newName":"","skills":{"A":0,"F":0,"S":0,"AW":0,"P":0},"hp":0,"addTraits":[],"removeTraits":[],"addAbilities":[],"note":"a sentence of flavour to add to their background"}
Keep each skill delta between -4 and +4 and HP between -10 and +10. For a full transformation, rename them and change several things; for a minor pick-up change little. Set "newName" to "" to keep the current name.`;
  try{
    const eff=await s.json(prompt,{modelTier:"default",cache:false});
    openEffectPreview(c,p,eff);
  }catch(e){toast(sampleErr(e&&e.code));}
}
function effectLines(eff){
  const L=[];
  if(eff.newName)L.push(`→ <b>${esc(String(eff.newName))}</b>`);
  const sd=eff.skills||{};["A","F","S","AW","P"].forEach(k=>{const d=Math.round(+sd[k]||0);if(d)L.push(`${k} ${d>0?"+":"−"}${Math.abs(d)}`);});
  const hd=Math.round(+eff.hp||0);if(hd)L.push(`HP ${hd>0?"+":"−"}${Math.abs(hd)}`);
  (eff.addTraits||[]).forEach(n=>{if(findCat("trait",n))L.push(`+ ${esc(n)}`);});
  (eff.removeTraits||[]).forEach(n=>{if(findCat("trait",n))L.push(`− ${esc(n)}`);});
  (eff.addAbilities||[]).forEach(n=>{if(findCat("ability",n))L.push(`+ ${esc(n)}`);});
  return L;
}
function openEffectPreview(c,p,eff){
  eff=eff&&typeof eff==="object"?eff:{};
  const body=$("#modalBody");
  const lines=effectLines(eff);
  body.innerHTML=`
    <h3>Apply pick-up · ${esc(p.name)}</h3>
    <p class="lead" style="font-style:italic;color:var(--arcane)">${esc(eff.summary||"Something changes…")}</p>
    ${lines.length?`<div class="eff-changes">${lines.map(l=>`<span class="eff-chip">${l}</span>`).join("")}</div>`:`<p class="lead">Flavour only — no mechanical change.</p>`}
    ${eff.note?`<p class="lead" style="margin-top:2px">“${esc(eff.note)}”</p>`:""}
    <div class="modal-actions">
      <button class="btn primary sm" id="effApply">Apply to ${esc(c.name)||"character"}</button>
      <button class="btn sm" id="effRetry">✦ Try again</button>
      <button class="btn ghost sm" id="effCancel" style="margin-left:auto">Cancel</button>
    </div>`;
  $("#effApply").onclick=()=>{applyEffect(c,p,eff);closeModal();if(curCharId===c.id)buildDossier();persist();if(cardCharId===c.id)buildCard();toast("Character changed");};
  $("#effRetry").onclick=()=>{closeModal();applyPickup(c,p);};
  $("#effCancel").onclick=closeModal;
  showModal();
}
function applyEffect(c,p,eff){
  p.before={name:c.name,skills:Object.assign({},c.skills),hp:c.hp,traits:[...c.traits],abilities:[...c.abilities],bg:c.bg};
  if(eff.newName)c.name=String(eff.newName).slice(0,42);
  const sd=eff.skills||{};["A","F","S","AW","P"].forEach(k=>{let v=c.skills[k]+Math.round(+sd[k]||0);c.skills[k]=Math.max(1,Math.min(10,v));});
  let hp=c.hp+Math.round(+eff.hp||0);if(hp<2)hp=2;if(hp%2)hp+=1;c.hp=hp;
  (eff.removeTraits||[]).forEach(n=>{const o=findCat("trait",n);if(o)c.traits=c.traits.filter(id=>id!==o.id);});
  (eff.addTraits||[]).forEach(n=>{const o=findCat("trait",n);if(o&&!c.traits.includes(o.id))c.traits.push(o.id);});
  (eff.addAbilities||[]).forEach(n=>{const o=findCat("ability",n);if(o&&!c.abilities.includes(o.id))c.abilities.push(o.id);});
  if(eff.note)c.bg=(c.bg?c.bg+"\n\n":"")+String(eff.note);
  p.applied=true;p.effect={summary:String(eff.summary||"")};
  save();
}
function revertPickup(c,p){
  const b=p.before;if(!b)return;
  c.name=b.name;c.skills=Object.assign({},b.skills);c.hp=b.hp;c.traits=[...b.traits];c.abilities=[...b.abilities];c.bg=b.bg;
  p.applied=false;delete p.effect;delete p.before;save();
}
function removePickup(c,p){
  const go=()=>{c.pickups=(c.pickups||[]).filter(x=>x!==p);
    const scn=findScn(p.scnId);if(scn){const it=(scn.items||[]).find(i=>i.id===p.itemId);if(it&&it.heldBy===c.id)it.heldBy=null;}
    save();buildDossier();persist();if(cardCharId===c.id)buildCard();};
  if(p.applied)askConfirm("Discard the pick-up “"+p.name+"”? Its change to "+(c.name||"the character")+" stays — revert first if you want to undo it.",go,{danger:true,yesLabel:"Discard"});
  else go();
}

/* which sections are open — remembered per device */
function accState(){try{return JSON.parse(localStorage.getItem("p28_scnacc")||"{}")||{};}catch(e){return {};}}
function accSet(k,v){const st=accState();st[k]=!!v;try{localStorage.setItem("p28_scnacc",JSON.stringify(st));}catch(e){}}
function accOpen(k,dflt){const st=accState();return (k in st)?!!st[k]:!!dflt;}
function accSection(key,icon,title,summary,inner,dflt){
  if(!inner)return "";
  return `<details class="scn-acc" data-acc="${key}"${accOpen(key,dflt)?" open":""}>
    <summary><span class="acc-t">${icon} ${title}</span><span class="acc-s">${summary||""}</span><span class="acc-c">›</span></summary>
    <div class="acc-body">${inner}</div></details>`;
}
/* the host's whole flow in one box: the code, who has joined, and the one next step */
function hostStage(s){
  const hosting=liveRole==="host"&&s.id===hostScenarioId;
  if(!hosting)return "host";
  if(!(s.battle&&s.battle.started))return "battle";
  if(!s.outcome)return "end";
  return "done";
}
function hostBarHTML(s){
  if(!fbAvailable()||!isHost()||scnReadOnly)return "";
  const st=hostStage(s), hosting=st!=="host";
  const steps=["import","host","battle","end"];
  const cur=st==="host"?1:st==="battle"?2:st==="end"?3:4;
  const stepRow=`<div class="hb-steps">${["Import","Host","Battle","End"].map((n,i)=>`<span class="${i<cur?"done":i===cur?"now":""}">${n}</span>`).join("<i></i>")}</div>`;
  const players=(livePlayers||[]);
  const plist=hosting?`<div class="hb-players">${players.length?players.map(p=>`<div class="hb-pl"><span class="hb-dot"></span><b>${esc(p.name||"?")}</b><small>· ${esc(p.warbandName||"warband")} · ${(p.combatants||[]).length} model${(p.combatants||[]).length===1?"":"s"} ✓</small></div>`).join(""):""}
      ${st==="battle"?`<div class="hb-pl wait"><span class="hb-dot wait"></span><small>${players.length?"waiting for more…":"waiting for players to join with the code…"}</small></div>`:""}</div>`:"";
  const o=s.outcome&&OUTCOMES[s.outcome.result];
  const main=st==="host"?`<div><div class="hb-code dim">— — — —</div><div class="hb-st">host it to get a game code</div></div><button class="btn primary sm" id="hbHost">📡 Host live</button>`
    :st==="battle"?`<div><div class="hb-code">${esc(hostCode)}</div><div class="hb-st">players join with this code</div></div><button class="btn primary sm" id="hbStart">⚔ Start the battle</button>`
    :st==="end"?`<div><div class="hb-code">${esc(hostCode)}</div><div class="hb-st">turn ${curRound(s)}${s.rounds?" of "+s.rounds:""} · running</div></div><div class="hb-btns"><button class="btn sm ${tableMode?"":"ghost"}" id="hbTable">${tableMode?"◉ Table mode":"○ Table mode"}</button><button class="btn primary sm" id="hbEnd">⚑ End the quest</button></div>`
    :`<div><div class="hb-code">${esc(hostCode)}</div><div class="hb-st">${o?o.icon+" "+esc(o.short)+" on turn "+(s.outcome.round||"?"):"finished"} · players can return to camp</div></div><button class="btn primary sm" id="hbStop">Stop hosting</button>`;
  return `<div class="hostbar">${stepRow}<div class="hb-main">${main}</div>${plist}${hosting&&st!=="done"?`<div class="hb-foot"><button class="linkbtn" id="hbStopSoft">stop hosting</button></div>`:""}</div>`;
}
let tableMode=(()=>{try{return localStorage.getItem("p28_table")==="1";}catch(e){return false;}})();
function setTableMode(v){tableMode=!!v;try{localStorage.setItem("p28_table",v?"1":"0");}catch(e){}renderScenarioView();}
/* H2 · the table: one screen for running the game, nothing else */
function tableHTML(s){
  const cur=curRound(s), tot=s.rounds, over=tot&&cur>=tot;
  const next=(s.events||[]).filter(e=>e.round>cur).sort((a,b)=>a.round-b.round)[0];
  const M=isMystery(s)?s.mystery:null;
  const env=M?`<div class="tbl-env">${M.envelopes.filter(e=>!e.opened).slice(0,3).map(e=>`<div class="env sealed"><div class="env-h"><b>${esc(e.title)}</b><span class="env-trig">open when: ${esc(e.trigger)}</span></div><button class="btn sm" data-envopen="${e.id}">✉ Open</button></div>`).join("")||`<div class="none-note">Every envelope is open.</div>`}</div>`:"";
  return `<div class="scn-detail table">
    <div class="tbl-top"><button class="scn-back" id="tblBack">‹ Full page</button><span class="tbl-title">${esc(s.title)}</span><span class="chip live">📡 ${esc(hostCode)}</span></div>
    <div class="tbl-turn"><div class="tbl-l">turn</div><div class="tbl-n">${cur}${tot?`<small>/${tot}</small>`:""}</div>

function myWarbandHTML(s){
  const rows=myCombatantsIn(s); if(!rows.length)return "";
  const w=activeWB(), byKey={};
  rows.forEach(m=>{const k=m.charId||("v:"+m.vehId);(byKey[k]=byKey[k]||[]).push(m);});
  const cards=Object.entries(byKey).map(([k,ms])=>{
    const first=ms[0], c=first.charId?w.characters.find(x=>x.id===first.charId):null;
    const cur=ms.reduce((a,m)=>a+Math.max(0,m.curHP|0),0), max=ms.reduce((a,m)=>a+(m.maxHP|0),0);
    const down=cur<=0, half=!down&&cur<=max*0.5;
    const name=(c&&c.name)||first.name.replace(/ \d+\/\d+$/,"");
    const finds=[].concat(...ms.map(m=>m.finds||[])).map(f=>f.name).filter(Boolean);
    const squad=ms.length>1?`<span class="chip">⛊ ${ms.filter(m=>(m.curHP|0)>0).length}/${ms.length} standing</span>`:"";
    const conds=[].concat(...ms.map(m=>m.conditions||[])).map(cd=>`<span class="chip amber">◈ ${esc(cd.label)}</span>`).join("");
    return `<div class="me ${down?"down":half?"hurt":""}">
      <div class="me-t"><b>${esc(name)}</b><span class="me-hp ${down?"d":half?"h":""}">${down?"DOWN":cur+`<small>/${max}</small>`}</span></div>

  });
  el.querySelectorAll("[data-hp]").forEach(b=>b.onclick=()=>{const[id,d]=b.dataset.hp.split("|");const m=(s.battle.combatants||[]).find(x=>x.id===id);if(!m)return;
    const was=m.curHP; m.curHP=Math.max(0,Math.min(m.maxHP,m.curHP+ +d));
    const base=squadBase(m.id);
    if(base&&!m.solo){ s.battle.sqTarget=s.battle.sqTarget||{};
      if(+d<0&&m.curHP>0)s.battle.sqTarget[base]=m.id;               // this one takes the hits from now on
      if(m.curHP<=0&&s.battle.sqTarget[base]===m.id)delete s.battle.sqTarget[base];   // fallen — choose the next
    }
    save();renderScenarioView();renderRoster();renderVehicleRoster();if(liveRole==="host")scheduleHostSync(s);});
  el.querySelectorAll("[data-tick]").forEach(b=>b.onclick=()=>{const u=battleUnits(s).find(x=>x.id===b.dataset.tick);if(!u)return;if(u.acted)unitRows(u).forEach(m=>{delete m.acted;});else markActed(s,u);save();renderScenarioView();if(liveRole==="host")scheduleHostSync(s);});
  const nbD=$("#nbDone");if(nbD)nbD.onclick=()=>{const u=currentUnit(s);if(u)markActed(s,u);save();renderScenarioView();if(liveRole==="host")scheduleHostSync(s);};
  const nbA=$("#nbAct");if(nbA)nbA.onclick=()=>{const u=currentUnit(s);if(!u)return;const r=u.m||u.members[0];r.pips=Math.min(2,(r.pips||0)+1);if(r.pips>=2){markActed(s,u);}else s.battle.cursor=u.id;save();renderScenarioView();if(liveRole==="host")scheduleHostSync(s);};
  const nbH=$("#nbHold");if(nbH)nbH.onclick=()=>{const u=currentUnit(s);if(!u)return;unitRows(u).forEach(m=>{m.held=true;});delete s.battle.cursor;save();renderScenarioView();toast(u.name+" holds — acts later this turn");if(liveRole==="host")scheduleHostSync(s);};
  el.querySelectorAll("[data-solo]").forEach(b=>b.onclick=()=>{const m=(s.battle.combatants||[]).find(x=>x.id===b.dataset.solo);if(!m)return;m.solo=true;save();renderScenarioView();toast(m.name+" is out of unit — a separate character until back within 5cm");if(liveRole==="host")scheduleHostSync(s);});
  el.querySelectorAll("[data-rejoin]").forEach(b=>b.onclick=()=>{const m=(s.battle.combatants||[]).find(x=>x.id===b.dataset.rejoin);if(!m)return;delete m.solo;save();renderScenarioView();if(liveRole==="host")scheduleHostSync(s);});
  el.querySelectorAll("[data-rf]").forEach(b=>b.onclick=()=>{rosterFilter=b.dataset.rf;renderScenarioView();});
  el.querySelectorAll("details.btl-squad > summary").forEach(sm=>sm.addEventListener("click",()=>{const d=sm.parentElement;setTimeout(()=>accSet("sq_"+d.dataset.sq,d.open),0);}));
  el.querySelectorAll("[data-cond]").forEach(b=>b.onclick=()=>{const[id,ci]=b.dataset.cond.split("|");const m=(s.battle.combatants||[]).find(x=>x.id===id);if(m){m.conditions.splice(+ci,1);save();renderScenarioView();}});
  // pickups
  el.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const it=(s.items||[]).find(x=>x.id===b.dataset.pick);if(it&&it.secret&&!it.revealed){it.revealed=true;save();}openFoundItem(s,it);});
  el.querySelectorAll("[data-pickcancel]").forEach(b=>b.onclick=()=>{pickupOpenId=null;renderScenarioView();});
  el.querySelectorAll("[data-assign]").forEach(b=>b.onclick=()=>{const[itId,cId]=b.dataset.assign.split("|");assignPickup(s,itId,cId);});
  el.querySelectorAll("[data-drop]").forEach(b=>b.onclick=()=>dropPickup(s,b.dataset.drop));
  el.querySelectorAll("[data-search]").forEach(b=>b.onclick=()=>searchCache(s,b.dataset.search));
  el.querySelectorAll("[data-tally]").forEach(b=>b.onclick=()=>{const[cid,k]=b.dataset.tally.split("|");const c=activeWB().characters.find(x=>x.id===cid);if(c)bumpTally(c,k);});
  el.querySelectorAll("[data-stash]").forEach(b=>b.onclick=()=>{const[id,lbl]=b.dataset.stash.split("|");stashItem(s,id,lbl);});
  // reveal secrets
  el.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>{const[cat,i]=b.dataset.reveal.split("|");const it=(s[cat]||[])[+i];if(it){it.revealed=true;save();renderScenarioView();}});
  const mp=el.querySelector(".scn-map-wrap .scn-map");if(mp)mp.onclick=()=>openMapLightbox(s.map,s.map&&s.map.note);
  wireMapNums(mp);

    const lb2=$("#scnLeave");if(lb2)lb2.onclick=leaveGame;

  const hh=$("#scnHost");if(hh)hh.onclick=()=>openHostDialog(s);
  const hs=$("#hostStop");if(hs)hs.onclick=stopHosting;
  const hs2=$("#hostStop2");if(hs2)hs2.onclick=stopHosting;

}
function scenarioText(s){
  let o=`${s.title}\n${s.mode==="coop"?"Co-op":"PvP"} · ${s.players} players · ${s.points} pts · ${s.gameLength}\n\n${s.premise}\n\n`;
  if(s.briefing)o+=s.briefing+"\n\n";
  if((s.objectives||[]).length)o+="OBJECTIVES:\n"+s.objectives.map(x=>"- "+x).join("\n")+"\n\n";
  if(s.deployment)o+="DEPLOYMENT: "+s.deployment+"\n\n";
  if(s.scenery)o+="SCENERY: "+s.scenery+"\n\n";
  if((s.specialRules||[]).length)o+="SPECIAL RULES:\n"+s.specialRules.map(x=>"- "+x).join("\n")+"\n\n";
  if(s.twist)o+="TWIST: "+s.twist+"\n\n";
  if((s.events||[]).length)o+="TIMED EVENTS:\n"+s.events.map(e=>e.kind==="deadline"?"- By turn "+e.round+" (deadline): "+e.title+(e.text?" — "+e.text:""):"- Turn "+e.round+" (surprise): "+e.title+(e.text?" — "+e.text:"")).join("\n")+"\n\n";
  const seq=mapSeq(s.map);
  if(seq.length)o+="MAP KEY:\n"+seq.map(e=>{const r=FEAT_ROLES[e.role],g=GROUND[e.ground];return "  "+e.n+". "+e.label+(r?" — "+r.label:"")+(g?" ["+g.label+"]":"");}).join("\n")+"\n\n";
  const pl=list=>(list||[]).map(raw=>{
    const x=prepEntry(raw);
    const n=mapNumsFor(s.map,x.mapLabel), pre=n.length?"["+n.join(",")+"] ":"";
    const r=FEAT_ROLES[prepRole(s.map,x)], rc=r?" ["+r.label+"]":"";
    if(x.secret&&!x.revealed)return pre+(x.hint||"a hidden surprise")+rc;
    return pre+x.name+(x.note?" ("+x.note+")":"")+rc+(x.when?" — when: "+x.when:"");
  }).join("; ");
  const prep=[];
  if((s.terrain||[]).length)prep.push("Terrain: "+pl(s.terrain));
  if((s.markers||[]).length)prep.push("Markers: "+pl(s.markers));
  if((s.npcs||[]).length)prep.push("Extra characters: "+pl(s.npcs));
  if((s.items||[]).length)prep.push("Custom items: "+pl(s.items));
  if(prep.length)o+="TO BUILD / PRINT (numbers match the map key):\n"+prep.map(x=>"- "+x).join("\n")+"\n\n";
  if(s.mode==="coop")o+="ENEMY FORCE: "+enemyTargetFor(s)+" pts (run by the DM, "+diffOf(s).label+")\n";
  return o;
}

/* ---- Escape and the phone's back button both close the top-most overlay ----
   Every overlay open pushes ONE history entry; going back pops it and closes the overlay
   instead of leaving the page. Closing by button pops that entry ourselves so the stack
   stays clean. If another overlay is still open underneath, the entry is re-armed. */
const OVERLAY_SEL=".confirm.show,.maplb.show,.picker.show,.modal.show,.dossier.show,.cardwrap.show,.menupop.show,#cheatDrawer.show";
function overlayOpenNow(){return !!document.querySelector(OVERLAY_SEL);}
function closeTopOverlay(){
  if($("#confirmWrap").classList.contains("show"))return closeConfirm();
  if($("#mapLightbox").classList.contains("show"))return closeMapLightbox();
  if($("#picker").classList.contains("show"))return closePicker();
  if($("#modal").classList.contains("show"))return closeModal();
  if($("#dossier").classList.contains("show"))return closeDossier();
  if($("#cardWrap").classList.contains("show"))return closeCard();
  const mp=$("#menuPop");if(mp&&mp.classList.contains("show"))return mp.classList.remove("show");
  const cd=$("#cheatDrawer");if(cd&&cd.classList.contains("show"))return closeCheat();
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeTopOverlay();});
let ovArmed=false, ovSelfBack=false;
function ovSync(){
  const open=overlayOpenNow();
  if(open&&!ovArmed){try{history.pushState({p28ov:1},"");ovArmed=true;}catch(e){}}
  else if(!open&&ovArmed){ovArmed=false;ovSelfBack=true;try{history.back();}catch(e){ovSelfBack=false;}}
}
window.addEventListener("popstate",()=>{
  if(ovSelfBack){ovSelfBack=false;return;}       // the pop we asked for after a button close
  if(!ovArmed)return;                              // not ours — let the browser do its thing
  ovArmed=false;
  closeTopOverlay();
  if(overlayOpenNow()){try{history.pushState({p28ov:1},"");ovArmed=true;}catch(e){}}
});
(function(){
  let t=0;
  new MutationObserver(()=>{if(!t)t=setTimeout(()=>{t=0;ovSync();},0);})
    .observe(document.body,{attributes:true,attributeFilter:["class","hidden"],subtree:true});
})();

/* ---- tooltips (hover + tap) for [data-tip] elements ---- */
(function(){
  const tip=document.createElement("div");tip.className="tooltip-pop";document.body.appendChild(tip);
  let pinned=null;
  function place(el){
    tip.style.display="block";
    const r=el.getBoundingClientRect(), t=tip.getBoundingClientRect();
    let left=r.left+r.width/2-t.width/2;
    left=Math.max(8,Math.min(left,window.innerWidth-t.width-8));
    let top=r.top-t.height-8;
    if(top<8)top=r.bottom+8;
    tip.style.left=left+"px";tip.style.top=top+"px";
  }
  function show(el){if(!el||!document.contains(el)){hide();return;}const txt=el.getAttribute("data-tip");if(!txt)return;tip.textContent=txt;place(el);}
  function hide(){tip.style.display="none";pinned=null;}
  const near=e=>e.target&&e.target.closest?e.target.closest("[data-tip]"):null;
  document.addEventListener("mouseover",e=>{if(pinned)return;const el=near(e);if(el)show(el);});
  document.addEventListener("mouseout",e=>{if(pinned)return;const el=near(e);if(el)hide();});
  document.addEventListener("focusin",e=>{if(pinned)return;const el=near(e);if(el)show(el);});
  document.addEventListener("focusout",()=>{if(!pinned)hide();});
  document.addEventListener("click",e=>{
    const el=near(e);
    if(el){pinned=(pinned===el)?null:el;pinned?show(el):hide();}
    else if(pinned)hide();
  });
  window.addEventListener("scroll",()=>{if(!pinned)hide();},true);
  window.addEventListener("resize",hide);
})();

/* A saved passphrase means this device already belongs to a table, but roomKey is only ever
   set lazily by ensureRoom(), so on a fresh load the camp header wrongly offered "Set group
   passphrase" — and clicking it silently reused the saved word without ever prompting, which
   is why the passphrase looked unchangeable. Restore the room on load so the header tells the
   truth and "change passphrase" is reachable on the first click. */
(async()=>{ try{
  if(fbAvailable()&&savedPass()&&!roomKey){
    roomKey=await hashKey(savedPass());
    render(); if(currentView==="scenarios")renderScenarioView();
    pullScns();

}catch(e){} })();
