    const base=box.value.trim();if(!base)return;
    en.disabled=true;const label=en.textContent;en.textContent="Enhancing…";
    const ip=`Rewrite this text-to-image prompt into a single vivid, richly detailed paragraph for an AI image generator. Keep every concrete detail (${isVeh?"vehicle type, armour, sections and weapons":"weapons, armour, physical traits"}, and the stated art style). Add tasteful visual detail — lighting, materials, colour, mood, composition — fitting a grimdark science-fiction tabletop ${isVeh?"vehicle":"character"}. Do NOT invent a name or backstory. Output only the finished prompt, no preamble.\n\nPrompt:\n${base}`;
    try{
      await s(ip,{modelTier:"quick",onText:({text})=>{box.value=text;}});
      toast("Prompt enhanced");
    }catch(e){
      if(e&&e.text)box.value=e.text;
      if(!e||e.code!=="cancelled")toast(sampleErr(e&&e.code));
    }finally{en.disabled=false;en.textContent=label;}
  };
  $("#pmClose").onclick=closeModal;

/* ============================ AI NAME GENERATOR ============================ */
function briefFromObj(o,isVeh){
  const bits=[];
  if(o.role&&o.role.trim())bits.push((isVeh?"Type/role: ":"Role/archetype: ")+o.role.trim());
  if(isVeh){

/* what this character may cost: the room in the build budget (its own current cost counts as
   free to re-spend), or the pool for a recruit. null = the dossier is locked, no builds offered */
function buildAllowanceFor(c){
  const w=activeWB();
  if(wbSealed(w)){
    if(!c.recruit)return null;
    return {pts:Math.max(0,(w.cp||0)),gear:false,label:"campaign points in the pool"};
  }
  const n=memberCount(c), room=w.budget-wbSpent(w)+(isFielded(c)?unitCost(c):0);
  return {pts:Math.max(RULES.baseCost,Math.floor(room/n)),gear:true,label:"build points"};
}
function catForBuild(gear){
  const L=(cat)=>Object.values(CAT[cat]).map(o=>`${o.name} (${o.cost})`).join(", ");
  return `TRAITS (points; negative ones refund points): ${L("trait")}
ABILITIES (points): ${L("ability")}`+(gear?`
WEAPONS (points): ${L("weapon")}
ARMOUR (points): ${L("armour")}
ITEMS (points): ${L("item")}`:"");
}
/* trim a suggested build to the catalogue and the allowance — never over, never illegal */
function legaliseBuild(raw,allow){
  if(!raw||typeof raw!=="object")return null;
  const b={skills:{},hp:RULES.hpStart,traits:[],abilities:[],weapons:[],armour:[],items:[]};
  SKILLS.forEach(([k])=>{b.skills[k]=Math.max(RULES.skillMin,Math.min(RULES.skillMax,Math.round(+((raw.skills||{})[k])||1)));});
  let hp=Math.round(+raw.hp||RULES.hpStart); hp=RULES.hpStart+Math.round((hp-RULES.hpStart)/RULES.hpStep)*RULES.hpStep; b.hp=Math.max(2,Math.min(60,hp));
  const ids=(arr,cat)=>[...new Set((Array.isArray(arr)?arr:[]).map(n=>{const o=findCat(cat,n);return o?o.id:null;}).filter(Boolean))];
  b.traits=ids(raw.traits,"trait").slice(0,4); b.abilities=ids(raw.abilities,"ability").slice(0,3);
  if(allow.gear){b.weapons=ids(raw.weapons,"weapon").slice(0,3).map(id=>({id,qty:1}));b.armour=ids(raw.armour,"armour").slice(0,1).map(id=>({id,qty:1}));b.items=ids(raw.items,"item").slice(0,2).map(id=>({id,qty:1}));}
  const cost=()=>allow.gear?charCost(Object.assign({},b)):RULES.baseCost+skillPts(b)+hpPts(b)+listPts(b.traits,"trait")+listPts(b.abilities,"ability");
  // recruits pay only for levels, traits and abilities — gear is credits later
  let guard=60;
  while(cost()>allow.pts&&guard-->0){
    if(b.items.length){b.items.pop();continue;}
    if(b.abilities.length){b.abilities.pop();continue;}
    if(b.armour.length){b.armour.pop();continue;}
    if(b.weapons.length>1){b.weapons.pop();continue;}
    const posT=b.traits.filter(id=>CAT.trait[id].cost>0); if(posT.length){b.traits.splice(b.traits.indexOf(posT[posT.length-1]),1);continue;}
    // one weapon left: if losing it alone closes the gap, it goes before the character's own levels do
    if(b.weapons.length&&CAT.weapon[b.weapons[0].id].cost>=cost()-allow.pts){b.weapons.pop();continue;}
    if(b.hp>RULES.hpStart){b.hp-=RULES.hpStep;continue;}
    const top=SKILLS.map(([k])=>k).sort((x,y)=>b.skills[y]-b.skills[x])[0]; if(b.skills[top]>1){b.skills[top]--;continue;}
    if(b.weapons.length){b.weapons.pop();continue;}
    break;
  }
  b.cost=cost();
  return b;
}
function buildSummary(b,allow){
  const names=(arr,cat,qty)=>arr.map(e=>CAT[cat][qty?e.id:e]).filter(Boolean).map(o=>o.name);
  const parts=[SKILLS.map(([k])=>k+" "+b.skills[k]).join(" · "),b.hp+" HP"];
  const ta=names(b.traits,"trait").concat(names(b.abilities,"ability")); if(ta.length)parts.push(ta.join(", "));
  const g=names(b.weapons,"weapon",1).concat(names(b.armour,"armour",1),names(b.items,"item",1)); if(g.length)parts.push(g.join(", "));
  return parts.join("  ·  ")+`  ·  <b>${b.cost} ${allow.gear?"pts":"cp"}</b>`;
}

  const A=pilot?Math.max(v.skills.A,pilot.c.skills.A):v.skills.A, S=pilot?Math.max(v.skills.S,pilot.c.skills.S):v.skills.S;
  const damagedFirst=secs.find(s=>(s.cur|0)>0&&s.cur<s.max);
  const vweaps=(v.weapons||[]).map(e=>({o:CAT.vweapon[e.id],q:e.qty,e})).filter(x=>x.o);
  const vtraits=(v.traits||[]).map(id=>CAT.vtrait[id]).filter(Boolean).map(o=>({name:o.name,desc:o.desc}));
  const vabils=(v.abilities||[]).map(id=>CAT.vability[id]).filter(Boolean).map(o=>({name:o.name,desc:o.desc}));
  const strip=`<div class="play ${cardIsEnemy?"enemy":""} ${brk.state==="wreck"?"down":brk.state==="test"?"hurt":""}">
    <div class="play-l1"><span class="play-hp ${brk.state==="wreck"?"d":brk.state==="test"?"h":""}">${brk.state==="wreck"?"WRECK":total+`<small>/${max}</small>`}</span>
      ${row?`<span class="chip amber">⚔ deployed</span>`:v.laidUp?`<span class="chip red">laid up</span>`:isFielded(v)?`<span class="chip teal">◉ fielded</span>`:`<span class="chip">○ benched</span>`}
      ${brk.state==="test"?`<span class="chip red">⚠ break test · 1D10 under ${brk.target}</span>`:brk.state==="steady"?`<span class="chip">last 3 sections — no more tests</span>`:""}
      ${pilot?`<span class="chip teal">pilot aboard · A ${A} / S ${S}</span>`:""}
      ${(row&&row.conditions||[]).map(cd=>`<span class="chip amber">◈ ${esc(cd.label)}</span>`).join("")}</div>
    <div class="play-l2">Speed <b>${esc(ty[2])}</b> · ${alive}/${secs.length} sections · no armour roll — damage lands on a section · in cover when <b>${cover}</b> · melee <b>F ${meleeF}</b>, <b>${meleeD}</b>${facings?" · 4 facings":" · no facings"}${brk.state==="test"?` · <span class="chip red">test every time a section is destroyed; 3 fails in a row → derelict</span>`:""}</div>
  </div>`;
  const secRows=secs.map(s=>{const dead=(s.cur|0)<=0, pct=Math.round(100*Math.max(0,s.cur)/s.max);
    return `<div class="vsec ${dead?"dead":""}"><span class="vs-n">${esc(s.name)}${facings&&s.facing&&s.facing!=="C"?` <small>${s.facing}</small>`:""}</span><span class="vs-bar"><i class="${dead?"d":pct<=50?"h":""}" style="width:${pct}%"></i></span><span class="vs-v">${Math.max(0,s.cur)}/${s.max}</span>${edit?`<span class="vs-pm"><button class="hpb" data-vsec="${s.key}|-1">−</button><button class="hpb" data-vsec="${s.key}|1">+</button></span>`:""}</div>
    ${dead?`<div class="vs-eff">destroyed — ${SEC_LOSS[s.kind]}</div>`:damagedFirst&&damagedFirst.key===s.key?`<div class="vs-eff amber">damaged — must take the next hit until destroyed</div>`:""}`;}).join("");
  const facingBox=facings?`<div class="facing"><div></div><div class="c">FRONT<br><small>${esc(secs.filter(s=>s.facing==="F").map(s=>s.name).join(", ")||"—")}</small></div><div></div><div class="c">LEFT<br><small>${esc(secs.filter(s=>s.facing==="L").map(s=>s.name).join(", ")||"—")}</small></div><div class="c">${esc(secs.filter(s=>s.facing==="C").map(s=>s.name).join(" · "))}</div><div class="c">RIGHT<br><small>${esc(secs.filter(s=>s.facing==="R").map(s=>s.name).join(", ")||"—")}</small></div><div></div><div class="c">REAR<br><small>${esc(secs.filter(s=>s.facing==="B").map(s=>s.name).join(", ")||"—")}</small></div><div></div></div>
    ${!row&&!cardIsEnemy?`<div class="none-note" style="font-style:normal;margin:0 18px 6px">Set where each bought section sits: tap a section's facing letter below.</div>`:""}`:"";
  const facingPick=(!row&&!cardIsEnemy&&facings)?`<div class="gc-sec"><div class="sh">Facings</div>${(v.sections||[]).map((e,i)=>{const o=CAT.vsection[e.id];if(!o)return "";return `<div class="vfac"><span>${esc(o.name)}${(e.qty||1)>1?" ×"+e.qty:""}</span><span class="chips-row">${["F","L","R","B"].map(f=>`<button class="stylechip ${(e.facing||"F")===f?"on":""}" data-vfac="${i}|${f}">${f}</button>`).join("")}</span></div>`;}).join("")||`<div class="gc-empty">Only the core sections — nothing to place.</div>`}</div>`:"";
  const attacks=vweaps.length?`<div class="gc-sec"><div class="sh">Attacks · ${crewN} weapon${crewN===1?"":"s"} per shooting action</div>${vweaps.map(({o,e})=>`<div class="atk"><div class="atk-t"><span>🎯 ${esc(gearLabel(o,e,e.qty||1))}</span><span class="atk-roll">under S ${S}</span></div><div class="atk-s">${o.range&&o.range!=="—"?`<b>${esc(o.range)}</b> · `:""}<b>${esc(o.dmg||"?")}</b>${o.rules&&o.rules!=="—"?" · "+esc(o.rules):""}${o.type?" · "+esc(o.type):""}</div></div>`).join("")}<div class="atk"><div class="atk-t"><span>⚔ Ram / crush</span><span class="atk-roll">under F ${meleeF}</span></div><div class="atk-s">${sizeName.toLowerCase()} hull · <b>${meleeD}</b></div></div></div>`
    :`<div class="gc-sec"><div class="sh">Attacks</div><div class="atk"><div class="atk-t"><span>⚔ Ram / crush</span><span class="atk-roll">under F ${meleeF}</span></div><div class="atk-s">${sizeName.toLowerCase()} hull · <b>${meleeD}</b> · no mounted weapons</div></div></div>`;
  const cap=3*secs.filter(x=>x.kind==="transport"&&(x.cur|0)>0).length;
  const seats=aboard.reduce((a,r)=>a+(r.n||1),0);
  const crewBox=row&&!cardIsEnemy&&(cap||aboard.length)?`<div class="gc-sec"><div class="sh">Aboard · ${seats}/${cap} seats</div>
    ${aboard.map(r=>{const rt=riderTraits.find(x=>x.r===r)||{};return `<div class="rider"><b>${esc(r.name)}${(r.n||1)>1?" ×"+r.n:""}</b>${r.facing?`<span class="chip">${r.facing==="F"?"front":r.facing==="L"?"left":r.facing==="R"?"right":"rear"}</span>`:""}${rt.pilot?`<span class="chip teal">pilot</span>`:""}${rt.eng?`<span class="chip teal">engineer</span>`:""}${rt.gun?`<span class="chip teal">gunner</span>`:""}${hasLoop?`<span class="chip">🔫 loophole</span>`:""}${edit?`<button class="linkbtn" data-off="${esc(r.charId)}">off</button>`:""}</div>`;}).join("")||`<div class="gc-empty">No one aboard.</div>`}
    ${edit&&seats<cap?`<button class="btn sm" id="vBoard" style="margin-top:6px">+ Board a character</button>`:""}
    <div class="none-note" style="font-style:normal;margin-top:6px">Aboard: cannot be targeted, cannot act${hasLoop?" — except shooting through the loopholes at their facing":""}. Getting off costs an action.${riderTraits.some(x=>x.eng)?" Engineer aboard: +1D4 to damaged sections in their facing each turn.":""}${riderTraits.some(x=>x.gun)?" Gunner aboard: may fire a weapon on their facing with their own Shooting.":""}</div></div>`:"";
  const gc=$("#gameCard");
  gc.innerHTML=`<div class="gc-layout single"><div class="gc-body">
    <div class="gc-top"><div class="gc-cost">${cost}<small>PTS</small></div><div class="gc-id">
      <div class="eyebrow"${cardIsEnemy?' style="color:var(--danger)"':''}>Planet 28 · ${cardIsEnemy?"Enemy Vehicle":"Vehicle"}</div>
      <h2 class="gc-name">${esc(v.name)||"Unnamed vehicle"}</h2>
      <div class="gc-role">${esc(v.role||"")}${v.role?" · ":""}${sizeName} ${ty[0].toLowerCase()} vehicle · ${alive}/${secs.length} sections</div></div></div>
    ${strip}
    ${v.hint?`<div class="hint"><b>How it fights</b>${esc(v.hint)}</div>`:""}
    <div class="gc-stats" style="grid-template-columns:repeat(4,1fr)">

      <div class="gc-stat"><b>${total}</b><span>HULL</span><small>of ${max}</small></div><div class="gc-stat"><b>${esc(ty[2]).replace("cm","")}</b><span>CM</span><small>${esc(ty[0])}</small></div></div>
    <div class="gc-sections">
      <div class="gc-sec"><div class="sh">Hull · ${row&&edit?"tap − on the section that was hit":secs.length+" sections"}</div>${secRows}${facingBox}</div>
      ${crewBox}${attacks}
      ${cardSection("Traits & abilities",vtraits.concat(vabils))}
      <div class="gc-sec"><div class="sh">Moves like</div><div class="gc-entry"><div class="en"><span>${esc(ty[0])}</span></div><div class="ed">${esc(ty[3])}</div></div><div class="gc-entry"><div class="ed">${esc(size[1])}</div></div></div>
      ${facingPick}
      ${cardIsEnemy?`<details class="scn-acc" style="margin-top:8px"><summary><span class="acc-t">◉ The Solo AI ladder</span><span class="acc-c">›</span></summary><div class="acc-body">${cardSoloAI(null)}</div></details>`:""}
    </div></div></div>
    <div class="gc-actions">
      ${cardIsEnemy?"":`<button class="btn ${isFielded(v)?"gc-fielded":""}" id="gcvField">${isFielded(v)?"◉ Fielded":"○ Benched"}</button>`}
      ${row&&edit?`<button class="btn" id="vFall">🎲 Fall · D4 facing</button>`:""}
      ${aboard.length&&edit?`<button class="btn" id="vAllOff">⬇ Everyone off</button>`:""}
      ${cardIsEnemy||isWorkshop()?`<button class="btn" id="gcvArt">✦ Art prompt</button>`:""}
      ${cardIsEnemy?"":`<button class="btn primary" id="gcvEdit">Edit</button>`}
      <button class="btn ${cardIsEnemy?"primary":"ghost"}" id="gcvClose">Close</button>
    </div>`;
  $("#gcvClose").onclick=closeCard;
  const vEd=$("#gcvEdit");if(vEd)vEd.onclick=()=>{const id=cardVehId;closeCard();openVehicleDossier(id);};

  gc.querySelectorAll("[data-vfac]").forEach(b=>b.onclick=()=>{const [i,f]=b.dataset.vfac.split("|");if(v.sections[+i]){v.sections[+i].facing=f;save();buildVehicleCard();}});

  const vb=$("#vBoard");if(vb)vb.onclick=()=>vehBoard(v,row);
  const va=$("#vAllOff");if(va)va.onclick=()=>vehDisembark(v,row,null);
  const vf=$("#vFall");if(vf)vf.onclick=()=>{const r=1+Math.floor(Math.random()*4);toast("Fell — damage to the "+(["front","rear","left","right"][r-1])+" facing: 1 per cm above 5. An action to right itself.");};

function openVehicleDossier(id){
  curVehId=id;curCharId=null;buildVehicleDossier();
  $("#scrim").classList.add("show");
  const d=$("#dossier");d.classList.add("show");d.setAttribute("aria-hidden","false");
  syncScroll();
}
function buildVehicleDossier(){
  const v=vehEdit();if(!v)return;
  const cost=vehicleCost(v);
  const d=$("#dossier");
  d.innerHTML=`
    <div class="dossier-head">
      <button class="iconbtn" id="dvBack" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div><div class="eyebrow">Vehicle dossier</div></div>
      <div class="dcost">${dossierCostHTML(cost,null)}</div>
    </div>
    <div class="dbody" id="dvbody"></div>
    <div class="dossier-foot">
      <button class="btn danger ghost" id="dvDelete">Scrap</button>
      <button class="btn primary" id="dvDone">Done</button>
    </div>`;
  const b=$("#dvbody");

  // identity
  const idc=document.createElement("div");idc.className="dgroup";
  idc.innerHTML=`
    <div class="field" style="margin-bottom:12px"><label>Name</label>
      <div class="name-row">
        <input class="input" id="fvName" value="${esc(v.name)}" placeholder="e.g. The Rust Wagon" maxlength="42">
        <button class="genbtn" id="fvGen" title="Suggest a name &amp; background with AI" aria-label="Suggest a name and background with AI">✦</button>
      </div></div>
    <div class="field" style="margin-bottom:12px"><label>Role / description</label><input class="input" id="fvRole" value="${esc(v.role)}" placeholder="e.g. Armoured gun-truck" maxlength="40"></div>
    <div class="field"><label>Background</label><textarea class="input" id="fvBg" placeholder="What is it, and who drives it?">${esc(v.bg)}</textarea></div>`;
  b.appendChild(idc);
  idc.querySelector("#fvName").oninput=e=>{v.name=e.target.value;persist();};
  idc.querySelector("#fvGen").onclick=()=>openNameGen(v,true);
  idc.querySelector("#fvRole").oninput=e=>{v.role=e.target.value;persist();};
  idc.querySelector("#fvBg").oninput=e=>{v.bg=e.target.value;save();};

  // type
  const tg=document.createElement("div");tg.className="dgroup";
  tg.innerHTML=`<div class="ghead"><span class="eyebrow">Type — propulsion &amp; speed</span><span class="rule"></span><span class="gcost mono">${VEHICLE_TYPES[v.type][1]?"+"+VEHICLE_TYPES[v.type][1]:"free"}</span></div>
    <div class="chips-row" id="vTypeChips">${VEHICLE_TYPES.map((t,i)=>`<button class="stylechip ${i===v.type?"on":""}" data-t="${i}" data-tip="${esc(t[3])}">${t[0]} · ${t[2]}${t[1]?" · +"+t[1]:""}</button>`).join("")}</div>`;
  b.appendChild(tg);
  tg.querySelectorAll("#vTypeChips .stylechip").forEach(bt=>bt.onclick=()=>{v.type=+bt.dataset.t;buildVehicleDossier();persist();});

  // size
  const zg=document.createElement("div");zg.className="dgroup";
  zg.innerHTML=`<div class="ghead"><span class="eyebrow">Size</span><span class="rule"></span></div>
    <div class="chips-row" id="vSizeChips">${VEHICLE_SIZES.map((z,i)=>`<button class="stylechip ${i===v.size?"on":""}" data-z="${i}" data-tip="${esc(z[1])}">${z[0]}</button>`).join("")}</div>
    <div class="none-note" style="font-style:normal;margin-top:8px">Size affects how the vehicle plays (fighting, movement, cover, facings) but not its points. In the book it's set by how many sections fit your vehicle grid — pick the closest here.</div>`;
  b.appendChild(zg);
  zg.querySelectorAll("#vSizeChips .stylechip").forEach(bt=>bt.onclick=()=>{v.size=+bt.dataset.z;buildVehicleDossier();persist();});

  // skills
  const sg=document.createElement("div");sg.className="dgroup";
  sg.innerHTML=`<div class="ghead"><span class="eyebrow">Skills</span><span class="rule"></span><span class="gcost mono">+${vSkillPts(v)}</span></div>`;
  [["A","Agility","Sets when the vehicle acts each turn and how it navigates terrain."],["S","Shooting","How well the vehicle performs shooting actions."]].forEach(([k,name,tip])=>{
    const pts=(v.skills[k]-VRULES.aStart)*VRULES.skillStep;
    const row=document.createElement("div");row.className="steprow";
    row.innerHTML=`
      <div class="lbl" data-tip="${esc(name+" ("+k+") — "+tip+" Roll 1D10 under this value to succeed. Starts at "+VRULES.aStart+".")}"><b>${name} <span style="color:var(--ink-mute)">(${k})</span></b><span>${VRULES.skillStep} pts / level · range ${VRULES.aStart}–${VRULES.skillMax}</span></div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="stepper">
          <button data-d="-1" ${v.skills[k]<=VRULES.aStart?"disabled":""} aria-label="Lower ${name}">−</button>
          <span class="val">${v.skills[k]}</span>
          <button data-d="1" ${v.skills[k]>=VRULES.skillMax?"disabled":""} aria-label="Raise ${name}">+</button>
        </div>
        <span class="pts mono ${pts>0?"pos":""}">${pts?"+"+pts:"—"}</span>
      </div>`;
    row.querySelectorAll("button").forEach(bt=>bt.onclick=()=>{const nv=v.skills[k]+ +bt.dataset.d;if(nv<VRULES.aStart||nv>VRULES.skillMax)return;v.skills[k]=nv;buildVehicleDossier();persist();});
    sg.appendChild(row);
  });
  b.appendChild(sg);

  // vitals (read-only info)
  const vg=document.createElement("div");vg.className="dgroup";
  vg.innerHTML=`<div class="ghead"><span class="eyebrow">Hull</span><span class="rule"></span></div>
    <div class="steprow"><div class="lbl"><b>Total hit-points</b><span>2 core sections (10 HP each) + your sections</span></div><span class="mono" style="font-weight:700;font-size:16px;color:var(--teal)">${vehicleHP(v)}</span></div>
    <div class="steprow"><div class="lbl"><b>Speed</b><span>set by vehicle type</span></div><span class="mono" style="font-weight:700;font-size:16px;color:var(--ink-dim)">${VEHICLE_TYPES[v.type][2]}</span></div>`;
  b.appendChild(vg);

  // groups
  b.appendChild(gearGroup(v,"Sections","vsection",v.sections,buildVehicleDossier));
  b.appendChild(gearGroup(v,"Traits","vtrait",v.traits,buildVehicleDossier));
  b.appendChild(gearGroup(v,"Abilities","vability",v.abilities,buildVehicleDossier));
  b.appendChild(gearGroup(v,"Weapons","vweapon",v.weapons,buildVehicleDossier));

  const backToCard=()=>{const id=curVehId;closeDossier();openVehicleCard(id);};
  $("#dvBack").onclick=backToCard;
  $("#dvDone").onclick=backToCard;
  $("#dvDelete").onclick=()=>{
    askConfirm("Scrap "+(v.name||"this vehicle")+"? This can't be undone.",()=>{
      const w=activeWB();w.vehicles=vehsOf(w).filter(x=>x.id!==v.id);closeDossier();render();toast("Vehicle scrapped");
    },{danger:true,yesLabel:"Scrap"});
  };
}

/* ---- ROUND CHEAT SHEET ----
   Straight off the rulebook, for the phone in your hand while the tracker is open. Grouped by
   the question you actually have mid-turn ("what can I do", "how do I shoot", "they charged
   me"), not by page order, and each procedure is written as the sequence you follow. */
/* ---- STANDARD PROP LIBRARY ----
   A scenario is only buildable if the pieces match what is on your shelf. These are ten
   shapes to cut, print or scavenge once and use forever; the DM must choose from them by
   code and then name each one to suit the story ("P4 — Wreck Spire"). Sizes are anchored to
   the two thresholds the rules actually care about: under 5cm you step and shoot over it,
   5cm or more must be CLIMBED, and anything taller than a standing model (about 4cm plus
   base) can hide one completely. */
const PROPS=[
 {code:"P1",start:4,full:6,name:"Low block",   size:"5×5cm, 3cm tall",    use:"Gives cover; shot over and stepped over. No climbing."},
 {code:"P2",start:2,full:4,name:"Long low wall",size:"20×2cm, 3cm tall",  use:"Gives cover along a line; shot over. Good for splitting open ground."},
 {code:"P3",start:3,full:4,name:"Crate stack", size:"6×6cm, 6cm tall",    use:"Hides a standing model. Must be climbed."},
 {code:"P4",start:2,full:3,name:"Tall block",  size:"8×8cm, 12cm tall",   use:"Blocks line of sight outright. Climbed in stages."},
 {code:"P5",start:0,full:2,name:"Spire",       size:"6×6cm, 20cm tall",   use:"Blocks line of sight and dominates a quarter of the board."},
 {code:"P6",start:0,full:2,name:"Platform",    size:"12×12cm, 6cm tall",  use:"Flat top to stand on — a model up here shoots down at +1."},
 {code:"P7",start:0,full:2,name:"Ramp",        size:"10×5cm, rising to 6cm",use:"Reaches a platform without climbing rolls."},
 {code:"P8",start:0,full:4,name:"Barrel cluster",size:"6cm across, 5cm tall",use:"Small hard cover; hides a crouching model, climbable."},
 {code:"P9",start:2,full:4,name:"Ground area", size:"12cm circle, flat",  use:"Marks ground: rough, hazardous or impassable. Never blocks sight."},
 {code:"P10",start:6,full:8,name:"Token",      size:"3cm disc, flat",     use:"An objective, a cache or a spawn point."}
];

/* What you actually own, which is not the same as what the library describes. Starts at a
   19-piece set you can cut in an evening and grows as you build; the DM is only ever told
   about pieces you have, so a scenario is always buildable tonight. */
function propCounts(){
  let saved={};
  try{ saved=JSON.parse(localStorage.getItem("p28_props")||"{}")||{}; }catch(e){ saved={}; }
  const out={};
  PROPS.forEach(p=>{ out[p.code]=(typeof saved[p.code]==="number")?Math.max(0,saved[p.code]):p.start; });
  return out;
}
function setPropCount(code,n){
  const c=propCounts(); c[code]=Math.max(0,Math.min(20,n|0));
  try{ localStorage.setItem("p28_props",JSON.stringify(c)); }catch(e){}
  renderCheat();
}
function ownedProps(){ const c=propCounts(); return PROPS.filter(p=>c[p.code]>0).map(p=>Object.assign({},p,{qty:c[p.code]})); }
function propByCode(c){c=String(c||"").trim().toUpperCase();return PROPS.find(p=>p.code===c)||null;}
function propsForAI(){
  return ownedProps().map(p=>`${p.code} — ${p.name} (the host owns ${p.qty}): ${p.size}. ${p.use}`).join("\n");
}
const CHEAT=[
 {ico:"◉",title:"Your two actions",items:[
  {n:"How a turn runs",d:"Every character gets 2 actions. Activate by Agility, highest first, both sides interleaved — not all of one player's characters together. Tied (A)? The higher (AW) chooses where to go. Tied on both? Both roll 1D10; lowest decides who acts first."},
  {n:"Move",d:"Move up to your speed (10cm as standard). Measure from one point on the base and finish the move from that same point."},
  {n:"Charge",d:"End a move in base contact with an enemy and you get one extra fight action at +1D4 Fighting. Only that first fight gets the bonus."},
  {n:"Fight",d:"Attack anyone you have charged, are locked in combat with, or are within 5cm of."},
  {n:"Shoot",d:"Fire one weapon at someone in range you can see. Not while you are locked in combat, and never at someone who is."},
  {n:"Ability",d:"Use one of your abilities, or cast if you have an arcana trait."},
  {n:"Item",d:"Use an item from your inventory, or swap weapons."},

let guideTab="round", guideQuery="", diceTarget=null, diceLast=null;
function guideEntries(){
  const out=[];
  CHEAT.forEach((s,si)=>{ if(s.build==="claude"&&fbAvailable())return;
    s.items.forEach(it=>out.push({tab:(s.title==="Back at camp"||s.title==="The prop library")?"camp":"round",sec:s.title,n:it.n,d:(it.d||"")+" "+(it.steps||[]).join(" ")+" "+(it.mod||""),html:cheatItemHTML(it)}));});
  WEAPON_RULES.forEach(r=>out.push({tab:"ref",sec:"Weapon keywords",n:r[0],d:r[1],html:`<div class="cheat-item"><div class="ci-n">${esc(r[0])}</div><div class="ci-d">${esc(r[1])}</div></div>`}));
  ARCANA.forEach(a=>out.push({tab:"ref",sec:"Arcana powers",n:a[0],d:a[1],html:`<div class="cheat-item"><div class="ci-n">${esc(a[0])}</div><div class="ci-d">${esc(a[1])}</div></div>`}));
  INJURY_TABLE.forEach(x=>out.push({tab:"ref",sec:"Injury table (1D8)",n:x.roll+" · "+x.name,d:x.note+" "+(x.effectNote||""),html:`<div class="cheat-item"><div class="ci-n"><span class="mono">${x.roll}</span> ${esc(x.name)}</div><div class="ci-d">${esc(x.note)}${x.effectNote?" — "+esc(x.effectNote):""}</div></div>`}));
  VEH_DAMAGE.forEach(x=>out.push({tab:"ref",sec:"Vehicle damage (1D6)",n:x.roll+" · "+x.name,d:x.effect,html:`<div class="cheat-item"><div class="ci-n"><span class="mono">${x.roll}</span> ${esc(x.name)}</div><div class="ci-d">${esc(x.effect)}</div></div>`}));
  return out;
}
function cheatItemHTML(it){
  return `<div class="cheat-item">
    <div class="ci-n">${esc(it.n)}</div>
    ${it.d?`<div class="ci-d">${esc(it.d)}</div>`:""}
    ${it.steps?`<ol>${it.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:""}
    ${it.prop?(()=>{const c=propCounts()[it.prop],f=(propByCode(it.prop)||{}).full;
      return `<div class="prop-own"><button class="rbtn sm" data-prop="${it.prop}|-1">−</button>
        <b class="mono">${c}</b><span class="none-note" style="font-style:normal">of ${f} built</span>
        <button class="rbtn sm" data-prop="${it.prop}|1">+</button></div>`;})():""}
    ${it.mod?`<div class="ci-d ci-mod" style="margin-top:5px">${esc(it.mod)}</div>`:""}
  </div>`;
}
/* what the live game says about right now — with THEIR numbers */
function rightNowHTML(){
  const s=activeQuestScn(); if(!s||!s.battle)return "";
  const w=activeWB(), lines=[], cur=curRound(s);
  const mine=myCombatantsIn(s), byChar={};
  mine.forEach(m=>{if(m.charId)(byChar[m.charId]=byChar[m.charId]||[]).push(m);});
  Object.entries(byChar).forEach(([id,ms])=>{
    const c=w.characters.find(x=>x.id===id); if(!c)return;
    const curHP=ms.reduce((a,m)=>a+Math.max(0,m.curHP|0),0), max=ms.reduce((a,m)=>a+(m.maxHP|0),0);
    const nm=c.name||"Unnamed", P=c.skills.P;
    if(curHP>0&&curHP<=max*0.5&&ms.length===1)lines.push(`<b>${esc(nm)} is under half</b> — every skill −1, and a break test on every hit: roll under <button class="linkbtn" data-dtarget="${P-1}|${esc(nm)} · Psyche (−1)">P ${P-1}</button>, −1 more for each test already this turn.`);
    if(curHP<=0)lines.push(`<b>${esc(nm)} is down</b> — they roll on the injury table back at camp.`);
    if(hasTrait(c,"Minor arcana")||hasTrait(c,"Major arcana")){const eff=P-(curHP>0&&curHP<=max*0.5?1:0);lines.push(`<b>${esc(nm)} can cast</b> — an Ability action: roll under <button class="linkbtn" data-dtarget="${eff}|${esc(nm)} · Psyche">P ${eff}</button>; a failed cast rends.`);}
    if(ms.length>1){const alive=ms.filter(m=>(m.curHP|0)>0).length;lines.push(`<b>${esc(nm)} is a squad</b> — ${alive}/${ms.length} standing; no break test per model, the squad tests when its total is at 25%${curHP<=max*0.25?" — <b>it is</b>":""}.`);}
  });
  const enemySquads={};
  (s.battle.combatants||[]).filter(m=>m.side==="enemy"&&/_\d+$/.test(String(m.id))).forEach(m=>{const k=String(m.id).replace(/_\d+$/,"");(enemySquads[k]=enemySquads[k]||[]).push(m);});
  Object.values(enemySquads).forEach(ms=>{const nm=ms[0].name.replace(/ \d+\/\d+$/,"");const tot=ms.reduce((a,m)=>a+(m.maxHP|0),0),cur=ms.reduce((a,m)=>a+Math.max(0,m.curHP|0),0);lines.push(`<b>The ${esc(nm)} squad</b> — tests as one at 25% of ${tot} HP${cur<=tot*0.25?" — <b>they are there now</b>":" ("+cur+" left)"}.`);});
  const next=(s.events||[]).filter(e=>e.round>cur).sort((a,b)=>a.round-b.round)[0];
  if(next)lines.push(`<b>Next event, turn ${next.round}</b> — ${esc(next.title)}${next.effect&&next.effect.apply?": "+esc(effLabel(next.effect))+(next.effect.where?" · "+esc(next.effect.where):""):""}.`);
  if(!lines.length)return "";
  return `<div class="now"><div class="now-h">Right now · turn ${cur}${s.rounds?" / "+s.rounds:""}</div>${lines.map(l=>`<div class="now-l">${l}</div>`).join("")}</div>`;
}
function diceHTML(){
  const w=activeWB();
  const s=activeQuestScn();
  const chars=(s?myCombatantsIn(s).map(m=>w.characters.find(c=>c.id===m.charId)).filter(Boolean):w.characters.filter(isFielded)).filter((c,i,a)=>a.indexOf(c)===i).slice(0,4);
  const res=diceLast?`<div class="dice-d ${diceLast.ok===true?"ok":diceLast.ok===false?"bad":""}">${diceLast.v}</div>`:`<div class="dice-d">?</div>`;
  const verdict=diceLast?(diceLast.d===10&&diceTarget?(diceLast.ok?"<b class='ok'>success</b>":"<b class='bad'>fail</b>")+(diceLast.v===1?" · a 1 always succeeds":diceLast.v===10?" · a 10 always fails":""):`rolled 1D${diceLast.d}`):"";
  const short=c=>((c.name||"?").split(" ").filter(w=>!/\.$/.test(w))[0]||"?").slice(0,9);
  return `<div class="dice">
    ${res}
    <div class="dice-tg">${diceTarget?`1D10 under <b>${esc(diceTarget.label)}</b> → needs <b>${diceTarget.v-1>0?"1–"+(diceTarget.v-1):"a 1"}</b>`:"1D10 — set a target below, or just roll"}${verdict?`<div class="dice-v">${verdict}</div>`:""}</div>
    <button class="btn sm primary" id="dRoll10">🎲 D10</button>
  </div>
  <div class="dice-row">
    ${chars.map(c=>`<span class="dice-who">${esc(short(c))}</span>${SKILLS.map(([k])=>`<button class="dchip ${diceTarget&&diceTarget.label===short(c)+" · "+k?"on":""}" data-dtarget="${c.skills[k]}|${esc(short(c))} · ${k}">${k}${c.skills[k]}</button>`).join("")}`).join("")}
    <span class="dice-who">damage</span>${[4,6,8,10,12].map(d=>`<button class="dchip" data-droll="${d}">D${d}</button>`).join("")}
  </div>`;
}

    body=groups.map(([title,items],gi)=>`<div class="cheat-sec${cheatOpen["r"+gi]?" open":""}"><button class="cheat-q" data-cheat="r${gi}"><span class="cq-ico">📚</span>${esc(title)}<span class="cq-n">${items.length}</span><span class="cq-arrow">›</span></button><div class="cheat-a">${items.map(cheatItemHTML).join("")}</div></div>`).join("");
  } else {
    const secs=CHEAT.map((s,i)=>[s,i]).filter(([s])=>!(s.build==="claude"&&fbAvailable())&&(s.title==="Back at camp"||s.title==="The prop library"));
    body=`<div class="cheat-roll">Between games: 20 cp buys a skill level or +${CP_COSTS.hpStep} HP · traits and abilities cost their points · a recruit is ${CP_COSTS.recruit} · treatment ${CP_COSTS.heal} · points → credits at 2:1.</div>`+
      secs.map(([s,i])=>`<div class="cheat-sec${cheatOpen[i]?" open":""}"><button class="cheat-q" data-cheat="${i}"><span class="cq-ico">${s.ico}</span>${esc(s.title)}<span class="cq-n">${s.items.length}</span><span class="cq-arrow">›</span></button><div class="cheat-a">${s.items.map(cheatItemHTML).join("")}</div></div>`).join("");
  }
  d.innerHTML=`<div class="cheat-head"><h3>Guide</h3><button class="iconbtn" id="cheatClose" aria-label="Close">✕</button></div>
    <div class="cheat-tools">
      <input class="input" id="guideQ" placeholder="🔍 search the rules… charge, cover, ammo" value="${esc(guideQuery)}">
      ${q?"":`<div class="topnav gtabs"><button class="topnav-btn ${guideTab==="round"?"active":""}" data-gtab="round">Round</button><button class="topnav-btn ${guideTab==="ref"?"active":""}" data-gtab="ref">Reference</button><button class="topnav-btn ${guideTab==="camp"?"active":""}" data-gtab="camp">Camp</button></div>`}
    </div>

/* ---- SCENARIOS BELONG TO A TABLE, NOT A WARBAND ----
   A scenario is something a group plays, so it is filed under the passphrase room it was made
   in: everything created at "Rusty" stays with Rusty, another table keeps its own, and any
   device that knows the passphrase sees the lot. They are stored camp-level (store.scenarios)
   with a `room` tag, mirrored up to rooms/<key>/scenarios so a brand-new device gets them all.
   The Claude app has no table at all, so what the DM writes there is UNFILED until it is
   imported into Realm, at which point it joins whichever table you are at. */
let _scnPushT={};
function allScns(){ if(!Array.isArray(store.scenarios))store.scenarios=[]; return store.scenarios; }
function visibleScns(){ return allScns().filter(s=>s&&(!s.room||s.room===roomKey)); }
function findScn(id){ return allScns().find(s=>s&&s.id===id)||null; }
function addScn(s){ s.room=s.room||roomKey||""; if(s.room===roomKey)s.realmName=savedPass()||""; allScns().unshift(s); save(); pushScn(s); return s; }
function dropScn(id){
  const s=findScn(id);
  clearTimeout(_scnPushT[id]);            // a pending push would otherwise resurrect it
  store.scenarios=allScns().filter(x=>x&&x.id!==id);
  save(); if(s&&s.room)deleteScnOnline(s);
}
// file everything currently unfiled into the table we just joined
function fileUnfiledInto(key){
  if(!key)return 0;
  let n=0;
  allScns().forEach(s=>{if(s&&!s.room){s.room=key;s.realmName=savedPass()||"";n++;pushScn(s);}});
  if(n)save();
  return n;
}
function pushScn(s){
  if(!s||!s.room||s.room!==roomKey)return;
  clearTimeout(_scnPushT[s.id]);
  _scnPushT[s.id]=setTimeout(async()=>{                 // coalesce rapid edits into one write
    try{ const db=await getDb(); if(!db)return;
      s.updatedAt=Date.now();
      await db.doc("scenarios/"+s.id).set(Object.assign(scnForDb(s),{updatedAt:s.updatedAt}));
    }catch(e){}
  },600);
}
async function deleteScnOnline(s){
  try{ const db=await getDb(); if(db)await db.doc("scenarios/"+s.id).delete(); }catch(e){}
}
/* Pull the table's scenarios down. Newer wins by updatedAt, so a device that has been offline
   catches up without clobbering work done elsewhere. */
async function pullScns(){
  if(!roomKey)return 0;
  let docs=[];
  try{ const db=await getDb(); if(!db)return 0; docs=(await db.collection("scenarios").get()).docs; }catch(e){ return 0; }
  let changed=0;
  docs.forEach(d=>{
    const raw=d.data(); if(!raw||!raw.id)return;
    const inc=normalizeImportedScn(JSON.parse(JSON.stringify(raw)));
    inc.id=raw.id; inc.room=roomKey; inc.updatedAt=raw.updatedAt||0;
    const cur=findScn(inc.id);
    if(!cur){ allScns().push(inc); changed++; return; }
    if((inc.updatedAt||0)>(cur.updatedAt||0)){ Object.assign(cur,inc); changed++; }
  });
  if(changed){ save(); renderScenarioView(); }
  return changed;
}

/* Firebase drops empty arrays one level deeper too: an enemy unit with no traits/armour
   comes back missing those fields entirely and the points maths throws on it. Heal them. */
function healScnChars(s){
  const arr=(o,k)=>{if(o&&!Array.isArray(o[k]))o[k]=[];};
  if(s&&s.enemy&&Array.isArray(s.enemy.characters))
    s.enemy.characters.forEach(c=>{
      if(!c||typeof c!=="object")return;
      ["traits","abilities","weapons","armour","items","pickups","sections"].forEach(k=>arr(c,k));
      if(!c.skills||typeof c.skills!=="object")c.skills={A:1,F:1,S:1,AW:1,P:1};
      ["A","F","S","AW","P"].forEach(k=>{if(typeof c.skills[k]!=="number")c.skills[k]=1;});
      if(typeof c.hp!=="number")c.hp=20;
      stripRedundantTraits(c);
      if(c.hint)c.hint=cleanHint(c.hint);
    });
  if(s&&s.enemy&&Array.isArray(s.enemy.vehicles))
    s.enemy.vehicles.forEach(v=>{
      if(!v||typeof v!=="object")return;
      v.isVehicle=true;
      ["sections","traits","abilities","weapons"].forEach(k=>arr(v,k));
      if(!v.skills||typeof v.skills!=="object")v.skills={A:VRULES.aStart,S:VRULES.sStart};
      if(typeof v.skills.A!=="number")v.skills.A=VRULES.aStart;
      if(typeof v.skills.S!=="number")v.skills.S=VRULES.sStart;
      if(typeof v.type!=="number")v.type=0;
      if(typeof v.size!=="number")v.size=1;
      if(v.hint)v.hint=cleanHint(v.hint);
    });
  if(s&&s.battle&&Array.isArray(s.battle.combatants))
    s.battle.combatants.forEach(m=>{arr(m,"conditions");arr(m,"neg");});
  return s;
}
function fillScnArrayDefaults(s){
  // Firebase Realtime Database silently drops any field that was an empty array/object
  // at write time (e.g. specialRules:[] round-trips as "field absent"). Restore safe
  // defaults on the receiving (guest) side so template code that assumes arrays never crashes.
  if(!s||typeof s!=="object")return s;
  ["objectives","specialRules","terrain","markers","npcs","items","events","searched"].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});
  s.items.forEach(it=>{if(it&&typeof it==="object"&&it.trap===undefined)it.trap=coerceTrap(it);});   // scenarios saved before traps existed
  if(!s.map||typeof s.map!=="object")s.map={note:"",zones:[],features:[]};
  s.map.zones=Array.isArray(s.map.zones)?s.map.zones:[];
  s.map.features=Array.isArray(s.map.features)?s.map.features:[];
  if(s.enemy&&typeof s.enemy==="object"){if(!Array.isArray(s.enemy.characters))s.enemy.characters=[];if(!Array.isArray(s.enemy.vehicles))s.enemy.vehicles=[];}
  if(s.battle&&typeof s.battle==="object"&&!Array.isArray(s.battle.combatants))s.battle.combatants=[];
  return healScnChars(s);
}

// a combatant is "mine" when it came from a character in this device's warband
function myCombatantsIn(scn){
  const w=activeWB(); if(!w||!scn||!scn.battle||!Array.isArray(scn.battle.combatants))return [];
  const cid=campId();
  return scn.battle.combatants.filter(m=>m&&m.side==="player"&&(m.charId||m.vehId)&&
    (m.charId?(w.characters.some(c=>c.id===m.charId)||(cid&&m.campId===cid))
             :(vehsOf(w).some(v=>v.id===m.vehId)||(cid&&m.campId===cid))));

/* "Destroyed 50% or more of an enemy warband" — read straight off the roster. */
function enemyRoutedIn(scn){
  const rows=((scn&&scn.battle&&scn.battle.combatants)||[]).filter(m=>m&&m.side==="enemy");
  if(!rows.length)return false;
  return rows.filter(m=>(m.curHP|0)<=0).length*2>=rows.length;

/* ---- campaign points & credits (rulebook economy) ----

      <div class="none-note" style="font-style:normal">${over>0?"Trim the build before it can seal.":(w.budget-spent>0?"The "+(w.budget-spent)+" unspent points become credits, one for one.":"Nothing left over.")}</div>
    </div>
    <div class="modal-actions">
      <button class="btn primary sm" id="sqSeal"${over>0?" disabled":""}>${btnLabel||"🔒 Seal and embark"}</button>
      <button class="btn ghost sm" id="sqBack" style="margin-left:auto">Return to camp</button>
    </div>`;
  $("#sqSeal").onclick=()=>{

    w.sealed=Date.now(); save(); render(); closeModal();

function isWorkshop(){return !fbAvailable();}
function wbSealed(w){if(isWorkshop())return false;w=w||activeWB();return !!(w&&w.sealed);}
function sealWarband(w,quiet){w=w||activeWB();if(w.sealed)return;w.sealed=Date.now();save();render();if(!quiet)toast("🔒 Warband sealed — it grows by campaign points and credits now");}
function unsealWarband(w){w=w||activeWB();delete w.sealed;(w.characters||[]).forEach(c=>{delete c.recruit;delete c.recruitFee;});save();render();toast("Unsealed — free editing is back");}
/* what a new recruit's build costs in campaign points: levels, hit-points, traits, abilities (gear is credits) */
function recruitBuildCost(c){return skillPts(c)+hpPts(c)+listPts(c.traits,"trait")+listPts(c.abilities,"ability");}
const CP_EARN=[
  {key:"actions",label:"Successful shoot or fight actions",per:1,input:true},
  {key:"kills",label:"Enemies killed",per:5,input:true},
  {key:"survived",label:"Survived the game",per:1,auto:true},
  {key:"unwounded",label:"Made it to the end unwounded",per:5,auto:true}
];
const CP_WARBAND=[
  {key:"goal",label:"Achieved the scenario goal",per:10},
  {key:"rout",label:"Destroyed 50% or more of an enemy warband",per:10}
];
const RANKS=[
  {at:0,name:"Recruit"},{at:20,name:"Trooper"},{at:60,name:"Blooded"},{at:120,name:"Veteran"},
  {at:200,name:"Sergeant"},{at:300,name:"Lieutenant"},{at:450,name:"Captain"},{at:650,name:"Warlord"}
];
function rankOf(total){let r=RANKS[0];RANKS.forEach(x=>{if((total||0)>=x.at)r=x;});return r.name;}
function nextRank(total){return RANKS.find(x=>(total||0)<x.at)||null;}
function cpOf(c){return (typeof c.cp==="number"?c.cp:(c.xp||0));}
function cpTotalOf(c){return (typeof c.cpTotal==="number"?c.cpTotal:(c.xpTotal||0));}
function creditsOf(w){return Math.max(0,Math.round(+w.credits||0));}
function hasTrait(c,name){const o=findCat("trait",name);return !!(o&&(c.traits||[]).includes(o.id));}
function grantCP(chars,amount){
  chars.forEach(c=>{
    const before=cpTotalOf(c);
    c.cp=cpOf(c)+amount; c.cpTotal=before+amount; delete c.xp; delete c.xpTotal;
    if(rankOf(before)!==rankOf(c.cpTotal))c._rankedUp=rankOf(c.cpTotal);
  });
}
/* HIDDEN AGENDAS (rulebook p.58, table p.80). A private goal one character carries into a
   game, separate from the scenario. Worth 5 campaign points, 1 less for every game it has
   already been carried and failed. Deliberately NEVER included in myCombatants(), so it is
   not synced to the host or the other players — the point is that they know you HAVE one,
   not what it is. */
const AGENDAS=[
  {roll:1,name:"Vendetta",text:"One of the enemies you're facing is an old foe. After all characters are deployed, select an enemy character — you must kill it before the game ends."},
  {roll:2,name:"The mule",text:"You're carrying illicit goods for a shadowy overlord. Reach the board edge opposite the one you started at and spend an entire turn in base contact with it."},
  {roll:3,name:"Thief in the night",text:"There's a stash out here somewhere. Move to each corner of the playing area and roll 1D4 — on a 4 you have found it, for 2D20 credits. (If three corners come up empty, the last needs no roll.)"},
  {roll:4,name:"Knowledge is power",text:"An enemy knows something you don't. Select an enemy character at the start of the game and win at least one fight action against it — instead of dealing damage, you extract what you need."},
  {roll:5,name:"Vow of pacifism",text:"After a night of prayer and hard liquor you swore off violence. Survive to the end of the game without causing any damage to an enemy character."},
  {roll:6,name:"An honourable death",text:"You went seeking glorious combat. You must fight and be slain by the enemy character with the highest (F). These campaign points are split among the warband."}
];
function agendaValue(a){return Math.max(0,5-((a&&a.fails)|0));}
function takeAgenda(c){
  const pick=AGENDAS[Math.floor(Math.random()*AGENDAS.length)];
  c.agenda={roll:pick.roll,fails:0};
  save();buildCard();render();
  toast("⚑ A hidden agenda — tap Reveal to read it");
}
let agendaOpen={};
/* The rulebook has a player "select which character has the agenda" — one, not one each —
   so once somebody carries one, everybody else's offer is closed and names the holder. */
function agendaHolder(){ return (activeWB().characters||[]).find(x=>x&&x.agenda)||null; }
function cardAgenda(c){
  const a=c.agenda;
  if(!a){
    const other=agendaHolder();
    if(other)return `<div class="gc-sec">
      <div class="sh">⚑ Hidden agenda</div>
      <div class="gc-spellnote">One character carries the warband's agenda, and <b>${esc(other.name||"another character")}</b> has it. When theirs is done or given up, this one can take a turn.</div>
    </div>`;
    return `<div class="gc-sec">
      <div class="sh">⚑ Hidden agenda</div>
      <div class="gc-spellnote">A private goal for your next quest, rolled in secret and worth <b>5 campaign points</b>. Only one character in the warband carries one. Tell the others you have it — never what it is.</div>
      <div class="rollrow"><button class="rollbtn" id="agTake">🎲 Take a hidden agenda</button></div>
    </div>`;
  }
  const o=AGENDAS.find(x=>x.roll===a.roll)||AGENDAS[0];
  const shown=!!agendaOpen[c.id];
  return `<div class="gc-sec">
    <div class="sh">⚑ Hidden agenda</div>
    <div class="gc-spellnote">Worth <b>${agendaValue(a)}</b> campaign point${agendaValue(a)===1?"":"s"}${(a.fails|0)?` — carried and failed ${a.fails} game${a.fails>1?"s":""}, so it is worth ${a.fails} less`:""}.</div>
    ${shown?`<div class="gc-entry"><div class="en"><span>${esc(o.name)}</span></div><div class="ed">${esc(o.text)}</div></div>`
           :`<div class="gc-entry"><div class="ed redacted">Sealed — only this character knows what they are after.</div></div>`}
    <div class="rollrow" style="margin:10px 0 0">
      <button class="rollbtn" id="agPeek">${shown?"Hide":"Reveal"}</button>
      <button class="linkbtn" id="agDrop">Give it up</button>
    </div>
  </div>`;
}
/* Settled at camp, after the quest tally — did they pull it off? */
function openAgendaCheck(chars,then){
  const list=(chars||[]).filter(c=>c&&c.agenda);
  if(!list.length){if(then)then();return;}
  let i=0;
  const step=()=>{
    if(i>=list.length){save();render();closeModal();if(then)then();return;}
    const c=list[i], a=c.agenda, o=AGENDAS.find(x=>x.roll===a.roll)||AGENDAS[0], val=agendaValue(a);
    $("#modalBody").innerHTML=`<h3>⚑ ${esc(c.name||"Unnamed")} — ${esc(o.name)}</h3>
      <p class="lead">${esc(o.text)}</p>
      <div class="ng-result"><b>Worth ${val} campaign point${val===1?"":"s"}</b> <span class="none-note" style="font-style:normal">${a.roll===6?"— split among the warband":"— kept by "+esc(c.name||"this character")}</span>${(a.fails|0)?`<div class="ed" style="margin-top:4px">Reduced by ${a.fails} for the game${a.fails>1?"s":""} already spent carrying it.</div>`:""}</div>
      <div class="modal-actions">
        <button class="btn primary sm" id="agDone">Completed — award ${val}</button>
        <button class="btn sm" id="agFail">Failed — carry it on</button>
      </div>`;
    $("#agDone").onclick=()=>{
      const shared=(a.roll===6);            // "An honourable death" splits its points
      if(val>0){ if(shared){const w=activeWB();w.cp=(w.cp||0)+val;} else grantCP([c],val); }
      delete c.agenda; save();
      toast(val>0?("+"+val+" campaign points"+(shared?" to the warband pool":" for "+(c.name||"them"))):"Completed — but it is worth nothing now");
      i++;step();
    };
    $("#agFail").onclick=()=>{
      a.fails=(a.fails|0)+1; save();
      toast("Carried on — now worth "+agendaValue(a));
      i++;step();
    };
  };
  step();showModal();
}
/* End-of-quest tally, straight off the rulebook's list. */
function openCPAwards(snap,charIds,then){
  const w=activeWB();
  const took=charIds.map(id=>w.characters.find(x=>x.id===id)).filter(Boolean);
  if(!took.length){if(then)then();return;}
  const state=took.map(c=>{
    const m=(snap.combatants||[]).find(x=>x.charId===c.id)||{};
    const max=c.hp*memberCount(c);
    const t=(c.tally&&c.tally.scnId===snap.scnId)?c.tally:null;
    return {c,actions:t?t.hits|0:0,kills:t?t.kills|0:0,survived:(m.curHP||0)>0,unwounded:(m.curHP||0)>=max};
  });
  const body=$("#modalBody");
  const draw=()=>{
    const rows=state.map((s,i)=>{
      const auto=(s.survived?1:0)+(s.unwounded?5:0);
      const tot=s.actions*1+s.kills*5+auto;
      return `<div class="earn-row">
        <div class="prep-h">${esc(s.c.name||"Unnamed")} <span class="mono" style="float:right;color:var(--amber)">+${tot}</span></div>
        <div class="cp-grid">
          <label>Shoot / fight hits <span class="none-note" style="font-style:normal">1 each</span>
            <input class="input" type="number" min="0" max="99" value="${s.actions}" data-cp="${i}|actions"></label>
          <label>Enemies killed <span class="none-note" style="font-style:normal">5 each</span>
            <input class="input" type="number" min="0" max="99" value="${s.kills}" data-cp="${i}|kills"></label>
        </div>
        <div class="none-note" style="font-style:normal;margin-top:5px">
          ${s.survived?"✓ survived (+1)":"✗ did not survive"} · ${s.unwounded?"✓ unwounded (+5)":"✗ was wounded"}
        </div></div>`;
    }).join("");
    const wbTot=CP_WARBAND.reduce((t,a)=>t+((body.querySelector('[data-wcp="'+a.key+'"]')||{}).checked?a.per:0),0);
    body.innerHTML=`
      <h3>Campaign points — ${esc(snap.title||"the quest")}</h3>
      <p class="lead">${state.some(s=>s.c.tally&&s.c.tally.scnId===snap.scnId)?"Filled in from the ⚔ and ☠ taps during the game — check and correct.":"Tally what each character managed."} The rulebook's rates: 1 per successful shoot or fight action, 5 per enemy killed, 1 for surviving, 5 for finishing unwounded.</p>
      ${rows}
      <div class="eyebrow" style="margin:14px 0 7px">The warband as a whole</div>
      ${CP_WARBAND.map(a=>`<label class="xp-award"><input type="checkbox" data-wcp="${a.key}"${(a.key==="goal"&&snap.outcome&&snap.outcome.result==="victory")||(a.key==="rout"&&snap.enemyRouted)?" checked":""}> <b>${esc(a.label)}</b> <span class="mono xp-val">+${a.per}</span></label>`).join("")}
      <div class="none-note" style="font-style:normal">These go to the warband's shared pool — spend them on recruits, or hand them out later.</div>
      <div class="modal-actions">
        <button class="btn primary sm" id="cpGive">Award campaign points</button>
        <button class="btn ghost sm" id="cpNone" style="margin-left:auto">Nothing this time</button>
      </div>`;
    body.querySelectorAll("[data-cp]").forEach(inp=>inp.oninput=e=>{
      const[i,k]=e.target.dataset.cp.split("|");
      state[+i][k]=Math.max(0,Math.min(99,parseInt(e.target.value||"0",10)||0));
      const row=e.target.closest(".earn-row").querySelector(".prep-h .mono");
      const s=state[+i]; if(row)row.textContent="+"+(s.actions+s.kills*5+(s.survived?1:0)+(s.unwounded?5:0));
    });
    const finish=give=>{
      let pool=0;
      if(give){
        state.forEach(s=>{
          const amt=s.actions*1+s.kills*5+(s.survived?1:0)+(s.unwounded?5:0);
          if(amt>0)grantCP([s.c],amt);
          if(s.kills)s.c.killsTotal=(s.c.killsTotal||0)+s.kills;
        });
        CP_WARBAND.forEach(a=>{const b=body.querySelector('[data-wcp="'+a.key+'"]');if(b&&b.checked)pool+=a.per;});
        if(pool){w.cp=(w.cp||0)+pool;}
        // Rich earns coin, Venal must cash out, Mercenary wants paying
        state.forEach(s=>{
          if(hasTrait(s.c,"Rich")){const d=1+Math.floor(Math.random()*8);w.credits=creditsOf(w)+d;toast(s.c.name+" (Rich) earned "+d+" credits");}
          if(hasTrait(s.c,"Venal")){const cash=Math.floor(cpOf(s.c)/2);if(cash>0){w.credits=creditsOf(w)+cash;s.c.cp=0;}}
        });
        save();render();
      }
      state.forEach(s=>{delete s.c.tally;});   // spent — the next quest starts at nought
      save();
      closeModal();
      const up=state.map(s=>s.c).filter(c=>c._rankedUp);
      up.forEach(c=>delete c._rankedUp);
      if(up.length)setTimeout(()=>openEarnedNames(up.map(c=>({charId:c.id,name:c.name,reason:(c.name||"They")+" rose to "+rankOf(cpTotalOf(c))})),"glory",then),300);
      else if(then)then();
    };
    $("#cpGive").onclick=()=>finish(true);
    $("#cpNone").onclick=()=>finish(false);
    body.querySelectorAll("[data-wcp]").forEach(b=>b.onchange=()=>{});
  };
  draw();showModal();
}
/* Advancement: 20 CP per skill level or +5 HP; traits and abilities at their listed cost.
   Equipment is NOT bought here — after the warband is built, gear costs credits. */
function openSpendCP(charId){
  const orig=activeWB().characters.find(x=>x.id===charId); if(!orig)return;
  const w=activeWB();
  const avail=()=>cpOf(orig)+(w.cp||0);
  if(avail()<=0){toast("No campaign points yet");return;}
  let draft=JSON.parse(JSON.stringify(orig)), spent=0;
  const left=()=>avail()-spent;
  const body=$("#modalBody");
  const draw=(filter)=>{
    const f=normLabel(filter||""), rem=left();
    const skillRow=SKILLS.map(([k])=>{
      const v=draft.skills[k], maxed=v>=10, short=CP_COSTS.skill-rem, off=maxed||short>0;
      return `<button class="stylechip${off&&!maxed?" unaffordable":""}" data-sk="${k}"${off?` disabled title="${maxed?"Already at 10":"Needs "+short+" more"}"`:""}>${k} ${v}${maxed?"":"→"+(v+1)} <b class="mono">${maxed?"max":CP_COSTS.skill}</b>${!maxed&&short>0?`<span class="short">+${short}</span>`:""}</button>`;
    }).join("");
    const hpShort=CP_COSTS.hp-rem;
    const hpChip=`<button class="stylechip${hpShort>0?" unaffordable":""}" data-hp="1"${hpShort>0?` disabled title="Needs ${hpShort} more"`:""}>+${CP_COSTS.hpStep} HP <b class="mono">${CP_COSTS.hp}</b>${hpShort>0?`<span class="short">+${hpShort}</span>`:""}</button>`;
    const rows=[["trait","traits"],["ability","abilities"]].map(([cat,field])=>{
      const list=Object.values(CAT[cat]).filter(o=>o.cost>0&&(!f||normLabel(o.name).includes(f))&&!(draft[field]||[]).includes(o.id));
      if(!list.length)return "";
      return `<div class="eyebrow" style="margin:10px 0 6px">${cat==="trait"?"Traits":"Abilities"}</div>
        <div class="chips-row">${list.slice(0,60).map(o=>{const short=o.cost-rem;
          return `<button class="stylechip${short>0?" unaffordable":""}" data-buy="${cat}|${o.id}"${short>0?` disabled title="Needs ${short} more"`:""}>${esc(o.name)} <b class="mono">${o.cost>=0?"+":""}${o.cost}</b>${short>0?`<span class="short">+${short}</span>`:""}</button>`;}).join("")}</div>`;
    }).join("");
    const added=[];
    SKILLS.forEach(([k])=>{if(draft.skills[k]>orig.skills[k])added.push(k+" "+orig.skills[k]+"→"+draft.skills[k]);});
    if(draft.hp>orig.hp)added.push("+"+(draft.hp-orig.hp)+" HP");
    ["traits","abilities"].forEach(fld=>{const cat=fld==="traits"?"trait":"ability";
      (draft[fld]||[]).forEach(id=>{if(!(orig[fld]||[]).includes(id)&&CAT[cat][id])added.push(CAT[cat][id].name);});});
    body.innerHTML=`
      <h3>Advance ${esc(orig.name||"Unnamed")}</h3>
      <p class="lead">Additions only — nothing else about them can be changed here. ${CP_COSTS.skill} campaign points buys one skill level or +${CP_COSTS.hpStep} hit-points; traits and abilities cost their listed points. Equipment is bought with credits, not these.</p>
      <div class="xp-bar"><span>Points left</span><b class="mono ${rem<=0?"spent":""}">${rem}</b><span class="none-note" style="font-style:normal;margin-left:auto">${esc(orig.name||"")}: ${cpOf(orig)} · warband pool: ${w.cp||0}</span></div>
      ${added.length?`<div class="camp-box" style="margin:10px 0"><div class="prep-h">Buying</div><div>${added.map(esc).join(" · ")}</div></div>`:""}
      <div class="eyebrow" style="margin:12px 0 6px">Skills &amp; hit-points</div>
      <div class="chips-row">${skillRow}</div>
      <div class="chips-row" style="margin-top:8px">${hpChip}</div>
      <div class="field" style="margin:12px 0 4px"><label>Search traits &amp; abilities</label><input class="input" id="cpSearch" value="${esc(filter||"")}" placeholder="e.g. brave, inspire"></div>
      <div style="max-height:32vh;overflow:auto">${rows||`<div class="ng-note">Nothing matches.</div>`}</div>
      <div class="none-note" style="font-style:normal;margin-top:6px">Greyed-out entries cost more than you have — unspent points carry over between games. Gear is bought with credits (🛒 in the dossier); spare points can be changed into credits at 2:1 there.</div>
      <div class="modal-actions">
        <button class="btn primary sm" id="cpConfirm"${spent>0?"":" disabled"}>Confirm — spend ${spent}</button>
        <button class="btn ghost sm" id="cpReset">Start over</button>
        <button class="btn ghost sm" id="cpCancel" style="margin-left:auto">Cancel</button>
      </div>`;
    const si=$("#cpSearch");
    if(si)si.oninput=e=>{const v=e.target.value;draw(v);const n=$("#cpSearch");if(n){n.focus();n.setSelectionRange(v.length,v.length);}};
    body.querySelectorAll("[data-sk]").forEach(b=>b.onclick=()=>{const k=b.dataset.sk;
      if(draft.skills[k]<10&&CP_COSTS.skill<=left()){draft.skills[k]++;spent+=CP_COSTS.skill;draw(filter);}});
    body.querySelectorAll("[data-hp]").forEach(b=>b.onclick=()=>{
      if(CP_COSTS.hp<=left()){draft.hp+=CP_COSTS.hpStep;spent+=CP_COSTS.hp;draw(filter);}});
    body.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{
      const[cat,id]=b.dataset.buy.split("|"),o=CAT[cat][id];
      if(!o||o.cost>left())return;
      const fld=cat==="trait"?"traits":"abilities";
      if(!draft[fld].includes(id)){draft[fld].push(id);spent+=o.cost;draw(filter);}});
    $("#cpReset").onclick=()=>{draft=JSON.parse(JSON.stringify(orig));spent=0;draw(filter);};
    $("#cpCancel").onclick=closeModal;
    $("#cpConfirm").onclick=()=>{
      if(spent<=0)return;
      if(spent>avail()){toast("That is more than the points you have");draft=JSON.parse(JSON.stringify(orig));spent=0;draw(filter);return;}
      // spend the character's own points first, then the warband pool
      let owe=spent, own=Math.min(cpOf(orig),owe); owe-=own;
      orig.cp=cpOf(orig)-own; if(owe>0)w.cp=Math.max(0,(w.cp||0)-owe);
      ["skills","hp","traits","abilities"].forEach(k=>{orig[k]=draft[k];});
      orig.advLog=Array.isArray(orig.advLog)?orig.advLog:[]; orig.advLog.unshift({at:Date.now(),text:added.join(", ")+" · "+spent+" cp"});
      save();closeModal();render();buildDossier();
      toast("Spent "+spent+" campaign points — now "+charCost(orig)+" pts");
      setTimeout(()=>openEarnedNames([{charId:orig.id,name:orig.name,
        reason:(orig.name||"They")+" grew stronger — "+added.join(", ")}],"glory",()=>buildDossier()),300);
    };
    showModal();
  };
  draw("");
}
/* Equipment after warband creation costs credits, per the rules. */

/* ---- spoils ----

const SPOIL_CATS=[["weapon","weapons"],["armour","armour"],["item","items"]];
function spoilsOf(w){

  (w.characters||[]).forEach(c=>(c.pickups||[]).forEach(p=>{if(p&&!p.kept&&!p.applied)out.push({c,p});}));
