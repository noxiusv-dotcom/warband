/* ============================ RENDER: header + roster ============================ */
const $=s=>document.querySelector(s);
function fmtSigned(n){return (n>=0?"+":"−")+Math.abs(n)}
function esc(s){return (s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}

function renderHeader(){
  const w=activeWB();
  $("#wbName").value=w.name;
  $("#wbBudget").value=w.budget;
  const spent=wbSpent(w), rem=w.budget-spent, pool=wbPool(w);
  const total=w.characters.length, fieldedN=w.characters.filter(isFielded).length;
  const over=spent>w.budget;
  const pct=w.budget>0?Math.min(100,spent/w.budget*100):0;
  $("#gSpent").textContent=spent;
  $("#gSpent").classList.toggle("over",over);
  $("#gOf").textContent=" / "+w.budget+" pts fielded";
  const bar=$("#gBar");bar.style.width=pct+"%";
  bar.className=over?"over":(pct>85?"warn":"");
  const gr=$("#gRemain");
  gr.className="remain "+(over?"over":"ok");
  gr.innerHTML=over?`Over by <b>${Math.abs(rem)}</b>`:`<b>${rem}</b> left`;
  const vTotal=vehsOf(w).length, vFielded=vehsOf(w).filter(isFielded).length;
  let info=`${fieldedN}/${total} fielded`;
  if(vTotal)info+=` · ${vFielded}/${vTotal} vehicles`;
  if(pool!==spent)info+=` · pool ${pool} pts`;
  $("#mCount").textContent=(total||vTotal)?info:"0 characters";
  const warns=[];
  if(total>0&&fieldedN<2)warns.push("⚠ field ≥ 2 characters for a battle");
  $("#mWarn").innerHTML=warns.length?`<span class="warnflag">${warns.join(" · ")}</span>`:"";
}

function renderRoster(){
  const w=activeWB(),el=$("#roster");el.innerHTML="";
  w.characters.forEach(c=>{
    const n=memberCount(c), cost=unitCost(c);
    const nGear=c.weapons.length+c.armour.length+c.items.length;
    const nAbil=c.traits.length+c.abilities.length;
    const fielded=isFielded(c);
    const card=document.createElement("div");
    card.className="card"+(fielded?"":" benched");card.tabIndex=0;card.setAttribute("role","button");
    card.onclick=()=>openCard(c.id);
    card.onkeydown=e=>{if(e.key==="Enter"){openCard(c.id);}};
    card.innerHTML=`
      <div class="card-top">
        ${c.img?`<img class="card-thumb" src="${c.img}" style="object-position:${(c.imgPos||{x:50}).x}% ${(c.imgPos||{y:50}).y}%" alt="">`:""}
        <div style="min-width:0;flex:1">
          <div class="card-name">${esc(c.name)||"<span style='color:var(--ink-mute)'>Unnamed</span>"}</div>
          <div class="card-role">${esc(c.role)||"&nbsp;"}</div>
        </div>
        <div class="card-cost">${cost}<small>points</small></div>
      </div>
      <div class="statgrid">
        ${SKILLS.map(([k])=>`<div class="stat"><b>${c.skills[k]}</b><span>${k}</span></div>`).join("")}
      </div>
      <div class="card-foot">
        <div class="chips">
          ${n>1?`<span class="chip squad">⛊ Squad ×${n}</span>`:""}
          ${(()=>{const max=c.hp*n,cur=(typeof c.curHP==="number"&&c.curHP<max)?c.curHP:null;
            return cur===null?`<span class="chip hp">${c.hp} HP</span>`
              :`<span class="chip hp ${cur<=0?"down":"hurt"}">${cur<=0?"DOWN":cur+"/"+max+" HP"}</span>`;})()}
          <span class="chip">${RULES.speed}cm</span>
          ${cpTotalOf(c)>0?`<span class="chip rank">${esc(rankOf(cpTotalOf(c)))}</span>`:""}
          ${cpOf(c)>0?`<span class="chip xp">⭐ ${cpOf(c)} cp</span>`:""}
          ${(c.injuries||[]).length?`<span class="chip scar">⚠ ${(c.injuries||[]).length} scar${(c.injuries||[]).length>1?"s":""}</span>`:""}
          ${nGear?`<span class="chip">${nGear} gear</span>`:""}
        </div>
        <button class="fieldtog ${fielded?"on":""}" data-tog title="Bring in / out of the battle">${fielded?"◉ Fielded":"○ Benched"}</button>
      </div>`;
    card.querySelector("[data-tog]").onclick=e=>{e.stopPropagation();toggleFielded(c);};
    el.appendChild(card);
  });
  const add=document.createElement("button");
  add.className="card add";add.onclick=addCharacter;
  add.innerHTML=`<div class="plus">+</div><span>Recruit character</span>`;
  el.appendChild(add);
}

function renderVehicleRoster(){
  const w=activeWB(),el=$("#vehicleRoster");if(!el)return;el.innerHTML="";
  vehsOf(w).forEach(v=>{
    const cost=vehicleCost(v), fielded=isFielded(v);
    const ty=VEHICLE_TYPES[v.type]||VEHICLE_TYPES[0];
    const nSec=(v.sections||[]).reduce((s,e)=>s+e.qty,0), nW=(v.weapons||[]).reduce((s,e)=>s+e.qty,0);
    const card=document.createElement("div");
    card.className="card"+(fielded?"":" benched");card.tabIndex=0;card.setAttribute("role","button");
    card.onclick=()=>openVehicleCard(v.id);
    card.onkeydown=e=>{if(e.key==="Enter")openVehicleCard(v.id);};
    card.innerHTML=`
      <div class="card-top">
        ${v.img?`<img class="card-thumb" src="${v.img}" style="object-position:${(v.imgPos||{x:50}).x}% ${(v.imgPos||{y:50}).y}%" alt="">`:""}
        <div style="min-width:0;flex:1">
          <div class="card-name">${esc(v.name)||"<span style='color:var(--ink-mute)'>Unnamed vehicle</span>"}</div>
          <div class="card-role">${esc(v.role)||(VEHICLE_SIZES[v.size]?VEHICLE_SIZES[v.size][0]+" "+ty[0].toLowerCase()+" vehicle":"&nbsp;")}</div>
        </div>
        <div class="card-cost">${cost}<small>points</small></div>
      </div>
      <div class="statgrid" style="grid-template-columns:repeat(4,1fr)">
        <div class="stat"><b>${v.skills.A}</b><span>A</span></div>
        <div class="stat"><b>${v.skills.S}</b><span>S</span></div>
        <div class="stat"><b>${vehicleHP(v)}</b><span>HP</span></div>
        <div class="stat"><b>${ty[2]}</b><span>SPD</span></div>
      </div>
      ${(v.damage||v.laidUp||v.wrecked||(typeof v.curHP==="number"&&v.curHP<vehicleHP(v)))?`<div class="none-note" style="font-style:normal;color:${v.wrecked?"var(--danger)":"var(--warn)"}">${v.wrecked?"☠ ":v.laidUp?"⚙ ":"⚠ "}${esc(v.damage||("Hull damage — "+v.curHP+"/"+vehicleHP(v)+" hit-points"))}</div>`:""}
      <div class="card-foot">
        <div class="chips">
          <span class="chip">${ty[0]}</span>
          <span class="chip">${2+nSec} sect.</span>
          ${nW?`<span class="chip">${nW} wpn${nW>1?"s":""}</span>`:""}
          ${v.laidUp?`<span class="chip" style="color:var(--warn)">in the workshop</span>`:""}
          ${v.wrecked?`<span class="chip" style="color:var(--danger)">wrecked</span>`:""}
        </div>
        <button class="fieldtog ${fielded?"on":""}" data-tog title="Bring in / out of the battle">${fielded?"◉ Fielded":"○ Benched"}</button>
      </div>`;
    card.querySelector("[data-tog]").onclick=e=>{e.stopPropagation();toggleFielded(v);};
    el.appendChild(card);
  });
  const add=document.createElement("button");
  add.className="card add";add.onclick=addVehicle;
  add.innerHTML=`<div class="plus">+</div><span>Build vehicle</span>`;
  el.appendChild(add);
}



/* ---- WHAT IS THIS DEVICE? ----
   Realm is one link but two jobs: a player's CAMP (a warband, taken on quests) or THE REALM
   itself (the host's table, running scenarios and the DM's enemies). Asking once on first run
   means neither person has to look past half an app they never use. The choice is remembered
   and can be changed any time from the camp header. In the Claude app there is no hosting at
   all, so the question is never asked. */
function appRole(){ try{return localStorage.getItem("p28_role")||"";}catch(e){return "";} }
function setAppRole(r){ try{localStorage.setItem("p28_role",r);}catch(e){} applyRole(); }
function isHost(){ return fbAvailable() && appRole()==="realm"; }
function applyRole(){
  const host=isHost();
  const campTab=document.querySelector('#topnav .topnav-btn[data-view="warband"]');
  if(campTab)campTab.hidden=host;
  const cb=$("#campBar"); if(cb)cb.hidden=host;
  if(host&&currentView!=="scenarios")switchView("scenarios");
  else{ render(); if(currentView==="scenarios")renderScenarioView(); }
}
/* Only camps that have been stashed at the table are listed — a camp living solely on
   someone's phone is invisible here, which is worth saying out loud rather than showing
   an empty list that looks broken. */
async function listCamps(){
  const db=await getDb(); if(!db)return null;
  try{ const s=await db.collection("camps").get();
    return s.docs.map(d=>{const v=d.data()||{};return {id:d.id,name:v.name||d.id,savedAt:v.savedAt||0,n:(v.warbands||[]).length};})
      .sort((a,b)=>b.savedAt-a.savedAt);
  }catch(e){ return null; }
}
function openRoleChooser(){
  const body=$("#modalBody");
  const step1=()=>{
    body.innerHTML=`<h3>What is this device?</h3>
      <p class="lead">You can change this later from your camp header.</p>
      <div class="rolegrid">
        <button class="rolecard" id="roleCamp">
          <div class="rc-ico">⛺</div><div class="rc-n">A camp</div>
          <div class="rc-d">You bring a warband. Build it, take it on quests, heal and spend campaign points here.</div>
        </button>
        <button class="rolecard" id="roleRealm">
          <div class="rc-ico">🗺</div><div class="rc-n">The realm</div>
          <div class="rc-d">You host the table. Import scenarios, run the DM's enemies, track everyone's roster. No warband building.</div>
        </button>
      </div>`;
    $("#roleRealm").onclick=()=>{ setAppRole("realm"); closeModal(); toast("🗺 Hosting the realm"); };
    $("#roleCamp").onclick=()=>{ setAppRole("camp"); step2(); };
  };
  const step2=async()=>{
    body.innerHTML=`<h3>⛺ Your camp</h3><div class="ng-note spin">Looking for camps at your table…</div>`;
    if(!roomKey){
      body.innerHTML=`<h3>⛺ Your camp</h3>
        <p class="lead">Your camps are kept at your table. Enter the group passphrase once and this device can pick up any camp stashed there — or just start a fresh one.</p>
        <div class="modal-actions">
          <button class="btn primary sm" id="rcPass">🔑 Set group passphrase</button>
          <button class="btn ghost sm" id="rcSkip">Start a new camp instead</button>
        </div>`;
      $("#rcPass").onclick=async()=>{ if(await ensureRoom())step2(); };
      $("#rcSkip").onclick=()=>{ closeModal(); openLibrary(); };
      return;
    }
    const camps=await listCamps();
    const rows=(camps||[]).map(c=>`<div class="wb-item">
      <button class="wbi-main" data-camp="${esc(c.id)}">
        <div class="wbi-name">⛺ ${esc(c.name)}</div>
        <div class="wbi-sub">${c.n} warband${c.n===1?"":"s"}${c.savedAt?" · stashed "+new Date(c.savedAt).toLocaleDateString():""}</div>
      </button></div>`).join("");
    body.innerHTML=`<h3>⛺ Your camp</h3>
      ${camps===null?`<p class="lead">Couldn't reach your table — you can still start a camp on this device.</p>`
        :rows?`<p class="lead">Camps stashed at your table. Pick yours up here, or start a new one.</p><div class="wb-switch">${rows}</div>`
             :`<p class="lead">No camps stashed at your table yet. Start one here — you can stash it later so your other devices can pick it up.</p>`}
      <div class="modal-actions">
        <button class="btn ${rows?"ghost":"primary"} sm" id="rcNew">+ Start a new camp</button>
      </div>`;
    body.querySelectorAll("[data-camp]").forEach(b=>b.onclick=()=>{
      setCampName((camps.find(c=>c.id===b.dataset.camp)||{}).name||b.dataset.camp);
      closeModal(); restoreCamp();
    });
    $("#rcNew").onclick=()=>{ closeModal(); openLibrary(); };
  };
  step1(); showModal();
}

/* The camp's own header: who you are (camp name) and which table you play at (passphrase).
   Both used to live inside the Warbands dialog, which is why nobody found them. The
   passphrase only means anything where there is a live table, so it only shows in Realm. */
function renderCampBar(){
  const el=$("#campBar"); if(!el)return;
  const nm=campName();
  const live=fbAvailable();
  const joined=!!roomKey;
  el.innerHTML=`<div class="campbar">
    <div class="cb-id">
      <span class="eyebrow">⛺ Your camp</span>
      <button class="cb-name" id="cbName">${esc(nm||"Name your camp")}</button>
    </div>
    <div class="cb-role">${live?`<button class="linkbtn" id="cbRole">this is a camp — change</button>`:""}
    </div>
    ${live?`<div class="cb-table">
      ${joined?`<span class="cb-ok">◉ At your table</span><button class="linkbtn" id="cbPass">change passphrase</button>`
              :`<button class="btn sm primary" id="cbPass">🔑 Set group passphrase</button>
                <span class="none-note" style="font-style:normal">One-time — your table's shared password. After this, joining a game is just a 4-letter code.</span>`}
    </div>`:""}
  </div>`;
  $("#cbName").onclick=openLibrary;
  const cr=$("#cbRole"); if(cr)cr.onclick=openRoleChooser;
  const cp=$("#cbPass"); if(cp)cp.onclick=async()=>{if(await ensureRoom()){render();renderScenarioView();}};
}
function render(){renderHeader();renderRoster();renderVehicleRoster();renderCampBar();syncAppButtons();save()}

function addCharacter(){
  const w=activeWB();const c=newChar();w.characters.push(c);render();openDossier(c.id);
}
function addVehicle(){
  const w=activeWB();if(!w.vehicles)w.vehicles=[];const v=newVehicle();w.vehicles.push(v);render();openVehicleDossier(v.id);
}

/* ============================ DOSSIER (character editor) ============================ */
function syncScroll(){
  const open=document.querySelector(".scrim.show,.dossier.show,.picker.show,.modal.show,.cardwrap.show,.confirm.show,.maplb.show");
  document.body.style.overflow=open?"hidden":"";
}
let _confirmCb=null;
function askConfirm(message,onYes,opts){
  opts=opts||{};
  $("#confirmMsg").textContent=message;
  const yes=$("#confirmYes");
  yes.textContent=opts.yesLabel||"Confirm";
  yes.className="btn sm "+(opts.danger===false?"primary":"confirm-danger");
  _confirmCb=onYes;
  $("#confirmWrap").classList.add("show");syncScroll();
}
function closeConfirm(){$("#confirmWrap").classList.remove("show");_confirmCb=null;syncScroll();}
function openDossier(id){
  curCharId=id;curVehId=null;buildDossier();
  $("#scrim").classList.add("show");
  const d=$("#dossier");d.classList.add("show");d.setAttribute("aria-hidden","false");
  syncScroll();
}
function closeDossier(){
  $("#scrim").classList.remove("show");
  const d=$("#dossier");d.classList.remove("show");d.setAttribute("aria-hidden","true");
  curCharId=null;curVehId=null;syncScroll();
}
function curChar(){return activeWB().characters.find(c=>c.id===curCharId)}

function buildDossier(){
  const c=curChar();if(!c)return;
  const cost=charCost(c);
  const d=$("#dossier");
  d.innerHTML=`
    <div class="dossier-head">
      <button class="iconbtn" id="dBack" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div><div class="eyebrow">Character dossier</div></div>
      <div class="dcost">${cost}<small>points</small></div>
    </div>
    <div class="dbody" id="dbody"></div>
    <div class="dossier-foot">
      <button class="btn danger ghost" id="dDelete">Discharge</button>
      <button class="btn primary" id="dDone">Done</button>
    </div>`;
  const b=$("#dbody");

  // identity
  const idc=document.createElement("div");idc.className="dgroup";
  idc.innerHTML=`
    <div class="field" style="margin-bottom:12px"><label>Name</label>
      <div class="name-row">
        <input class="input" id="fName" value="${esc(c.name)}" placeholder="e.g. Sgt. Vex Kalloran" maxlength="42">
        <button class="genbtn" id="fGen" title="Suggest a name &amp; background with AI" aria-label="Suggest a name and background with AI">✦</button>
      </div></div>
    <div class="field" style="margin-bottom:12px"><label>Role / archetype</label><input class="input" id="fRole" value="${esc(c.role)}" placeholder="e.g. Warband leader" maxlength="40"></div>
    <div class="field"><label>Background</label><textarea class="input" id="fBg" placeholder="Who are they, and why do they fight?">${esc(c.bg)}</textarea></div>`;
  b.appendChild(idc);
  idc.querySelector("#fName").oninput=e=>{c.name=e.target.value;liveCost();renderHeader();renderRoster();save()};
  idc.querySelector("#fGen").onclick=()=>openNameGen(c,false);
  idc.querySelector("#fRole").oninput=e=>{c.role=e.target.value;save();renderRoster()};
  idc.querySelector("#fBg").oninput=e=>{c.bg=e.target.value;save()};

  // skills
  const sg=document.createElement("div");sg.className="dgroup";
  sg.innerHTML=`<div class="ghead"><span class="eyebrow">Core skills</span><span class="rule"></span><span class="gcost mono">+${skillPts(c)}</span></div>`;
  SKILLS.forEach(([k,name])=>{
    const pts=(c.skills[k]-1)*RULES.skillStep;
    const row=document.createElement("div");row.className="steprow";
    row.innerHTML=`
      <div class="lbl" data-tip="${esc(SKILL_INFO[k]+" "+SKILL_ROLL)}"><b>${name} <span style="color:var(--ink-mute)">(${k})</span></b><span>${RULES.skillStep} pts / level · range ${RULES.skillMin}–${RULES.skillMax}</span></div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="stepper">
          <button data-d="-1" ${c.skills[k]<=RULES.skillMin?"disabled":""} aria-label="Lower ${name}">−</button>
          <span class="val">${c.skills[k]}</span>
          <button data-d="1" ${c.skills[k]>=RULES.skillMax?"disabled":""} aria-label="Raise ${name}">+</button>
        </div>
        <span class="pts mono ${pts>0?"pos":""}">${pts?"+"+pts:"—"}</span>
      </div>`;
    row.querySelectorAll("button").forEach(bt=>bt.onclick=()=>{
      const d=+bt.dataset.d,nv=c.skills[k]+d;
      if(nv<RULES.skillMin||nv>RULES.skillMax)return;
      c.skills[k]=nv;buildDossier();persist();
    });
    sg.appendChild(row);
  });
  b.appendChild(sg);

  // vitals
  const vg=document.createElement("div");vg.className="dgroup";
  vg.innerHTML=`<div class="ghead"><span class="eyebrow">Vitals</span><span class="rule"></span><span class="gcost mono">${hpPts(c)>=0?"+":"−"}${Math.abs(hpPts(c))}</span></div>`;
  const hpRow=document.createElement("div");hpRow.className="steprow";
  hpRow.innerHTML=`
    <div class="lbl" data-tip="${esc(VITAL_INFO.hp)}"><b>Hit-points</b><span>start ${RULES.hpStart} · ±${RULES.hpStep} HP = ±${RULES.hpPts} pts</span></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="stepper">
        <button data-d="-1" ${c.hp<=2?"disabled":""} aria-label="Lower HP">−</button>
        <span class="val">${c.hp}</span>
        <button data-d="1" aria-label="Raise HP">+</button>
      </div>
      <span class="pts mono ${hpPts(c)>0?"pos":hpPts(c)<0?"neg":""}">${hpPts(c)?fmtSigned(hpPts(c)):"—"}</span>
    </div>`;
  hpRow.querySelectorAll("button").forEach(bt=>bt.onclick=()=>{
    const d=+bt.dataset.d*RULES.hpStep,nv=c.hp+d;if(nv<2)return;c.hp=nv;buildDossier();persist();
  });
  vg.appendChild(hpRow);
  const spRow=document.createElement("div");spRow.className="steprow";
  spRow.innerHTML=`<div class="lbl"><b>Speed</b><span>fixed by the rules — cannot be bought</span></div><span class="mono" style="font-weight:700;font-size:16px;color:var(--ink-dim)">${RULES.speed}cm</span>`;
  vg.appendChild(spRow);
  b.appendChild(vg);

  // deployment — single character or squad
  const n=memberCount(c);
  const dg=document.createElement("div");dg.className="dgroup";
  dg.innerHTML=`<div class="ghead"><span class="eyebrow">Deployment</span><span class="rule"></span><span class="gcost mono">${n>1?charCost(c)+" × "+n+" = "+unitCost(c):"single"}</span></div>`;
  const memRow=document.createElement("div");memRow.className="steprow";
  memRow.innerHTML=`
    <div class="lbl" data-tip="A squad is one shared profile fielded as several identical models (3–10). Its cost is the profile cost × the number of members. A squad reduced to 2 becomes independent characters.">
      <b>${n>1?"Squad size":"Single character"}</b><span>${n>1?"squad · cost = profile × members":"set 3+ to deploy as a squad"}</span></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="stepper">
        <button data-d="-1" ${n<=1?"disabled":""} aria-label="Fewer members">−</button>
        <span class="val">${n}</span>
        <button data-d="1" ${n>=10?"disabled":""} aria-label="More members">+</button>
      </div>
      <span class="pts mono">${n>1?n+"×":""}</span>
    </div>`;
  memRow.querySelectorAll("button").forEach(bt=>bt.onclick=()=>{
    let nv=n+ +bt.dataset.d;
    if(nv===2)nv+= +bt.dataset.d;   // 2 members isn't a legal squad — skip to 1 or 3
    nv=Math.max(1,Math.min(10,nv));c.count=nv;buildDossier();persist();
  });
  dg.appendChild(memRow);
  if(n>1)dg.insertAdjacentHTML("beforeend",`<div class="none-note" style="font-style:normal;margin-top:8px">All members share this exact profile and equipment (per the rules, ≥75% must carry the same weapons). Total unit cost: <b style="color:var(--teal)">${unitCost(c)} pts</b>.</div>`);
  b.appendChild(dg);

  // campaign pick-ups (collected scenario items that can change the character)
  b.appendChild(renderXPGroup(c));
  if((c.pickups||[]).length)b.appendChild(renderPickupsGroup(c));

  // traits, abilities
  b.appendChild(gearGroup(c,"Traits","trait",c.traits,buildDossier));
  b.appendChild(gearGroup(c,"Abilities","ability",c.abilities,buildDossier));
  // equipment
  b.appendChild(gearGroup(c,"Weapons","weapon",c.weapons,buildDossier));
  b.appendChild(gearGroup(c,"Armour","armour",c.armour,buildDossier));
  b.appendChild(gearGroup(c,"Items & consumables","item",c.items,buildDossier));

  const backToCard=()=>{const id=curCharId;closeDossier();openCard(id);};
  $("#dBack").onclick=backToCard;
  $("#dDone").onclick=backToCard;
  $("#dDelete").onclick=()=>{
    askConfirm("Discharge "+(c.name||"this character")+" from the warband? This can't be undone.",()=>{
      const w=activeWB();w.characters=w.characters.filter(x=>x.id!==c.id);closeDossier();render();toast("Character discharged");
    },{danger:true,yesLabel:"Discharge"});
  };
}
/* Realm has a live table (Firebase); the Claude app has the DM instead. Each shows only the

/* meta/description line for a catalog entry (shared by group rows + picker) */
function entryDesc(cat,o){
  if(cat==="weapon"||cat==="vweapon"){
    const b=[];
    if(o.type)b.push(o.type); if(o.size)b.push(o.size);
    if(o.dmg)b.push("dmg "+o.dmg);
    if(o.range&&o.range!=="—")b.push(o.range);
    if(o.rules&&o.rules!=="—")b.push(o.rules);
    return b.join(" · ");
  }
  if(cat==="armour")return (o.def&&o.def!=="—"?"Defence "+o.def:"")+(o.desc&&o.desc!=="—"?((o.def&&o.def!=="—")?" · ":"")+o.desc:"");
  if(cat==="vsection")return "HP "+o.hp+(o.desc?" · "+o.desc:"");
  return o.desc||"";
}
const ADD_NOUN={trait:"trait",ability:"ability",weapon:"weapon",armour:"armour",item:"item",vsection:"section",vtrait:"trait",vability:"ability",vweapon:"weapon"};

/* generic group renderer — obj[field] is a list of ids (traits/abilities) or {id,qty} (gear).
   rebuild() re-renders the parent editor (buildDossier or buildVehicleDossier). */
function gearGroup(obj,label,cat,arr,rebuild){
  const meta=CAT_META[cat], isQty=meta.kind==="qty", unit=meta.unit;
  const g=document.createElement("div");g.className="dgroup";
  const groupCost=isQty?gearPts(arr,cat):listPts(arr,cat);
  g.innerHTML=`<div class="ghead"><span class="eyebrow">${label}</span><span class="rule"></span>
     <span class="gcost mono">${groupCost?(isQty?groupCost+" "+unit:fmtSigned(groupCost)):"—"}</span></div>`;
  const list=document.createElement("div");list.className="sel-list";
  if(!arr.length){const n=document.createElement("div");n.className="none-note";n.textContent="None selected.";list.appendChild(n);}
  arr.forEach(entry=>{
    const id=isQty?entry.id:entry;const o=CAT[cat][id];if(!o)return;
    const row=document.createElement("div");row.className="sel-row";
    let costTxt,costCls;
    if(isQty){costTxt=(o.cost*entry.qty)+" "+unit;costCls="cr";}
    else{costTxt=fmtSigned(o.cost);costCls=o.cost>=0?"pos":"neg";}
    const d=entryDesc(cat,o);
    row.innerHTML=`
      <div class="srmain"><div class="srname">${esc(o.name)}</div>${d?`<div class="srdesc">${esc(d)}</div>`:""}</div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:7px">
        <span class="srcost ${costCls}">${costTxt}</span>
        ${isQty?`<div class="qty"><button data-q="-1" aria-label="less">−</button><span class="qv">${entry.qty}</span><button data-q="1" aria-label="more">+</button></div>`:""}
      </div>
      <button class="rm" aria-label="Remove">×</button>`;
    if(isQty)row.querySelectorAll(".qty button").forEach(bt=>bt.onclick=()=>{entry.qty=Math.max(1,entry.qty+ +bt.dataset.q);rebuild();persist();});
    row.querySelector(".rm").onclick=()=>{arr.splice(arr.indexOf(entry),1);rebuild();persist();};
    list.appendChild(row);
  });
  g.appendChild(list);
  const addLine=document.createElement("div");addLine.className="add-line";addLine.style.marginTop="9px";
  const ab=document.createElement("button");ab.className="addbtn";
  ab.innerHTML=`<span class="p">+</span> Add ${ADD_NOUN[cat]||"item"}`;
  ab.onclick=()=>openPicker(cat,obj,rebuild);
  addLine.appendChild(ab);g.appendChild(addLine);
  return g;
}

/* ============================ PICKER ============================ */
let pickerCtx=null;
const PICKER_TITLE={trait:"Add a trait",ability:"Add an ability",weapon:"Add a weapon",armour:"Add armour",item:"Add an item",
  vsection:"Add a section",vtrait:"Add a vehicle trait",vability:"Add a vehicle ability",vweapon:"Add a weapon"};
function openPicker(cat,obj,rebuild){
  pickerCtx={cat,obj,field:FIELD_OF[cat],rebuild};
  $("#pkTitle").innerHTML=PICKER_TITLE[cat]||"Add";
  $("#pkSearch").value="";
  renderPickerList("");
  $("#picker").classList.add("show");syncScroll();
  setTimeout(()=>$("#pkSearch").focus(),60);
}
function closePicker(){$("#picker").classList.remove("show");pickerCtx=null;syncScroll();}
function renderPickerList(q){
  const {cat,obj,field,rebuild}=pickerCtx;const list=$("#pkList");list.innerHTML="";
  q=q.trim().toLowerCase();
  const meta=CAT_META[cat], isQty=meta.kind==="qty", unit=meta.unit;
  const arr=obj[field];
  const pickedIds=new Set(isQty?arr.map(e=>e.id):arr);
  const entries=Object.values(CAT[cat]).filter(o=>{
    if(!q)return true;
    const hay=(o.name+" "+(o.desc||"")+" "+(o.rules||"")+" "+(o.type||"")+" "+(o.dmg||"")+" "+(o.def||"")).toLowerCase();
    return hay.includes(q);
  });
  if(!entries.length){list.innerHTML=`<div class="nomatch">No match for “${esc(q)}”.</div>`;return}
  $("#pkTitle").innerHTML=(PICKER_TITLE[cat]||"Add")+` <span class="cnt">${entries.length}</span>`;
  entries.forEach(o=>{
    const picked=!isQty&&pickedIds.has(o.id);
    const btn=document.createElement("button");btn.className="opt"+(picked?" picked":"");
    let costTxt,costCls;
    if(isQty){costTxt=o.cost+" "+unit;costCls="cr";}else{costTxt=fmtSigned(o.cost);costCls=o.cost>=0?"pos":"neg";}
    const desc=entryDesc(cat,o);
    btn.innerHTML=`
      <div class="omain">
        <div class="oname">${esc(o.name)}${picked?' <span class="tag">added</span>':""}</div>
        ${desc?`<div class="odesc">${esc(desc)}</div>`:""}
      </div>
      <div class="ocost ${costCls}">${costTxt}</div>`;
    btn.onclick=()=>{
      if(isQty){
        const ex=arr.find(e=>e.id===o.id);
        if(ex)ex.qty++;else arr.push({id:o.id,qty:1});
        toast(o.name+" added");
      }else{
        if(pickedIds.has(o.id)){arr.splice(arr.indexOf(o.id),1);toast(o.name+" removed");}
        else{arr.push(o.id);toast(o.name+" added");}
      }
      rebuild();persist();
      renderPickerList($("#pkSearch").value);
    };
    list.appendChild(btn);
  });
}

function summaryText(w){
  const pool=wbPool(w),fieldedN=w.characters.filter(isFielded).length;

  w.characters.slice().sort((a,b)=>(isFielded(b)?1:0)-(isFielded(a)?1:0)).forEach(c=>{
    out+=`${c.name||"Unnamed"}${c.role?" — "+c.role:""}  [${unitCost(c)} pts]${memberCount(c)>1?"  (squad ×"+memberCount(c)+")":""}${isFielded(c)?"":"  (benched)"}\n`;
    out+="  "+SKILLS.map(([k])=>`${k} ${c.skills[k]}`).join("  ")+`   ${c.hp}HP  ${RULES.speed}cm\n`;
    const t=c.traits.map(id=>CAT.trait[id]?.name).filter(Boolean).join(", ");if(t)out+="  Traits: "+t+"\n";
    const a=c.abilities.map(id=>CAT.ability[id]?.name).filter(Boolean).join(", ");if(a)out+="  Abilities: "+a+"\n";
    const g=[...c.weapons.map(e=>CAT.weapon[e.id]?.name+(e.qty>1?" x"+e.qty:"")),...c.armour.map(e=>CAT.armour[e.id]?.name),...c.items.map(e=>CAT.item[e.id]?.name+(e.qty>1?" x"+e.qty:""))].filter(Boolean).join(", ");
    if(g)out+="  Gear: "+g+"\n";
    out+="\n";
  });
  return out;
}

/* SOLO AI (rulebook p.51-52). The host runs the DM's units, and until now had to remember
   this ladder unaided. It is a strict priority order — take the FIRST line that applies. */
const SOLO_AI=[
  ["In combat","It fights on until it or its opponent is slain. It may not choose to leave combat."],
  ["Not in combat, a player character in line of sight","It takes a shooting action, or uses an ability if it has a relevant one."],
  ["Can't shoot and has no relevant ability","It moves its full speed straight at the nearest visible player character. If two are equally close, pick at random."],
  ["No player character visible","It moves its full speed towards the board edge furthest from where it stands."]
];
const SOLO_AI_ALWAYS=[
  "Always charges when a charge is possible.",
  "Always counters in combat when it can.",
  "Never pushes an opponent back after winning a fight.",
  "Never leaves combat, and never holds an action.",
  "Hits an obstacle while moving? Roll 1D4 — on 1-2 it carries straight on, using Agility to tackle the obstacle; on 3 it turns and moves back the way it came; on 4 you decide how it spends the rest of its move."
];
function cardSoloAI(){

function spellNote(isMajor,isMinor,hasPsyka){
  const lines=[];
  if(isMajor)lines.push("<b>Major arcana</b> — roll 3 random powers from the table at the start of each game; cast them as often as you like.");
  else if(isMinor)lines.push("<b>Minor arcana</b> — roll 1 random power from the table at the start of each game; cast it as often as you like.");
  if(hasPsyka)lines.push("<b>Psyka</b> — a dose lets this character use any one arcane power of their choice (with addiction risk).");
  lines.push("Fail a cast and you risk being <b>Rent Asunder</b> (damage, and −1 Psyche for the game).");
  return lines.join(" ");
}
function cardSpellbook(c,note,rollCount){
  const rolled=Array.isArray(c.rolledSpells)?c.rolledSpells:[];
  const hasRoll=rolled.length>0;
  const thisGame=hasRoll?`<div class="gc-spellnote" style="margin:2px 0 10px"><b style="color:var(--arcane)">This game's powers:</b> ${rolled.map(i=>esc(ARCANA[i][0])).join(" · ")}</div>`:"";
  return `<div class="gc-sec">

    <div class="rollrow">
      <button class="rollbtn" id="spRoll">🎲 Roll ${rollCount} power${rollCount>1?"s":""}</button>
      ${hasRoll?`<button class="rollbtn" id="spCast">✦ Cast a power</button>`:""}
      ${hasRoll?`<button class="linkbtn" id="spClear">Clear roll</button>`:""}
    </div>
    ${thisGame}
    ${(c.pDrop|0)?`<div class="gc-spellnote" style="color:var(--danger)">Psyche is down to <b>${effP(c)}</b> for the rest of this game (rent asunder ×${c.pDrop}). Roll new powers to start a fresh game.</div>`:""}
    ${castLine(c)}
    <div class="spellgrid${hasRoll?" hasroll":""}">${ARCANA.map((a,i)=>`<span class="spell${rolled.includes(i)?" rolled":""}" tabindex="0" data-tip="${esc(a[1])}">${rolled.includes(i)?"✦ ":""}${esc(a[0])}</span>`).join("")}</div>
  </div>`;
}
/* RENT ASUNDER (rulebook p.69-70). Every failed arcana roll risks it, and the app used to
   only WARN about it — leaving the one consequence that makes casting a gamble to be tracked
   on paper. Skill rolls succeed UNDER the value, so a cast fails on a roll >= (P). Then a
   second 1D10: under the caster's CURRENT (P) and nothing happens; equal or over and the mind
   is rent — damage equal to the failed cast roll minus (P), which armour cannot stop, and (P)
   drops by 1 for the rest of the game (so each rending makes the next one likelier). */
function effP(c){return Math.max(1,(c.skills.P|0)-(c.pDrop|0));}
function castArcana(c){
  const P=effP(c), cast=1+Math.floor(Math.random()*10);
  if(cast<P){c.lastCast={cast,P,ok:true};save();buildCard();toast("Cast succeeded — rolled "+cast+" under "+P);return;}
  const check=1+Math.floor(Math.random()*10);
  if(check<P){c.lastCast={cast,P,ok:false,check,rent:false};save();buildCard();toast("Cast failed, but the mind holds");return;}
  const dmg=Math.max(0,cast-P);
  c.pDrop=(c.pDrop|0)+1;
  c.lastCast={cast,P,ok:false,check,rent:true,dmg};
  save();buildCard();
  toast("RENT ASUNDER — "+dmg+" damage (no armour), Psyche now "+effP(c));
}
function castLine(c){
  const r=c.lastCast; if(!r)return "";
  const base=`rolled <b>${r.cast}</b> against (P) ${r.P}`;
  if(r.ok)return `<div class="gc-spellnote" style="margin-top:8px;color:var(--teal)">✓ Cast succeeded — ${base}.</div>`;
  if(!r.rent)return `<div class="gc-spellnote" style="margin-top:8px">✗ Cast failed — ${base}. Rent-asunder check rolled <b>${r.check}</b>, under (P) — the mind holds.</div>`;
  return `<div class="gc-spellnote" style="margin-top:8px;color:var(--danger)">☠ <b>Rent asunder</b> — ${base}, check rolled <b>${r.check}</b>. Takes <b>${r.dmg}</b> damage that armour cannot stop, and (P) drops by 1 for the rest of the game.</div>`;
}
function rollArcana(c,n){
  const idx=Array.from({length:ARCANA.length},(_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=idx[i];idx[i]=idx[j];idx[j]=t;}
  c.rolledSpells=idx.slice(0,n).sort((a,b)=>a-b);
  c.pDrop=0;c.lastCast=null;            // a new game: the mind starts whole again
  save();buildCard();
  toast("Rolled: "+c.rolledSpells.map(i=>ARCANA[i][0]).join(", "));
}

/* ---- character portrait (paste / drop / browse) ---- */
function wirePortrait(o){
  const port=$("#gcPortrait");if(!port)return;
  const browse=()=>$("#imgInput").click();
  if(o.img&&portraitEditing){
    const img=$("#gcImg");
    let dragging=false,sx=0,sy=0,ox=50,oy=50;
    img.addEventListener("pointerdown",e=>{dragging=true;sx=e.clientX;sy=e.clientY;ox=tmpPos.x;oy=tmpPos.y;try{img.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
    img.addEventListener("pointermove",e=>{
      if(!dragging)return;
      const r=port.getBoundingClientRect();
      const kx=100/Math.max(1,r.width), ky=100/Math.max(1,r.height);
      tmpPos.x=Math.max(0,Math.min(100,ox-(e.clientX-sx)*kx));
      tmpPos.y=Math.max(0,Math.min(100,oy-(e.clientY-sy)*ky));
      img.style.objectPosition=tmpPos.x+"% "+tmpPos.y+"%";
    });
    const end=()=>{dragging=false;};
    img.addEventListener("pointerup",end);img.addEventListener("pointercancel",end);
    $("#gcPosSave").onclick=()=>{o.imgPos={x:Math.round(tmpPos.x),y:Math.round(tmpPos.y)};portraitEditing=false;save();rebuildOpenCard();renderRoster();renderVehicleRoster();toast("Position saved");};
    $("#gcPosCancel").onclick=()=>{portraitEditing=false;rebuildOpenCard();};
    return;
  }
  if(o.img){
    $("#gcImgAdjust").onclick=e=>{e.stopPropagation();tmpPos=Object.assign({x:50,y:50},o.imgPos);portraitEditing=true;rebuildOpenCard();};
    $("#gcImgChange").onclick=e=>{e.stopPropagation();browse();};
    $("#gcImgRemove").onclick=e=>{e.stopPropagation();o.img=null;save();rebuildOpenCard();renderRoster();renderVehicleRoster();toast("Portrait removed");};
  }else{
    const drop=$("#gcDrop");
    drop.onclick=browse;
    drop.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();browse();}};
  }
  port.addEventListener("dragover",e=>{e.preventDefault();const d=port.querySelector(".gc-drop");if(d)d.classList.add("drag");});
  port.addEventListener("dragleave",()=>{const d=port.querySelector(".gc-drop");if(d)d.classList.remove("drag");});
  port.addEventListener("drop",e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)handleImageFile(o,f);});
}
function processImage(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onerror=()=>reject(new Error("read"));
    r.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("decode"));
      img.onload=()=>{
        const maxW=640,maxH=820;
        let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        const scale=Math.min(1,maxW/w,maxH/h);
        w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
        const cv=document.createElement("canvas");cv.width=w;cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        resolve(cv.toDataURL("image/jpeg",0.82));
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}
async function handleImageFile(o,file){
  if(!file||!file.type||!/^image\//.test(file.type)){toast("That doesn't look like an image");return;}
  toast("Adding portrait…");
  try{
    const url=await processImage(file);
    const prev=o.img, prevPos=o.imgPos;o.img=url;o.imgPos={x:50,y:50};
    if(!save()){o.img=prev;o.imgPos=prevPos;save();toast("Storage full — try a smaller image or remove some");return;}
    rebuildOpenCard();renderRoster();renderVehicleRoster();toast("Portrait added");
  }catch(e){toast("Couldn't read that image");}
}

/* ============================ AI ART-PROMPT BUILDER ============================ */
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s}
function naturalJoin(a){if(a.length===0)return "";if(a.length===1)return a[0];if(a.length===2)return a[0]+" and "+a[1];return a.slice(0,-1).join(", ")+", and "+a[a.length-1];}
function article(w){return /^[aeiou]/i.test(w)?"an ":"a ";}

function buildArtPrompt(c){
  const s=c.skills, out=[];
  // subject
  const who=(c.name||"").trim();
  const role=(c.role||"").trim();
  const lead=role?article(role)+role.toLowerCase():"a lone operative";
  let bgEss="";
  if(c.bg&&c.bg.trim()){bgEss=(c.bg.trim().match(/^[^.!?]*/)||[""])[0].trim();if(bgEss.length>150)bgEss=bgEss.slice(0,150).trim();if(bgEss)bgEss=bgEss.charAt(0).toLowerCase()+bgEss.slice(1);}
  out.push(`${who?who+", ":""}${lead}`+(bgEss?` — ${bgEss}`:""));
  // physique from stats
  const ap=[];
  if(s.F>=8)ap.push("hulking, heavily muscled and covered in battle scars");
  else if(s.F>=6)ap.push("powerfully built for close combat");
  if(s.S>=8)ap.push("a deadeye marksman");
  else if(s.S>=6)ap.push("a steady-handed shooter");
  if(s.A>=8)ap.push("lithe and acrobatic");
  else if(s.A<=2)ap.push("slow and heavy-footed");
  if(s.AW>=8)ap.push("hyper-alert with sharp, watchful eyes");
  if(s.P>=8)ap.push("crackling with psychic energy, eyes glowing with arcane power");
  else if(s.P>=6)ap.push("carrying an unsettling psychic aura");
  if(s.F<=2&&s.A<=2&&s.S<=2)ap.push("frail and physically unimposing");
  if(ap.length)out.push(cap(naturalJoin(ap.slice(0,3))));
  // traits
  const tv=c.traits.map(id=>TRAIT_VIS[CAT.trait[id]?.name]).filter(Boolean);
  if(tv.length)out.push(cap(naturalJoin(tv.slice(0,4))));
  // armour
  const av=[...new Set(c.armour.map(e=>ARMOUR_VIS[CAT.armour[e.id]?.name]).filter(Boolean))];
  if(av.length)out.push("wearing "+naturalJoin(av));
  // weapons
  const wns=[...new Set(c.weapons.map(e=>CAT.weapon[e.id]?.name).filter(Boolean).filter(n=>n!=="Fist"))];
  if(wns.length)out.push("armed with "+naturalJoin(wns.map(n=>article(n)+n.toLowerCase())));
  else out.push("fighting with bare fists");
  // items
  const iv=[...new Set(c.items.map(e=>ITEM_VIS[CAT.item[e.id]?.name]).filter(Boolean))];
  if(iv.length)out.push("carrying "+naturalJoin(iv));
  // style + framing
  const style=ART_STYLES[promptStyle]||ART_STYLES.concept;
  const asp=ASPECTS[promptAspect]||ASPECTS["2:3"];
  let p=out.map(cap).join(". ")+". "+cap(style[1])+". ";
  p+="Character shown in a dark, grimy science-fiction setting (the Planet 28 tabletop skirmish universe), neutral background, no text or watermark. ";
  p+=cap(asp[1])+" ("+asp[2]+").";
  return p;
}
const NEG_PROMPT="blurry, low detail, low quality, cropped, extra fingers, deformed hands, watermark, signature, text, logo, modern clothing, cartoonish";

function buildVehicleArtPrompt(v){
  const out=[];
  const who=(v.name||"").trim();
  const ty=VEHICLE_TYPES[v.type]||VEHICLE_TYPES[0];
  const sz=VEHICLE_SIZES[v.size]||VEHICLE_SIZES[1];
  const typeDesc={Ground:"rugged wheeled and tracked ground vehicle",Walker:"legged walker war-machine",Hover:"hovering anti-grav vehicle",Flyer:"flying aircraft-style vehicle"}[ty[0]]||"vehicle";
  const sizeWord=sz[0]==="Small"?"small, nimble":sz[0]==="Large"?"huge, hulking":"mid-sized";
  let bgEss="";
  if(v.bg&&v.bg.trim()){bgEss=(v.bg.trim().match(/^[^.!?]*/)||[""])[0].trim();if(bgEss.length>150)bgEss=bgEss.slice(0,150).trim();if(bgEss)bgEss=bgEss.charAt(0).toLowerCase()+bgEss.slice(1);}
  out.push(`${who?who+", ":""}a ${sizeWord} ${typeDesc}${v.role?` (${v.role.toLowerCase()})`:""}`+(bgEss?` — ${bgEss}`:""));
  const secNames=(v.sections||[]).map(e=>CAT.vsection[e.id]?.name).filter(Boolean);
  const sv=[];
  if(secNames.includes("Armour plating"))sv.push("heavy bolted armour plating");
  if(secNames.includes("Transport section"))sv.push("a troop-carrying compartment");
  if(secNames.includes("Dozer blade"))sv.push("a front dozer blade");
  if(secNames.includes("Turret hard point"))sv.push("a rotating gun turret");
  if(secNames.includes("Smoke launchers"))sv.push("smoke launchers");
  if(secNames.includes("Radio")||secNames.includes("Scrambler array"))sv.push("antennae and comms arrays");
  if(sv.length)out.push(cap(naturalJoin(sv)));
  const wns=[...new Set((v.weapons||[]).map(e=>CAT.vweapon[e.id]?.name).filter(Boolean))];
  if(wns.length)out.push("armed with "+naturalJoin(wns.map(n=>article(n)+n.toLowerCase())));
  const trn=(v.traits||[]).map(id=>CAT.vtrait[id]?.name).filter(Boolean);
  const tv=[];
  if(trn.includes("Camo"))tv.push("camouflage paint");
  if(trn.includes("Ramshackle"))tv.push("a rusty, ramshackle, cobbled-together look");
  if(trn.includes("Open-topped"))tv.push("an open top");
  if(tv.length)out.push(cap(naturalJoin(tv)));
  const style=ART_STYLES[promptStyle]||ART_STYLES.concept;
  const asp=ASPECTS[promptAspectVeh]||ASPECTS["3:2"];
  let p=out.map(cap).join(". ")+". "+cap(style[1])+". ";
  p+="Three-quarter side view of the vehicle in a dark, grimy science-fiction setting (the Planet 28 tabletop skirmish universe), neutral background, no text or watermark. ";
  p+=cap(asp[1])+" ("+asp[2]+").";
  return p;
}

function briefFromObj(o,isVeh){
  const bits=[];
  if(o.role&&o.role.trim())bits.push((isVeh?"Type/role: ":"Role/archetype: ")+o.role.trim());
  if(isVeh){
    const ty=VEHICLE_TYPES[o.type], sz=VEHICLE_SIZES[o.size];
    if(sz&&ty)bits.push(sz[0]+" "+ty[0].toLowerCase()+" vehicle");
    const tr=(o.traits||[]).map(id=>CAT.vtrait[id]?.name).filter(Boolean);
    if(tr.length)bits.push("Traits: "+tr.join(", "));
    const wp=[...new Set((o.weapons||[]).map(e=>CAT.vweapon[e.id]?.name).filter(Boolean))];
    if(wp.length)bits.push("Weapons: "+wp.join(", "));
  }else{
    const tr=(o.traits||[]).map(id=>CAT.trait[id]?.name).filter(Boolean);
    if(tr.length)bits.push("Notable traits: "+tr.join(", "));
  }
  if(o.bg&&o.bg.trim())bits.push(o.bg.trim());
  return bits.join(". ");
}

function warbandBrief(w){
  const bits=[];
  const nC=w.characters.length, nV=vehsOf(w).length;
  if(nC||nV)bits.push([nC?nC+" character"+(nC>1?"s":""):"",nV?nV+" vehicle"+(nV>1?"s":""):""].filter(Boolean).join(" and "));
  const roles=[...new Set(w.characters.map(c=>c.role).filter(Boolean))];
  if(roles.length)bits.push("including "+roles.slice(0,4).join(", "));
  const traits=[];w.characters.forEach(c=>c.traits.forEach(id=>{const n=CAT.trait[id]&&CAT.trait[id].name;if(n)traits.push(n);}));
  const ut=[...new Set(traits)];
  if(ut.length)bits.push("notable traits: "+ut.slice(0,5).join(", "));
  return bits.join("; ");
}

/* ---- ROUND CHEAT SHEET ----
   Straight off the rulebook, for the phone in your hand while the tracker is open. Grouped by
   the question you actually have mid-turn ("what can I do", "how do I shoot", "they charged
   me"), not by page order, and each procedure is written as the sequence you follow. */
const CHEAT=[
 {ico:"◉",title:"Your two actions",items:[
  {n:"How a turn runs",d:"Every character gets 2 actions. Activate by Agility, highest first, both sides interleaved — not all of one player's characters together. Tied (A)? The higher (AW) chooses where to go. Tied on both? Both roll 1D10; lowest decides who acts first."},
  {n:"Move",d:"Move up to your speed (10cm as standard). Measure from one point on the base and finish the move from that same point."},
  {n:"Charge",d:"End a move in base contact with an enemy and you get one extra fight action at +1D4 Fighting. Only that first fight gets the bonus."},
  {n:"Fight",d:"Attack anyone you have charged, are locked in combat with, or are within 5cm of."},
  {n:"Shoot",d:"Fire one weapon at someone in range you can see. Not while you are locked in combat, and never at someone who is."},
  {n:"Ability",d:"Use one of your abilities, or cast if you have an arcana trait."},
  {n:"Item",d:"Use an item from your inventory, or swap weapons."},
  {n:"Hold",d:"Declare you are holding and act later in the turn instead. Holding is free — it costs no action — but held actions are lost at the end of the turn."},
  {n:"Universal action",d:"Anything that takes time but needs no roll — reloading, crouching, searching a body, picking up a dropped weapon."}
 ]},
 {ico:"⚔",title:"Attacking",items:[
  {n:"Shoot — step by step",steps:[
    "Check range, and that you can see part of their body (head, torso, arms or legs — not weapons or base).",
    "Roll 1D10 under your Shooting, applying the modifiers below.",
    "On a hit, roll your weapon's damage dice.",
    "They roll armour — plus an extra 1D6 if they are in cover.",
    "Whatever is left comes off their hit-points."],
   mod:"−1 for each move you or the target made this turn · −1 if they are 5cm+ above you · +1 if you are 5cm+ above them"},
  {n:"Fight — step by step",steps:[
    "Declare who you are attacking.",
    "Move your base into contact with theirs — this is not a move action and does not count as a charge.",
    "Roll 1D10 under your Fighting.",
    "On a hit, roll damage; they roll armour; the rest comes off their hit-points."]},
  {n:"Pushback",d:"Dealt damage in a fight? You may shove them 3cm directly away. Doing so breaks you both out of combat — sometimes exactly what you want, sometimes not."},
  {n:"Fighting several enemies",d:"Locked with more than one? Take a focus test before attacking: subtract the number of enemies in combat with you from your (AW) and roll under that. Pass and you fight normally for the rest of the turn. Fail and you take −1 Fighting for every enemy in base contact. You may split your two actions between different targets."},
  {n:"One weapon per action",d:"Shooting or fighting, you use a single weapon per action. Two pistols means two separate shoot actions, not one double shot."}
 ]},
 {ico:"⛨",title:"Defending",items:[
  {n:"Counter",d:"Being attacked and have not acted yet this turn? Spend an action to fight back — but you must declare it BEFORE they roll.",steps:[
    "Both of you roll against Fighting.",
    "Both succeed — you both take damage, then both push back 3cm.",
    "Both fail — you stay locked in combat.",
    "One succeeds — that character finishes the attack as normal, even if they were the one being attacked."]},
  {n:"Block a charge",d:"Charged? Roll under your Awareness. Succeed and they still get their extra fight action, but without the +1D4."},
  {n:"Cover",d:"If any part of your body is covered by terrain you are in cover: an extra 1D6 armour roll against shooting, on top of your normal armour."},
  {n:"Leave combat",d:"Move out of base contact at any time, at −1D4cm speed (roll each time you do it). Every opponent gets one free fight action first, and you may not counter it."}
 ]},
 {ico:"☠",title:"When it goes wrong",items:[
  {n:"Below half hit-points",d:"All your skills drop by 1 for the rest of the game, until you are healed back above half."},
  {n:"Break test",d:"Taken below half? Roll under your Psyche. Fail and you immediately run at full speed for the nearest board edge — that move is free, not an action.",steps:[
    "Below half, you test again every single time you take damage.",
    "Each successive test in a turn is at −1 Psyche.",
    "Keep spending actions on tests until you pass or leave the table.",
    "Reach the board edge before passing one and you are out of the game.",
    "Down to exactly 1 hit-point? You never test again."]},
  {n:"Climbing",d:"Anything vertical, or an obstacle 5cm or higher, needs an Agility roll per action, moving up to your speed. Stopping mid-climb needs another roll to hold on until your next action, and you can do nothing else until you are up."},
  {n:"Falling",d:"Fail a climb roll and you fall. Take 1 damage for every cm above 5, with no armour roll, and land directly below where you fell."},
  {n:"Out of hit-points",d:"Removed from the game. Back at camp they roll on the injury table for what it cost them."}
 ]},
 {ico:"⚄",title:"Rolling dice",items:[
  {n:"The one rule",d:"Roll 1D10 UNDER the skill to succeed. Equal or over is a failure. A 1 always succeeds and a 10 always fails, whatever the modifiers."},
  {n:"Measuring",d:"Between characters, measure base edge to base edge. For movement, start and finish from the same point on the model. Everything is in centimetres."}
 ]}
];

 easy:  {label:"Easy",  enemyBonus:100, roundMod:2,  tone:"forgiving — the enemy is lighter and there is a little more time"},
 normal:{label:"Normal",enemyBonus:200, roundMod:0,  tone:"balanced — the standard co-op odds from the rules"},

/* Firebase drops empty arrays one level deeper too: an enemy unit with no traits/armour
   comes back missing those fields entirely and the points maths throws on it. Heal them. */
function healScnChars(s){
  const arr=(o,k)=>{if(o&&!Array.isArray(o[k]))o[k]=[];};
  if(s&&s.enemy&&Array.isArray(s.enemy.characters))
    s.enemy.characters.forEach(c=>{
      if(!c||typeof c!=="object")return;
      ["traits","abilities","weapons","armour","items","pickups","sections"].forEach(k=>arr(c,k));
      if(!c.skills||typeof c.skills!=="object")c.skills={A:1,F:1,S:1,AW:1,P:1};
      ["A","F","S","AW","P"].forEach(k=>{if(typeof c.skills[k]!=="number")c.skills[k]=1;});
      if(typeof c.hp!=="number")c.hp=20;
      stripRedundantTraits(c);
      if(c.hint)c.hint=cleanHint(c.hint);
    });
  if(s&&s.enemy&&Array.isArray(s.enemy.vehicles))
    s.enemy.vehicles.forEach(v=>{
      if(!v||typeof v!=="object")return;
      v.isVehicle=true;
      ["sections","traits","abilities","weapons"].forEach(k=>arr(v,k));
      if(!v.skills||typeof v.skills!=="object")v.skills={A:VRULES.aStart,S:VRULES.sStart};
      if(typeof v.skills.A!=="number")v.skills.A=VRULES.aStart;
      if(typeof v.skills.S!=="number")v.skills.S=VRULES.sStart;
      if(typeof v.type!=="number")v.type=0;
      if(typeof v.size!=="number")v.size=1;
      if(v.hint)v.hint=cleanHint(v.hint);
    });
  if(s&&s.battle&&Array.isArray(s.battle.combatants))
    s.battle.combatants.forEach(m=>{arr(m,"conditions");arr(m,"neg");});
  return s;
}
function fillScnArrayDefaults(s){
  // Firebase Realtime Database silently drops any field that was an empty array/object
  // at write time (e.g. specialRules:[] round-trips as "field absent"). Restore safe
  // defaults on the receiving (guest) side so template code that assumes arrays never crashes.
  if(!s||typeof s!=="object")return s;
  ["objectives","specialRules","terrain","markers","npcs","items","events","searched"].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});
  if(!s.map||typeof s.map!=="object")s.map={note:"",zones:[],features:[]};
  s.map.zones=Array.isArray(s.map.zones)?s.map.zones:[];
  s.map.features=Array.isArray(s.map.features)?s.map.features:[];
  if(s.enemy&&typeof s.enemy==="object"){if(!Array.isArray(s.enemy.characters))s.enemy.characters=[];if(!Array.isArray(s.enemy.vehicles))s.enemy.vehicles=[];}
  if(s.battle&&typeof s.battle==="object"&&!Array.isArray(s.battle.combatants))s.battle.combatants=[];
  return healScnChars(s);
}
async function joinGame(code,name){
  const db=await getDb();if(!db){toast("Live play unavailable here.");return;}
  const res=$("#lgResult");if(res)res.innerHTML=`<div class="ng-note spin">Joining ${esc(code)}…</div>`;
  const ref=db.doc("sessions/"+code);
  let snap;try{snap=await ref.get();}catch(e){if(res)res.innerHTML=`<div class="ng-note">Couldn't reach the game — check your connection and try again.</div>`;toast("Couldn't reach the game");return;}
  if(!snap.exists){if(res)res.innerHTML=`<div class="ng-note">No live game with code ${esc(code)} at your table. Double-check the code on the host's screen, and that you both set the same group passphrase.</div>`;toast("No game found with that code");return;}
  clearLive();liveRole="guest";liveCode=code;liveScenario=fillScnArrayDefaults((snap.data()||{}).scenario||null);
  try{ _liveUnsub.push(ref.onSnapshot(sn=>{
    if(sn.exists){
      liveScenario=fillScnArrayDefaults((sn.data()||{}).scenario)||liveScenario;
      rememberQuestState(liveScenario);      // keep our own copy so spoils survive the host leaving
      if(liveRole==="guest")renderScenarioView();
    }else{toast("The host packed up — bring your warband home");returnToCamp();}
  },()=>{})); }catch(e){}
  const pid=(name.replace(/[^A-Za-z0-9_-]/g,"")||"guest").slice(0,20)+"_"+Math.random().toString(36).slice(2,6);
  guestPid=pid; guestPlayerRef=ref.collection("players").doc(pid);
  try{ await guestPlayerRef.set({name,warbandName:activeWB().name,combatants:myCombatants(name,"g"+pid+"_"),joinedAt:Date.now()}); }catch(e){}
  closeModal();switchView("scenarios");renderScenarioView();toast("Joined game "+code);
}
async function resendWarband(){
  if(!guestPlayerRef){toast("You're not in a game.");return;}
  const nm=playerName()||"Guest";
  try{ await guestPlayerRef.set({name:nm,warbandName:activeWB().name,combatants:myCombatants(nm,"g"+guestPid+"_"),joinedAt:Date.now()}); toast("Sent your warband to the host"); }
  catch(e){ toast("Couldn't send — try again."); }
}
/* ---- returning from a quest ----
   Your own device keeps the last roster it saw, so your characters can still come home even
   if the host has already packed up. Claims are recorded per quest so nothing lands twice. */
// a combatant is "mine" when it came from a character in this device's warband
function myCombatantsIn(scn){
  const w=activeWB(); if(!w||!scn||!scn.battle||!Array.isArray(scn.battle.combatants))return [];
  const cid=campId();
  return scn.battle.combatants.filter(m=>m&&m.side==="player"&&(m.charId||m.vehId)&&
    (m.charId?(w.characters.some(c=>c.id===m.charId)||(cid&&m.campId===cid))
             :(vehsOf(w).some(v=>v.id===m.vehId)||(cid&&m.campId===cid))));
}
function rememberQuestState(scn){
  try{
    if(!scn||!scn.battle)return;
    const mine=myCombatantsIn(scn);
    if(!mine.length)return;
    localStorage.setItem("p28_quest_"+scn.id,JSON.stringify({scnId:scn.id,title:scn.title||"",at:Date.now(),combatants:mine,
      injuries:injuryTableFor(scn),causes:injuryCauses(scn)}));
  }catch(e){}
}
/* ---- experience & rank ----
   1 XP = 1 point of upgrades. Spending grows the character's points value, so veterans cost
   more and you field fewer of them. Ranks come from lifetime XP, never spent away. */
/* ---- campaign points & credits (rulebook economy) ----
   Characters earn their own campaign points and spend them on themselves; the warband keeps a
   collective pool for scenario goals and recruiting. Equipment is bought with POINTS only when
   the warband is first built — after that it costs CREDITS, and CP convert to credits at 2:1. */
const CP_COSTS={skill:20,hp:20,hpStep:5,recruit:10,heal:10};
const CP_EARN=[
  {key:"actions",label:"Successful shoot or fight actions",per:1,input:true},
  {key:"kills",label:"Enemies killed",per:5,input:true},
  {key:"survived",label:"Survived the game",per:1,auto:true},
  {key:"unwounded",label:"Made it to the end unwounded",per:5,auto:true}
];
const CP_WARBAND=[
  {key:"goal",label:"Achieved the scenario goal",per:10},
  {key:"rout",label:"Destroyed 50% or more of an enemy warband",per:10}
];
const RANKS=[
  {at:0,name:"Recruit"},{at:20,name:"Trooper"},{at:60,name:"Blooded"},{at:120,name:"Veteran"},
  {at:200,name:"Sergeant"},{at:300,name:"Lieutenant"},{at:450,name:"Captain"},{at:650,name:"Warlord"}
];
function rankOf(total){let r=RANKS[0];RANKS.forEach(x=>{if((total||0)>=x.at)r=x;});return r.name;}
function nextRank(total){return RANKS.find(x=>(total||0)<x.at)||null;}
function cpOf(c){return (typeof c.cp==="number"?c.cp:(c.xp||0));}
function cpTotalOf(c){return (typeof c.cpTotal==="number"?c.cpTotal:(c.xpTotal||0));}
function creditsOf(w){return Math.max(0,Math.round(+w.credits||0));}
function hasTrait(c,name){const o=findCat("trait",name);return !!(o&&(c.traits||[]).includes(o.id));}
function grantCP(chars,amount){
  chars.forEach(c=>{
    const before=cpTotalOf(c);
    c.cp=cpOf(c)+amount; c.cpTotal=before+amount; delete c.xp; delete c.xpTotal;
    if(rankOf(before)!==rankOf(c.cpTotal))c._rankedUp=rankOf(c.cpTotal);
  });
}
/* HIDDEN AGENDAS (rulebook p.58, table p.80). A private goal one character carries into a
   game, separate from the scenario. Worth 5 campaign points, 1 less for every game it has
   already been carried and failed. Deliberately NEVER included in myCombatants(), so it is
   not synced to the host or the other players — the point is that they know you HAVE one,
   not what it is. */
const AGENDAS=[
  {roll:1,name:"Vendetta",text:"One of the enemies you're facing is an old foe. After all characters are deployed, select an enemy character — you must kill it before the game ends."},
  {roll:2,name:"The mule",text:"You're carrying illicit goods for a shadowy overlord. Reach the board edge opposite the one you started at and spend an entire turn in base contact with it."},
  {roll:3,name:"Thief in the night",text:"There's a stash out here somewhere. Move to each corner of the playing area and roll 1D4 — on a 4 you have found it, for 2D20 credits. (If three corners come up empty, the last needs no roll.)"},
  {roll:4,name:"Knowledge is power",text:"An enemy knows something you don't. Select an enemy character at the start of the game and win at least one fight action against it — instead of dealing damage, you extract what you need."},
  {roll:5,name:"Vow of pacifism",text:"After a night of prayer and hard liquor you swore off violence. Survive to the end of the game without causing any damage to an enemy character."},
  {roll:6,name:"An honourable death",text:"You went seeking glorious combat. You must fight and be slain by the enemy character with the highest (F). These campaign points are split among the warband."}
];
function agendaValue(a){return Math.max(0,5-((a&&a.fails)|0));}
function takeAgenda(c){
  const pick=AGENDAS[Math.floor(Math.random()*AGENDAS.length)];
  c.agenda={roll:pick.roll,fails:0};
  save();buildCard();render();
  toast("⚑ A hidden agenda — tap Reveal to read it");
}
let agendaOpen={};
function cardAgenda(c){
  const a=c.agenda;
  if(!a)return `<div class="gc-sec">
    <div class="sh">⚑ Hidden agenda</div>
    <div class="gc-spellnote">A private goal, rolled in secret and worth <b>5 campaign points</b>. Tell the others you have one — never what it is.</div>
    <div class="rollrow"><button class="rollbtn" id="agTake">🎲 Take a hidden agenda</button></div>
  </div>`;
  const o=AGENDAS.find(x=>x.roll===a.roll)||AGENDAS[0];
  const shown=!!agendaOpen[c.id];
  return `<div class="gc-sec">
    <div class="sh">⚑ Hidden agenda</div>
    <div class="gc-spellnote">Worth <b>${agendaValue(a)}</b> campaign point${agendaValue(a)===1?"":"s"}${(a.fails|0)?` — carried and failed ${a.fails} game${a.fails>1?"s":""}, so it is worth ${a.fails} less`:""}.</div>
    ${shown?`<div class="gc-entry"><div class="en"><span>${esc(o.name)}</span></div><div class="ed">${esc(o.text)}</div></div>`
           :`<div class="gc-entry"><div class="ed redacted">Sealed — only this character knows what they are after.</div></div>`}
    <div class="rollrow" style="margin:10px 0 0">
      <button class="rollbtn" id="agPeek">${shown?"Hide":"Reveal"}</button>
      <button class="linkbtn" id="agDrop">Give it up</button>
    </div>
  </div>`;
}
/* Settled at camp, after the quest tally — did they pull it off? */
function openAgendaCheck(chars,then){
  const list=(chars||[]).filter(c=>c&&c.agenda);
  if(!list.length){if(then)then();return;}
  let i=0;
  const step=()=>{
    if(i>=list.length){save();render();closeModal();if(then)then();return;}
    const c=list[i], a=c.agenda, o=AGENDAS.find(x=>x.roll===a.roll)||AGENDAS[0], val=agendaValue(a);
    $("#modalBody").innerHTML=`<h3>⚑ ${esc(c.name||"Unnamed")} — ${esc(o.name)}</h3>
      <p class="lead">${esc(o.text)}</p>
      <div class="ng-result"><b>Worth ${val} campaign point${val===1?"":"s"}</b>${(a.fails|0)?`<div class="ed" style="margin-top:4px">Reduced by ${a.fails} for the game${a.fails>1?"s":""} already spent carrying it.</div>`:""}</div>
      <div class="modal-actions">
        <button class="btn primary sm" id="agDone">Completed — award ${val}</button>
        <button class="btn sm" id="agFail">Failed — carry it on</button>
      </div>`;
    $("#agDone").onclick=()=>{
      if(val>0)grantCP([c],val);
      delete c.agenda; save();
      toast(val>0?("+"+val+" campaign points"):"Completed — but it is worth nothing now");
      i++;step();
    };
    $("#agFail").onclick=()=>{
      a.fails=(a.fails|0)+1; save();
      toast("Carried on — now worth "+agendaValue(a));
      i++;step();
    };
  };
  step();showModal();
}
/* End-of-quest tally, straight off the rulebook's list. */
function openCPAwards(snap,charIds,then){
  const w=activeWB();
  const took=charIds.map(id=>w.characters.find(x=>x.id===id)).filter(Boolean);
  if(!took.length){if(then)then();return;}
  const state=took.map(c=>{
    const m=(snap.combatants||[]).find(x=>x.charId===c.id)||{};
    const max=c.hp*memberCount(c);
    return {c,actions:0,kills:0,survived:(m.curHP||0)>0,unwounded:(m.curHP||0)>=max};
  });
  const body=$("#modalBody");
  const draw=()=>{
    const rows=state.map((s,i)=>{
      const auto=(s.survived?1:0)+(s.unwounded?5:0);
      const tot=s.actions*1+s.kills*5+auto;
      return `<div class="earn-row">
        <div class="prep-h">${esc(s.c.name||"Unnamed")} <span class="mono" style="float:right;color:var(--amber)">+${tot}</span></div>
        <div class="cp-grid">
          <label>Shoot / fight hits <span class="none-note" style="font-style:normal">1 each</span>
            <input class="input" type="number" min="0" max="99" value="${s.actions}" data-cp="${i}|actions"></label>
          <label>Enemies killed <span class="none-note" style="font-style:normal">5 each</span>
            <input class="input" type="number" min="0" max="99" value="${s.kills}" data-cp="${i}|kills"></label>
        </div>
        <div class="none-note" style="font-style:normal;margin-top:5px">
          ${s.survived?"✓ survived (+1)":"✗ did not survive"} · ${s.unwounded?"✓ unwounded (+5)":"✗ was wounded"}
        </div></div>`;
    }).join("");
    const wbTot=CP_WARBAND.reduce((t,a)=>t+((body.querySelector('[data-wcp="'+a.key+'"]')||{}).checked?a.per:0),0);
    body.innerHTML=`
      <h3>Campaign points — ${esc(snap.title||"the quest")}</h3>
      <p class="lead">Tally what each character managed. The rulebook's rates: 1 per successful shoot or fight action, 5 per enemy killed, 1 for surviving, 5 for finishing unwounded.</p>
      ${rows}
      <div class="eyebrow" style="margin:14px 0 7px">The warband as a whole</div>
      ${CP_WARBAND.map(a=>`<label class="xp-award"><input type="checkbox" data-wcp="${a.key}"> <b>${esc(a.label)}</b> <span class="mono xp-val">+${a.per}</span></label>`).join("")}
      <div class="none-note" style="font-style:normal">These go to the warband's shared pool — spend them on recruits, or hand them out later.</div>
      <div class="modal-actions">
        <button class="btn primary sm" id="cpGive">Award campaign points</button>
        <button class="btn ghost sm" id="cpNone" style="margin-left:auto">Nothing this time</button>
      </div>`;
    body.querySelectorAll("[data-cp]").forEach(inp=>inp.oninput=e=>{
      const[i,k]=e.target.dataset.cp.split("|");
      state[+i][k]=Math.max(0,Math.min(99,parseInt(e.target.value||"0",10)||0));
      const row=e.target.closest(".earn-row").querySelector(".prep-h .mono");
      const s=state[+i]; if(row)row.textContent="+"+(s.actions+s.kills*5+(s.survived?1:0)+(s.unwounded?5:0));
    });
    const finish=give=>{
      let pool=0;
      if(give){
        state.forEach(s=>{
          const amt=s.actions*1+s.kills*5+(s.survived?1:0)+(s.unwounded?5:0);
          if(amt>0)grantCP([s.c],amt);
        });
        CP_WARBAND.forEach(a=>{const b=body.querySelector('[data-wcp="'+a.key+'"]');if(b&&b.checked)pool+=a.per;});
        if(pool){w.cp=(w.cp||0)+pool;}
        // Rich earns coin, Venal must cash out, Mercenary wants paying
        state.forEach(s=>{
          if(hasTrait(s.c,"Rich")){const d=1+Math.floor(Math.random()*8);w.credits=creditsOf(w)+d;toast(s.c.name+" (Rich) earned "+d+" credits");}
          if(hasTrait(s.c,"Venal")){const cash=Math.floor(cpOf(s.c)/2);if(cash>0){w.credits=creditsOf(w)+cash;s.c.cp=0;}}
        });
        save();render();
      }
      closeModal();
      const up=state.map(s=>s.c).filter(c=>c._rankedUp);
      up.forEach(c=>delete c._rankedUp);
      if(up.length)setTimeout(()=>openEarnedNames(up.map(c=>({charId:c.id,name:c.name,reason:(c.name||"They")+" rose to "+rankOf(cpTotalOf(c))})),"glory",then),300);
      else if(then)then();
    };
    $("#cpGive").onclick=()=>finish(true);
    $("#cpNone").onclick=()=>finish(false);
    body.querySelectorAll("[data-wcp]").forEach(b=>b.onchange=()=>{});
  };
  draw();showModal();
}
/* Advancement: 20 CP per skill level or +5 HP; traits and abilities at their listed cost.
   Equipment is NOT bought here — after the warband is built, gear costs credits. */
function openSpendCP(charId){
  const orig=activeWB().characters.find(x=>x.id===charId); if(!orig)return;
  const w=activeWB();
  const avail=()=>cpOf(orig)+(w.cp||0);
  if(avail()<=0){toast("No campaign points yet");return;}
  let draft=JSON.parse(JSON.stringify(orig)), spent=0;
  const left=()=>avail()-spent;
  const body=$("#modalBody");
  const draw=(filter)=>{
    const f=normLabel(filter||""), rem=left();
    const skillRow=SKILLS.map(([k])=>{
      const v=draft.skills[k], maxed=v>=10, short=CP_COSTS.skill-rem, off=maxed||short>0;
      return `<button class="stylechip${off&&!maxed?" unaffordable":""}" data-sk="${k}"${off?` disabled title="${maxed?"Already at 10":"Needs "+short+" more"}"`:""}>${k} ${v}${maxed?"":"→"+(v+1)} <b class="mono">${maxed?"max":CP_COSTS.skill}</b>${!maxed&&short>0?`<span class="short">+${short}</span>`:""}</button>`;
    }).join("");
    const hpShort=CP_COSTS.hp-rem;
    const hpChip=`<button class="stylechip${hpShort>0?" unaffordable":""}" data-hp="1"${hpShort>0?` disabled title="Needs ${hpShort} more"`:""}>+${CP_COSTS.hpStep} HP <b class="mono">${CP_COSTS.hp}</b>${hpShort>0?`<span class="short">+${hpShort}</span>`:""}</button>`;
    const rows=[["trait","traits"],["ability","abilities"]].map(([cat,field])=>{
      const list=Object.values(CAT[cat]).filter(o=>(!f||normLabel(o.name).includes(f))&&!(draft[field]||[]).includes(o.id));
      if(!list.length)return "";
      return `<div class="eyebrow" style="margin:10px 0 6px">${cat==="trait"?"Traits":"Abilities"}</div>
        <div class="chips-row">${list.slice(0,60).map(o=>{const short=o.cost-rem;
          return `<button class="stylechip${short>0?" unaffordable":""}" data-buy="${cat}|${o.id}"${short>0?` disabled title="Needs ${short} more"`:""}>${esc(o.name)} <b class="mono">${o.cost>=0?"+":""}${o.cost}</b>${short>0?`<span class="short">+${short}</span>`:""}</button>`;}).join("")}</div>`;
    }).join("");
    const added=[];
    SKILLS.forEach(([k])=>{if(draft.skills[k]>orig.skills[k])added.push(k+" "+orig.skills[k]+"→"+draft.skills[k]);});
    if(draft.hp>orig.hp)added.push("+"+(draft.hp-orig.hp)+" HP");
    ["traits","abilities"].forEach(fld=>{const cat=fld==="traits"?"trait":"ability";
      (draft[fld]||[]).forEach(id=>{if(!(orig[fld]||[]).includes(id)&&CAT[cat][id])added.push(CAT[cat][id].name);});});
    body.innerHTML=`
      <h3>Advance ${esc(orig.name||"Unnamed")}</h3>
      <p class="lead">Additions only — nothing else about them can be changed here. ${CP_COSTS.skill} campaign points buys one skill level or +${CP_COSTS.hpStep} hit-points; traits and abilities cost their listed points. Equipment is bought with credits, not these.</p>
      <div class="xp-bar"><span>Points left</span><b class="mono ${rem<=0?"spent":""}">${rem}</b><span class="none-note" style="font-style:normal;margin-left:auto">${esc(orig.name||"")}: ${cpOf(orig)} · warband pool: ${w.cp||0}</span></div>
      ${added.length?`<div class="camp-box" style="margin:10px 0"><div class="prep-h">Buying</div><div>${added.map(esc).join(" · ")}</div></div>`:""}
      <div class="eyebrow" style="margin:12px 0 6px">Skills &amp; hit-points</div>
      <div class="chips-row">${skillRow}</div>
      <div class="chips-row" style="margin-top:8px">${hpChip}</div>
      <div class="field" style="margin:12px 0 4px"><label>Search traits &amp; abilities</label><input class="input" id="cpSearch" value="${esc(filter||"")}" placeholder="e.g. brave, inspire"></div>
      <div style="max-height:32vh;overflow:auto">${rows||`<div class="ng-note">Nothing matches.</div>`}</div>
      <div class="none-note" style="font-style:normal;margin-top:6px">Greyed-out entries cost more than you have — unspent points carry over between games.</div>
      <div class="modal-actions">
        <button class="btn primary sm" id="cpConfirm"${spent>0?"":" disabled"}>Confirm — spend ${spent}</button>
        <button class="btn ghost sm" id="cpReset">Start over</button>
        <button class="btn ghost sm" id="cpCancel" style="margin-left:auto">Cancel</button>
      </div>`;
    const si=$("#cpSearch");
    if(si)si.oninput=e=>{const v=e.target.value;draw(v);const n=$("#cpSearch");if(n){n.focus();n.setSelectionRange(v.length,v.length);}};
    body.querySelectorAll("[data-sk]").forEach(b=>b.onclick=()=>{const k=b.dataset.sk;
      if(draft.skills[k]<10&&CP_COSTS.skill<=left()){draft.skills[k]++;spent+=CP_COSTS.skill;draw(filter);}});
    body.querySelectorAll("[data-hp]").forEach(b=>b.onclick=()=>{
      if(CP_COSTS.hp<=left()){draft.hp+=CP_COSTS.hpStep;spent+=CP_COSTS.hp;draw(filter);}});
    body.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{
      const[cat,id]=b.dataset.buy.split("|"),o=CAT[cat][id];
      if(!o||o.cost>left())return;
      const fld=cat==="trait"?"traits":"abilities";
      if(!draft[fld].includes(id)){draft[fld].push(id);spent+=o.cost;draw(filter);}});
    $("#cpReset").onclick=()=>{draft=JSON.parse(JSON.stringify(orig));spent=0;draw(filter);};
    $("#cpCancel").onclick=closeModal;
    $("#cpConfirm").onclick=()=>{
      if(spent<=0)return;
      // spend the character's own points first, then the warband pool
      let owe=spent, own=Math.min(cpOf(orig),owe); owe-=own;
      orig.cp=cpOf(orig)-own; if(owe>0)w.cp=Math.max(0,(w.cp||0)-owe);
      ["skills","hp","traits","abilities"].forEach(k=>{orig[k]=draft[k];});
      save();closeModal();render();buildDossier();
      toast("Spent "+spent+" campaign points — now "+charCost(orig)+" pts");
      setTimeout(()=>openEarnedNames([{charId:orig.id,name:orig.name,
        reason:(orig.name||"They")+" grew stronger — "+added.join(", ")}],"glory",()=>buildDossier()),300);
    };
    showModal();
  };
  draw("");
}
/* Equipment after warband creation costs credits, per the rules. */
function openBuyGear(charId){
  const w=activeWB(), c=w.characters.find(x=>x.id===charId); if(!c)return;
  const body=$("#modalBody");
  const draw=(filter)=>{
    const f=normLabel(filter||""), purse=creditsOf(w);
    const haggle=hasTrait(c,"Haggle");
    const rows=[["weapon","weapons"],["armour","armour"],["item","items"]].map(([cat,field])=>{
      const list=Object.values(CAT[cat]).filter(o=>!f||normLabel(o.name).includes(f));
      if(!list.length)return "";
      return `<div class="eyebrow" style="margin:10px 0 6px">${cat==="weapon"?"Weapons":cat==="armour"?"Armour":"Items"}</div>
        <div class="chips-row">${list.slice(0,60).map(o=>{const short=o.cost-purse;
          return `<button class="stylechip${short>0?" unaffordable":""}" data-cbuy="${cat}|${o.id}"${short>0?` disabled title="Needs ${short} more credits"`:""}>${esc(o.name)} <b class="mono">${o.cost}cr</b>${short>0?`<span class="short">+${short}</span>`:""}</button>`;}).join("")}</div>`;
    }).join("");
    body.innerHTML=`
      <h3>Buy equipment — ${esc(c.name||"Unnamed")}</h3>
      <p class="lead">Once a warband is built, gear is paid for in credits rather than points. Anything bought still adds its cost to what this character is worth on the table.</p>
      <div class="xp-bar"><span>Credits</span><b class="mono ${purse<=0?"spent":""}">${purse}</b>
        <span class="none-note" style="font-style:normal;margin-left:auto">${haggle?"Haggle: roll to knock the price down":"warband purse"}</span></div>
      <div class="field" style="margin:12px 0 4px"><label>Search</label><input class="input" id="cgSearch" value="${esc(filter||"")}" placeholder="e.g. pistol, plate"></div>
      <div style="max-height:38vh;overflow:auto">${rows||`<div class="ng-note">Nothing matches.</div>`}</div>
      <div class="modal-actions">
        <button class="btn ghost sm" id="cgConvert">Convert points → credits (2:1)</button>
        <button class="btn ghost sm" id="cgClose" style="margin-left:auto">Close</button>
      </div>`;
    const si=$("#cgSearch");
    if(si)si.oninput=e=>{const v=e.target.value;draw(v);const n=$("#cgSearch");if(n){n.focus();n.setSelectionRange(v.length,v.length);}};
    body.querySelectorAll("[data-cbuy]").forEach(b=>b.onclick=()=>{
      const[cat,id]=b.dataset.cbuy.split("|"),o=CAT[cat][id]; if(!o)return;
      let price=o.cost;
      if(haggle){const r=1+Math.floor(Math.random()*6);
        const off=r<=3?(1+Math.floor(Math.random()*4)):(1+Math.floor(Math.random()*10));
        price=Math.max(1,price-off); toast("Haggled "+(o.cost-price)+" credits off");}
      if(price>creditsOf(w)){toast("Not enough credits");return;}
      const fld=cat==="weapon"?"weapons":cat==="armour"?"armour":"items";
      c[fld]=Array.isArray(c[fld])?c[fld]:[];
      const ex=c[fld].find(e=>e.id===id); if(ex)ex.qty=(ex.qty||1)+1; else c[fld].push({id,qty:1});
      w.credits=creditsOf(w)-price; save();render();draw(filter);
      toast("Bought "+o.name+" for "+price+" credits");
    });
    $("#cgConvert").onclick=()=>openConvertCP(charId);
    $("#cgClose").onclick=closeModal;
    showModal();
  };
  draw("");
}
function openConvertCP(backToChar){
  const w=activeWB(), body=$("#modalBody");
  const chars=w.characters.filter(c=>cpOf(c)>0);
  const merc=(c)=>hasTrait(c,"Mercenary");   // Mercenary converts at 1:1
  body.innerHTML=`
    <h3>Convert campaign points to credits</h3>
    <p class="lead">Campaign points become credits at two to one. A Mercenary trades theirs at one to one.</p>
    ${(w.cp||0)>0?`<div class="wb-item"><div class="wbi-main" style="cursor:default"><div class="wbi-name">Warband pool</div>

/* ---- lasting injuries ----

/* Where the rulebook already has a trait for the injury, USE IT — Armless, Slow, Coward and
   the rest are real rules with real (negative) point costs, so a maimed veteran also gets
   cheaper to field. Only fall back to a skill shift or a written note when nothing fits. */
/* The rulebook's own 1D8 character injury table. The AI's scenario injuries are used only for
   FLAVOUR (a name and a line of prose that fits what actually happened) — the mechanics always
   come from here, so a campaign stays legal. */
const INJURY_TABLE=[
  {roll:1,name:"Complete recovery",note:"A swift recovery from their wounds — they fight as normal next game.",permanent:false,heals:true,effectNote:"",skills:{},hp:0,addTraits:[],miss:0,games:0},
